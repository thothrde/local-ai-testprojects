function home(){const c=D.meta.counts,I=D.homeIntro[state.lang];const title=state.lang==='de'?'Fragmente einer':'Fragments of a',title2=state.lang==='de'?'verschwindenden Welt':'vanishing world';return `<div class="wrap"><section class="hero"><div class="hero-copy"><div class="eyebrow">${u('publicEdition')} · DE / EN</div><h1>${title}<span>${title2}</span></h1><div class="hero-intro"><p class="lead-first">${esc(I.lead)}</p>${I.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="hero-actions"><button class="primary" data-view="stories">${u('stories')}</button><button class="ghost" data-view="atlas">${u('atlas')}</button><button class="ghost" data-view="insights">${u('insights')}</button><button class="ghost" data-view="rights">${u('rights')}</button></div></div><div class="hero-art">${heroArt()}</div></section><div class="why-grid">${I.why.map(x=>`<article class="why-card"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join('')}</div><div class="intro-note">${state.lang==='de'?'Leitfrage: Welche Form von Mensch kann Wahrheit bewahren, wenn Bücher, Schulen, Heiligtümer und politische Sicherheiten verschwinden?':'Guiding question: What kind of person can preserve truth when books, schools, sanctuaries, and political security disappear?'}</div><div class="stat-row">${[['people',c.people],['places',D.places.length],['stories',c.stories],['cases',c.cases],['wonders',c.wonders],['fragments',c.fragments],['insights',c.insights]].map(([k,n])=>`<div class="stat"><strong>${n}</strong><span>${u(k)}</span></div>`).join('')}</div><div class="section-title"><h2>${state.lang==='de'?'Drei Einstiege':'Three ways in'}</h2></div><div class="grid cols-3">${['alexandria-collapse','sarapio-path','asclepiodotus-path'].map((id,i)=>storyCard(find(D.stories,id),i)).join('')}</div>${footer()}</div>`}
function storyCard(s,i=0){return `<article class="card"><div class="art">${storyArt(s.cover,i+3)}</div><div class="card-body"><div class="eyebrow">${esc(storyDuration(s))} · ${esc(storyTone(s))}</div><h3>${esc(loc('stories',s.id,'title',s.title))}</h3><p>${esc(loc('stories',s.id,'subtitle',s.subtitle))}</p><button class="primary" data-story="${s.id}">${u('readStory')}</button></div></article>`}
function atlas(){const tools=`<div class="language-audit-badge">✓ ${u('publicDomainMap')}</div>`;const routeRows=D.routes.filter(r=>state.routeFilter==='all'||r.group===state.routeFilter).map(r=>`<div class="route-row" data-route="${r.id}"><b>${esc(placeName(find(D.places,r.from)))} → ${esc(placeName(find(D.places,r.to)))}</b><span>${r.year} · ${esc(routeKind(r))}</span></div>`).join('');return `<div class="wrap">${head(state.lang==='de'?'Raum, Reise und Überlieferung':'Space, travel, and transmission',u('atlas'),esc(u('atlasIntro')),tools)}<div class="atlas-shell"><div class="atlas-toolbar"><span class="toolbar-label">${u('mapData')}</span><button class="map-toggle ${state.mapMode==='regional'?'active':''}" data-map-mode="regional">${u('mapRegional')}</button><button class="map-toggle ${state.mapMode==='wide'?'active':''}" data-map-mode="wide">${u('mapWide')}</button><span class="toolbar-label">${u('selectRoute')}</span><button class="map-toggle ${state.routeFilter==='all'?'active':''}" data-route-filter="all">${u('routesAll')}</button><button class="map-toggle ${state.routeFilter==='journey'?'active':''}" data-route-filter="journey">${u('routesJourney')}</button><button class="map-toggle ${state.routeFilter==='persia'?'active':''}" data-route-filter="persia">${u('routesPersia')}</button></div><div class="atlas-layout"><div class="atlas-canvas">${mapSvg()}</div><aside class="atlas-side"><h3>${u('placesIndex')}</h3><p class="atlas-note">${u('mapDisclaimer')}</p><div class="place-list">${D.places.map(p=>`<button data-place="${p.id}"><i class="place-dot" style="background:${mapColors[p.mapCategory]||'#6aa7c7'}"></i><span>${esc(placeName(p))}</span><span class="place-coord">${fmtCoord(p)}</span></button>`).join('')}</div><div class="route-list"><h3>${u('route')}</h3>${routeRows}</div><div class="map-legend"><span class="legend-item"><i class="legend-line"></i>${u('routesJourney')}</span><span class="legend-item"><i class="legend-line persia"></i>${u('routesPersia')}</span><span class="legend-item"><i class="legend-line hyp"></i>${u('mapHypothetical')}</span></div><div class="map-credit">${u('originalCartography')}<br>${u('noModernBorders')}<br>${u('mapDisclaimer')}</div></aside></div></div>${footer()}</div>`}
function network(){return `<div class="wrap">${head(state.lang==='de'?'Menschen und Beziehungen':'People and relations',u('network'),state.lang==='de'?'Lehrer, Familien, Konflikte, Patronage und Überlieferung. Unter der Grafik stehen alle modellierten Beziehungen als lesbare Liste.':'Teachers, families, conflicts, patronage, and transmission. All modelled relations are listed beneath the graph.')}<div class="network-shell"><div class="network-toolbar"><span class="source-pill">${D.relationships.length} ${state.lang==='de'?'Relationen':'relations'}</span></div><div class="network-canvas">${networkSvg()}</div></div><div class="section-title"><h2>${u('connections')}</h2></div><div class="grid cols-3">${D.relationships.map(r=>{const a=find(D.people,r[0]),b=find(D.people,r[1]);return `<article class="card card-body"><b>${esc(personName(a))} → ${esc(personName(b))}</b><p>${esc(relationLabel(r))}</p><button class="ghost" data-person="${a.id}">${u('details')}</button></article>`}).join('')}</div>${footer()}</div>`}
function networkSvg(){const W=1100,H=720;const groups={philosopher:[.5,.43],woman:[.28,.42],ritual:[.72,.36],scientist:[.73,.62],teacher:[.45,.22],ascetic:[.25,.66],physician:[.56,.7]};const pos={};D.people.forEach((p,i)=>{const g=groups[p.group]||[.5,.5];pos[p.id]=[W*(g[0]+Math.cos(i*2.2)*.09),H*(g[1]+Math.sin(i*1.7)*.12)]});const edges=D.relationships.map((r,i)=>{const a=pos[r[0]],b=pos[r[1]];return `<path class="edge ${i%5===0?'hot':''}" d="M${a[0]},${a[1]} Q${(a[0]+b[0])/2},${(a[1]+b[1])/2-25} ${b[0]},${b[1]}"><title>${esc(relationLabel(r))}</title></path>`}).join('');const nodes=D.people.map(p=>{const [x,y]=pos[p.id],col=p.group==='woman'?'#d27b70':p.group==='ritual'?'#9c88c7':p.group==='scientist'?'#89d2d4':p.group==='ascetic'?'#85b889':'#d6b46b';return `<g class="node" data-person="${p.id}" transform="translate(${x},${y})"><circle r="${p.id==='damascius'||p.id==='isidore'?18:12}" fill="${col}" opacity=".82"/><circle r="${p.id==='damascius'||p.id==='isidore'?27:20}" fill="none" stroke="${col}" opacity=".13"/><text y="${p.id==='damascius'||p.id==='isidore'?34:27}">${esc(personName(p).replace(', Sohn des Hermeias','').replace(', son of Hermeias',''))}</text></g>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(state.lang==='de'?'Interaktives Personennetz':'Interactive person network')}"><rect width="${W}" height="${H}" fill="#0a0e17"/><g>${edges}</g><g>${nodes}</g></svg>`}
function timeline(){return `<div class="wrap">${head(state.lang==='de'?'Zeit und Überlieferung':'Time and transmission',u('timeline'),state.lang==='de'?'Historische Ereignisse und spätere Stadien der Textüberlieferung.':'Historical events and later stages in the transmission of the text.')}<div class="timeline">${D.timeline.map(x=>{const key=String(x.year)+'-'+x.title;return `<div class="time-item"><div class="time-year">${x.year}</div><div><h3>${esc(loc('timeline',key,'title',x.title))}</h3><p>${esc(loc('timeline',key,'detail',x.detail))}</p></div></div>`}).join('')}</div>${footer()}</div>`}
function stories(){return `<div class="wrap">${head(state.lang==='de'?'Geführte Erkundungen':'Guided explorations',u('stories'),state.lang==='de'?'Dreizehn visuelle Wege durch Personen, Krisen, Reisen und merkwürdige Überlieferungen. Jeder Pfad enthält jetzt Kontext, Beteiligte und einen quellenkritischen Hinweis.':'Thirteen visual paths through people, crises, journeys, and unusual traditions. Each path now includes context, participants, and a source-critical note.')}<div class="grid cols-3">${D.stories.map((s,i)=>storyCard(s,i)).join('')}</div>${footer()}</div>`}
function caseCard(c){return `<article class="card case-card"><div class="eyebrow">${esc(loc('cases',c.id,'status',c.status))}</div><h3>${esc(loc('cases',c.id,'title',c.title))}</h3><p>${esc(loc('cases',c.id,'question',c.question))}</p><button class="primary" data-case="${c.id}">${u('open')}</button></article>`}
function cases(){return `<div class="wrap">${head(state.lang==='de'?'Abduktion statt Scheingewissheit':'Abduction without false certainty',u('cases'),state.lang==='de'?'Mehrere Erklärungen bleiben nebeneinander sichtbar; Prozentwerte sind heuristisch, nicht statistisch.':'Several explanations remain visible side by side; percentages are heuristic, not statistical.')}<div class="grid cols-3">${D.cases.map(c=>caseCard(c)).join('')}</div>${footer()}</div>`}
function wonders(){return `<div class="wrap">${head(state.lang==='de'?'Wunder, Natur und Deutung':'Marvels, nature, and interpretation',u('wonders'),state.lang==='de'?'Jede Geschichte wird als Bericht, religiöse Bedeutung und mögliche natürliche oder historische Lesart gezeigt.':'Each story is shown as report, religious meaning, and possible natural or historical reading.')}<div class="grid cols-3">${D.wonders.map(w=>`<article class="card wonder-card"><div class="wonder-icon">${wonderIcon(w.id)}</div><div class="eyebrow">${esc(loc('wonders',w.id,'category',w.category))}</div><h3>${esc(loc('wonders',w.id,'title',w.title))}</h3><p>${esc(loc('wonders',w.id,'report',w.report))}</p><div class="quad"><div><b>${u('meaning')}</b>${esc(loc('wonders',w.id,'meaning',w.meaning))}</div><div><b>${u('possibleReading')}</b>${esc(loc('wonders',w.id,'natural',w.natural))}</div></div>${state.sources?`<div class="meta-row"><span class="source-pill">${esc(w.source)}</span><span class="pill">${u('reliability')}: ${esc(loc('wonders',w.id,'reliability',w.reliability))}</span></div>`:''}</article>`).join('')}</div>${footer()}</div>`}
function fragments(){return `<div class="wrap">${head(state.lang==='de'?'Text, Zeuge, Paraphrase':'Text, witness, paraphrase',u('fragments'),state.lang==='de'?'Kurze griechische Identifikationszitate, eigene bilinguale Paraphrasen und expliziter Überlieferungsstatus.':'Short Greek identifying quotations, independent bilingual paraphrases, and explicit textual status.')}<div class="grid cols-3">${D.fragments.map(f=>`<article class="card fragment-card"><div class="fragment-strip" lang="grc">${esc(f.greek)}</div><div class="card-body"><div class="eyebrow">${esc(f.fragment)}</div><h3>${esc(loc('fragments',f.id,'title',f.title))}</h3><p>${esc(loc('fragments',f.id,'paraphrase',f.paraphrase))}</p><div class="verified">✓ ${u('verified')}</div>${state.sources?`<div class="meta-row"><span class="source-pill">${u('sourceWitness')}: ${esc(loc('fragments',f.id,'witness',f.witness))}</span><span class="pill">${esc(loc('fragments',f.id,'status',f.status))}</span></div><p class="micro">${u('editorialParaphrase')} · ${esc(loc('fragments',f.id,'notes',f.notes))}</p>`:''}${state.pdfUrl?`<div class="meta-row">${(f.openPages||[f.page]).map(pg=>`<button class="ghost" data-page="${pg}">PDF ${pg}</button>`).join('')}</div>`:''}<button class="ghost fragment-more" data-fragment="${f.id}">${u('details')}</button></div></article>`).join('')}</div>${footer()}</div>`}
const insightCategoryLabels={persons:['personsAndLives','Persons & lives'],knowledge:['knowledgeMethods','Knowledge & methods'],institutions:['institutionsPower','Institutions & power'],transmission:['transmissionMemory','Transmission & memory'],ethics:['ethicsCharacter','Ethics & character'],bias:['biasAsymmetry','Biases & asymmetries'],method:['methodAuthorship','Method & authorship'],synthesis:['editorialSyntheses','Syntheses']};
function insightCategory(x){const k=insightCategoryLabels[x.category]?.[0];return k?u(k):x.category}
function insightLevel(x){return x.level==='textual'?u('directText'):x.level==='hypothesis'?u('explicitInference'):u('editorialReading')}
function insightField(x,f){return state.lang==='en'?(D.i18n.insights?.[x.id]?.[f]??x[f]):x[f]}
function insightCard(x){return `<article class="card card-body insight-card"><div class="meta-row"><span class="level-badge">${esc(insightLevel(x))}</span><span class="origin-badge">${x.origin==='new'?u('newSynthesis'):u('reviewCoverage')}</span></div><div class="eyebrow">${esc(insightCategory(x))}</div><h3>${esc(insightField(x,'title'))}</h3><p>${esc(insightField(x,'thesis'))}</p><button class="primary" data-insight="${x.id}">${u('readMore')}</button></article>`}
function insights(){const cats=[['all','allInsights'],['persons','personsAndLives'],['knowledge','knowledgeMethods'],['institutions','institutionsPower'],['transmission','transmissionMemory'],['ethics','ethicsCharacter'],['bias','biasAsymmetry'],['method','methodAuthorship'],['synthesis','editorialSyntheses']];const list=D.insights.filter(x=>state.insightFilter==='all'||x.category===state.insightFilter);return `<div class="wrap">${head(state.lang==='de'?'Texte, Deutungen und Grenzen':'Texts, interpretations, and limits',u('insights'),esc(u('insightsIntro')),`<div class="language-audit-badge">${D.insights.length} ${u('insights')}</div>`)}<div class="coverage-note"><b>${state.lang==='de'?'Vollständigkeitsvermerk':'Coverage note'}:</b> ${state.lang==='de'?'Die 22 ausführlichen Personen- und Themenbeobachtungen, die vier abschließenden Strukturthesen und fünf neu entwickelte, ausdrücklich als Inferenz markierte Synthesen sind hier einzeln auffindbar und mit den übrigen App-Bereichen verknüpft.':'The 22 extended observations on people and themes, four concluding structural theses, and five newly developed syntheses explicitly marked as inferences are individually accessible here and linked to the rest of the app.'}</div><div class="insight-toolbar">${cats.map(([id,k])=>`<button class="map-toggle ${state.insightFilter===id?'active':''}" data-insight-filter="${id}">${u(k)}</button>`).join('')}</div><div class="grid cols-3">${list.map(insightCard).join('')}</div>${footer()}</div>`}
function people(){return `<div class="wrap">${head(state.lang==='de'?'Prosopographischer Atlas':'Prosopographical atlas',u('people'),state.lang==='de'?'Berühmte und fast vergessene Träger einer intellektuellen Welt. Die Detailansichten verknüpfen Orte, Fragmente, Erzählpfade und Beziehungen.':'Famous and nearly forgotten bearers of an intellectual world. Detail views connect places, fragments, narrative paths, and relations.')}<div class="grid cols-3">${D.people.map(p=>`<article class="card person-card" data-person="${p.id}"><div class="person-head"><div class="avatar">${esc(personName(p)[0])}</div><div><h3>${esc(personName(p))}</h3><div class="greek" lang="grc">${esc(p.greek)}</div></div></div><p><b>${u('role')}:</b> ${esc(loc('people',p.id,'role',p.role))}</p><p>${esc(loc('people',p.id,'summary',p.summary))}</p><div class="meta-row">${loc('people',p.id,'tags',p.tags).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></article>`).join('')}</div>${footer()}</div>`}
function glossary(){return `<div class="wrap">${head(state.lang==='de'?'Begriffe und Denkfiguren':'Concepts and figures of thought',u('glossary'),state.lang==='de'?'Ein zweisprachiges Glossar zur Welt des Werkes.':'A bilingual glossary for the world of the work.')}<div class="grid cols-3">${D.glossary.map(g=>`<article class="card gloss-card"><div class="greek" lang="grc">${esc(g.greek)}</div><h3>${esc(loc('glossary',g.term,'term',g.term))}</h3><p>${esc(loc('glossary',g.term,'definition',g.definition))}</p></article>`).join('')}</div>${footer()}</div>`}
function transmission(){return `<div class="wrap">${head(state.lang==='de'?'Vom verlorenen Werk zur App':'From lost work to app',u('transmission'),state.lang==='de'?'Jede Stufe bewahrt und verändert: Damascius → Photios → Suda → moderne Edition → digitale Paraphrase.':'Every stage preserves and transforms: Damascius → Photius → Suda → modern edition → digital paraphrase.')}<div class="grid cols-4">${D.sources.map(s=>`<article class="card source-card"><div class="eyebrow">${esc(loc('sources',s.id,'type',s.type))} · ${esc(loc('sources',s.id,'date',s.date))}</div><h3>${esc(loc('sources',s.id,'title',s.title))}</h3><p>${esc(loc('sources',s.id,'note',s.note))}</p></article>`).join('')}</div><div class="section-title"><h2>${state.lang==='de'?'Methodische Regel':'Methodological rule'}</h2></div><div class="rights-box"><p>${state.lang==='de'?'Die App unterscheidet antiken Bericht, Überlieferungszeugen, moderne Rekonstruktion und eigene Interpretation. Ein Quellenverweis ist keine Behauptung, dass jede Einzelheit historisch wahr sei.':'The app distinguishes ancient report, textual witness, modern reconstruction, and its own interpretation. A source reference does not imply that every reported detail is historically true.'}</p></div>${footer()}</div>`}
function rights(){const r=D.rights[state.lang];return `<div class="wrap">${head(u('sourcesAndMethod'),r.headline,r.intro)}<div class="rights-box"><ul>${r.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="micro">${esc(r.caveat)}</p><p><a href="https://www.gesetze-im-internet.de/urhg/__64.html" target="_blank" rel="noopener">UrhG §64</a> · <a href="https://www.gesetze-im-internet.de/urhg/__70.html" target="_blank" rel="noopener">UrhG §70</a> · <a href="https://www.gesetze-im-internet.de/urhg/__51.html" target="_blank" rel="noopener">UrhG §51</a> · <a href="https://www.naturalearthdata.com/about/terms-of-use/" target="_blank" rel="noopener">Natural Earth terms</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · <a href="https://opensource.org/license/mit" target="_blank" rel="noopener">MIT</a></p></div><div class="section-title"><h2>${state.lang==='de'?'Publikationscheck':'Publication checklist'}</h2></div><div class="grid cols-3"><article class="card card-body"><h3>${state.lang==='de'?'Keine eingebettete PDF':'No bundled PDF'}</h3><p>${state.lang==='de'?'Die öffentlich hochgeladene App-Datei enthält keine Seite und kein Bild aus der modernen Ausgabe.':'The publicly hosted app contains no page or image from the modern edition.'}</p></article><article class="card card-body"><h3>${state.lang==='de'?'Kartendaten: Public Domain':'Map data: public domain'}</h3><p>${u('originalCartography')}</p></article><article class="card card-body"><h3>${state.lang==='de'?'Klare Lizenzdateien':'Clear licence files'}</h3><p>${state.lang==='de'?'Das Veröffentlichungspaket trennt Code, eigene Inhalte und gemeinfreie Kartengrundlage.':'The publication package distinguishes code, original content, and the public-domain map basis.'}</p></article></div>${footer()}</div>`}
function searchView(q){q=q.toLowerCase();const results=[];const push=(type,id,title,txt,view)=>{if((title+' '+txt).toLowerCase().includes(q))results.push({type,id,title,text:txt,view})};D.people.forEach(p=>push(u('people'),p.id,personName(p),loc('people',p.id,'summary',p.summary),'people'));D.places.forEach(p=>push(u('places'),p.id,placeName(p),loc('places',p.id,'summary',p.summary)+' '+loc('places',p.id,'geography',p.geography),'atlas'));D.stories.forEach(s=>push(u('stories'),s.id,loc('stories',s.id,'title',s.title),loc('stories',s.id,'intro',s.intro)+' '+loc('stories',s.id,'significance',s.significance),'stories'));D.cases.forEach(c=>push(u('cases'),c.id,loc('cases',c.id,'title',c.title),loc('cases',c.id,'question',c.question),'cases'));D.wonders.forEach(w=>push(u('wonders'),w.id,loc('wonders',w.id,'title',w.title),loc('wonders',w.id,'report',w.report),'wonders'));D.fragments.forEach(f=>push(u('fragments'),f.id,loc('fragments',f.id,'title',f.title),loc('fragments',f.id,'paraphrase',f.paraphrase),'fragments'));D.insights.forEach(x=>push(u('insights'),x.id,insightField(x,'title'),insightField(x,'thesis')+' '+insightField(x,'analysis'),'insights'));D.glossary.forEach(g=>push(u('glossary'),g.term,loc('glossary',g.term,'term',g.term),loc('glossary',g.term,'definition',g.definition),'glossary'));D.sources.forEach(s=>push(u('transmission'),s.id,loc('sources',s.id,'title',s.title),loc('sources',s.id,'note',s.note),'transmission'));return `<div class="wrap">${head(state.lang==='de'?'Suche':'Search',`“${esc(state.search)}”`,`${results.length} ${state.lang==='de'?'Treffer':'results'}`)}<div class="search-results">${results.length?results.map(r=>`<div class="result" data-view="${r.view}"><div class="eyebrow">${esc(r.type)}</div><b>${esc(r.title)}</b><p>${esc(r.text)}</p></div>`).join(''):`<div class="empty">${u('noResults')}</div>`}</div>${footer()}</div>`}
function openStory(id){const s=find(D.stories,id);let n=0;const draw=()=>{const scene=s.scenes[n],sceneTitle=nested('stories',id,'scenes',n,'title',scene.title),sceneText=nested('stories',id,'scenes',n,'text',scene.text),place=scene.place?find(D.places,scene.place):null,persons=(scene.people||[]).map(pid=>find(D.people,pid)).filter(Boolean),insights=D.insights.filter(x=>(x.stories||[]).includes(id));$('#modal-root').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="scene-visual">${storyArt(s.cover,n+17)}</div><div class="modal-body"><button class="icon-btn close-x" data-close aria-label="${u('close')}">×</button><div class="eyebrow">${n+1} / ${s.scenes.length} · ${esc(storyDuration(s))} · ${esc(storyTone(s))}</div><h1>${esc(sceneTitle)}</h1><div class="story-intro-box"><b>${u('storyOverview')}</b>${esc(loc('stories',id,'intro',s.intro))}</div><p class="lead">${esc(sceneText)}</p><div class="rich-grid">${place?`<div class="context-box"><h3>${u('location')}: ${esc(placeName(place))}</h3><p>${esc(loc('places',place.id,'geography',place.geography))}</p><div class="meta-row"><span class="coord-badge">${fmtCoord(place)}</span><button class="ghost" data-place="${place.id}">${u('details')}</button></div></div>`:''}<div class="context-box"><h3>${u('whyItMatters')}</h3><p>${esc(loc('stories',id,'significance',s.significance))}</p></div></div>${persons.length?`<h3>${u('peopleInScene')}</h3><div class="mini-people">${persons.map(p=>`<div class="person-mini" data-person="${p.id}"><b>${esc(personName(p))}</b><span>${esc(loc('people',p.id,'summary',p.summary))}</span></div>`).join('')}</div>`:''}${insights.length?`<h3>${u('insights')}</h3><div class="related-insights">${insights.slice(0,5).map(x=>`<button class="link-chip" data-insight="${x.id}">${esc(insightField(x,'title'))}</button>`).join('')}</div>`:''}${state.sources?`<div class="source-caution"><b>${u('sourceCriticalNote')}</b><br>${esc(loc('stories',id,'sourceNote',s.sourceNote))}<div class="meta-row"><span function timeLens(compact=false){const events=nearbyEvents(state.syncYear);return `<section class="time-lens ${compact?'compact':''}" aria-label="${esc(u('yearLens'))}"><div class="time-lens-row"><span class="time-year" data-time-year>${state.syncYear}</span><input data-sync-year type="range" min="400" max="540" step="1" value="${state.syncYear}" aria-label="${esc(u('currentYear'))}"><button class="ghost" data-play-time aria-pressed="${state.playing}">${state.playing?'Ⅱ '+u('pause'):'▶ '+u('play')}</button><span class="pill">${activePeopleAt(state.syncYear).length} ${u('activePeople')}</span></div><div class="time-summary">${events.length?events.map(t=>`<button class="time-event-chip" data-jump-year="${t.year}">${t.year} · ${esc(timelineField(t,'title'))}</button>`).join(''):`<span class="time-event-chip">${u('nearbyEvents')}: 0</span>`}</div><div class="time-caution">${u('syncedViews')} ${u('timeCaution')}</div></section>`}
function setSyncYear(y,rerender=true){state.syncYear=Math.max(400,Math.min(540,+y));localStorage.setItem('damascius-sync-year',state.syncYear);if(rerender)render({keepFocus:true})}
function toggleTimePlay(){state.playing=!state.playing;if(playTimer){clearInterval(playTimer);playTimer=null}if(state.playing){playTimer=setInterval(()=>{state.syncYear=state.syncYear>=540?400:state.syncYear+1;localStorage.setItem('damascius-sync-year',state.syncYear);render({keepFocus:true})},260)}render({keepFocus:true})}
function mapPostProcess(){const active=activePlaceIds(state.syncYear);document.querySelectorAll('.atlas-map [data-place]').forEach(g=>{const id=g.dataset.place;g.classList.toggle('time-muted',!active.has(id));g.classList.toggle('time-active',active.has(id));g.setAttribute('tabindex','0');g.setAttribute('role','button');const texts=g.querySelectorAll('.place-label-text,.inset-label-text');const p=find(D.places,id);texts.forEach(t=>{if(p)t.textContent=semanticLabel(p)})});document.querySelectorAll('.atlas-map [data-route]').forEach(el=>{const r=find(D.routes,el.dataset.route);if(!r)return;const on=Math.abs(r.year-state.syncYear)<=2;el.classList.toggle('time-muted',!on);el.classList.toggle('time-active',on)});const svg=document.querySelector('.atlas-map');if(svg&&!svg.querySelector(':scope>title'))svg.insertAdjacentHTML('afterbegin',`<title>${esc(state.lang==='de'?'Zeitlich gefilterter geografischer Atlas':'Time-filtered geographic atlas')}</title><desc>${esc(u('timeCaution'))}</desc>`)}
function updateNavA11y(){document.querySelectorAll('.nav-btn').forEach(b=>{if(b.dataset.view===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelectorAll('[aria-pressed]').forEach(()=>{})}
function copyCurrentLink(btn){navigator.clipboard?.writeText(location.href).then(()=>{const s=btn.parentElement.querySelector('.copy-feedback');if(s){s.textContent=u('linkCopied');setTimeout(()=>s.textContent='',1600)}})}
function dialogShell(title,body,klass=''){return `<dialog class="app-dialog ${klass}" aria-labelledby="dialog-title"><div class="modal-body"><button class="icon-btn close-x" data-close aria-label="${esc(u('close'))}">×</button><div class="dialog-actions"><button class="ghost" data-copy-link>${u('copyLink')}</button><span class="copy-feedback" aria-live="polite"></span></div><h1 id="dialog-title" class="dialog-title">${esc(title)}</h1>${body}</div></dialog>`}
function showDialog(title,body,klass=''){const root=$('#modal-root');root.innerHTML=dialogShell(title,body,klass);const dlg=root.querySelector('dialog');dlg.addEventListener('cancel',e=>{e.preventDefault();closeModal()});dlg.addEventListener('click',e=>{if(e.target===dlg)closeModal()});dlg.querySelector('[data-close]').onclick=()=>closeModal();dlg.querySelector('[data-copy-link]').onclick=e=>copyCurrentLink(e.currentTarget);dlg.showModal();requestAnimationFrame(()=>dlg.querySelector('[data-close]')?.focus());bindDialogLinks(dlg)}
function bindDialogLinks(root){root.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>navigate('person',b.dataset.person));root.querySelectorAll('[data-register-person]').forEach(b=>b.onclick=()=>navigate('register-person',b.dataset.registerPerson));root.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>navigate('place',b.dataset.place));root.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>navigate('route',b.dataset.route));root.querySelectorAll('[data-fragment]').forEach(b=>b.onclick=()=>navigate('fragment',b.dataset.fragment));root.querySelectorAll('[data-insight]').forEach(b=>b.onclick=()=>navigate('insight',b.dataset.insight));root.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>navigate('story',b.dataset.story,'scene/0'));root.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>navigate('case',b.dataset.case));root.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>navigate('module',b.dataset.module));root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPdf(+b.dataset.page))}
function kindView(k){return {'person':'people','register-person':'people','place':'atlas','route':'atlas','fragment':'fragments','insight':'insights','story':'stories','case':'cases','module':'labs'}[k]||k||'overview'}
function parseRoute(){const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);if(!p.length)return {view:'overview'};if(views.includes(p[0]))return {view:p[0]};const kind=p[0],id=decodeURIComponent(p[1]||'');return {kind,id,view:kindView(kind),extra:p.slice(2)}}
function navigate(kind,id,extra=''){lastTrigger=document.activeElement;const h=`#/${kind}/${encodeURIComponent(id)}${extra?'/'+extra:''}`;if(location.hash===h)handleRoute();else location.hash=h}
function routeFocusSelector(r){const attr={person:'data-person','register-person':'data-register-person',place:'data-place',route:'data-route',fragment:'data-fragment',insight:'data-insight',story:'data-story',case:'data-case',module:'data-module'}[r?.kind];return attr&&r?.id?`[${attr}="${CSS.escape(r.id)}"]`:''}
function closeModal(updateRoute=true){const closing=parseRoute(),focusSelector=routeFocusSelector(closing),previous=lastTrigger;const dlg=$('#modal-root dialog');if(dlg?.open)dlg.close();$('#modal-root').innerHTML='';if(updateRoute&&!suppressRoute&&closing.kind){suppressRoute=true;location.hash='#/'+kindView(closing.kind);setTimeout(()=>suppressRoute=false,0)}if(updateRoute)setTimeout(()=>{const target=previous?.isConnected?previous:(focusSelector?document.querySelector(focusSelector):null)||$('#view');target?.focus?.()},0)}
function evidenceArt(story,scene,index){let svg=V140_BASE_STORY_ART(story.cover,index+41);const source=sourceLabel(scene.source||'');const entities=(scene.people||[]).map(id=>{const p=getAnyPerson(id);return p?(p.profileType?registerName(p):personName(p)):id}).slice(0,3).join(' · ');const overlay=`<g class="evidence-art"><rect x="12" y="12" width="496" height="34" rx="10" fill="rgba(5,10,18,.82)" stroke="rgba(137,210,212,.35)"/><text x="28" y="34" fill="#89d2d4" font-size="12">${esc(source)}</text><rect x="12" y="218" width="496" height="30" rx="9" fill="rgba(5,10,18,.78)"/><text x="28" y="238" fill="#f1d99a" font-size="11">${esc(entities||semanticLabel(find(D.places,scene.place)||{ancientName:'',modernName:''}))}</text></g>`;return svg.replace('</svg>',overlay+'</svg>')}
function visualCaption(story){return `<div class="visual-evidence-caption"><b>${u('sceneEvidence')}</b><span>${esc(loc('stories',story.id,'visualBasis',story.visualBasis))}<br><small>${u('visualCaution')}</small></span></div>`}
function densityBars(n){const x=Math.min(5,Math.max(1,Math.ceil(n/4)));return `<span class="density" title="${u('evidenceDensity')}: ${n}">${Array.from({length:5},(_,i)=>`<i class="${i<x?'on':''}"></i>`).join('')}</span>`}
function exportGeoJSON(){const fc={type:'FeatureCollection',name:'Damascius Atlas places and routes',features:[...D.places.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:[p.lon,p.lat]},properties:{id:p.id,ancientName:p.ancientName,modernName:p.modernName,lateRegion:p.lateRegion,semanticType:p.semanticType,status:p.semanticStatus,pleiades:p.pleiadesUri||null,evidenceCount:p.evidenceCount}})),...D.routes.map(r=>{const a=find(D.places,r.from),b=find(D.places,r.to);return {type:'Feature',geometry:{type:'LineString',coordinates:[[a.lon,a.lat],[b.lon,b.lat]]},properties:{id:r.id,year:r.year,kind:r.kind,certainty:r.certainty,note:r.note}}})]};downloadText('damascius-atlas.geojson',JSON.stringify(fc,null,2),'application/geo+json')}
function exportJSONLD(){const graph=D.places.map(p=>({'@id':`https://thomas.autark-data.org/damascius-atlas/#/place/${p.id}`,'@type':'Place',name:p.ancientName,alternateName:p.modernName,latitude:p.lat,longitude:p.lon,containedInPlace:p.lateRegion,sameAs:p.pleiadesUri||undefined}));downloadText('damascius-atlas-places.jsonld',JSON.stringify({'@context':'https://schema.org','@graph':graph},null,2),'application/ld+json')}
function downloadText(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function synoptic(){const ev=nearbyEvents(state.syncYear),active=activePeopleAt(state.syncYear).filter(p=>p.id!=='photius').slice(0,18);return `<div class="wrap">${head(state.lang==='de'?'Synchronisierte historische Linse':'Synchronised historical lens',u('synoptic'),u('syncedViews'))}${timeLens()}<div class="synoptic-grid"><section class="synoptic-map"><div class="atlas-canvas">${V140_BASE_MAP()}</div></section><section class="synoptic-network">${networkSvg(true)}</section><section class="synoptic-events"><h3>${u('nearbyEvents')}</h3>${ev.map(t=>`<div class="synoptic-event"><b>${t.year} · ${esc(timelineField(t,'title'))}</b><p>${esc(timelineField(t,'detail'))}</p></div>`).join('')||`<p>${u('nearbyEvents')}: 0</p>`}<h3>${u('activePeople')}</h3><div class="related-links">${active.map(p=>`<button class="link-chip" ${p.profileType?`data-register-person="${p.id}"`:`data-person="${p.id}"`}>${esc(p.profileType?registerName(p):personName(p))}</button>`).join('')}</div></section></div>${footer()}</div>`}
atlas=function(){const routeRows=D.routes.filter(r=>state.routeFilter==='all'||r.group===state.routeFilter).map(r=>`<div class="route-row" data-route="${r.id}"><b>${esc(semanticLabel(find(D.places,r.from)))} → ${esc(semanticLabel(find(D.places,r.to)))}</b><span>${r.year} · ${esc(routeKind(r))} · ${r.certainty}</span></div>`).join('');return `<div class="wrap">${head(state.lang==='de'?'Raum, Semantik und historische Zeit':'Space, semantics, and historical time',u('atlas'),state.lang==='de'?'Der Atlas verbindet Koordinaten, antike und moderne Namen, spätantike Räume, Belegdichte, Routenunsicherheit und eine gemeinsame Zeitlinse.':'The atlas links coordinates, ancient and modern names, late-antique regions, evidence density, route uncertainty, and a shared time lens.')} ${timeLens()}<div class="atlas-shell"><div class="atlas-toolbar"><span class="toolbar-label">${u('selectRoute')}</span><button class="map-toggle ${state.routeFilter==='all'?'active':''}" data-route-filter="all">${u('routesAll')}</button><button class="map-toggle ${state.routeFilter==='journey'?'active':''}" data-route-filter="journey">${u('routesJourney')}</button><button class="map-toggle ${state.routeFilter==='persia'?'active':''}" data-route-filter="persia">${u('routesPersia')}</button></div><div class="semantic-toolbar"><span class="toolbar-label">${u('ancientName')} / ${u('modernName')}</span>${[['ancient','nameAncient'],['bilingual','nameBilingual'],['modern','nameModern']].map(([v,k])=>`<button class="map-toggle ${state.nameMode===v?'active':''}" data-name-mode="${v}" aria-pressed="${state.nameMode===v}">${u(k)}</button>`).join('')}<button class="ghost" data-export-geojson>${u('exportGeoJSON')}</button><button class="ghost" data-export-jsonld>${u('exportJSONLD')}</button></div><div class="atlas-layout"><div class="atlas-canvas">${V140_BASE_MAP()}</div><aside class="atlas-side"><h3>${u('placesIndex')}</h3><p class="atlas-note">${u('mapDisclaimer')}</p><div>${D.places.map(p=>`<div class="semantic-place" data-place="${p.id}" role="button" tabindex="0"><i class="place-dot" style="background:${mapColors[p.mapCategory]||'#6aa7c7'}"></i><span><b>${esc(semanticLabel(p))}</b><small>${esc(p.lateRegion)} · ${esc(p.semanticType)} · ${fmtCoord(p)}</small></span>${densityBars(p.evidenceCount)}</div>`).join('')}</div><div class="route-list"><h3>${u('route')}</h3>${routeRows}</div><div class="map-credit">${u('originalCartography')}<br>${state.lang==='de'?'Pleiades-URIs werden nur dort angezeigt, wo eine Zuordnung ausdrücklich verifiziert wurde.':'Pleiades URIs are shown only where an identification has been explicitly verified.'}</div></aside></div></div>${footer()}</div>`}
function networkNodes(scope){let arr=V140_CORE_PEOPLE;if(scope==='expanded'){const activeIds=new Set(activePeopleAt(state.syncYear).map(p=>p.id));arr=V140_ALL_PEOPLE.filter(p=>!p.profileType||activeIds.has(p.id)||V140_ALL_REL.some(r=>(r[0]===p.id&&activeIds.has(r[1]))||(r[1]===p.id&&activeIds.has(r[0]))))}return arr}
networkSvg=function(mini=false){const W=1100,H=mini?420:720,arr=networkNodes(state.networkScope),ids=new Set(arr.map(p=>p.id));const rel=V140_ALL_REL.filter(r=>ids.has(r[0])&&ids.has(r[1]));const pos={};arr.forEach((p,i)=>{if(p.profileType){const a=2*Math.PI*i/Math.max(arr.length,1);pos[p.id]=[W/2+Math.cos(a)*(W*.43),H/2+Math.sin(a)*(H*.40)]}else{const groups={philosopher:[.5,.43],woman:[.28,.42],ritual:[.72,.36],scientist:[.73,.62],teacher:[.45,.22],ascetic:[.25,.66],physician:[.56,.7],political:[.82,.5],patron:[.18,.5],traveller:[.5,.8],transmission:[.5,.12]};const g=groups[p.group]||[.5,.5];pos[p.id]=[W*(g[0]+Math.cos(i*2.2)*.08),H*(g[1]+Math.sin(i*1.7)*.1)]}});const edges=rel.map(r=>{const a=pos[r[0]],b=pos[r[1]],on=rangeActive(getAnyPerson(r[0]),state.syncYear)&&rangeActive(getAnyPerson(r[1]),state.syncYear);return `<path class="edge ${on?'network-edge-active':'network-edge-inactive'}" data-a="${r[0]}" data-b="${r[1]}" d="M${a[0]},${a[1]} Q${(a[0]+b[0])/2},${(a[1]+b[1])/2-18} ${b[0]},${b[1]}"><title>${esc(state.lang==='en'?(D.relationshipLabelsEn[r[2]]||r[2]):r[2])}</title></path>`}).join('');const nodes=arr.map(p=>{const [x,y]=pos[p.id],on=rangeActive(p,state.syncYear),context=!!p.profileType,name=context?registerName(p):personName(p),col=context?'#6aa7c7':p.group==='woman'?'#d27b70':p.group==='ritual'?'#9c88c7':p.group==='scientist'?'#89d2d4':p.group==='ascetic'?'#85b889':'#d6b46b';return `<g class="node ${context?'network-node-context':''} ${on?'':'network-node-inactive'}" ${context?`data-register-person="${p.id}"`:`data-person="${p.id}"`} tabindex="0" role="button" transform="translate(${x},${y})"><circle r="${context?7:(p.id==='damascius'||p.id==='isidore'?18:12)}" fill="${col}" opacity=".85"/><text y="${context?18:(p.id==='damascius'||p.id==='isidore'?34:27)}">${esc(name.replace(', Sohn des Hermeias','').replace(', son of Hermeias',''))}</text></g>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img"><title>${esc(state.lang==='de'?'Zeitlich gefiltertes Personennetz':'Time-filtered personal network')}</title><desc>${esc(u('timeCaution'))}</desc>${edges}${nodes}</svg>`}
network=function(){return `<div class="wrap">${head(state.lang==='de'?'Beziehungen im Zeitfenster':'Relations in a time window',u('network'),state.lang==='de'?'Die Zeitlinse hebt Personen und Beziehungen hervor, die im gewählten breiten Aktivitätsfenster liegen. Kontextprofile können als äußerer Ring hinzugeschaltet werden.':'The time lens highlights people and relations that fall within the selected broad activity window. Context profiles can be added as an outer ring.')} ${timeLens()}<div class="network-shell"><div class="network-toolbar"><span class="toolbar-label">${u('networkScope')}</span><button class="map-toggle ${state.networkScope==='core'?'active':''}" data-network-scope="core" aria-pressed="${state.networkScope==='core'}">${u('coreNetwork')}</button><button class="map-toggle ${state.networkScope==='expanded'?'active':''}" data-network-scope="expanded" aria-pressed="${state.networkScope==='expanded'}">${u('expandedNetwork')}</button></div><div class="network-canvas">${networkSvg(false)}</div><div class="network-key">${u('timeCaution')}</div></div>${footer()}</div>`}
timeline=function(){return `<div class="wrap">${head(state.lang==='de'?'Ereignisse und aktive Netzwerke':'Events and active networks',u('timeline'),state.lang==='de'?'Die historische Zeitleiste ist mit Karte und Netzwerk gekoppelt. Die späteren Überlieferungsereignisse bleiben als eigener Nachlauf sichtbar.':'The historical timeline is linked to map and network. Later transmission events remain visible as a separate afterlife.')} ${timeLens()}<div class="timeline">${D.timeline.map(t=>{const hist=t.year<=540,on=hist&&Math.abs(t.year-state.syncYear)<=4;return `<article class="time-item ${hist?(on?'timeline-item-current':'timeline-item-dim'):''}"><div class="time-year">${t.year}</div><div><h3>${esc(timelineField(t,'title'))}</h3><p>${esc(timelineField(t,'detail'))}</p><div class="timeline-entities">${(t.people||[]).map(id=>{const p=getAnyPerson(id);if(!p)return'';return `<button class="link-chip" ${p.profileType?`data-register-person="${id}"`:`data-person="${id}"`}>${esc(p.profileType?registerName(p):personName(p))}</button>`}).join('')}${(t.places||[]).map(id=>{const p=find(D.places,id);return p?`<button class="link-chip" data-place="${id}">${esc(semanticLabel(p))}</button>`:''}).join('')}</div></div></article>`}).join('')}</div>${footer()}</div>`}
stories=function(){return `<div class="wrap">${head(state.lang==='de'?'Geführte, evidenzgebundene Erzählungen':'Guided, evidence-bound narratives',u('stories'),state.lang==='de'?'Die Bilder sind analytische Diagramme: Jede Karte nennt, welche Elemente aus der Überlieferung visualisiert werden und was ausdrücklich nicht rekonstruiert wird.':'The images are analytical diagrams: each card states which elements of the evidence are visualised and what is explicitly not reconstructed.')}<div class="grid cols-3">${D.stories.map((s,i)=>`<article class="card"><div class="art">${evidenceArt(s,s.scenes[0],i)}</div>${visualCaption(s)}<div class="card-body"><div class="eyebrow">${esc(storyTone(s))} · ${esc(storyDuration(s))}</div><h3>${esc(loc('stories',s.id,'title',s.title))}</h3><p>${esc(loc('stories',s.id,'intro',s.intro))}</p><button class="primary" data-story="${s.id}">${u('open')}</button></div></article>`).join('')}</div>${footer()}</div>`}
people=function(){const core=state.peopleScope==='register'?[]:D.people,reg=state.peopleScope==='core'?[]:D.registerPeople;return `<div class="wrap">${head(state.lang==='de'?'Menschen, Rollen und Überlieferungsstatus':'People, roles, and status in the evidence',u('prosopography'),u('registerIntro'))}<div class="prosopography-toolbar">${[['core','coreProfiles'],['register','registerProfiles'],['all','allProfiles']].map(([v,k])=>`<button class="map-toggle ${state.peopleScope===v?'active':''}" data-people-scope="${v}" aria-pressed="${state.peopleScope===v}">${u(k)}</button>`).join('')}<span class="pill">${core.length+reg.length} ${u('people')}</span></div><div class="grid cols-3">${core.map(p=>`<article class="card person-card"><div class="person-head"><div class="avatar">${esc(personName(p)[0])}</div><div><h3>${esc(personName(p))}</h3><div class="greek" lang="grc">${esc(p.greek)}</div></div></div><p>${esc(loc('people',p.id,'summary',p.summary))}</p><button class="ghost" data-person="${p.id}">${u('details')}</button><div class="portrait-disclaimer">${u('noPortraitClaim')}</div></article>`).join('')}${reg.map(p=>`<article class="card person-card register-card"><div class="profile-type">${profileLabel(p.profileType)}</div><div class="person-head"><div class="avatar">${esc(registerName(p)[0])}</div><div><h3>${esc(registerName(p))}</h3><div class="greek" lang="grc">${esc(p.greek)}</div></div></div><p>${esc(registerField(p,'summary'))}</p><button class="ghost" data-register-person="${p.id}">${u('details')}</button><div class="portrait-disclaimer">${u('noPortraitClaim')}</div></article>`).join('')}</div>${footer()}</div>`}
function labs(){return `<div class="wrap">${head(state.lang==='de'?'Interaktive Quellen- und Erkenntnisexperimente':'Interactive source and knowledge experiments',u('labs'),u('moduleIntro'))}<div class="lab-grid">${D.modules.map((m,i)=>`<article class="card lab-card"><div class="lab-art">${moduleIcon(m.id)}</div><div class="card-body"><div class="eyebrow">${u('module')} ${i+1}</div><h3>${esc(moduleField(m,'title'))}</h3><p>${esc(moduleField(m,'intro'))}</p><button class="primary" data-module="${m.id}">${u('launchModule')}</button></div></article>`).join('')}</div>${footer()}</div>`}
function moduleIcon(id){if(id==='monochord')return `<svg viewBox="0 0 420 180"><path d="M45 125h330M60 65h300M60 65v60M360 65v60" stroke="#d6b46b" stroke-width="4" fill="none"/><path d="M230 50v92" stroke="#89d2d4" stroke-width="6"/><text x="210" y="165" text-anchor="middle" fill="#f1d99a">≥ 220 positions</text></svg>`;if(id==='transmission')return `<svg viewBox="0 0 420 180">${Array.from({length:24},(_,i)=>`<rect x="${45+(i%8)*42}" y="${34+Math.floor(i/8)*42}" width="30" height="30" rx="5" fill="${i%4===0?'#6aa7c7':i%4===1?'#9c88c7':i%4===2?'#d6b46b':'#5f7891'}" opacity=".75"/>`).join('')}</svg>`;return `<svg viewBox="0 0 420 180"><circle cx="210" cy="90" r="28" fill="none" stroke="#f1d99a" stroke-width="3"/>${Array.from({length:8},(_,i)=>{const a=i*Math.PI/4,x=210+Math.cos(a)*110,y=90+Math.sin(a)*65;return `<path d="M210 90L${x} ${y}" stroke="#6aa7c7"/><circle cx="${x}" cy="${y}" r="13" fill="#17283b" stroke="#89d2d4"/>`}).join('')}</svg>`}
searchView=function(q){const needle=q.toLocaleLowerCase(state.lang),results=[];const add=(kind,id,title,text,sub='')=>{const hay=(title+' '+text+' '+sub).toLocaleLowerCase(state.lang);if(hay.includes(needle))results.push({kind,id,title,text,sub})};D.people.forEach(p=>add('person',p.id,personName(p),[p.greek,loc('people',p.id,'summary',p.summary),loc('people',p.id,'why',p.why),(p.tags||[]).join(' ')].join(' ')));D.registerPeople.forEach(p=>add('register-person',p.id,registerName(p),[p.greek,registerField(p,'summary'),p.sources.join(' ')].join(' '),profileLabel(p.profileType)));D.places.forEach(p=>add('place',p.id,semanticLabel(p),[p.ancientName,p.modernName,p.lateRegion,loc('places',p.id,'summary',p.summary),loc('places',p.id,'geography',p.geography)].join(' ')));D.stories.forEach(s=>add('story',s.id,loc('stories',s.id,'title',s.title),[loc('stories',s.id,'intro',s.intro),loc('stories',s.id,'significance',s.significance),...s.scenes.map((sc,i)=>nested('stories',s.id,'scenes',i,'text',sc.text))].join(' ')));D.cases.forEach(c=>add('case',c.id,loc('cases',c.id,'title',c.title),[loc('cases',c.id,'question',c.question),...c.evidence.map((e,i)=>nested('cases',c.id,'evidence',i,'text',e.text)),...c.hypotheses.map((h,i)=>nested('cases',c.id,'hypotheses',i,'name',h.name))].join(' ')));D.fragments.forEach(f=>add('fragment',f.id,loc('fragments',f.id,'title',f.title),[f.fragment,f.greek,loc('fragments',f.id,'paraphrase',f.paraphrase),loc('fragments',f.id,'notes',f.notes)].join(' ')));D.insights.forEach(x=>add('insight',x.id,insightField(x,'title'),[insightField(x,'thesis'),insightField(x,'analysis'),insightField(x,'basis')].join(' ')));D.modules.forEach(m=>add('module',m.id,moduleField(m,'title'),moduleField(m,'intro')+' '+moduleField(m,'basis')));return `<div class="wrap">${head(state.lang==='de'?'Suche':'Search',`“${esc(state.search)}”`,`${results.length} ${state.lang==='de'?'Treffer':'results'}`)}<div class="search-results">${results.length?results.map(r=>`<button class="result" data-open-kind="${r.kind}" data-open-id="${r.id}"><div class="eyebrow">${esc(u(kindView(r.kind)))}</div><b>${esc(r.title)}</b><p>${esc(r.text.slice(0,260))}</p>${r.sub?`<div class="search-result-path">${esc(r.sub)}</div>`:''}</button>`).join(''):`<div class="empty">${u('noResults')}</div>`}</div>${footer()}</div>`}
function openStory(id,sceneIndex=0){const s=find(D.stories,id);let n=Math.max(0,Math.min(s.scenes.length-1,+sceneIndex||0));const draw=()=>{const sc=s.scenes[n],title=nested('stories',id,'scenes',n,'title',sc.title),text=nested('stories',id,'scenes',n,'text',sc.text),place=sc.place?find(D.places,sc.place):null,persons=(sc.people||[]).map(getAnyPerson).filter(Boolean),ins=D.insights.filter(x=>(x.stories||[]).includes(id));const body=`<div class="scene-visual">${evidenceArt(s,sc,n)}</div>${visualCaption(s)}<div class="eyebrow">${n+1} / ${s.scenes.length} · ${esc(storyDuration(s))} · ${esc(storyTone(s))}</div><div class="story-intro-box"><b>${u('storyOverview')}</b>${esc(loc('stories',id,'intro',s.intro))}</div><p class="lead">${esc(text)}</p><div class="rich-grid">${place?`<div class="context-box"><h3>${u('location')}: ${esc(semanticLabel(place))}</h3><p>${esc(loc('places',place.id,'geography',place.geography))}</p><button class="ghost" data-place="${place.id}">${u('details')}</button></div>`:''}<div class="context-box"><h3>${u('whyItMatters')}</h3><p>${esc(loc('stories',id,'significance',s.significance))}</p></div></div>${persons.length?`<h3>${u('peopleInScene')}</h3><div class="related-links">${persons.map(p=>`<button class="link-chip" ${p.profileType?`data-register-person="${p.id}"`:`data-person="${p.id}"`}>${esc(p.profileType?registerName(p):personName(p))}</button>`).join('')}</div>`:''}${ins.length?`<h3>${u('insights')}</h3><div class="related-links">${ins.slice(0,5).map(x=>`<button class="link-chip" data-insight="${x.id}">${esc(insightField(x,'title'))}</button>`).join('')}</div>`:''}${state.sources?`<div class="source-caution"><b>${u('sourceCriticalNote')}</b><br>${esc(loc('stories',id,'sourceNote',s.sourceNote))}<div class="meta-row"><span class="source-pill">${esc(sourceLabel(sc.source))}</span></div></div>`:''}<div class="modal-nav"><button class="ghost" data-prev ${n===0?'disabled':''}>← ${u('back')}</button><button class="primary" data-next>${n===s.scenes function openMonochord(m){const body=`${moduleIntro(m)}<div class="monochord-controls"><div class="monochord-display"><svg viewBox="0 0 800 220" role="img"><title>${esc(u('monochordLab'))}</title><path d="M70 145H730M90 65H710M90 65V145M710 65V145" stroke="#d6b46b" stroke-width="5" fill="none"/><line id="bridge-line" x1="400" x2="400" y1="48" y2="165" stroke="#89d2d4" stroke-width="8"/><text x="70" y="195" fill="#a9adba">L</text><text id="bridge-label" x="400" y="35" text-anchor="middle" fill="#f1d99a">0.75 L</text></svg></div><label>${u('bridgePosition')} <input id="bridge-slider" type="range" min="0.52" max="0.98" step="0.001" value="0.75"></label><div class="metric-grid"><div class="metric"><strong id="ratio-value">0.750</strong><span>L₂ / L₁</span></div><div class="metric"><strong id="cents-value">498</strong><span>cents</span></div><div class="metric"><strong id="freq-value">293.3</strong><span>Hz (base 220)</span></div></div><div class="tone-buttons"><button class="primary" data-tone="base">${u('playLower')}</button><button class="primary" data-tone="upper">${u('playUpper')}</button><button class="ghost" data-tone="alternate">${u('playAlternating')}</button></div><div class="source-caution">${u('illustrativeOnly')}</div></div>`;showDialog(moduleField(m,'title'),body,'lab-dialog');bindMonochord()}
function bindMonochord(){const slider=$('#modal-root #bridge-slider');const update=()=>{const r=+slider.value,c=Math.round(1200*Math.log2(1/r)),f=(220/r);$('#modal-root #ratio-value').textContent=r.toFixed(3);$('#modal-root #cents-value').textContent=c;$('#modal-root #freq-value').textContent=f.toFixed(1);const x=90+r*620;const line=$('#modal-root #bridge-line');line.setAttribute('x1',x);line.setAttribute('x2',x);const lab=$('#modal-root #bridge-label');lab.setAttribute('x',x);lab.textContent=r.toFixed(3)+' L'};slider.oninput=update;update();$('#modal-root').querySelectorAll('[data-tone]').forEach(b=>b.onclick=()=>playTone(b.dataset.tone,+slider.value))}
function playTone(kind,r){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC(),tone=(freq,start,dur)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.18,start+.02);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g).connect(ctx.destination);o.start(start);o.stop(start+dur+.05)};const now=ctx.currentTime+.03;if(kind==='base')tone(220,now,.7);else if(kind==='upper')tone(220/r,now,.7);else{tone(220,now,.45);tone(220/r,now+.55,.45);tone(220,now+1.1,.45);tone(220/r,now+1.65,.45)}}
function openTransmission(m){const counts={photius:0,suda:0,both:0,other:0};D.fragments.forEach(f=>counts[witnessClass(f)]++);const tiles=D.fragments.filter(f=>state.mosaicFilter==='all'||witnessClass(f)===state.mosaicFilter).map(f=>`<button class="mosaic-tile ${witnessClass(f)}" data-fragment="${f.id}" title="${esc(f.fragment+' · '+loc('fragments',f.id,'title',f.title))}">${esc(f.fragment.replace('PH ',''))}</button>`).join('');const body=`${moduleIntro(m)}<div class="insight-toolbar"><span class="toolbar-label">${u('witnessFilter')}</span>${[['all','allWitnesses'],['photius','photiosOnly'],['suda','sudaOnly'],['both','bothWitnesses'],['other','otherWitness']].map(([v,k])=>`<button class="map-toggle ${state.mosaicFilter===v?'active':''}" data-mosaic-filter="${v}">${u(k)}</button>`).join('')}</div><div class="metric-grid"><div class="metric"><strong>${counts.photius}</strong><span>${u('photiosOnly')}</span></div><div class="metric"><strong>${counts.suda}</strong><span>${u('sudaOnly')}</span></div><div class="metric"><strong>${counts.both}</strong><span>${u('bothWitnesses')}</span></div></div><div class="mosaic">${tiles}</div>`;showDialog(moduleField(m,'title'),body,'lab-dialog');const dlg=$('#modal-root dialog');dlg.querySelectorAll('[data-mosaic-filter]').forEach(b=>b.onclick=()=>{state.mosaicFilter=b.dataset.mosaicFilter;openTransmission(m)});bindDialogLinks(dlg)}
function openEpistemic(m){const cards=D.epistemicInstruments.map(x=>`<button class="instrument-card ${state.instrumentSelection.includes(x.id)?'selected':''}" data-instrument="${x.id}" aria-pressed="${state.instrumentSelection.includes(x.id)}"><b>${esc(instrumentField(x,'name'))}</b><span>${esc(instrumentField(x,'episode'))}</span><small>${esc(x.source)}</small></button>`).join('');let table='';if(state.instrumentSelection.length){const sel=state.instrumentSelection.map(id=>find(D.epistemicInstruments,id)).filter(Boolean);table=`<table class="compare-table"><thead><tr><th>${u('instrument')}</th><th>${u('repeatability')}</th><th>${u('publicCheck')}</th><th>${u('embodied')}</th><th>${u('ritualDependence')}</th></tr></thead><tbody>${sel.map(x=>`<tr><th>${esc(instrumentField(x,'name'))}</th><td>${esc(levelText(x.repeatability))}</td><td>${esc(levelText(x.public))}</td><td>${esc(levelText(x.embodied))}</td><td>${esc(levelText(x.ritual))}</td></tr><tr><td colspan="5"><b>${u('authority')}:</b> ${esc(instrumentField(x,'authority'))} · <span class="source-pill">${esc(x.source)}</span></td></tr>`).join('')}</tbody></table>`}const body=`${moduleIntro(m)}<p>${u('compareInstruments')}</p><div class="instrument-grid">${cards}</div>${table}`;showDialog(moduleField(m,'title'),body,'lab-dialog');$('#modal-root').querySelectorAll('[data-instrument]').forEach(b=>b.onclick=()=>{const id=b.dataset.instrument,i=state.instrumentSelection.indexOf(id);if(i>=0)state.instrumentSelection.splice(i,1);else{if(state.instrumentSelection.length>=2)state.instrumentSelection.shift();state.instrumentSelection.push(id)}openEpistemic(m)})}
nav=function(){ $('#nav').innerHTML=views.map(id=>`<button class="nav-btn ${state.view===id?'active':''}" data-view="${id}" ${state.view===id?'aria-current="page"':''}><span class="nav-icon">${navIcons[id]}</span><span>${esc(labelForView(id))}</span></button>`).join('');$('#edition-label').textContent=`${u('publicEdition')} · v${D.meta.version}`;$('#source-toggle').textContent=`${u('sourceMode')}: ${u(state.sources?'on':'off')}`;$('#source-toggle').setAttribute('aria-pressed',state.sources);$('#pdf-button').textContent=u('connectPdf');$('#pdf-status').textContent=state.pdfName?`${u('localPdf')}: ${state.pdfName}`:`${u('noPdf')} · ${u('pdfPrivacy')}`;$('#art-note').textContent=u('visualCaution');document.documentElement.lang=state.lang;document.title=state.lang==='de'?'Damascius Atlas · Forschungsatlas':'Damascius Atlas · Research Atlas';document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',b.dataset.lang===state.lang);b.setAttribute('aria-pressed',b.dataset.lang===state.lang)});$('#search').placeholder=u('search');$('#crumbs').textContent=labelForView(state.view)}
bindDynamic=function(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>navigate('story',b.dataset.story,'scene/0'));document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>navigate('case',b.dataset.case));document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>navigate('person',b.dataset.person));document.querySelectorAll('[data-register-person]').forEach(b=>b.onclick=()=>navigate('register-person',b.dataset.registerPerson));document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>navigate('place',b.dataset.place));document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>navigate('route',b.dataset.route));document.querySelectorAll('[data-fragment]').forEach(b=>b.onclick=()=>navigate('fragment',b.dataset.fragment));document.querySelectorAll('[data-insight]').forEach(b=>b.onclick=()=>navigate('insight',b.dataset.insight));document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>navigate('module',b.dataset.module));document.querySelectorAll('[data-open-kind]').forEach(b=>b.onclick=()=>navigate(b.dataset.openKind,b.dataset.openId,b.dataset.openKind==='story'?'scene/0':''));document.querySelectorAll('[data-map-mode]').forEach(b=>b.onclick=()=>{state.mapMode=b.dataset.mapMode;render()});document.querySelectorAll('[data-route-filter]').forEach(b=>b.onclick=()=>{state.routeFilter=b.dataset.routeFilter;render()});document.querySelectorAll('[data-insight-filter]').forEach(b=>b.onclick=()=>{state.insightFilter=b.dataset.insightFilter;render()});document.querySelectorAll('[data-name-mode]').forEach(b=>b.onclick=()=>{state.nameMode=b.dataset.nameMode;localStorage.setItem('damascius-name-mode',state.nameMode);render()});document.querySelectorAll('[data-people-scope]').forEach(b=>b.onclick=()=>{state.peopleScope=b.dataset.peopleScope;render()});document.querySelectorAll('[data-network-scope]').forEach(b=>b.onclick=()=>{state.networkScope=b.dataset.networkScope;render()});document.querySelectorAll('[data-sync-year]').forEach(r=>{r.oninput=e=>{document.querySelectorAll('[data-time-year]').forEach(x=>x.textContent=e.target.value)};r.onchange=e=>setSyncYear(e.target.value)});document.querySelectorAll('[data-jump-year]').forEach(b=>b.onclick=()=>setSyncYear(b.dataset.jumpYear));document.querySelectorAll('[data-play-time]').forEach(b=>b.onclick=toggleTimePlay);document.querySelectorAll('[data-export-geojson]').forEach(b=>b.onclick=exportGeoJSON);document.querySelectorAll('[data-export-jsonld]').forEach(b=>b.onclick=exportJSONLD);document.querySelectorAll('.atlas-map [data-place],.network-canvas [data-person],.network-canvas [data-register-person],.synoptic-network [data-person],.synoptic-network [data-register-person]').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(el.dataset.place)navigate('place',el.dataset.place);else if(el.dataset.registerPerson)navigate('register-person',el.dataset.registerPerson);else navigate('person',el.dataset.person)}}));mapPostProcess();updateNavA11y()}
render=function(opts={}){const focus=opts.keepFocus&&document.activeElement===$('#search'),pos=focus?$('#search').selectionStart:null;nav();const viewsMap={overview:home,synoptic,atlas,network,timeline,stories,cases,wonders,fragments,insights,people,labs,glossary,transmission,rights};const out=state.search?searchView(state.search):(viewsMap[state.view]||home)();$('#view').innerHTML=out;bindDynamic();if(focus){$('#search').focus();$('#search').setSelectionRange(pos,pos)}else if(!opts.noFocus)$('#view').focus({preventScroll:true})}
function handleRoute(){const r=parseRoute();suppressRoute=true;const dlg=$('#modal-root dialog');if(dlg?.open)dlg.close();$('#modal-root').innerHTML='';suppressRoute=false;state.view=r.view;state.search='';$('#search').value='';render({noFocus:!!r.kind});if(!r.kind)return;requestAnimationFrame(()=>{if(r.kind==='person')openPerson(r.id);else if(r.kind==='register-person')openRegisterPerson(r.id);else if(r.kind==='place')openPlace(r.id);else if(r.kind==='route')openRoute(r.id);else if(r.kind==='fragment')openFragment(r.id);else if(r.kind==='insight')openInsight(r.id);else if(r.kind==='case')openCase(r.id);else if(r.kind==='module')openModule(r.id);else if(r.kind==='story'){const i=r.extra?.[0]==='scene'?+r.extra[1]||0:0;openStory(r.id,i)}})}
go=function(v){state.view=v;state.search='';$('#search').value='';const h='#/'+v;if(location.hash===h)handleRoute();else location.hash=h;$('#sidebar').classList.remove('open')}
/* ===== end upgrade block ===== */


$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b)go(b.dataset.view)};
$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');
$('#source-toggle').onclick=()=>{state.sources=!state.sources;localStorage.setItem('damascius-source-mode',state.sources?'on':'off');render()};
$('#pdf-button').onclick=()=>$('#pdf-input').click();
$('#pdf-input').onchange=e=>{const f=e.target.files[0];if(!f)return;if(state.pdfUrl)URL.revokeObjectURL(state.pdfUrl);state.pdfUrl=URL.createObjectURL(f);state.pdfName=f.name;render()};
$('#search').addEventListener('input',e=>{const value=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.search=value.trim();render({keepFocus:true})},90)});
document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;localStorage.setItem('damascius-lang',state.lang);closeModal(false);handleRoute()});
$('#rights-button').onclick=()=>go('rights');
window.addEventListener('hashchange',()=>{if(!suppressRoute)handleRoute()});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){$('#sidebar').classList.remove('open')}});
handleRoute();
})();
</script>
</body>
