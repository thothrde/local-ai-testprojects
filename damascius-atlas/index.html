window.DAMASCIUS_DATA = {"meta":{"title":"Damascius Atlas","subtitle":"Fragmente einer verschwindenden Welt","edition":"Polymnia Athanassiadi, Damascius: The Philosophical History, Apamea 1999","notice":"Öffentliche bilinguale Forschungs- und Leseapp mit synchronisiertem Zeitatlas, erweiterter Prosopographie, stabilen Tiefenlinks, barriereärmeren Dialogen, qualitativen Evidenzstufen und drei interaktiven Modulen. Keine moderne Übersetzung, kein Kommentartext und keine PDF-Datei sind eingebettet.","counts":{"people":26,"places":18,"stories":13,"cases":8,"wonders":18,"fragments":24,"insights":31,"registerPeople":30,"totalPeople":56,"modules":3},"version":"1.4.1","verification":{"date":"2026-08-07","scope":"Technische Tiefenlinks, Suchfokus, Dialogzugänglichkeit einschließlich Fokuswiederherstellung, qualitative Evidenzstufen, synchronisierte Karte/Zeitleiste/Netzwerk, semantische Ortsdaten, 30 zusätzliche Registerprofile und drei interaktive Module.","method":"Automatisierte Daten-, Link-, Sprach-, Dialog-, Such-, Karten-, Zeitlinsen- und Mobiltests in Chromium; redaktionelle Zusatzprofile beruhen auf der Ausgabe und ihrer Einleitung und sind als Kern-, Parallel- oder Kontextprofile gekennzeichnet.","result":"56 Personenprofile insgesamt; 3 interaktive Module; stabile Hash-URLs für Einträge; keine externen Laufzeitabhängigkeiten; keine PDF im Veröffentlichungspaket."}},"people":[{"id":"damascius","name":"Damascius","greek":"Δαμάσκιος","dates":"ca. 458–nach 538","role":"Philosoph, Schulvorsteher, Historiker","group":"philosopher","origin":"Damaskus","places":["damascus","alexandria","athens","ctesiphon","emesa"],"summary":"Rhetor, der unter dem Eindruck der alexandrinischen Verfolgungen zur Philosophie überging; später Leiter der platonischen Schule in Athen.","why":"Er prüft Menschen nicht nur an Lehrsätzen, sondern an der Übereinstimmung von Einsicht, Lebensform und Handeln unter Druck.","tags":["Rhetorik","Platonismus","Exil","Institutionen"],"sources":["Athanassiadi 1999, Introduction","PH passim"],"confidence":"hoch","active":[460,540]},{"id":"isidore","name":"Isidor","greek":"Ἰσίδωρος","dates":"5. Jh.","role":"Philosoph und Lehrer des Damascius","group":"philosopher","origin":"Alexandria","places":["alexandria","athens","bostra","aphrodisias"],"summary":"Exzentrischer, mündlich orientierter Philosoph, den Damascius als Verkörperung unmittelbarer, bacchischer Erkenntnis idealisiert.","why":"Er verbindet philosophische Intuition, moralische Prüfung und Distanz zur bloßen Büchergelehrsamkeit.","tags":["Sokrates","Bacchus","Intuition","Lehrer"],"sources":["PH 35–38","PH 132–144"],"confidence":"hoch","active":[450,515]},{"id":"sarapio","name":"Sarapio","greek":"Σαραπίων","dates":"5. Jh.","role":"Urbaner Eremit","group":"ascetic","origin":"Alexandria","places":["alexandria"],"summary":"Lebte allein in einem kleinen Haus und las nur zwei oder drei Bücher, darunter Orpheus.","why":"Seine freiwillige Bücherarmut ist eine Erkenntnispolitik gegen die Zersplitterung durch fremde Meinungen.","tags":["Orpheus","Askese","Kronisches Leben","Stille"],"sources":["PH 111"],"confidence":"hoch","active":[450,490]},{"id":"asclepiodotus","name":"Asclepiodotus","greek":"Ἀσκληπιόδοτος","dates":"5. Jh.","role":"Universalgelehrter, Arzt, Musiker, Mathematiker","group":"scientist","origin":"Alexandria / Aphrodisias","places":["alexandria","aphrodisias","hierapolis"],"summary":"Experimentierte mit Musikintervallen, Medizin, giftigen Dämpfen und Naturbeobachtung; von Damascius bewundert und bekämpft.","why":"Er verkörpert ein konkurrierendes Philosophenideal: Wahrheit durch Versuch, Rekonstruktion und technische Meisterschaft.","tags":["Experiment","Mathematik","Musik","Medizin"],"sources":["PH 80–87","Appendix II"],"confidence":"hoch","active":[440,505]},{"id":"heraiscus","name":"Heraiscus","greek":"Ἡραΐσκος","dates":"5. Jh.","role":"Ägyptischer Ritualspezialist","group":"ritual","origin":"Ägypten","places":["alexandria","menouthis"],"summary":"Soll beseelte von unbeseelten Kultbildern unterschieden und göttliche Gegenwart körperlich wahrgenommen haben.","why":"Sein Körper fungiert als Resonanzinstrument des Sakralen – Gegenmodell zum distanzierten Experiment.","tags":["Aion","Osiris","Kultbilder","Divination"],"sources":["PH 76"],"confidence":"mittel","active":[445,489]},{"id":"horapollo","name":"Horapollo","greek":"Ὡραπόλλων","dates":"5. Jh.","role":"Leiter einer alexandrinischen Schule","group":"teacher","origin":"Ägypten","places":["alexandria","menouthis"],"summary":"Rhetor und Lehrer in einem internationalen paganen und christlichen Milieu; unter Verfolgung verhaftet und gefoltert.","why":"Sein Leben zeigt die Schule als sozialen, religiösen und politischen Knotenpunkt.","tags":["Schule","Konversion","Folter","Netzwerk"],"sources":["PH 117–121","Athanassiadi 1999, Introduction"],"confidence":"hoch","active":[445,500]},{"id":"ammonius","name":"Ammonius, Sohn des Hermeias","greek":"Ἀμμώνιος","dates":"ca. 440–520","role":"Philosoph und Aristoteles-Kommentator","group":"philosopher","origin":"Alexandria","places":["alexandria","athens"],"summary":"Pragmatischer, wissenschaftlich orientierter Lehrer; Damascius wirft ihm Gewinnsucht und einen Kompromiss mit Peter Mongos vor.","why":"Der Fall bleibt offen: Verrat, Überlebensstrategie oder institutionelle Rettung einer Lehrtradition?","tags":["Aristoteles","Kompromiss","Überleben","Rationalismus"],"sources":["PH 118B","Athanassiadi 1999, Introduction"],"confidence":"mittel","active":[440,525]},{"id":"aedesia","name":"Aedesia","greek":"Αἰδεσία","dates":"5. Jh.","role":"Mäzenin und Trägerin einer philosophischen Familie","group":"woman","origin":"Alexandria","places":["alexandria","athens"],"summary":"Sicherte die Ausbildung ihrer Söhne, bewahrte öffentliche Förderung und half Bedürftigen bis zur eigenen Verschuldung.","why":"Sie macht sichtbar, dass philosophische Sukzession auf Geld, Fürsorge und weiblichen Netzwerken beruht.","tags":["Fürsorge","Dynastie","Bildung "year":485,"title":"Tod des Proklos","category":"institution","detail":"Beginn der offenen Nachfolgekrise.","people":["proclus","marinus","isidore"],"places":["athens"]},{"year":488,"title":"Verfolgung des alexandrinischen Milieus","category":"violence","detail":"Verhaftung, Folter, Flucht und mutmaßliche Kompromisse zerreißen das Netzwerk.","people":["horapollo","heraiscus","isidore","ammonius","peter-mongus","harpocras"],"places":["alexandria","menouthis"]},{"year":489,"title":"Philosophische Wende und Flucht","category":"person","detail":"Unter Isidors Einfluss verlässt Damascius die Rhetorik.","people":["damascius","isidore","dorus","antony-gaza"],"places":["gaza","bostra","damascus","heliopolis"]},{"year":490,"title":"Aphrodisias und Ankunft in Athen","category":"travel","detail":"Begegnung mit Asclepiodotus und Eintritt in die Athener Schulwelt.","people":["damascius","isidore","asclepiodotus"],"places":["aphrodisias","hierapolis","athens"]},{"year":500,"title":"Hegias’ Restaurationsaktivismus","category":"religion","detail":"Heiligtümer werden erneuert; Damascius kritisiert die politische Unklugheit.","people":["hegias"],"places":["athens","attica"]},{"year":515,"title":"Damascius als Diadochos","category":"institution","detail":"Ungefähre Datierung seiner Schulleitung und Reformen.","people":["damascius"],"places":["athens"]},{"year":517,"title":"Möglicher Beginn der Abfassung","category":"text","detail":"Athanassiadi datiert das Werk zwischen 517 und 526.","people":["damascius","theodora"],"places":["athens"]},{"year":529,"title":"Unterrichtsverbot in Athen","category":"violence","detail":"Ein kaiserliches Edikt beendet den öffentlichen Lehrbetrieb.","people":["damascius","simplicius","justinian"],"places":["athens","constantinople"]},{"year":531,"title":"Reise der sieben Philosophen nach Persien","category":"travel","detail":"Hoffnung auf intellektuelle Freiheit bei Chosrau I.","people":["damascius","simplicius","eulalius","priscian","khusrau"],"places":["athens","harran","ctesiphon"]},{"year":532,"title":"Friedensvertrag und Rückkehrgarantie","category":"politics","detail":"Keine erzwungene Änderung ihrer Überzeugungen.","people":["damascius","khusrau","justinian"],"places":["ctesiphon","constantinople"]},{"year":850,"title":"Photios exzerpiert das Werk","category":"transmission","detail":"Seine Epitome bewahrt große Teile und formt sie neu.","people":["photius"],"places":["constantinople"]},{"year":975,"title":"Suda-Exzerpte","category":"transmission","detail":"Lexikographische Zersplitterung bewahrt zusätzliche Fragmente.","people":[],"places":["constantinople"]},{"year":1999,"title":"Athanassiadis Rekonstruktion","category":"transmission","detail":"Text, Übersetzung, Kommentar und neue Gesamtordnung.","people":[],"places":[]}],"stories":[{"id":"alexandria-collapse","title":"Alexandria 488/89 – Das Netzwerk zerbricht","subtitle":"Verfolgung, Folter, Flucht und Kompromiss","duration":"12 Min.","tone":"investigativ","cover":"network","intro":"Eine Schule ist zugleich Lehrbetrieb, Familie, Kultgemeinschaft, Karriereweg und Schutznetz.","scenes":[{"title":"Die Schule als Knoten","text":"Horapollos Einrichtung versammelt pagane und christliche Schüler, Rhetoren, Philosophen, Familien und Kultspezialisten.","place":"alexandria","people":["horapollo","ammonius","isidore","heraiscus","damascius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Der Auslöser","text":"Ein Konflikt um einen konvertierten Studenten, ein geheimes Isisheiligtum und kirchenpolitische Rivalitäten wird zur Operation gegen das pagane Milieu.","place":"menouthis","people":["peter-mongus","horapollo"],"source":"Athanassiadi 1999, Introduction"},{"title":"Folter und Schweigen","text":"Horapollo und Heraiscus werden gefoltert, um Verstecke preiszugeben. Damascius macht ihr Schweigen zur moralischen Probe.","place":"alexandria","people":["horapollo","heraiscus","isidore"],"source":"PH 117B–C"},{"title":"Der offene Fall Ammonius","text":"Ammonius bleibt beruflich unbeschädigt und trifft eine Vereinbarung mit dem Patriarchen. Der Inhalt ist verloren.","place":"alexandria","people":["ammonius","peter-mongus"],"source":"PH 118B; Athanassiadi 1999, Introduction"},{"title":"Konversion des Damascius","text":"Die Krise zerstört sein Vertrauen in Rhetorik. Philosophie wird zur Frage, ob Worte im Handeln bestehen.","place":"alexandria","people":["damascius","isidore"],"source":"Athanassiadi 1999, Introduction; contrast PH 124"}],"durationMinutes":12,"significance":"Die Episode zeigt die Schule nicht als isolierten Unterrichtsraum, sondern als verletzliches Geflecht aus Familien, Karrieren, Kulten, Patronage und persönlicher Loyalität. Weil Damascius parteiisch berichtet und die Bedingungen von Ammonius’ Vereinbarung verloren sind, muss dessen Rolle offenbleiben.","sourceNote":"Die Ereignisfolge wird aus Damascius-Fragmenten und zeitnahen christlichen Quellen rekonstruiert. Die App unterscheidet überlieferte Einzelheiten von Athanassiadis moderner Synthese.","visualBasis":"Das Diagramm zeigt nur bezeugte oder rekonstruierte Beziehungen zwischen Schule, Heiligtum, Verfolgten und kirchlicher Macht."},{"id":"sarapio-path","title":"Der Mann mit nur drei Büchern","subtitle":"Sarapio und die Politik der geistigen Armut","duration":"8 Min.","tone":"kontemplativ","cover":"books","intro":"Was wäre, wenn eine Bibliothek nicht durch Wachstum, sondern durch radikale Auswahl philosophisch wird?","scenes":[{"title":"Das kleine Haus","text":"Sarapio lebt nahezu unsichtbar in Alexandria und empfängt fast niemanden.","place":"alexandria","people":["sarapio"],"source":"PH 111"},{"title":"Zwei oder drei Bücher","text":"Er besitzt nur wenige Texte, darunter Orpheus. Bücher werden nach ihrer Fähigkeit zur Sammlung beurteilt.","place":"alexandria","people":["sarapio","isidore"],"source":"PH 111"},{"title":"Kronos in der Gegenwart","text":"Damascius erklärt ihn zum Beweis eines goldenen, kronischen Lebens mitten in einer typhonischen Zeit.","place":"alexandria","people":["sarapio","pamprepius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Das Problem","text":"Ist Rückzug höchste Konzentration – oder entzieht er Tugend der politischen Bewährung?","place":"alexandria","people":["sarapio","damascius"],"source":"Kontrast PH 111 / PH 124"}],"durationMinutes":8,"significance":"Sarapio dient Damascius als kronisches Gegenbild zu einer zerstreuten, „typhonischen“ Gegenwart. Zugleich erklärt Damascius an anderer Stelle, Tugend müsse sich im Handeln bewähren. Das Porträt enthält daher eine echte Spannung zwischen Rückzug und öffentlicher Bewährung.","sourceNote":"Die wenigen biographischen Angaben stammen aus der fragmentarischen Überlieferung; die Deutung als Erkenntnispolitik ist eine ausdrücklich gekennzeichnete Interpretation der App.","visualBasis":"Haus, wenige Bücher und ein einzelner Besucher stammen aus der Sarapio-Erzählung; die Grafik behauptet keine Rekonstruktion seines Hauses."},{"id":"asclepiodotus-path","title":"Das verlorene Intervall","subtitle":"Asclepiodotus zwischen Labor und Metaphysik","duration":"11 Min.","tone":"experimentell","cover":"monochord","intro":"Ein Universalgelehrter versucht, eine Klangwelt wiederzugewinnen, die seine Zeit nicht mehr hören kann.","scenes":[{"title":"220 Positionen","text":"Am Monochord verschiebt Asclepiodotus den Steg in mindestens 220 Positionen, um die enharmonische Diesis zu rekonstruieren.","place":"aphrodisias","people":["asclepiodotus"],"source":"PH 85B"},{"title":"Das historische Ohr","text":"Eine Kultur kann die Fähigkeit verlieren, ein Intervall überhaupt wahrzunehmen.","place":"aphrodisias","people":["asclepiodotus"],"source":"PH 85B"},{"title":"Der giftige Abstieg","text":"In Hierapolis schützt er sich mit eingeschlossener Außenluft und untersucht einen tödlichen unterirdischen Dampf.","place":"hierapolis","people":["asclepiodotus","damascius"],"source":"PH 87A"},{"title":"Medizin als Rekonstruktion","text":"Er stellt den Gebrauch der weißen Nieswurz wieder her.","place":"aphrodisias","people":["asclepiodotus","iacobus"],"source":"PH 85D"},{"title":"Damascius’ Abwehr","text":"Gerade seine empirische Genialität macht ihn zum gefährlichen Gegenmodell.","place":"aphrodisias","people":["asclepiodotus","damascius","isidore"],"source":"Athanassiadi 1999, Introduction"}],"durationMinutes":11,"significance":"Die ungewöhnlich vielen technischen Anekdoten machen Asclepiodotus zu einem konkurrierenden Modell des Philosophen. Damascius’ Kritik ist deshalb selbst ein historischer Befund über rivalisierende Standards von Wissen und nicht als neutrales Urteil zu übernehmen.","sourceNote":"Monochord, Medizin und Dampfexperiment sind als Berichte des Damascius überliefert. Die App trennt den Bericht von moderner naturwissenschaftlicher Einordnung.","visualBasis":"Monochord, beweglicher Steg, Heilpflanze und Höhlengang visualisieren ausdrücklich genannte Experimente."},{"id":"anthusa-path","title":"Die Frau, die aus Wolken las","subtitle":"Anthusa und eine neu erfundene Mantik","duration":"7 Min.","tone":"visuell","cover":"clouds","intro":"Eine persönliche Sorge, ein Traum und ein politisches Ereignis werden zur Gründungsgeschichte einer Methode.","scenes":[{"title":"Gebet an beide Horizonte","text":"Anthusa betet zur aufgehenden Sonne; der verstorbene Vater fordert sie im Traum auf, auch die untergehende Sonne anzurufen.","place":"aegae","people":["anthusa"],"source":"PH 52"},{"title":"Mann, Löwe, Verschlingen","text":"Zwei Wolken nehmen Gestalt an. Ein Löwe verschlingt einen gotisch wirkenden Mann.","place":"constantinople","people":["anthusa"],"source":"PH 52"},{"title":"Politische Erfüllung","text":"Damascius verbindet das Bild mit der Ermordung Aspars durch Kaiser Leo.","place":"constantinople","people":["anthusa"],"source":"PH 52"},{"title":"Von der Vision zur Technik","text":"Anthusa soll die Wolkenmantik anschließend dauerhaft praktiziert haben.","place":"aegae","people":["anthusa"],"source":"PH 52"}],"durationMinutes":7,"significance":"Die Erzählung verbindet persönliche Sorge, Traumweisung, Wolkenbeobachtung und politische Erinnerung. Damascius schreibt Anthusa die Umwandlung eines einzelnen Zeichens in eine fortgesetzte Kunst zu; unabhängig überprüfen lässt sich diese Methode nicht.","sourceNote":"Die historische Ermordung Aspars ist vom mantischen Deutungsrahmen zu unterscheiden. Die App behauptet keine erfolgreiche Vorhersage als Tatsache.","visualBasis":"Die Wolkenformen – Mann und Löwe – folgen der erzählten Vision; jede atmosphärische Ausgestaltung ist diagrammatisch."},{"id":"journey-conversion","title":"Die Reise der Bekehrung","subtitle":"Von Alexandria nach Athen durch sakrale Landschaften","duration":"14 Min.","tone":"atlas","cover":"route","intro":"Flucht, Bildungsreise, Pilgerfahrt und Feldforschung überlagern sich.","scenes":[{"title":"Gaza: Hilfe","text":"Antony unterstützt die Flüchtenden. Dankbarkeit wird zu einem Punkt in Damascius’ Gedächtnisgeographie.","place":"gaza","people":["damascius","isidore"],"source":"PH 132–144"},{"title":"Bostra und Arabien","text":"Mit Dorus besuchen sie Kultorte, heilige Gewässer und lokale Theologien.","place":"bostra","people":["damascius","isidore"],"source":"PH 134–142, reconstructed sequence"},{"title":"Heliopolis","text":"Lokale Priester und selbsternannte Philosophen werden zu Prüfsteinen echter und vorgetäuschter Weisheit.","place":"heliopolis","people":["damascius","isidore"],"source":"PH 138–141"},{"title":"Berytos","text":"Damascius hört den Eshmun-Mythos und bewahrt eine phönizische Stimme in griechischer Sprache.","place":"berytius","people":["damascius"],"source":"PH 142B"},{"title":"Aphrodisias","text":"Asclepiodotus führt die Reisenden in eine Welt aus Experiment, Kult und Institutionenbildung.","place":"aphrodisias","people":["asclepiodotus","isidore","damascius"],"source":"PH 81–90"},{"title":"Athen","text":"Die Reise endet in einer alternden, intriganten Schule, die Damascius später reformieren will.","place":"athens","people":["damascius","isidore","marinus"],"source":"PH 145–152"}],"durationMinutes":14,"significance":"Die Route verwandelt Flucht in intellektuelle Feldforschung. Lokale Informanten, Landschaften und Kulttraditionen gelangen in das Werk; zugleich hängt die genaue Reihenfolge der Stationen von einer modernen Anordnung verstreuter Fragmente ab.","sourceNote":"Die gezeichnete Linie ist eine quellenbasierte Rekonstruktion, keine antike Reiseroute mit vollständig überlieferten Etappen.","visualBasis":"Orte und Bewegungsrichtung beruhen auf der rekonstruierten Reiseabfolge; die Linie ist ein Korridor, keine exakte antike Route."},{"id":"golden-chain","title":"Die goldene Kette und ihre dunkle Unterseite","subtitle":"Nachfolge, Familien, Bücher und Macht","duration":"10 Min.","tone":"institutionell","cover":"chain","intro":"Metaphysische Sukzession erscheint in der Praxis als Kampf um Lehrstühle, Texte und Legitimität.","scenes":[{"title":"Der alternde Proklos","text":"Während Proklos’ Krankheit beginnt die Frage, wer die platonische Autorität erben kann.","place":"athens","people":["proclus","marinus"],"source":"PH 97–105"},{"title":"Marinus’ Buchverbrennung","text":"Ein höflicher Satz Isidors genügt: Der umfangreiche Philebos-Kommentar wird vernichtet.","place":"athens","people":["marinus","isidore","proclus"],"source":"PH 38A"},{"title":"Parmenides als Kampfzone","text":"Ob der Dialog von Arten oder Göttern handelt, entscheidet über die theologische Identität der Schule.","place":"athens","people":["marinus","isidore","proclus"],"source":"PH 97I–J"},{"title":"Freier Diadochos?","text":"Isidor erhält möglicherweise einen Ehrenstatus, ohne die Schule regulär zu leiten.","place":"athens","people":["isidore","damascius"],"source":"Athanassiadi 1999, Introduction"}],"durationMinutes":10,"significance":"Philosophische Sukzession erscheint hier nicht nur als metaphysische „goldene Kette“, sondern als Streit um Autorität, Geld, Manuskripte, Familien und institutionelle Legitimität. Gerade die Selbstvernichtung von Texten macht den inneren Mechanismus kulturellen Verlusts sichtbar.","sourceNote":"Damascius ist Beteiligter und moralischer Richter dieser Konflikte. Seine Charakterbilder sind Quellen, aber keine unparteiischen Protokolle.","visualBasis":"Die Kette wird als institutionelles Beziehungsdiagramm gezeigt, nicht als historisches Objekt."},{"id":"persian-exile","title":"Die sieben Philosophen in Persien","subtitle":"Utopie, Kulturschock und ausgehandelte Rückkehr","duration":"12 Min.","tone":"politisch","cover":"exile","intro":"Als der Lehrbetrieb verboten wird, versucht Damascius eine ganze Institution in eine andere Welt zu versetzen.","scenes":[{"title":"Verbergen und Packen","text":"Heilige Objekte werden in Brunnen verborgen, Handschriften gepackt.","place":"athens","people":["damascius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Die Hoffnung auf Chosrau","text":"Platonische Königsideale lassen Ktesiphon wie einen Ort philosophischer Freiheit erscheinen.","place":"ctesiphon","people":["damascius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Kulturschock","text":"Der Hof ist kein freier Lehrraum; die Philosophen werden zu fremden Beratern.","place":"ctesiphon","people":["damascius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Gewissensfreiheit","text":"Der Friedensvertrag garantiert nach Agathias Freiheit von erzwungenem Glaubenswechsel.","place":"harran","people":["damascius"],"source":"Agathias II.31"},{"title":"Harran?","text":"Ob die Rückkehrer tatsächlich in Harran lebten, bleibt umstritten.","place":"harran","people":["damascius"],"source":"Athanassiadi 1999, Introduction"}],"durationMinutes":12,"significance":"Die Geschichte fragt, ob eine Institution in eine andere politische Welt versetzt werden kann. Der persische Hof enttäuscht die Hoffnung auf den philosophischen König; der Friedensvertrag sichert nach Agathias wenigstens Schutz vor erzwungener Konversion.","sourceNote":"Die Reise nach Persien ist antik bezeugt. Verborgene Kultobjekte, mitgeführte Manuskripte und ein späterer Aufenthalt in Harran gehören teilweise zu moderner Rekonstruktion und bleiben unterschiedlich sicher.","visualBasis":"Orte, Manuskripte, verborgene Kultobjekte und Vertragsklausel stammen aus der modernen Rekonstruktion und Parallelüberlieferung."},{"id":"zosime-path","title":"Zosimes Freiheit","subtitle":"Zwei Verse gegen die soziale Definition eines Menschen","duration":"5 Min.","tone":"minimal","cover":"epigram","intro":"Die kleinste Geschichte enthält möglicherweise die stärkste philosophische Verdichtung.","scenes":[{"title":"Der Grabstein","text":"Zosime spricht: Früher war sie nur körperlich versklavt; im Tod sei nun auch der Körper frei.","place":"emesa","people":["zosime","damascius"],"source":"Anthologia Graeca VII.553"},{"title":"Innere Freiheit","text":"Die Seele war nie Besitz eines anderen.","place":"emesa","people":["zosime"],"source":"Athanassiadi 1999, Introduction"},{"title":"Damascius im Alter","text":"Das Epigramm ist ein schwaches Indiz für seine Rückkehr in die syrische Heimat.","place":"emesa","people":["damascius"],"source":"Athanassiadi 1999, Introduction"}],"durationMinutes":5,"significance":"Das kurze Epigramm verdichtet die Unterscheidung zwischen innerer und körperlich-sozialer Freiheit in der Stimme einer versklavten Frau. Seine mögliche Verbindung mit den letzten Lebensjahren des Damascius ist bewegend, aber biographisch nur ein schwaches Indiz.","sourceNote":"Der Wortlaut wird in der öffentlichen App nicht aus einer modernen Übersetzung übernommen, sondern eigenständig paraphrasiert.","visualBasis":"Grabstein und gebrochene Fessel sind analytische Zeichen für Epigramm und soziale Unfreiheit; kein Grabmal wird rekonstruiert."},{"id":"sacred-geography","title":"Die arabische Styx","subtitle":"Naturphänomen, Eid und göttliches Urteil","duration":"8 Min.","tone":"landschaft","cover":"water","intro":"In der sakralen Geographie sind Natur, Recht, Ritual und Körper nicht getrennt.","scenes":[{"title":"Der Abstieg","text":"Auch geeignete Frauen steigen in die Schlucht hinab; Gärten und Höfe liegen in der Tiefe.","place":"bostra","people":["damascius","isidore"],"source":"PH 135"},{"title":"Das Wasser entscheidet","text":"Leichte Opfer sinken, schwere werden zurückgeworfen – je nach göttlicher Zustimmung.","place":"bostra","people":["damascius","isidore"],"source":"PH 135"},{"title":"Eid und Körper","text":"Meineid an diesem Wasser soll binnen eines Jahres durch Wassersucht bestraft werden.","place":"bostra","people":["damascius"],"source":"PH 135"},{"title":"Feldforschung","text":"Lokale Erfahrung, Homerzitate und religiöse Deutung werden in einem Bericht gesammelt.","place":"bostra","people":["damascius","isidore"],"source":"Kommentar zu PH 135"}],"durationMinutes":8,"significance":"Der Bericht verbindet Landschaft, Recht, Körper und Ritual. Er ist besonders aufschlussreich für eine Welt, in der Naturerscheinung und göttliches Urteil nicht als getrennte Kategorien behandelt werden.","sourceNote":"Die App behauptet weder die physikalische Funktionsweise der Opferprobe noch die berichtete Strafe für Meineid. Sie untersucht die Erzählung als heilige Geographie.","visualBasis":"Schlucht, Wasser, Gabe und Waage entsprechen den Elementen der Erzählung; ihr physischer Mechanismus bleibt unbekannt."},{"id":"phantom-wars","title":"Schlachten nach dem Tod","subtitle":"Phantomkrieger, Geräusche und wiederkehrende Orte","duration":"7 Min.","tone":"paradoxographisch","cover":"ghosts","intro":"Damascius vergleicht einen wiederkehrenden Typus von Erscheinung.","scenes":[{"title":"Drei Tage Kampf","text":"Nach einer großen Schlacht sollen die Seelen der Gefallenen drei Tage und Nächte weitergekämpft haben.","place":"rome","people":["damascius"],"source":"PH 50"},{"title":"Geographie der Wiederholung","text":"Ähnliche Phantome erscheinen in Karien, Sizilien und anderen Ebenen.","place":"aphrodisias","people":["damascius"],"source":"PH 50"},{"title":"Anomalietyp","text":"Der Text sammelt Zeugen, Orte und Varianten eines Phänomens.","place":"rome","people":["damascius"],"source":"PH 50"}],"durationMinutes":7,"significance":"Die Sammlung ähnlicher Berichte zeigt Damascius’ Interesse an wiederkehrenden Typen des Außergewöhnlichen. Der vergleichende Impuls ist historisch interessant; er beweist nicht, dass die Erscheinungen stattgefunden haben.","sourceNote":"Orte und Varianten sind als antike Berichte dargestellt, nicht als bestätigte Ereignisse.","visualBasis":"Wiederholte Schlachtlinien und drei Zeitmarken visualisieren die vergleichende Typologie der Erzählungen."},{"id":"eshmun-path","title":"Eshmun, der achte Sohn","subtitle":"Ein phönizischer Heilgott zwischen Kastration und Wiedergeburt","duration":"7 Min.","tone":"mythologisch","cover":"eshmun","intro":"Eine lokale mündliche Überlieferung gelangt in eine griechische philosophische Reiseerzählung.","scenes":[{"title":"Astronoes Verfolgung","text":"Die Göttin verfolgt den schönen Jäger Eshmun; in Panik verstümmelt er sich.","place":"berytius","people":[],"source":"PH 142B"},{"title":"Lebenswärme","text":"Astronoe belebt ihn durch Wärme neu; der Jüngling wird zum Heilgott.","place":"berytius","people":["damascius"],"source":"PH 142B"},{"title":"Die Acht","text":"Eine zweite Etymologie macht ihn zum achten Sohn und öffnet kosmologische Symbolik.","place":"berytius","people":["isidore"],"source":"Kommentar zu PH 142B"},{"title":"Lokale Stimme","text":"Der Erzählstil deutet auf einen örtlichen Informanten.","place":"berytius","people":["damascius"],"source":"Athanassiadi 1999, commentary"}],"durationMinutes":7,"significance":"Die Episode kann eine lokale phönizische Tradition bewahren, aber sie erreicht uns durch eine griechische philosophische Reiseerzählung. Gerade diese Übersetzung zwischen lokalen und gelehrten Deutungssystemen macht sie wichtig.","sourceNote":"Die Annahme eines lokalen Informanten ist plausibel, aber keine direkt überlieferte Angabe.","visualBasis":"Axt, Wärme, Tod und Wiederbelebung sind Symbole des überlieferten lokalen Mythos, keine Kultbildrekonstruktion."},{"id":"hypatia-path","title":"Hypatia im Spiegel des Damascius","subtitle":"Bewunderung, Mordbericht und disziplinäre Hierarchie","duration":"9 Min.","tone":"kritisch","cover":"hypatia","intro":"Eine Quelle kann zugleich wertvolles Zeugnis und parteiisches Urteil sein.","scenes":[{"title":"Öffentliche Autorität","text":"Hypatia lehrt öffentlich, berät Amtsträger und wird von der Stadt hoch geachtet.","place":"alexandria","people":["hypatia"],"source":"PH 43E"},{"title":"Neid und Mord","text":"Damascius macht Kyrills Neid zum Ausgangspunkt des Mordkomplotts.","place":"alexandria","people":["hypatia"],"source":"PH 43E"},{"title":"Wahrer Philosoph gegen Mathematikerin","text":"An anderer Stelle dient Hypatia als Gegenfolie für Isidors höhere Philosophie.","place":"alexandria","people":["hypatia","isidore"],"source":"PH 106A"},{"title":"Quellenkritik","text":"Gerade die Ungerechtigkeit des Vergleichs dokumentiert Damascius’ Hierarchie.","place":"alexandria","people":["hypatia","damascius"],"source":"Interpretative Analyse"}],"durationMinutes":9,"significance":"Damascius liefert ein wertvolles Zeugnis für Hypatias öffentliche Autorität und benutzt sie zugleich als Gegenfolie für Isidors angeblich höhere Philosophie. Seine Voreingenommenheit ist deshalb kein Grund, die Quelle zu verwerfen; sie ist selbst Teil des historischen Befunds.","sourceNote":"Die App hält PH 43E (öffentliche Autorität und Tod) und PH 106A (Vergleich mit Isidor) ausdrücklich auseinander.","visualBasis":"Stadt, Lehrstuhl, mathematische Figur und zerrissene Öffentlichkeit markieren die getrennten Aussagen über Autorität, Mathematik und Mord."},{"id":"brahmans-path","title":"Brahmanen im Haus eines römischen Senators","subtitle":"Alexandria als transkultureller Knoten","duration":"6 Min.","tone":"ethnographisch","cover":"brahmans","intro": s":["emesa"],"notes":"Kein Fragment des Werkes, aber zentral für Damascius’ späte Biographie.","pageRange":"48–49","greekPages":"48","translationPages":"49","openPages":[49],"verificationCue":"Grabepigramm: zuerst nur körperlich versklavt, nun auch körperlich frei.","verified":true,"verifiedVersion":"1.0.1","verifiedDate":"2026-08-06"}],"glossary":[{"term":"Kronisches Leben","greek":"Κρόνιος βίος","definition":"Von Vernunft, Einheit und innerer Sammlung geprägte Lebensform; Sarapio ist das Idealbild."},{"term":"Typhonisches Leben","greek":"Τυφώνιος βίος","definition":"Zersplitterung durch Begierde, Machtstreben, Unwahrheit und gesellschaftliche Gewaltsamkeit."},{"term":"Bacchus","greek":"Βάκχος","definition":"Metapher für den wahren Philosophen, der philosophische Einsicht und hieratische Erfahrung vereinigt."},{"term":"Theurgie","greek":"θεουργία","definition":"Rituelle Praxis, welche die Seele durch göttliche Symbole und Ursachen emporführen soll."},{"term":"Diadochos","greek":"διάδοχος","definition":"Nachfolger bzw. Leiter einer philosophischen Schule; spiritueller Rang und umkämpfte Institution."},{"term":"Polydoxia","greek":"πολυδοξία","definition":"Vielheit von Meinungen; Risiko ungerichteter Bücher- und Hörgelehrsamkeit."},{"term":"Genesis","greek":"γένεσις","definition":"Bereich des Werdens und der Verkörperung; Gegensatz zu intelligiblem Sein und Einheit."},{"term":"Eumoiria","greek":"εὐμοιρία","definition":"Angeborene glückliche Intuition oder besondere Begabung."},{"term":"Patria","greek":"πάτρια","definition":"Lokale Traditionen, Ursprungs- und Ortsgeschichten."},{"term":"Paradoxa","greek":"παράδοξα","definition":"Berichte über Wunderbares und Anomalien; bei Damascius eine Erkenntnisform."},{"term":"Prosopographie","greek":"προσωπογραφία","definition":"Geschichte durch Beziehungsnetze von Personen, Familien, Schulen und Ämtern."},{"term":"Suda","greek":"Σοῦδα","definition":"Byzantinisches Lexikon des 10. Jahrhunderts mit vielen Damascius-Fragmenten."},{"term":"Photios-Epitome","greek":"Βιβλιοθήκη, κώδιξ 242","definition":"Wichtigste zusammenhängende Überlieferung des verlorenen Werkes."},{"term":"Hellenismus","greek":"Ἑλληνισμός","definition":"Pagane religiös-philosophische Lebensordnung, nicht nur Sprache oder Bildung."},{"term":"Heilige Geographie","greek":"ἱερὰ τοπογραφία","definition":"Landschaften, Quellen, Höhlen und Städte als Träger göttlicher Präsenz."},{"term":"Rhetorik","greek":"ῥητορική","definition":"Notwendige Technik, aber gefährlich, wenn Karriere und Schein über Wahrheit gestellt werden."}],"sources":[{"id":"athanassiadi","title":"Polymnia Athanassiadi, Damascius: The Philosophical History","type":"Moderne Edition","date":"1999","note":"Grundlage der App: rekonstruierter griechischer Text, englische Übersetzung, Kommentar, Testimonien und Anhänge."},{"id":"photius-source","title":"Photios, Bibliotheca, Codex 242","type":"Byzantinische Epitome","date":"9. Jh.","note":"Wichtigster zusammenhängender Überlieferungszeuge; kürzt und beurteilt aus christlicher Perspektive."},{"id":"suda-source","title":"Suda-Lexikon","type":"Lexikographische Exzerpte","date":"10. Jh.","note":"Bewahrt zusätzliche Splitter; Reihenfolge und Kontext sind häufig verloren."},{"id":"marinus-source","title":"Marinus, Vita Procli","type":"Zeitnahe Hagiographie","date":"spätes 5. Jh.","note":"Vergleichsquelle zur Athener Schule und zum Proklosbild."},{"id":"zacharias-source","title":"Zacharias von Mytilene, Vita Severi / Ammonius","type":"Christliche Parallelquelle","date":"5./6. Jh.","note":"Ermöglicht Gegenlesen des alexandrinischen Schulmilieus."},{"id":"agathias-source","title":"Agathias, Historien II","type":"Historische Parallelquelle","date":"6. Jh.","note":"Hauptquelle für Persienreise und Rückkehrgarantie."},{"id":"socrates-source","title":"Sokrates Scholastikos, Kirchengeschichte VII.15","type":"Historische Parallelquelle","date":"5. Jh.","note":"Frühere Quelle zur Ermordung Hypatias."},{"id":"inscriptions-source","title":"Inschriften und Papyri","type":"Dokumentarische Quellen","date":"Spätantike","note":"Unter anderem das Zosime-Epigramm und Zeugnisse aus Aphrodisias."}],"i18n":{"people":{"damascius":{"role":"Philosopher, school head, historian","origin":"Damascus","summary":"A rhetorician who turned to philosophy after the Alexandrian persecutions and later led the Platonic school in Athens.","why":"He judges people not only by doctrines but by whether insight, way of life, and action remain coherent under pressure.","tags":["Rhetoric","Platonism","Exile","Institutions"],"name":"Damascius","dates":"c. 458–after 538","confidence":"high"},"isidore":{"role":"Philosopher and teacher of Damascius","origin":"Alexandria","summary":"An eccentric, orally oriented philosopher whom Damascius idealises as an embodiment of immediate, Bacchic insight.","why":"He joins philosophical intuition and moral testing with distrust of mere book learning.","tags":["Socrates","Bacchus","Intuition","Teacher"],"name":"Isidore","dates":"5th c.","confidence":"high"},"sarapio":{"role":"Urban hermit","origin":"Alexandria","summary":"He lived alone in a tiny house and owned only two or three books, including Orphic poetry.","why":"His voluntary poverty of books is an epistemic policy against fragmentation by borrowed opinions.","tags":["Orpheus","Asceticism","Cronian life","Silence"],"name":"Sarapio","dates":"5th c.","confidence":"high"},"asclepiodotus":{"role":"Polymath, physician, musician, mathematician","origin":"Alexandria / Aphrodisias","summary":"He experimented with musical intervals, medicine, toxic vapours, and natural phenomena; Damascius both admired and attacked him.","why":"He embodies a rival ideal of philosophy: truth through experiment, reconstruction, and technical mastery.","tags":["Experiment","Mathematics","Music","Medicine"],"name":"Asclepiodotus","dates":"5th c.","confidence":"high"},"heraiscus":{"role":"Egyptian ritual specialist","origin":"Egypt","summary":"He was said to distinguish divinely animated cult images from inert ones and to perceive sacred presence bodily.","why":"His body becomes a resonant instrument of the sacred, opposed to detached experiment.","tags":["Aion","Osiris","Cult images","Divination"],"name":"Heraiscus","dates":"5th c.","confidence":"medium"},"horapollo":{"role":"Head of an Alexandrian school","origin":"Egypt","summary":"A rhetorician and teacher in an international pagan-Christian milieu; arrested and tortured during persecution.","why":"His life reveals the school as a social, religious, and political node.","tags":["School","Conversion","Torture","Network"],"name":"Horapollo","dates":"5th c.","confidence":"high"},"ammonius":{"role":"Philosopher and commentator on Aristotle","origin":"Alexandria","summary":"A pragmatic, scientifically minded teacher whom Damascius accuses of greed and of striking a bargain with Peter Mongus.","why":"The case remains open: betrayal, survival strategy, or institutional rescue?","tags":["Aristotle","Compromise","Survival","Rationalism"],"name":"Ammonius, son of Hermeias","dates":"c. 440–520","confidence":"medium"},"aedesia":{"role":"Patron and bearer of a philosophical family","origin":"Alexandria","summary":"She secured her sons’ education, preserved public support, and helped the poor even at the cost of debt.","why":"She shows that philosophical succession depends on money, care, and women’s networks.","tags":["Care","Dynasty","Education","Patronage"],"name":"Aedesia","dates":"5th c.","confidence":"high"},"hypatia":{"role":"Mathematician, philosopher, public teacher","origin":"Alexandria","summary":"Admired for dialectic, political judgement, and public authority, yet ranked below the “true philosopher” in Damascius’ hierarchy.","why":"The tension between reverence and demotion exposes Damascius’ own ideal of philosophy.","tags":["Mathematics","Politics","Murder","Public life"],"name":"Hypatia","dates":"c. 355–415","confidence":"high"},"theosebius":{"role":"Practical ethicist","origin":"Unknown","summary":"He invoked Helios and the God of the Jews in an exorcism and later lived in a voluntarily continent marriage.","why":"He exemplifies an urban pagan asceticism that is neither simply theurgic nor Christian.","tags":["Asceticism","Marriage","Exorcism","Syncretism"],"name":"Theosebius","dates":"5th c.","confidence":"high"},"anthusa":{"role":"Inventor of cloud divination","origin":"Aegae in Cilicia","summary":"She interpreted a cloud vision as an omen of Aspar’s killing and was said to turn it into a continuing divinatory technique.","why":"She appears not merely as a visionary but as a methodological innovator.","tags":["Clouds","Divination","Politics","Innovation"],"name":"Anthusa","dates":"5th c.","confidence":"medium"},"epiphanius":{"role":"Astronomer and mystery specialist","origin":"Alexandria","summary":"A custodian of Osiris and Aion mysteries, probably connected with Theon’s scientific circle.","why":"He represents the transitional generation that still knew the last bearers of the old order.","tags":["Aion","Astronomy","Osiris","Transmission"],"name":"Epiphanius","dates":"4th/5th c.","confidence":"medium"},"euprepius":{"role":"Leader of Persian mysteries","origin":"Alexandria","summary":"A ritual specialist who transmitted older pagan narratives after institutional continuity had broken.","why":"Tradition appears as a chain of personal contacts rather than an unbroken institution.","tags":["Mysteries","Transmission","Ritual"],"name":"Euprepius","dates":"4th/5th c.","confidence":"medium"},"olympos":{"role":"Charismatic priest of Sarapis","origin":"Cilicia","summary":"He taught the ancestral rites while their social world was collapsing and foretold that Sarapis would leave the temple.","why":"He shows how a religion ends when competent teachers disappear.","tags":["Sarapis","Serapeum","Charisma","End of religion"],"name":"Olympos","dates":"4th/5th c.","confidence":"medium"},"iacobus":{"role":"Physician and benefactor","origin":"Alexandria","summary":"He treated poor patients without payment and persuaded the wealthy to help; Isidore called his soul Asclepian.","why":"Technical mastery is understood as ethical and religious likeness to the patron god of an art.","tags":["Medicine","Poverty","Asclepius","Professional ethics"],"name":"Iacobus","dates":"5th c.","confidence":"high"},"marinus":{"role":"Successor of Proclus","origin":"Neapolis","summary":"After Isidore’s terse criticism he burned an unpublished commentary on the Philebus.","why":"His case reveals textual loss through internal censorship and the authority of the master.","tags":["Philebus","Parmenides","Self-censorship","Succession"],"name":"Marinus","dates":"5th c.","confidence":"high"},"proclus":{"role":"Platonic successor","origin":"Constantinople / Lycia","summary":"The commanding authority of the Athenian school; after his death his theology became both norm and object of internal criticism.","why":"He functions not only as an author but as an institutional field of gravity.","tags":["Theology","Succession","Authority","Theurgy"],"name":"Proclus","dates":"412–485","confidence":"high"},"hegias":{"role":"Philosopher and pagan activist","origin":"Athens","summary":"He secretly restored sanctuaries; Damascius criticises his zeal as politically dangerous.","why":"He forces a distinction between piety, activism, and judgement.","tags":["Theurgy","Sanctuaries","Activism","Risk"],"name":"Hegias","dates":"5th/6th c.","confidence":"high"},"pamprepius":{"role":"Poet, politician, prophet","origin":"Panopolis","summary":"He linked the revolt of Illus with hopes for pagan restoration; Damascius casts him as the Typhonian opposite of Sarapio.","why":"Religious hope, propaganda, and personal ambition merge in him.","tags":["Propaganda","Illus","Typhon","Revolt"],"name":"Pamprepius","dates":"c. 440–484","confidence":"medium"},"peter-mongus":{"role":"Patriarch of Alexandria","origin":"Alexandria","summary":"A Miaphysite patriarch whom Athanassiadi’s reconstruction places within the persecution of the pagan school milieu.","why":"He reminds us both of Damascius’ partisanship and of the multiple fronts of church politics.","tags":["Church politics","Persecution","Alexandria"],"name":"Peter Mongos","dates":"† 490","confidence":"medium"},"photius":{"role":"Patriarch and excerptor","origin":"Constantinople","summary":"Codex 242 of his Bibliotheca preserves the most important continuous epitome of the lost work.","why":"Without Photius the work would scarcely survive, yet we see it through a ninth-century Christian reader.","tags":["Bibliotheca","Epitome","Transmission","Filter"],"name":"Photius","dates":"c. 810–893","confidence":"high"},"theodora":{"role":"Student and dedicatee","origin":"Emesene dynasty","summary":"A learned pupil of Damascius and Isidore who, with others, requested the composition of the work.","why":"The Philosophical History is also the result of female demand and patronage.","tags":["Dedication","Student","Patronage"],"name":"Theodora","dates":"5th/6th c.","confidence":"high"},"zosime":{"role":"Formerly enslaved woman","origin":"Syria","summary":"On her grave she says that she was once enslaved only in body and has now found bodily freedom as well.","why":"Two verses apply Platonic inner freedom to a woman without social rights.","tags":["Slavery","Freedom","Funerary epigram","Soul"],"name":"Zosime","dates":"6th c.","confidence":"high"},"ulpian":{"role":"Mathematician, brother of Isidore","origin":"Alexandria","summary":"Famous for new mathematical problems and solutions; he died young and remained outside politics.","why":"Damascius respects mathematical brilliance while ranking it below theoretical philosophy.","tags":["Mathematics","Problems","Athens"],"name":"Ulpian","dates":"5th c.","confidence":"high"},"severus":{"role":"Roman senator and host","origin":"Rome","summary":"A learned host who received philosophers and Indian Brahmans in Alexandria.","why":"His household shows scholarship as social infrastructure.","tags":["Hospitality","Brahmans","Books"],"name":"Severus","dates":"5th c.","confidence":"medium"},"brahmans":{"role":"Religious intermediaries","origin":"India","summary":"They lived ascetically in Severus’ house and described themselves as mediators between cities and mountain Brahmans.","why":"The episode documents a concrete social role for transcultural brokers.","tags":["India","Asceticism","Mediation","Travel lore"],"name":"The unnamed Brahmans","dates":"5th c.","confidence":"medium"}},"places":{"alexandria":{"type":"Metropolis","summary":"Horapollo’s school, a zone of contact and conflict among pagan, Christian, and Jewish milieus; site of the persecution of 488/89.","name":"Alexandria","geography":"A major port on Egypt’s Mediterranean coast. The marker indicates the ancient urban area, not a specific school building.","precision":"approximate ancient-site centroid","years":"c. 480–490"},"menouthis":{"type":"Sanctuary","summary":"A hidden sanctuary of Isis whose cult objects were discovered and publicly destroyed.","name":"Menouthis / Abukir","geography":"A sanctuary located in the Canopus/Abukir area. The marker is deliberately approximate and does not claim a precise identification of the ancient cult site.","precision":"approximate identification","years":"c. 485–488"},"athens":{"type":"School centre","summary":"Platonic succession, struggles for leadership, institutional reform, and finally the ban on teaching.","name":"Athens","geography":"The Attic city and centre of the late antique Platonic school. The map distinguishes the city from the wider cult landscape of Attica.","precision":"approximate ancient-site centroid","years":"485–529"},"aphrodisias":{"type":"Philosophical centre","summary":"Asclepiodotus built a materially and institutionally strong pagan centre.","name":"Aphrodisias","geography":"A city in Caria in south-western Asia Minor, associated with Asclepiodotus as a philosophical, religious, and institutional centre.","precision":"approximate ancient-site centroid","years":"late 5th c."},"hierapolis":{"type":"Sacred landscape","summary":"Subterranean vapours, hot springs, Damascius’ Attis dream, and Asclepiodotus’ experiments.","name":"Hierapolis","geography":"A Phrygian healing and cult centre by the thermal springs of modern Pamukkale, and the setting of the story about subterranean vapour.","precision":"approximate ancient-site centroid","years":"c. 490"},"damascus":{"type":"Place of origin","summary":"Birthplace of Damascius and a stage on his journey with Isidore.","name":"Damascus","geography":"A major Syrian city, birthplace of Damascius, and a stage in his journey with Isidore.","precision":"approximate historic-city centroid","years":"5th c."},"heliopolis":{"type":"Sacred city","summary":"Local theologies, priestly tales, and the contrast between genuine and pretended philosophy.","name":"Heliopolis / Baalbek","geography":"Baalbek in the Lebanon range, a major late antique cult centre with local theological traditions.","precision":"approximate ancient-site centroid","years":"c. 490"},"berytius":{"type":"City and cult site","summary":"Damascius heard local Phoenician traditions here, including the myth of Eshmun.","name":"Berytus / Beirut","geography":"The coastal city of Berytus, modern Beirut; in the journey narrative it preserves Phoenician local traditions, including the myth of Eshmun.","precision":"approximate historic-city centroid","years":"c. 490"},"bostra":{"type":"Provincial capital","summary":"Encounters with Arabian cults, Dusares, and sacred landscapes.","name":"Bostra","geography":"Bosra in the Hauran, a Roman provincial capital and point of departure for reports about Arabian cults and sacred landscapes.","precision":"approximate ancient-site centroid","years":"c. 490"},"gaza":{"type":"Educational centre","summary":"Antony assisted Damascius and Isidore during their flight.","name":"Gaza","geography":"A major educational centre on the southern Levantine coast; in the reconstructed journey it is a place of assistance for the fugitives.","precision":"approximate historic-city centroid","years":"c. 489"},"emesa":{"type":"Sacred homeland","summary":"City of the Iamblichean tradition; possible last home of Damascius and findspot of Zosime’s epigram.","name":"Emesa / Homs","geography":"Homs in Syria, a sacred homeland for several philosophical traditions; Damascius’ possible later residence in the region remains a reconstruction.","precision":"approximate historic-city centroid","years":"6th c."},"harran":{"type":"Frontier city","summary":"A strongly pagan city and, in a disputed hypothesis, a possible refuge for the philosophers.","name":"Harran","geography":"A city in Upper Mesopotamia with a long-lived non-Christian religious culture. Its role as a refuge for the philosophers is a disputed hypothesis.","precision":"approximate ancient-site centroid","years":"after 532?"},"ctesiphon":{"type":"Sasanian capital","summary":"Destination of the seven philosophers in their hope for intellectual freedom under Khusrau I.","name":"Ctesiphon","geography":"The Sasanian residence on the Tigris south-east of modern Baghdad, and destination of the philosophers’ journey to Khusrau I.","precision":"approximate ancient-site centroid","years":"c. 531–532"},"constantinople":{"type":"Imperial capital","summary":"Court politics, the killing of Aspar, careers, and struggles over religious power.","name":"Constantinople","geography":"The imperial capital on the Bosporus, political horizon of the Aspar story and of many fifth-century careers.","precision":"approximate historic-city centroid","years":"5th c."},"rome":{"type":"Imperial memory","summary":"A symbolic horizon in tales about Attila, Severus, and portents.","name":"Rome","geography":"The western imperial city and a field of memory in stories of power, omens, and battles.","precision":"approximate historic-city centroid","years":"5th c."},"aegae":{"type":"Place of origin","summary":"Home of Anthusa, credited with inventing cloud divination.","name":"Aegae in Cilicia","geography":"Aegae in Cilicia, approximately in the area of modern Yumurtalık/Ayas, marked as Anthusa’s place of origin.","precision":"approximate identification","years":"5th c."},"attica":{"type":"Cult landscape","summary":"Hegias secretly restored sanctuaries and renewed rites.","name":"Attica","geography":"The region around Athens. The point is a cartographic anchor for a landscape, not a single ancient site.","precision":"regional marker","years":"c. 500"},"india":{"type":"Distant region","summary":"The homeland attributed to the Brahmans staying in Severus’ house.","name":"India (region unspecified)","geography":"Damascius names India as the origin and narrative horizon of the Brahmans without specifying a precise location. The marker therefore denotes a broad region.","precision":"regional marker","years":"5th c."}},"timeline":{"412-Geburt des Proklos":{"title":"Birth of Proclus","detail":"Later the commanding authority of the Athenian school."},"415-Ermordung Hypatias":{"title":"Murder of Hypatia","detail":"Damascius presents envy and religious power as a complex of motives."},"450-Blüte paganer Schulen in Alexandria":{"title":"Pagan schools flourish in Alexandria","detail":"Horapollo, Aedesia, Ammonius, Heraiscus, and Isidore form a dense milieu."},"468-Vandalenexpedition Leos I.":{"title":"Leo I’s Vandal expedition","detail":"Anthusa’s anxiety for her husband forms the background to the cloud vision."},"471-Ermordung Aspars":{"title":"Killing of Aspar","detail":"In Anthusa’s vision a lion devours the figure of a Goth."},"480-Damascius in Alexandria":{"title":"Damascius in Alexandria","detail":"Study and practice of rhetoric in Horapollo’s circle."},"484-Aufstand des Illus":{"title":"Revolt of Illus","detail":"Pamprepius joins rebellion to hopes for pagan restoration."},"485-Tod des Proklos":{"title":"Death of Proclus","detail":"The open crisis of succession begins."},"488-Verfolgung des alexandrinischen Milieus":{"title":"Persecution of the Alexandrian milieu","detail":"Arrest, torture, flight, and suspected bargains tear the network apart."},"489-Philosophische Wende und Flucht":{"title":"Philosophical turn and flight","detail":"Under Isidore’s influence Damascius abandons rhetoric."},"490-Aphrodisias und Ankunft in Athen":{"title":"Aphrodisias and arrival in Athens","detail":"Encounter with Asclepiodotus and entry into the Athenian school world."},"500-Hegias’ Restaurationsaktivismus":{"title":"Hegias’ restoration activism","detail":"Sanctuaries are renewed; Damascius criticises the political imprudence."},"515-Damascius als Diadochos":{"title":"Damascius as successor","detail":"Approximate date of his leadership and reforms."},"517-Möglicher Beginn der Abfassung":{"title":"Possible beginning of composition","detail":"Athanassiadi dates the work between 517 and 526."},"529-Unterrichtsverbot in Athen":{"title":"Ban on teaching in Athens","detail":"An imperial edict ends public philosophical teaching."},"531-Reise der sieben Philosophen nach Persien":{"title":"Journey of the seven philosophers to Persia","detail":"Hope for intellectual freedom under Khusrau I."},"532-Friedensvertrag und Rückkehrgarantie":{"title":"Peace treaty and guarantee of return","detail":"No forced change of their convictions."},"850-Photios exzerpiert das Werk":{"title":"Photius excerpts the work","detail":"His epitome preserves large portions while reshaping them."},"975-Suda-Exzerpte":{"title":"Suda excerpts","detail":"Lexicographical fragmentation preserves additional pieces."},"1999-Athanassiadis Rekonstruktion":{"title":"Athanassiadi’s reconstruction","detail":"Text, translation, commentary, and a new overall ordering."}},"stories":{"alexandria-collapse":{"title":"Alexandria 488/89 — A Network Breaks Apart","subtitle":"Persecution, torture, flight, and compromise","intro":"A school is at once a teaching institution, family, cult community, career path, and protection network","scenes":[{"title":"The school as a node","text":"Horapollo’s institution gathers pagan and Christian students, rhetoricians, philosophers, families, and ritual specialists."},{"title":"The trigger","text":"A dispute involving a converted student, a hidden sanctuary of Isis, and church rivalries becomes an operation against the pagan milieu."},{"title":"Torture and silence","text":"Horapollo and Heraiscus are tortured for information about hiding places. Damascius turns their silence into a moral test."},{"title":"The open case of Ammonius","text":"Ammonius survives professionally and reaches an agreement with the patriarch. Its terms are lost."},{"title":"Damascius changes course","text":"The crisis destroys his trust in rhetoric. Philosophy becomes the question whether words withstand action."}],"significance":"The episode presents the school not as an isolated classroom but as a vulnerable web of families, careers, cults, patronage, and personal loyalty. Because Damascius is partisan and the terms of Ammonius’ agreement are lost, his role must remain open.","sourceNote":"The sequence is reconstructed from fragments of Damascius and near-contemporary Christian sources. The app distinguishes preserved details from Athanassiadi’s modern synthesis.","tone":"investigative","visualBasis":"The diagram shows only attested or reconstructed relations between school, sanctuary, persecuted figures, and ecclesiastical power."},"sarapio-path":{"title":"The Man with Only Three Books","subtitle":"Sarapio and the politics of intellectual poverty","intro":"What if a library became philosophical not by growing, but by radical selection?","scenes":[{"title":"The small house","text":"Sarapio lives almost invisibly in Alexandria and receives scarcely anyone."},{"title":"Two or three books","text":"He owns only a few texts, among them Orpheus. Books are judged by their power to gather the mind."},{"title":"Cronus in the present","text":"Damascius treats him as evidence of a golden, Cronian life within a Typhonian age."},{"title":"The problem","text":"Is withdrawal the highest concentration, or does it remove virtue from political testing?"}],"significance":"Sarapio serves Damascius as a Cronian counter-image to a dispersed, “Typhonian” present. Yet elsewhere Damascius insists that virtue must be tested in action. The portrait therefore contains a real tension between withdrawal and public testing.","sourceNote":"The few biographical details come from the fragmentary transmission; the reading of book-poverty as an epistemic policy is explicitly the app’s interpretation.","tone":"contemplative","visualBasis":"House, few books, and a single visitor derive from the Sarapio narrative; the graphic does not claim to reconstruct his house."},"asclepiodotus-path":{"title":"The Lost Interval","subtitle":"Asclepiodotus between laboratory and metaphysics","intro":"A polymath tries to recover a sound-world that his own age can no longer hear.","scenes":[{"title":"220 positions","text":"On a monochord Asclepiodotus moves the bridge through at least 220 positions to reconstruct the enharmonic diesis."},{"title":"The historical ear","text":"A culture can lose the capacity to perceive an interval at all."},{"title":"The poisonous descent","text":"At Hierapolis he uses trapped outside air as improvised protection while investigating lethal subterranean vapour."},{"title":"Medicine as reconstruction","text":"He recovers the medicinal use of white hellebore."},{"title":"Damascius resists","text":"His empirical brilliance makes him a particularly dangerous counter-model."}],"significance":"The unusual density of technical anecdotes makes Asclepiodotus a rival model of the philosopher. Damascius’ criticism is therefore evidence for competing standards of knowledge, not a neutral verdict to be adopted.","sourceNote":"The monochord, medical practice, and vapour experiment are preserved as reports by Damascius. The app separates the report from modern scientific interpretation.","tone":"experimental","visualBasis":"Monochord, movable bridge, medicinal plant, and underground passage visualise explicitly reported experiments."},"anthusa-path":{"title":"The Woman Who Read the Clouds","subtitle":"Anthusa and a newly invented divination","intro":"Personal anxiety, a dream, and a political event become the founding story of a method.","scenes":[{"title":"Prayer to both horizons","text":"Anthusa prays to the rising sun; her dead father appears in a dream and tells her to invoke the setting sun as well."},{"title":"Man, lion, devouring","text":"Two clouds take shape. A lion swallows a man who looks like a Goth."},{"title":"Political fulfilment","text":"Damascius connects the image with the killing of Aspar by Emperor Leo."},{"title":"From vision to technique","text":"Anthusa was said to continue practising cloud divination afterwards."}],"significance":"The story joins personal anxiety, dream instruction, cloud observation, and political memory. Damascius credits Anthusa with turning a single sign into an ongoing art, but the method cannot be independently verified.","sourceNote":"The historical killing of Aspar must be distinguished from the divinatory frame. The app does not assert a successful prediction as fact.","tone":"visual","visualBasis":"The cloud forms—a man and a lion—follow the reported vision; all atmospheric treatment is diagrammatic."},"journey-conversion":{"title":"The Journey of Conversion","subtitle":"From Alexandria to Athens through sacred landscapes","intro":"Flight, educational travel, pilgrimage, and field research overlap.","scenes":[{"title":"Gaza: assistance","text":"Antony helps the fugitives. Gratitude becomes a point in Damascius’ remembered geography."},{"title":"Bostra and Arabia","text":"With Dorus they visit cult places, holy waters, and local theologies."},{"title":"Heliopolis","text":"Local priests and self-styled philosophers become tests of genuine and pretended wisdom."},{"title":"Berytus","text":"Damascius hears the Eshmun myth and preserves a Phoenician voice in Greek."},{"title":"Aphrodisias","text":"Asclepiodotus introduces the travellers to a world of experiment, cult, and institution building."},{"title":"Athens","text":"The journey ends in an ageing and contentious school that Damascius will later try to reform."}],"significance":"The route turns flight into intellectual fieldwork. Local informants, landscapes, and cult traditions enter the work; at the same time, the exact order of stages depends on a modern arrangement of scattered fragments.","sourceNote":"The drawn line is a source-based reconstruction, not an ancient itinerary preserved stage by stage.","tone":"atlas","visualBasis":"Places and direction derive from the reconstructed itinerary; the line is a corridor, not an exact ancient road."},"golden-chain":{"title":"The Golden Chain and Its Dark Underside","subtitle":"Succession, families, books, and power","intro":"Metaphysical succession appears in practice as a struggle over chairs, texts, and legitimacy.","scenes":[{"title":"The ageing Proclus","text":"During Proclus’ illness the question begins: who can inherit Platonic authority?"},{"title":"Marinus burns his book","text":"One courteous sentence from Isidore is enough: the lengthy commentary on the Philebus is destroyed."},{"title":"Parmenides as a battleground","text":"Whether the dialogue concerns species or gods determines the school’s theological identity."},{"title":"A freelance successor?","text":"Isidore may have received an honorary status without regularly leading the school."}],"significance":"Philosophical succession appears not only as a metaphysical “golden chain” but as a struggle over authority, money, manuscripts, families, and institutional legitimacy. The destruction of texts exposes an internal mechanism of cultural loss.","sourceNote":"Damascius is both participant and moral judge in these conflicts. His portraits are evidence, not impartial records.","tone":"institutional","visualBasis":"The chain is shown as an institutional relation diagram, not as a historical object."},"persian-exile":{"title":"The Seven Philosophers in Persia","subtitle":"Utopia, culture shock, and a negotiated return","intro":"When teaching is forbidden, Damascius tries to transfer an entire institution into another world.","scenes":[{"title":"Hiding and packing","text":"Sacred objects are hidden in wells and manuscripts are packed."},{"title":"Hope in Khusrau","text":"Platonic ideals of kingship make Ctesiphon seem a possible home of philosophical freedom."},{"title":"Culture shock","text":"The court is not a free school; the philosophers become foreign advisers."},{"title":"Freedom of conscience","text":"According to Agathias, the peace treaty protects them from forced conversion."},{"title":"Harran?","text":"Whether the returnees actually settled in Harran remains disputed."}],"significance":"The story asks whether an institution can be moved into another political world. The Persian court disappoints hopes for a philosopher-king; according to Agathias, the peace treaty at least protects the philosophers from forced conversion.","sourceNote":"The journey to Persia is anciently attested. Hidden cult objects, transported manuscripts, and a later residence at Harran belong partly to modern reconstruction and carry different levels of certainty.","tone":"political","visualBasis":"Places, manuscripts, hidden cult objects, and treaty clause derive from modern reconstruction and parallel testimony."},"zosime-path":{"title":"Zosime’s Freedom","subtitle":"Two verses against the social definition of a human being","intro":"The smallest story may contain the strongest philosophical compression.","scenes":[{"title":"The gravestone","text":"Zosime says that she had been enslaved only in body; in death the body too is free."},{"title":"Inner freedom","text":"Her soul had never been another person’s property."},{"title":"Damascius in old age","text":"The epigram is slight evidence for his return to his Syrian homeland."}],"significance":"The brief epigram condenses the distinction between inner and bodily-social freedom in the voice of an enslaved woman. Its possible connection with Damascius’ final years is moving but only weak biographical evidence.","sourceNote":"The public app does not reproduce a modern translation of the epigram; it offers an independent paraphrase.","tone":"minimal","visualBasis":"Tombstone and broken bond are analytical signs for the epigram and social unfreedom; no monument is reconstructed."},"sacred-geography":{"title":"The Arabian Styx","subtitle":"Natural phenomenon, oath, and divine judgement","intro":"In sacred geography nature, law, ritual, and body are not separate.","scenes":[{"title":"The descent","text":"Suitable women too descend into the ravine; gardens and farms lie below."},{"title":"The water decides","text":"Light offerings sink and heavy ones are rejected, depending on divine approval."},{"title":"Oath and body","text":"False swearing at the water is said to bring fatal dropsy within a year."},{"title":"Field research","text":"Local experience, Homeric language, and religious interpretation are assembled into one report."}],"significance":"The report joins landscape, law, body, and ritual. It is especially revealing of a world in which natural phenomenon and divine judgement are not treated as separate categories.","sourceNote":"The app asserts neither the physical operation of the offering test nor the reported punishment for perjury. It examines the story as sacred geography.","tone":"landscape","visualBasis":"Gorge, water, offering, and balance correspond to elements of the narrative; their physical mechanism remains unknown."},"phantom-wars":{"title":"Battles after Death","subtitle":"Phantom warriors, sounds, and recurring places","intro":"Damascius compares a recurring type of apparition.","scenes":[{"title":"Three days of combat","text":"After a great battle, the souls of the dead are said to have fought for three days and nights."},{"title":"A geography of repetition","text":"Similar phantoms appear in Caria, Sicily, and other plains."},{"title":"A type of anomaly","text":"The text collects witnesses, places, and variants of one phenomenon."}],"significance":"The collection of similar reports shows Damascius’ interest in recurring types of anomaly. The comparative impulse is historically significant; it does not prove that the apparitions occurred.","sourceNote":"Places and variants are presented as ancient reports, not as confirmed events.","tone":"paradoxographical","visualBasis":"Repeated battle lines and three time markers visualise the narrative’s comparative typology."},"eshmun-path":{"title":"Eshmun, the Eighth Son","subtitle":"A Phoenician healing god between castration and rebirth","intro":"A local oral tradition enters a Greek philosophical travel narrative.","scenes":[{"title":"Astronoe’s pursuit","text":"The goddess pursues the beautiful hunter Eshmun; in panic he mutilates himself."},{"title":"Life-giving warmth","text":"Astronoe revives him with warmth and the youth becomes a healing god."},{"title":"The number eight","text":"A second etymology makes him the eighth son and opens a cosmological symbolism."},{"title":"A local voice","text":"The narrative manner suggests a local informant."}],"significance":"The episode may preserve a local Phoenician tradition, but it reaches us through a Greek philosophical travel narrative. This translation between local and learned systems of interpretation is precisely what makes it important.","sourceNote":"The inference of a local informant is plausible but not directly stated in the surviving text.","tone":"mythological","visualBasis":"Axe, warmth, death, and revival are symbols of the transmitted local myth, not a reconstruction of a cult image."},"hypatia-path":{"title":"Hypatia in Damascius’ Mirror","subtitle":"Admiration, murder narrative, and disciplinary hierarchy","intro":"A source can be both valuable testimony and a partisan judgement.","scenes":[{"title":"Public authority","text":"Hypatia teaches publicly, advises officials, and is honoured by the city."},{"title":"Envy and murder","text":"Damascius makes Cyril’s envy the beginning of the plot against her."},{"title":"“True philosopher” versus mathematician","text":"Elsewhere Hypatia serves as a foil for Isidore’s supposedly higher philosophy."},{"title":"Source criticism","text":"The unfair comparison itself documents Damascius’ hierarchy."}],"significance":"Damascius provides valuable evidence for Hypatia’s public authority while also using her as a foil for Isidore’s supposedly higher philosophy. His bias is not a reason to discard the source; it is itself part of the historical evidence.","sourceNote":"The app explicitly distinguishes PH 43E (public authority and death) from PH 106A (comparison with Isidore).","tone":"critical","visualBasis":"City, teaching seat, mathematical figure, and fractured public sphere mark the distinct claims about authority, mathematics, and murder."},"brahmans-path":{"title":"Brahmans in a Roman Senator’s House","subtitle":"Alexandria as a transcultural node","intro":"The more revealing figure is not the legendary mountain ascetic but the mediator between two social worlds.","scenes":[{"title":"Ascetic life in the house","text":"The guests scarcely leave, eat dates and rice, and drink water."},{"title":"Between two worlds","text":"They represent mountain Brahmans in city affairs and the cities before the Brahmans."},{"title":"Marvels and travel lore","text":"Rain prayers, protection from epidemics, and seven-headed snakes mingle experience with literary tradition."}],"significance":"The most historically suggestive element is not the catalogue of marvels but the described social brokerage between cities and ascetic groups. It reveals Alexandria as a node of transcultural knowledge movement.","sourceNote":"Diet and brokerage are presented as Damascius’ report; rain prayers, protection from epidemics, and many-headed animals belong to travel and marvel tradition.","tone":"ethnographic","visualBasis":"House, simple food, mediating axes, and travel reports correspond to the social functions of the unnamed guests."}},"cases":{"ammonius-case":{"title":"What happened between Ammonius and Peter Mongus?","status":"open","question":"Was Ammonius a betrayer, a pragmatic survivor, or the rescuer of an institution?","evidence":[{"kind":"Damascius","text":"He calls Ammonius greedy and reports an agreement with the overseer of the prevailing religion."},{"kind":"Context","text":"Ammonius alone among the inner school circle remained professionally unharmed."},{"kind":"Counter-evidence","text":"He continued to teach doctrines such as the eternity of the world, opposed by Christian students."},{"kind":"Bias","text":"Damascius was the theological opponent and moral accuser of this pragmatic rationalist."}],"hypotheses":[{"name":"Protective or teaching compromise","note":"Plausible, but the terms are not preserved."},{"name":"Denunciation of colleagues","note":"A suspicion that cannot be proved."},{"name":"Pure polemical distortion","note":"It does not explain his privileged survival."}],"open":"No contract and no direct reply survive."},"asclepiodotus-bias":{"title":"Why does Damascius attack Asclepiodotus so fiercely?","status":"open","question":"Is the criticism philosophical, personal, or institutional?","evidence":[{"kind":"Admiration","text":"Damascius preserves an exceptional number of technical achievements and adventures."},{"kind":"Philosophy","text":"He accuses Asclepiodotus of reducing the invisible to visible analogies."},{"kind":"Dependence","text":"Asclepiodotus helped Damascius during a critical period."},{"kind":"Imitation","text":"Damascius’ reforms resemble the building of the centre at Aphrodisias."}],"hypotheses":[{"name":"Defence against a rival ideal of philosophy","note":"Empirical polymathy threatens Damascius’ hierarchy of intuition."},{"name":"Personal ambivalence and obligation","note":"Gratitude and distancing explain the unusual detail."},{"name":"Purely objective criticism","note":"Too weak to explain the emotional intensity."}],"open":"Asclepiodotus’ own writings are lost."},"harran-case":{"title":"Did the philosophers live in Harran after their return?","status":"disputed","question":"Can Harran be regarded as a late refuge of the Athenian school?","evidence":[{"kind":"Treaty","text":"Agathias reports a guarantee of freedom of conviction after their return."},{"kind":"Place","text":"Harran remained strongly pagan and lay on a plausible route."},{"kind":"Gap","text":"No direct source says that they settled there permanently."}],"hypotheses":[{"name":"Long-term refuge","note":"Stimulating, but more reconstructed than demonstrated."},{"name":"Brief stay","note":"Geographically and religiously plausible."},{"name":"Return to different places","note":"The most economical assumption."}],"open":"Direct evidence of residence is missing."},"isidore-diadochus":{"title":"Was Isidore really a successor?","status":"open","question":"Did he lead the school or hold only an honorary status?","evidence":[{"kind":"Damascius","text":"Isidore was elected successor in honour rather than in actual office."},{"kind":"Title history","text":"Photius’ title Life of Isidore encouraged later assumptions about succession."},{"kind":"Institution","text":"Secondary or parallel successor status is conceivable."}],"hypotheses":[{"name":"Honorary successor without leadership","note":"Best fits the explicit wording."},{"name":"Short-term head","note":"Not impossible, but poorly attested."},{"name":"Travelling freelance successor","note":"Athanassiadi’s suggestive reconstruction."}],"open":"Chronology and terminology remain imprecise."},"heraiscus-interpolation":{"title":"Which Heraiscus anecdotes come from Damascius?","status":"text-critical","question":"Did the Suda excerptor add sensational details?","evidence":[{"kind":"Transmission","text":"The menstruation anecdote is absent from Photius."},{"kind":"Style","text":"It reads like an explanatory intensification of a purity motif."},{"kind":"Core","text":"Other reports of sacred perception are multiply anchored."}],"hypotheses":[{"name":"Suda explanation rather than original sentence","note":"Athanassiadi considers intervention possible."},{"name":"Original sentence omitted by Photius","note":"Epitomes often remove side details."}],"open":"The lost full manuscript would decide the issue."},"house-case":{"title":"Was the house near the Areopagus Damascius’ school?","status":"disputed","question":"How far do architecture, location, and finds support a personal identification?","evidence":[{"kind":"Archaeology","text":"A wealthy late-antique house suits a philosophical school milieu."},{"kind":"Context","text":"Damascius reformed a materially equipped institution."},{"kind":"Caution","text":"Athanassiadi explicitly avoids stating the identification as fact."}],"hypotheses":[{"name":"House of Damascius or his school","note":"Tempting, but not secured by an inscription."},{"name":"Another philosophical-pagan town house","note":"The more general identification is stronger."}],"open":"No naming inscription or chain of ownership survives."},"anthusa-case":{"title":"Prediction or retrospective construction?","status":"open","question":"How did Anthusa’s cloud vision become linked to the killing of Aspar?","evidence":[{"kind":"Historical core","text":"Aspar and Ardabur were attacked in 471; Aspar was killed."},{"kind":"Narrative form","text":"The cloud figures form a clear political allegory."},{"kind":"Transmission","text":"Damascius writes decades later and probably at second hand."}],"hypotheses":[{"name":"Real vision, interpreted later","note":"Psychologically plausible, historically untestable."},{"name":"Retrospective divinatory legend","note":"A common form of political portent story."},{"name":"Deliberate invention","note":"No source permits a judgement about motive."}],"open":"The date of the first version is unknown."},"hegias-case":{"title":"Courageous restorer or dangerous activist?","status":"value-dependent","question":"How should religious visibility be judged under persecution?","evidence":[{"kind":"Action","text":"Hegias restored sanctuaries and renewed rites."},{"kind":"Damascius","text":"His zeal was imprudent and drew enemies against the community."},{"kind":"Isidore","text":"Theurgy presupposes human and philosophical maturity."}],"hypotheses":[{"name":"Moral courage with strategic errors","note":"Reconciles both sides."},{"name":"Self-dramatising piety","note":"Suggested, not proved."}],"open":"The views of the local cult communities are missing."}},"wonders":{"animated-statues":{"title":"Animated and inert statues","category":"Cult objects","report":"Heraiscus reacts bodily only to statues believed to be divinely animated.","meaning":"The purified human being functions as a sensor of sacred presence.","natural":"Suggestion, ritualised bodily response, or hagiography.","reliability":"medium"},"aion-union":{"title":"Aion as Osiris and Adonis","category":"Theology","report":"An Alexandrian statue is recognised as the mystical unity of several gods.","meaning":"Local cults are understood as a real theological union.","natural":"Religious-historical syncretism.","reliability":"high as evidence for an interpretation"},"mystical-birth":{"title":"Heraiscus’ finger of silence","category":"Body","report":"He was said to have been born with a finger attached to his lip, like Harpocrates.","meaning":"Biography is read through a divine iconographic pattern.","natural":"Congenital anomaly plus mythological interpretation.","reliability":"low"},"cloud-divination":{"title":"Anthusa’s cloud divination","category":"Divination","report":"Clouds form a Goth and a lion; the image is linked to Aspar’s death.","meaning":"Cosmic images comment on imperial politics.","natural":"Pareidolia and retrospective interpretation.","reliability":"medium"},"water-scrying":{"title":"Scrying in a glass of water","category":"Divination","report":"A holy woman sees future events in clear water; Damascius claims personal experience.","meaning":"Purity of medium and seer mirror one another.","natural":"Scrying, expectation effects, selective memory.","reliability":"medium"},"stygian-water":{"title":"Offerings in the Styx","category":"Sacred landscape","report":"Light offerings sink and heavy ones float, depending on divine approval.","meaning":"A natural place acts as oracle and court.","natural":"Current, shape, density, and selective observation.","reliability":"medium"},"oath-dropsy":{"title":"Dropsy after perjury","category":"Sacred landscape","report":"A false oath at the Styx water is said to bring death by dropsy within a year.","meaning":"Law, body, and deity form a system of sanctions.","natural":"Social control and remembered cases.","reliability":"low"},"phantom-battle":{"title":"Dead souls continuing the battle","category":"Apparitions","report":"The fallen continue as visible and audible phantoms; similar places are compared.","meaning":"Violence marks landscapes beyond death.","natural":"Light effects, sounds, collective memory.","reliability":"low"},"electric-sparks":{"title":"Sparks from body and clothing","category":"Natural phenomenon","report":"Damascius observes crackling sparks and flame-like light while dressing.","meaning":"Rare physics can also be read as an omen.","natural":"Tribo-electric discharge.","reliability":"high as a possible observation"},"gorgon-plant":{"title":"The Gorgon plant","category":"Natural history","report":"Severus sees a root shaped like a girl’s head with serpentine hair.","meaning":"Nature produces iconic likenesses to mythical figures.","natural":"Anthropomorphic root form and pareidolia.","reliability":"medium"},"seven-headed-snakes":{"title":"Seven-headed snakes","category":"Ethnography
