opacity=".35"/>`;else if(kind==='chain')art=`<g fill="none" stroke="${line}" stroke-width="8" transform="rotate(-14 260 130)">${[0,1,2,3].map(i=>`<ellipse cx="${130+i*85}" cy="130" rx="54" ry="28"/>`).join('')}</g><path d="M66 214h388" stroke="${blue}" opacity=".35"/>`;else if(kind==='epigram')art=`<path d="M138 218V62h242v156" fill="none" stroke="${line}" stroke-width="4"/><path d="M170 94h177M170 119h155M170 144h172M170 169h120" stroke="${pale}" opacity=".55"/><path d="M110 220h300" stroke="${blue}" stroke-width="3"/>`;else if(kind==='water')art=`<path d="M50 80c80 45 129 23 192-7s128-43 228 10" fill="none" stroke="${line}" opacity=".45"/><path d="M206 65c-18 49-5 95 31 139M285 62c25 53 12 104-30 152" fill="none" stroke="${blue}" stroke-width="5"/><path d="M160 211h182" stroke="${pale}" opacity=".5"/><circle cx="245" cy="132" r="11" fill="none" stroke="${line}"/>`;else if(kind==='ghosts')art=`<g fill="none" stroke="${blue}" stroke-width="3" opacity=".8">${[105,220,335,440].map((x,i)=>`<path d="M${x} 197v-74c0-34 45-34 45 0v75l-12-13-12 13-11-13z"/>`).join('')}</g><path d="M55 215h415" stroke="${line}" opacity=".35"/>`;else if(kind==='eshmun')art=`<g transform="translate(260 132)" fill="none" stroke="${line}" stroke-width="3">${Array.from({length:8},(_,i)=>`<path d="M0 0L0 -86" transform="rotate(${i*45})"/>`).join('')}<circle r="48" stroke="${blue}"/><circle r="14" fill="${pale}" opacity=".65"/></g>`;else if(kind==='hypatia')art=`<circle cx="260" cy="132" r="86" fill="none" stroke="${line}" stroke-width="3"/><path d="M174 132h172M260 46v172M199 71l122 122M199 193L321 71" stroke="${blue}" opacity=".55"/><path d="M60 210h120M340 210h120" stroke="${pale}" opacity=".35"/>`;else if(kind==='brahmans')art=`<path d="M40 211l105-143 82 143M174 211L296 50l122 161" fill="none" stroke="${line}" opacity=".65"/><path d="M328 210v-76h112v76M348 210v-46h35v46" fill="none" stroke="${blue}" stroke-width="3"/><circle cx="110" cy="60" r="23" fill="none" stroke="${pale}"/>`;else art=`<g stroke="${line}" fill="none">${Array.from({length:8},(_,i)=>`<circle cx="260" cy="130" r="${25+i*17}" opacity="${.5-i*.045}"/>`).join('')}</g><path d="M60 205C150 128 226 215 307 130S424 97 480 54" fill="none" stroke="${blue}" stroke-width="3"/>`;return `<svg viewBox="0 0 520 260" role="img" aria-label="${esc(state.lang==='de'?'Eigene Vektorillustration':'Original vector illustration')}">${bg}${art}</svg>`}
function heroArt(){const cfg=MAPCFG.regional;return `<svg viewBox="0 0 700 520" role="img" aria-label="${esc(state.lang==='de'?'Karte und Fragmente als Titelillustration':'Map and fragments as title illustration')}"><defs><radialGradient id="heroBg"><stop stop-color="#263b53"/><stop offset="1" stop-color="#080b12"/></radialGradient></defs><rect width="700" height="520" fill="url(#heroBg)"/><g transform="translate(20 70) scale(.59)"><path d="${MAIN_LAND}" fill="#202a35" stroke="#6a7684" stroke-width="1.5"/><path d="M330 460Q505 300 705 345T1010 170" fill="none" stroke="#d6b46b" stroke-width="4" stroke-dasharray="9 10"/><g fill="#89d2d4">${D.places.filter(p=>inBounds(p,cfg)).slice(0,14).map(p=>{const [x,y]=project(p.lon,p.lat,cfg);return `<circle cx="${x}" cy="${y}" r="7"/>`}).join('')}</g></g><g transform="translate(52 55) rotate(-7)"><rect width="150" height="190" rx="8" fill="#efe4c6" opacity=".09" stroke="#d6b46b"/><path d="M22 42h103M22 62h88M22 82h110M22 119h94M22 139h106" stroke="#efe4c6" opacity=".25"/></g><g transform="translate(506 317) rotate(7)"><rect width="138" height="165" rx="8" fill="#efe4c6" opacity=".07" stroke="#89d2d4"/><path d="M20 38h94M20 58h82M20 78h102M20 112h86M20 132h98" stroke="#efe4c6" opacity=".2"/></g></svg>`}
const wonderIcon=id=>({'animated-statues':'◉','aion-union':'∞','mystical-birth':'☝','cloud-divination':'☁','water-scrying':'◌','stygian-water':'≈','oath-dropsy':'⚖','phantom-battle':'♙','electric-sparks':'ϟ','gorgon-plant':'⚘','seven-headed-snakes':'⌇','cave-gas':'▽','attis-dream':'☾','eshmun':'✦','animal-omens':'✧','ring-continence':'○','syncretic-exorcism':'☉','serapis-departure':'↗'}[id]||'✦');
const labelForView=id=>u(id);
function nav(){
 $('#nav').innerHTML=views.map(id=>`<button class="nav-btn ${state.view===id?'active':''}" data-view="${id}"><span class="nav-icon">${navIcons[id]}</span><span>${esc(labelForView(id))}</span></button>`).join('');
 $('#edition-label').textContent=`${u('publicEdition')} · v${D.meta.version}`;
 $('#source-toggle').textContent=`${u('sourceMode')}: ${u(state.sources?'on':'off')}`;
 $('#pdf-button').textContent=u('connectPdf');

function head(ey,title,lead,tools=''){return `<div class="view-head"><div><div class="eyebrow">${esc(ey)}</div><h1>${esc(title)}</h1><div class="lead">${lead}</div></div>${tools}</div>`}
function footer(){return `<footer><span>Damascius Atlas · v${D.meta.version} · ${u('publicSafe')}</span><span>${u('copyrightNote')} · Code MIT · Text & original design CC BY 4.0 · Natural Earth public domain</span></footer>`}
function home(){const c=D.meta.counts,I=D.homeIntro[state.lang];const title=state.lang==='de'?'Fragmente einer':'Fragments of a',title2=state.lang==='de'?'verschwindenden Welt':'vanishing world';return `<div class="wrap"><section class="hero"><div class="hero-copy"><div class="eyebrow">${u('publicEdition')} · DE / EN</div><h1>${title}<span>${title2}</span></h1><div class="hero-intro"><p class="lead-first">${esc(I.lead)}</p>${I.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="hero-actions"><button class="primary" data-view="stories">${u('stories')}</button><button class="ghost" data-view="atlas">${u('atlas')}</button><button class="ghost" data-view="rights">${u('rights')}</button></div></div><div class="hero-art">${heroArt()}</div></section><div class="why-grid">${I.why.map(x=>`<article class="why-card"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join('')}</div><div class="intro-note">${state.lang==='de'?'Leitfrage: Welche Form von Mensch kann Wahrheit bewahren, wenn Bücher, Schulen, Heiligtümer und politische Sicherheiten verschwinden?':'Guiding question: What kind of person can preserve truth when books, schools, sanctuaries, and political security disappear?'}</div><div class="stat-row">${[['people',c.people],['places',D.places.length],['stories',c.stories],['cases',c.cases],['wonders',c.wonders],['fragments',c.fragments]].map(([k,n])=>`<div class="stat"><strong>${n}</strong><span>${u(k)}</span></div>`).join('')}</div><div class="section-title"><h2>${state.lang==='de'?'Drei Einstiege':'Three ways in'}</h2></div><div class="grid cols-3">${['alexandria-collapse','sarapio-path','asclepiodotus-path'].map((id,i)=>storyCard(find(D.stories,id),i)).join('')}</div>${footer()}</div>`}
function storyCard(s,i=0){return `<article class="card"><div class="art">${storyArt(s.cover,i+3)}</div><div class="card-body"><div class="eyebrow">${esc(storyDuration(s))} · ${esc(storyTone(s))}</div><h3>${esc(loc('stories',s.id,'title',s.title))}</h3><p>${esc(loc('stories',s.id,'subtitle',s.subtitle))}</p><button class="primary" data-story="${s.id}">${u('readStory')}</button></div></article>`}
function atlas(){const tools=`<div class="language-audit-badge">✓ ${u('publicDomainMap')}</div>`;const routeRows=D.routes.filter(r=>state.routeFilter==='all'||r.group===state.routeFilter).map(r=>`<div class="route-row" data-route="${r.id}"><b>${esc(placeName(find(D.places,r.from)))} → ${esc(placeName(find(D.places,r.to)))}</b><span>${r.year} · ${esc(routeKind(r))}</span></div>`).join('');return `<div class="wrap">${head(state.lang==='de'?'Raum, Reise und Überlieferung':'Space, travel, and transmission',u('atlas'),esc(u('atlasIntro')),tools)}<div class="atlas-shell"><div class="atlas-toolbar"><span class="toolbar-label">${u('mapData')}</span><button class="map-toggle ${state.mapMode==='regional'?'active':''}" data-map-mode="regional">${u('mapRegional')}</button><button class="map-toggle ${state.mapMode==='wide'?'active':''}" data-map-mode="wide">${u('mapWide')}</button><span class="toolbar-label">${u('selectRoute')}</span><button class="map-toggle ${state.routeFilter==='all'?'active':''}" data-route-filter="all">${u('routesAll')}</button><button class="map-toggle ${state.routeFilter==='journey'?'active':''}" data-route-filter="journey">${u('routesJourney')}</button><button class="map-toggle ${state.routeFilter==='persia'?'active':''}" data-route-filter="persia">${u('routesPersia')}</button></div><div class="atlas-layout"><div class="atlas-canvas">${mapSvg()}</div><aside class="atlas-side"><h3>${u('placesIndex')}</h3><p class="atlas-note">${u('mapDisclaimer')}</p><div class="place-list">${D.places.map(p=>`<button data-place="${p.id}"><i class="place-dot" style="background:${mapColors[p.mapCategory]||'#6aa7c7'}"></i><span>${esc(placeName(p))}</span><span class="place-coord">${fmtCoord(p)}</span></button>`).join('')}</div><div class="route-list"><h3>${u('route')}</h3>${routeRows}</div><div class="map-legend"><span class="legend-item"><i class="legend-line"></i>${u('routesJourney')}</span><span class="legend-item"><i class="legend-line persia"></i>${u('routesPersia')}</span><span class="legend-item"><i class="legend-line hyp"></i>${u('mapHypothetical')}</span></div><div class="map-credit">${u('originalCartography')}<br>${u('noModernBorders')}<br>${u('mapDisclaimer')}</div></aside></div></div>${footer()}</div>`}
function network(){return `<div class="wrap">${head(state.lang==='de'?'Menschen und Beziehungen':'People and relations',u('network'),state.lang==='de'?'Lehrer, Familien, Konflikte, Patronage und Überlieferung. Unter der Grafik stehen alle modellierten Beziehungen als lesbare Liste.':'Teachers, families, conflicts, patronage, and transmission. All modelled relations are listed beneath the graph.')}<div class="network-shell"><div class="network-toolbar"><span class="source-pill">${D.relationships.length} ${state.lang==='de'?'Relationen':'relations'}</span></div><div class="network-canvas">${networkSvg()}</div></div><div class="section-title"><h2>${u('connections')}</h2></div><div class="grid cols-3">${D.relationships.map(r=>{const a=find(D.people,r[0]),b=find(D.people,r[1]);return `<article class="card card-body"><b>${esc(personName(a))} → ${esc(personName(b))}</b><p>${esc(relationLabel(r))}</p><button class="ghost" data-person="${a.id}">${u('details')}</button></article>`}).join('')}</div>${footer()}</div>`}
function networkSvg(){const W=1100,H=720;const groups={philosopher:[.5,.43],woman:[.28,.42],ritual:[.72,.36],scientist:[.73,.62],teacher:[.45,.22],ascetic:[.25,.66],physician:[.56,.7]};const pos={};D.people.forEach((p,i)=>{const g=groups[p.group]||[.5,.5];pos[p.id]=[W*(g[0]+Math.cos(i*2.2)*.09),H*(g[1]+Math.sin(i*1.7)*.12)]});const edges=D.relationships.map((r,i)=>{const a=pos[r[0]],b=pos[r[1]];return `<path class="edge ${i%5===0?'hot':''}" d="M${a[0]},${a[1]} Q${(a[0]+b[0])/2},${(a[1]+b[1])/2-25} ${b[0]},${b[1]}"><title>${esc(relationLabel(r))}</title></path>`}).join('');const nodes=D.people.map(p=>{const [x,y]=pos[p.id],col=p.group==='woman'?'#d27b70':p.group==='ritual'?'#9c88c7':p.group==='scientist'?'#89d2d4':p.group==='ascetic'?'#85b889':'#d6b46b';return `<g class="node" data-person="${p.id}" transform="translate(${x},${y})"><circle r="${p.id==='damascius'||p.id==='isidore'?18:12}" fill="${col}" opacity=".82"/><circle r="${p.id==='damascius'||p.id==='isidore'?27:20}" fill="none" stroke="${col}" opacity=".13"/><text y="${p.id==='damascius'||p.id==='isidore'?34:27}">${esc(personName(p).replace(', Sohn des Hermeias','').replace(', son of Hermeias',''))}</text></g>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(state.lang==='de'?'Interaktives Personennetz':'Interactive person network')}"><rect width="${W}" height="${H}" fill="#0a0e17"/><g>${edges}</g><g>${nodes}</g></svg>`}
function timeline(){return `<div class="wrap">${head(state.lang==='de'?'Zeit und Überlieferung':'Time and transmission',u('timeline'),state.lang==='de'?'Historische Ereignisse und spätere Stadien der Textüberlieferung.':'Historical events and later stages in the transmission of the text.')}<div class="timeline">${D.timeline.map(x=>{const key=String(x.year)+'-'+x.title;return `<div class="time-item"><div class="time-year">${x.year}</div><div><h3>${esc(loc('timeline',key,'title',x.title))}</h3><p>${esc(loc('timeline',key,'detail',x.detail))}</p></div></div>`}).join('')}</div>${footer()}</div>`}
function stories(){return `<div class="wrap">${head(state.lang==='de'?'Geführte Erkundungen':'Guided explorations',u('stories'),state.lang==='de'?'Dreizehn visuelle Wege durch Personen, Krisen, Reisen und merkwürdige Überlieferungen. Jeder Pfad enthält jetzt Kontext, Beteiligte und einen quellenkritischen Hinweis.':'Thirteen visual paths through people, crises, journeys, and unusual traditions. Each path now includes context, participants, and a source-critical note.')}<div class="grid cols-3">${D.stories.map((s,i)=>storyCard(s,i)).join('')}</div>${footer()}</div>`}
function caseCard(c){return `<article class="card case-card"><div class="eyebrow">${esc(loc('cases',c.id,'status',c.status))}</div><h3>${esc(loc('cases',c.id,'title',c.title))}</h3><p>${esc(loc('cases',c.id,'question',c.question))}</p><button class="primary" data-case="${c.id}">${u('open')}</button></article>`}
function cases(){return `<div class="wrap">${head(state.lang==='de'?'Abduktion statt Scheingewissheit':'Abduction without false certainty',u('cases'),state.lang==='de'?'Mehrere Erklärungen bleiben nebeneinander sichtbar; Prozentwerte sind heuristisch, nicht statistisch.':'Several explanations remain visible side by side; percentages are heuristic, not statistical.')}<div class="grid cols-3">${D.cases.map(c=>caseCard(c)).join('')}</div>${footer()}</div>`}
function wonders(){return `<div class="wrap">${head(state.lang==='de'?'Wunder, Natur und Deutung':'Marvels, nature, and interpretation',u('wonders'),state.lang==='de'?'Jede Geschichte wird als Bericht, religiöse Bedeutung und mögliche natürliche oder historische Lesart gezeigt.':'Each story is shown as report, religious meaning, and possible natural or historical reading.')}<div class="grid cols-3">${D.wonders.map(w=>`<article class="card wonder-card"><div class="wonder-icon">${wonderIcon(w.id)}</div><div class="eyebrow">${esc(loc('wonders',w.id,'category',w.category))}</div><h3>${esc(loc('wonders',w.id,'title',w.title))}</h3><p>${esc(loc('wonders',w.id,'report',w.report))}</p><div class="quad"><div><b>${u('meaning')}</b>${esc(loc('wonders',w.id,'meaning',w.meaning))}</div><div><b>${u('possibleReading')}</b>${esc(loc('wonders',w.id,'natural',w.natural))}</div></div>${state.sources?`<div class="meta-row"><span class="source-pill">${esc(w.source)}</span><span class="pill">${u('reliability')}: ${esc(loc('wonders',w.id,'reliability',w.reliability))}</span></div>`:''}</article>`).join('')}</div>${footer()}</div>`}
function fragments(){return `<div class="wrap">${head(state.lang==='de'?'Text, Zeuge, Paraphrase':'Text, witness, paraphrase',u('fragments'),state.lang==='de'?'Kurze griechische Identifikationszitate, eigene bilinguale Paraphrasen und expliziter Überlieferungsstatus.':'Short Greek identifying quotations, independent bilingual paraphrases, and explicit textual status.')}<div class="grid cols-3">${D.fragments.map(f=>`<article class="card fragment-card"><div class="fragment-strip" lang="grc">${esc(f.greek)}</div><div class="card-body"><div class="eyebrow">${esc(f.fragment)}</div><h3>${esc(loc('fragments',f.id,'title',f.title))}</h3><p>${esc(loc('fragments',f.id,'paraphrase',f.paraphrase))}</p><div class="verified">✓ ${u('verified')}</div>${state.sources?`<div class="meta-row"><span class="source-pill">${u('sourceWitness')}: ${esc(loc('fragments',f.id,'witness',f.witness))}</span><span class="pill">${esc(loc('fragments',f.id,'status',f.status))}</span></div><p class="micro">${u('editorialParaphrase')} · ${esc(loc('fragments',f.id,'notes',f.notes))}</p>`:''}${state.pdfUrl?`<div class="meta-row">${(f.openPages||[f.page]).map(pg=>`<button class="ghost" data-page="${pg}">PDF ${pg}</button>`).join('')}</div>`:''}<button class="ghost fragment-more" data-fragment="${f.id}">${u('details')}</button></div></article>`).join('')}</div>${footer()}</div>`}
function people(){return `<div class="wrap">${head(state.lang==='de'?'Prosopographischer Atlas':'Prosopographical atlas',u('people'),state.lang==='de'?'Berühmte und fast vergessene Träger einer intellektuellen Welt. Die Detailansichten verknüpfen Orte, Fragmente, Erzählpfade und Beziehungen.':'Famous and nearly forgotten bearers of an intellectual world. Detail views connect places, fragments, narrative paths, and relations.')}<div class="grid cols-3">${D.people.map(p=>`<article class="card person-card" data-person="${p.id}"><div class="person-head"><div class="avatar">${esc(personName(p)[0])}</div><div><h3>${esc(personName(p))}</h3><div class="greek" lang="grc">${esc(p.greek)}</div></div></div><p><b>${u('role')}:</b> ${esc(loc('people',p.id,'role',p.role))}</p><p>${esc(loc('people',p.id,'summary',p.summary))}</p><div class="meta-row">${loc('people',p.id,'tags',p.tags).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></article>`).join('')}</div>${footer()}</div>`}
function glossary(){return `<div class="wrap">${head(state.lang==='de'?'Begriffe und Denkfiguren':'Concepts and figures of thought',u('glossary'),state.lang==='de'?'Ein zweisprachiges Glossar zur Welt des Werkes.':'A bilingual glossary for the world of the work.')}<div class="grid cols-3">${D.glossary.map(g=>`<article class="card gloss-card"><div class="greek" lang="grc">${esc(g.greek)}</div><h3>${esc(loc('glossary',g.term,'term',g.term))}</h3><p>${esc(loc('glossary',g.term,'definition',g.definition))}</p></article>`).join('')}</div>${footer()}</div>`}
function transmission(){return `<div class="wrap">${head(state.lang==='de'?'Vom verlorenen Werk zur App':'From lost work to app',u('transmission'),state.lang==='de'?'Jede Stufe bewahrt und verändert: Damascius → Photios → Suda → moderne Edition → digitale Paraphrase.':'Every stage preserves and transforms: Damascius → Photius → Suda → modern edition → digital paraphrase.')}<div class="grid cols-4">${D.sources.map(s=>`<article class="card source-card"><div class="eyebrow">${esc(loc('sources',s.id,'type',s.type))} · ${esc(loc('sources',s.id,'date',s.date))}</div><h3>${esc(loc('sources',s.id,'title',s.title))}</h3><p>${esc(loc('sources',s.id,'note',s.note))}</p></article>`).join('')}</div><div class="section-title"><h2>${state.lang==='de'?'Methodische Regel':'Methodological rule'}</h2></div><div class="rights-box"><p>${state.lang==='de'?'Die App unterscheidet antiken Bericht, Überlieferungszeugen, moderne Rekonstruktion und eigene Interpretation. Ein Quellenverweis ist keine Behauptung, dass jede Einzelheit historisch wahr sei.':'The app distinguishes ancient report, textual witness, modern reconstruction, and its own interpretation. A source reference does not imply that every reported detail is historically true.'}</p></div>${footer()}</div>`}
function rights(){const r=D.rights[state.lang];return `<div class="wrap">${head(u('sourcesAndMethod'),r.headline,r.intro)}<div class="rights-box"><ul>${r.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="micro">${esc(r.caveat)}</p><p><a href="https://www.gesetze-im-internet.de/urhg/__64.html" target="_blank" rel="noopener">UrhG §64</a> · <a href="https://www.gesetze-im-internet.de/urhg/__70.html" target="_blank" rel="noopener">UrhG §70</a> · <a href="https://www.gesetze-im-internet.de/urhg/__51.html" target="_blank" rel="noopener">UrhG §51</a> · <a href="https://www.naturalearthdata.com/about/terms-of-use/" target="_blank" rel="noopener">Natural Earth terms</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · <a href="https://opensource.org/license/mit" target="_blank" rel="noopener">MIT</a></p></div><div class="section-title"><h2>${state.lang==='de'?'Publikationscheck':'Publication checklist'}</h2></div><div class="grid cols-3"><article class="card card-body"><h3>${state.lang==='de'?'Keine eingebettete PDF':'No bundled PDF'}</h3><p>${state.lang==='de'?'Die öffentlich hochgeladene App-Datei enthält keine Seite und kein Bild aus der modernen Ausgabe.':'The publicly hosted app contains no page or image from the modern edition.'}</p></article><article class="card card-body"><h3>${state.lang==='de'?'Kartendaten: Public Domain':'Map data: public domain'}</h3><p>${u('originalCartography')}</p></article><article class="card card-body"><h3>${state.lang==='de'?'Klare Lizenzdateien':'Clear licence files'}</h3><p>${state.lang==='de'?'Das Veröffentlichungspaket trennt Code, eigene Inhalte und gemeinfreie Kartengrundlage.':'The publication package distinguishes code, original content, and the public-domain map basis.'}</p></article></div>${footer()}</div>`}
function searchView(q){q=q.toLowerCase();const results=[];const push=(type,id,title,txt,view)=>{if((title+' '+txt).toLowerCase().includes(q))results.push({type,id,title,text:txt,view})};D.people.forEach(p=>push(u('people'),p.id,personName(p),loc('people',p.id,'summary',p.summary),'people'));D.places.forEach(p=>push(u('places'),p.id,placeName(p),loc('places',p.id,'summary',p.summary)+' '+loc('places',p.id,'geography',p.geography),'atlas'));D.stories.forEach(s=>push(u('stories'),s.id,loc('stories',s.id,'title',s.title),loc('stories',s.id,'intro',s.intro)+' '+loc('stories',s.id,'significance',s.significance),'stories'));D.cases.forEach(c=>push(u('cases'),c.id,loc('cases',c.id,'title',c.title),loc('cases',c.id,'question',c.question),'cases'));D.wonders.forEach(w=>push(u('wonders'),w.id,loc('wonders',w.id,'title',w.title),loc('wonders',w.id,'report',w.report),'wonders'));D.fragments.forEach(f=>push(u('fragments'),f.id,loc('fragments',f.id,'title',f.title),loc('fragments',f.id,'paraphrase',f.paraphrase),'fragments'));D.glossary.forEach(g=>push(u('glossary'),g.term,loc('glossary',g.term,'term',g.term),loc('glossary',g.term,'definition',g.definition),'glossary'));D.sources.forEach(s=>push(u('transmission'),s.id,loc('sources',s.id,'title',s.title),loc('sources',s.id,'note',s.note),'transmission'));return `<div class="wrap">${head(state.lang==='de'?'Suche':'Search',`“${esc(state.search)}”`,`${results.length} ${state.lang==='de'?'Treffer':'results'}`)}<div class="search-results">${results.length?results.map(r=>`<div class="result" data-view="${r.view}"><div class="eyebrow">${esc(r.type)}</div><b>${esc(r.title)}</b><p>${esc(r.text)}</p></div>`).join(''):`<div class="empty">${u('noResults')}</div>`}</div>${footer()}</div>`}
function openStory(id){const s=find(D.stories,id);let n=0;const draw=()=>{const scene=s.scenes[n],sceneTitle=nested('stories',id,'scenes',n,'title',scene.title),sceneText=nested('stories',id,'scenes',n,'text',scene.text),place=scene.place?find(D.places,scene.place):null,persons=(scene.people||[]).map(pid=>find(D.people,pid)).filter(Boolean);$('#modal-root').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="scene-visual">${storyArt(s.cover,n+17)}</div><div class="modal-body"><button class="icon-btn close-x" data-close aria-label="${u('close')}">×</button><div class="eyebrow">${n+1} / ${s.scenes.length} · ${esc(storyDuration(s))} · ${esc(storyTone(s))}</div><h1>${esc(sceneTitle)}</h1><div class="story-intro-box"><b>${u('storyOverview')}</b>${esc(loc('stories',id,'intro',s.intro))}</div><p class="lead">${esc(sceneText)}</p><div class="rich-grid">${place?`<div class="context-box"><h3>${u('location')}: ${esc(placeName(place))}</h3><p>${esc(loc('places',place.id,'geography',place.geography))}</p><div class="meta-row"><span class="coord-badge">${fmtCoord(place)}</span><button class="ghost" data-place="${place.id}">${u('details')}</button></div></div>`:''}<div class="context-box"><h3>${u('whyItMatters')}</h3><p>${esc(loc('stories',id,'significance',s.significance))}</p></div></div>${persons.length?`<h3>${u('peopleInScene')}</h3><div class="mini-people">${persons.map(p=>`<div class="person-mini" data-person="${p.id}"><b>${esc(personName(p))}</b><span>${esc(loc('people',p.id,'summary',p.summary))}</span></div>`).join('')}</div>`:''}${state.sources?`<div class="source-caution"><b>${u('sourceCriticalNote')}</b><br>${esc(loc('stories',id,'sourceNote',s.sourceNote))}<div class="meta-row"><span class="source-pill">${esc(sourceLabel(scene.source))}</span></div></div>`:''}<div class="modal-nav"><button class="ghost" data-prev ${n===0?'disabled':''}>← ${u('back')}</button><button class="primary" data-next>${n===s.scenes.length-1?u('close'):u('next')+' →'}</button></div></div></div></div>`;$('#modal-root [data-close]').onclick=closeModal;$('#modal-root [data-prev]').onclick=()=>{if(n>0){n--;draw()}};$('#modal-root [data-next]').onclick=()=>{if(n<s.scenes.length-1){n++;draw()}else closeModal()};$('#modal-root').querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(b.dataset.person));$('#modal-root').querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>openPlace(b.dataset.place))};draw()}
function openCase(id){const c=find(D.cases,id);$('#modal-root').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-body"><button class="icon-btn close-x" data-close aria-label="${u('close')}">×</button><div class="eyebrow">${esc(loc('cases',id,'status',c.status))}</div><h1>${esc(loc('cases',id,'title',c.title))}</h1><p class="lead">${esc(loc('cases',id,'question',c.question))}</p><div class="source-caution">${state.lang==='de'?'Die Prozentwerte sind bewusst nur heuristische Lesemarkierungen; sie sind keine berechneten historischen Wahrscheinlichkeiten.':'The percentages are deliberately heuristic reading aids, not calculated historical probabilities.'}</div><h3>${u('evidence')}</h3><div class="evidence">${c.evidence.map((e,i)=>`<div class="evidence-item"><b>${esc(nested('cases',id,'evidence',i,'kind',e.kind))}</b><span>${esc(nested('cases',id,'evidence',i,'text',e.text))}</span></div>`).join('')}</div><h3>${u('hypotheses')}</h3><div class="hyp-list">${c.hypotheses.map((h,i)=>`<div class="hyp"><b>${esc(nested('cases',id,'hypotheses',i,'name',h.name))} — ${h.confidence}%</b><div>${esc(nested('cases',id,'hypotheses',i,'note',h.note))}</div><div class="bar"><i style="width:${h.confidence}%"></i></div></div>`).join('')}</div><h3>${u('whatMissing')}</h3><p>${esc(loc('cases',id,'open',c.open))}</p></div></div></div>`;$('#modal-root [data-close]').onclick=closeModal}
function openPerson(id){const p=find(D.people,id);if(!p)return;const stories=D.stories.filter(s=>s.scenes.some(sc=>(sc.people||[]).includes(id))),frags=D.fragments.filter(f=>(f.people||[]).includes(id)),rels=D.relationships.filter(r=>r[0]===id||r[1]===id),places=(p.places||[]).map(pid=>find(D.places,pid)).filter(Boolean);$('#detail').innerHTML=`<div class="detail-inner"><button class="icon-btn close-x" data-close aria-label="${u('close')}">×</button><div class="avatar">${esc(personName(p)[0])}</div><h1>${esc(personName(p))}</h1><div class="greek" lang="grc">${esc(p.greek)}</div><p><b>${u('role')}:</b> ${esc(loc('people',id,'role',p.role))}</p><p><b>${u('origin')}:</b> ${esc(loc('people',id,'origin',p.origin))}</p><p><b>${state.lang==='de'?'Datierung':'Dates'}:</b> ${esc(loc('people',id,'dates',p.dates))}</p><p>${esc(loc('people',id,'summary',p.summary))}</p><div class="detail-section"><h3>${u('whyInteresting')}</h3><p>${esc(loc('people',id,'why',p.why))}</p></div>${places.length?`<div class="detail-section"><h3>${u('relatedPlaces')}</h3><div class="related-links">${places.map(x=>`<button class="link-chip" data-place="${x.id}">${esc(placeName(x))}</button>`).join('')}</div></div>`:''}${stories.length?`<div class="detail-section"><h3>${u('relatedStories')}</h3><div class="related-links">${stories.map(x=>`<button class="link-chip" data-story="${x.id}">${esc(loc('stories',x.id,'title',x.title))}</button>`).join('')}</div></div>`:''}${frags.length?`<div class="detail-section"><h3>${u('relatedFragments')}</h3><div class="related-links">${frags.map(x=>`<button class="link-chip" data-fragment="${x.id}">${esc(x.fragment)}</button>`).join('')}</div></div>`:''}${rels.length?`<div class="detail-section"><h3>${u('connections')}</h3><div class="relation-list">${rels.map(r=>{const other=find(D.people,r[0]===id?r[1]:r[0]);return `<div class="relation-item"><button class="link-chip" data-person="${other.id}">${esc(personName(other))}</button><span>${esc(relationLabel(r))}</span></div>`}).join('')}</div></div>`:''}${state.sources?`<div class="detail-section"><h3>${u('sourceBasis')}</h3><div class="meta-row">${p.sources.map(s=>`<span class="source-pill">${esc(sourceLabel(s))}</span>`).join('')}</div><p class="micro">${state.lang==='de'?'Vertrauensstufe der kuratierten Kurzbeschreibung':'Confidence level of the curated short profile'}: ${esc(loc('people',id,'confidence',p.confidence))}</p></div>`:''}</div>`;$('#detail').classList.add('open');bindPanel()}
function openPlace(id){const p=find(D.places,id);if(!p)return;const persons=D.people.filter(x=>(x.places||[]).includes(id)),stories=D.stories.filter(s=>s.scenes.some(sc=>sc.place===id)),routes=D.routes.filter(r=>r.from===id||r.to===id);$('#detail').innerHTML=`<div class="detail-inner"><button class="icon-btn close-x" data-close aria-label="${u('close')}">×</button><div class="eyebrow">${esc(loc('places',id,'type',p.type))}</div><h1>${esc(placeName(p))}</h1><div class="coord-badge">${fmtCoord(p)} · ${esc(loc('places',id,'precision',p.precision))}</div><p>${esc(loc('places',id,'summary',p.summary))}</p><div class="detail-section"><h3>${u('context')}</h3><p>${esc(loc('places',id,'geography',p.geography))}</p></div><div class="meta-row"><span class="pill">${esc(loc('places',id,'years',p.years))}</span></div>${persons.length?`<div class="detail-section"><h3>${u('relatedPeople')}</h3><div class="related-links">${persons.map(x=>`<button class="link-chip" data-person="${x.id}">${esc(personName(x))}</button>`).join('')}</div></div>`:''}${stories.length?`<div class="detail-section"><h3>${u('relatedStories')}</h3><div class="related-links">${stories.map(x=>`<button class="link-chip" data-story="${x.id}">${esc(loc('stories',x.id,'title',x.title))}</button>`).join('')}</div></div>`:''}${routes.length?`<div class="detail-section"><h3>${u('route')}</h3>${routes.map(r=>`<div class="route-row" data-route="${r.id}"><b>${esc(placeName(find(D.places,r.from)))} → ${esc(placeName(find(D.places,r.to)))}</b><span>${r.year} · ${esc(routeKind(r))}</span></div>`).join('')}</div>`:''}</div>`;$('#detail').classList.add('open');bindPanel()}
function openRoute(id){const r=D.routes.find(x=>x.id===id),a=find(D.places,r.from),b=find(D.places,r.to);$('#detail').innerHTML=`<div class="detail-inner"><button class="icon-btn close-x" data-close aria-label="${u('close')}">×</button><div class="eyebrow">${u('route')} · ${r.year}</div><h1>${esc(placeName(a))} → ${esc(placeName(b))}</h1><p><b>${u('certainty')}:</b> ${r.certainty==='hypothetical'?u('mapHypothetical'):u('mapReconstructed')}</p><p>${esc(routeNote(r))}</p><div class="rich-grid"><div class="context-box"><h3>${u('from')}</h3><p>${esc(loc('places',a.id,'geography',a.geography))}</p><button class="ghost" data-place="${a.id}">${u('details')}</button></div><div class="context-box"><h3>${u('to')}</h3><p>${esc(loc('places',b.id,'geography',b.geography))}</p><button class="ghost" data-place="${b.id}">${u('details')}</button></div></div></div>`;$('#detail').classList.add('open');bindPanel()}
function openFragment(id){const f=find(D.fragments,id),persons=(f.people||[]).map(x=>find(D.people,x)).filter(Boolean),places=(f.places||[]).map(x=>find(D.places,x)).filter(Boolean);$('#modal-root').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-body"><button class="icon-btn close-x" data-close aria-label="${u('close')}">×</button><div class="fragment-strip" lang="grc">${esc(f.greek)}</div><div class="eyebrow">${esc(f.fragment)} · ${esc(loc('fragments',id,'status',f.status))}</div><h1>${esc(loc('fragments',id,'title',f.title))}</h1><p class="lead">${esc(loc('fragments',id,'paraphrase',f.paraphrase))}</p><div class="rich-grid"><div class="context-box"><h3>${u('sourceWitness')}</h3><p>${esc(loc('fragments',id,'witness',f.witness))}<br>${state.lang==='de'?'Seitenbereich der überprüften Ausgabe':'Page range in the checked edition'}: ${esc(f.pageRange)}</p></div><div class="context-box"><h3>${u('context')}</h3><p>${esc(loc('fragments',id,'notes',f.notes))}</p></div></div>${persons.length?`<h3>${u('relatedPeople')}</h3><div class="related-links">${persons.map(p=>`<button class="link-chip" data-person="${p.id}">${esc(personName(p))}</button>`).join('')}</div>`:''}${places.length?`<h3>${u('relatedPlaces')}</h3><div class="related-links">${places.map(p=>`<button class="link-chip" data-place="${p.id}">${esc(placeName(p))}</button>`).join('')}</div>`:''}${state.pdfUrl?`<div class="meta-row">${(f.openPages||[f.page]).map(pg=>`<button class="primary" data-page="${pg}">PDF ${pg}</button>`).join('')}</div>`:''}</div></div></div>`;$('#modal-root [data-close]').onclick=closeModal;$('#modal-root').querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(b.dataset.person));$('#modal-root').querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>openPlace(b.dataset.place));$('#modal-root').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPdf(+b.dataset.page))}
function bindPanel(){const d=$('#detail');const close=d.querySelector('[data-close]');if(close)close.onclick=()=>d.classList.remove('open');d.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(b.dataset.person));d.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>openPlace(b.dataset.place));d.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>openStory(b.dataset.story));d.querySelectorAll('[data-fragment]').forEach(b=>b.onclick=()=>openFragment(b.dataset.fragment));d.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>openRoute(b.dataset.route))}
function closeModal(){$('#modal-root').innerHTML=''}
function go(v){state.view=v;state.search='';$('#search').value='';location.hash='#/'+v;render();$('#sidebar').classList.remove('open')}
function openPdf(page){if(!state.pdfUrl)return;window.open(`${state.pdfUrl}#page=${page}`,'_blank','noopener')}
function bindDynamic(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>openStory(b.dataset.story));document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case));document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(b.dataset.person));document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>openPlace(b.dataset.place));document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>openRoute(b.dataset.route));document.querySelectorAll('[data-fragment]').forEach(b=>b.onclick=()=>openFragment(b.dataset.fragment));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPdf(+b.dataset.page));document.querySelectorAll('[data-map-mode]').forEach(b=>b.onclick=()=>{state.mapMode=b.dataset.mapMode;render()});document.querySelectorAll('[data-route-filter]').forEach(b=>b.onclick=()=>{state.routeFilter=b.dataset.routeFilter;render()})}
function render(){nav();const viewsMap={overview:home,atlas,network,timeline,stories,cases,wonders,fragments,people,glossary,transmission,rights};const out=state.search?searchView(state.search):(viewsMap[state.view]||home)();$('#view').innerHTML=out;bindDynamic();$('#view').focus({preventScroll:true})}
$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b)go(b.dataset.view)};
$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');
$('#source-toggle').onclick=()=>{state.sources=!state.sources;localStorage.setItem('damascius-source-mode',state.sources?'on':'off');render()};
$('#pdf-button').onclick=()=>$('#pdf-input').click();
$('#pdf-input').onchange=e=>{const f=e.target.files[0];if(!f)return;if(state.pdfUrl)URL.revokeObjectURL(state.pdfUrl);state.pdfUrl=URL.createObjectURL(f);state.pdfName=f.name;render()};
$('#search').addEventListener('input',e=>{state.search=e.target.value.trim();render()});
document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;localStorage.setItem('damascius-lang',state.lang);closeModal();$('#detail').classList.remove('open');render()});
$('#rights-button').onclick=()=>go('rights');
window.addEventListener('hashchange',()=>{state.view=location.hash.slice(2)||'overview';render()});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){closeModal();$('#detail').classList.remove('open');$('#sidebar').classList.remove('open')}});
render();
})();
</script>
</body>
</html>
