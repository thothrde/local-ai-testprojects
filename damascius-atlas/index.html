ert vor der Theurgie philosophische und menschliche Reife.","people":["isidore","hegias"],"places":["athens"],"notes":"Innere pagane Kritik an ritualistischem Aktivismus.","pageRange":"322–323","greekPages":"322","translationPages":"323","openPages":[323],"verificationCue":"Isidor zu Hegias: Künftige Götter müssen zuerst Menschen werden.","verified":true,"verifiedVersion":"1.0.1","verifiedDate":"2026-08-06"},{"id":"zosime-epi","title":"Zosimes Grabepigramm","fragment":"Anth. Gr. VII.553","witness":"Inschrift + Anthologia Graeca","page":49,"status":"externes Selbstzeugnis","greek":"ἡ πρὶν ἐοῦσα μόνῳ τῷ σώματι δούλη","paraphrase":"Die Tote war nur körperlich versklavt; nun findet auch der Körper Freiheit.","people":["zosime","damascius"],"places":["emesa"],"notes":"Kein Fragment des Werkes, aber zentral für Damascius’ späte Biographie.","pageRange":"48–49","greekPages":"48","translationPages":"49","openPages":[49],"verificationCue":"Grabepigramm: zuerst nur körperlich versklavt, nun auch körperlich frei.","verified":true,"verifiedVersion":"1.0.1","verifiedDate":"2026-08-06"}],"glossary":[{"term":"Kronisches Leben","greek":"Κρόνιος βίος","definition":"Von Vernunft, Einheit und innerer Sammlung geprägte Lebensform; Sarapio ist das Idealbild."},{"term":"Typhonisches Leben","greek":"Τυφώνιος βίος","definition":"Zersplitterung durch Begierde, Machtstreben, Unwahrheit und gesellschaftliche Gewaltsamkeit."},{"term":"Bacchus","greek":"Βάκχος","definition":"Metapher für den wahren Philosophen, der philosophische Einsicht und hieratische Erfahrung vereinigt."},{"term":"Theurgie","greek":"θεουργία","definition":"Rituelle Praxis, welche die Seele durch göttliche Symbole und Ursachen emporführen soll."},{"term":"Diadochos","greek":"διάδοχος","definition":"Nachfolger bzw. Leiter einer philosophischen Schule; spiritueller Rang und umkämpfte Institution."},{"term":"Polydoxia","greek":"πολυδοξία","definition":"Vielheit von Meinungen; Risiko ungerichteter Bücher- und Hörgelehrsamkeit."},{"term":"Genesis","greek":"γένεσις","definition":"Bereich des Werdens und der Verkörperung; Gegensatz zu intelligiblem Sein und Einheit."},{"term":"Eumoiria","greek":"εὐμοιρία","definition":"Angeborene glückliche Intuition oder besondere Begabung."},{"term":"Patria","greek":"πάτρια","definition":"Lokale Traditionen, Ursprungs- und Ortsgeschichten."},{"term":"Paradoxa","greek":"παράδοξα","definition":"Berichte über Wunderbares und Anomalien; bei Damascius eine Erkenntnisform."},{"term":"Prosopographie","greek":"προσωπογραφία","definition":"Geschichte durch Beziehungsnetze von Personen, Familien, Schulen und Ämtern."},{"term":"Suda","greek":"Σοῦδα","definition":"Byzantinisches Lexikon des 10. Jahrhunderts mit vielen Damascius-Fragmenten."},{"term":"Photios-Epitome","greek":"Βιβλιοθήκη, κώδιξ 242","definition":"Wichtigste zusammenhängende Überlieferung des verlorenen Werkes."},{"term":"Hellenismus","greek":"Ἑλληνισμός","definition":"Pagane religiös-philosophische Lebensordnung, nicht nur Sprache oder Bildung."},{"term":"Heilige Geographie","greek":"ἱερὰ τοπογραφία","definition":"Landschaften, Quellen, Höhlen und Städte als Träger göttlicher Präsenz."},{"term":"Rhetorik","greek":"ῥητορική","definition":"Notwendige Technik, aber gefährlich, wenn Karriere und Schein über Wahrheit gestellt werden."}],"sources":[{"id":"athanassiadi","title":"Polymnia Athanassiadi, Damascius: The Philosophical History","type":"Moderne Edition","date":"1999","note":"Grundlage der App: rekonstruierter griechischer Text, englische Übersetzung, Kommentar, Testimonien und Anhänge."},{"id":"photius-source","title":"Photios, Bibliotheca, Codex 242","type":"Byzantinische Epitome","date":"9. Jh.","note":"Wichtigster zusammenhängender Überlieferungszeuge; kürzt und beurteilt aus christlicher Perspektive."},{"id":"suda-source","title":"Suda-Lexikon","type":"Lexikographische Exzerpte","date":"10. Jh.","note":"Bewahrt zusätzliche Splitter; Reihenfolge und Kontext sind häufig verloren."},{"id":"marinus-source","title":"Marinus, Vita Procli","type":"Zeitnahe Hagiographie","date":"spätes 5. Jh.","note":"Vergleichsquelle zur Athener Schule und zum Proklosbild."},{"id":"zacharias-source","title":"Zacharias von Mytilene, Vita Severi / Ammonius","type":"Christliche Parallelquelle","date":"5./6. Jh.","note":"Ermöglicht Gegenlesen des alexandrinischen Schulmilieus."},{"id":"agathias-source","title":"Agathias, Historien II","type":"Historische Parallelquelle","date":"6. Jh.","note":"Hauptquelle für Persienreise und Rückkehrgarantie."},{"id":"socrates-source","title":"Sokrates Scholastikos, Kirchengeschichte VII.15","type":"Historische Parallelquelle","date":"5. Jh.","note":"Frühere Quelle zur Ermordung Hypatias."},{"id":"inscriptions-source","title":"Inschriften und Papyri","type":"Dokumentarische Quellen","date":"Spätantike","note":"Unter anderem das Zosime-Epigramm und Zeugnisse aus Aphrodisias."}],"i18n":{"people":{"damascius":{"role":"Philosopher, school head, historian","origin":"Damascus","summary":"A rhetorician who turned to philosophy after the Alexandrian persecutions and later led the Platonic school in Athens.","why":"He judges people not only by doctrines but by whether insight, way of life, and action remain coherent under pressure.","tags":["Rhetoric","Platonism","Exile","Institutions"],"name":"Damascius","dates":"c. 458–after 538","confidence":"high"},"isidore":{"role":"Philosopher and teacher of Damascius","origin":"Alexandria","summary":"An eccentric, orally oriented philosopher whom Damascius idealises as an embodiment of immediate, Bacchic insight.","why":"He joins philosophical intuition and moral testing with distrust of mere book learning.","tags":["Socrates","Bacchus","Intuition","Teacher"],"name":"Isidore","dates":"5th c.","confidence":"high"},"sarapio":{"role":"Urban hermit","origin":"Alexandria","summary":"He lived alone in a tiny house and owned only two or three books, including Orphic poetry.","why":"His voluntary poverty of books is an epistemic policy against fragmentation by borrowed opinions.","tags":["Orpheus","Asceticism","Cronian life","Silence"],"name":"Sarapio","dates":"5th c.","confidence":"high"},"asclepiodotus":{"role":"Polymath, physician, musician, mathematician","origin":"Alexandria / Aphrodisias","summary":"He experimented with musical intervals, medicine, toxic vapours, and natural phenomena; Damascius both admired and attacked him.","why":"He embodies a rival ideal of philosophy: truth through experiment, reconstruction, and technical mastery.","tags":["Experiment","Mathematics","Music","Medicine"],"name":"Asclepiodotus","dates":"5th c.","confidence":"high"},"heraiscus":{"role":"Egyptian ritual specialist","origin":"Egypt","summary":"He was said to distinguish divinely animated cult images from inert ones and to perceive sacred presence bodily.","why":"His body becomes a resonant instrument of the sacred, opposed to detached experiment.","tags":["Aion","Osiris","Cult images","Divination"],"name":"Heraiscus","dates":"5th c.","confidence":"medium"},"horapollo":{"role":"Head of an Alexandrian school","origin":"Egypt","summary":"A rhetorician and teacher in an international pagan-Christian milieu; arrested and tortured during persecution.","why":"His life reveals the school as a social, religious, and political node.","tags":["School","Conversion","Torture","Network"],"name":"Horapollo","dates":"5th c.","confidence":"high"},"ammonius":{"role":"Philosopher and commentator on Aristotle","origin":"Alexandria","summary":"A pragmatic, scientifically minded teacher whom Damascius accuses of greed and of striking a bargain with Peter Mongus.","why":"The case remains open: betrayal, survival strategy, or institutional rescue?","tags":["Aristotle","Compromise","Survival","Rationalism"],"name":"Ammonius, son of Hermeias","dates":"c. 440–520","confidence":"medium"},"aedesia":{"role":"Patron and bearer of a philosophical family","origin":"Alexandria","summary":"She secured her sons’ education, preserved public support, and helped the poor even at the cost of debt.","why":"She shows that philosophical succession depends on money, care, and women’s networks.","tags":["Care","Dynasty","Education","Patronage"],"name":"Aedesia","dates":"5th c.","confidence":"high"},"hypatia":{"role":"Mathematician, philosopher, public teacher","origin":"Alexandria","summary":"Admired for dialectic, political judgement, and public authority, yet ranked below the “true philosopher” in Damascius’ hierarchy.","why":"The tension between reverence and demotion exposes Damascius’ own ideal of philosophy.","tags":["Mathematics","Politics","Murder","Public life"],"name":"Hypatia","dates":"c. 355–415","confidence":"high"},"theosebius":{"role":"Practical ethicist","origin":"Unknown","summary":"He invoked Helios and the God of the Jews in an exorcism and later lived in a voluntarily continent marriage.","why":"He exemplifies an urban pagan asceticism that is neither simply theurgic nor Christian.","tags":["Asceticism","Marriage","Exorcism","Syncretism"],"name":"Theosebius","dates":"5th c.","confidence":"high"},"anthusa":{"role":"Inventor of cloud divination","origin":"Aegae in Cilicia","summary":"She interpreted a cloud vision as an omen of Aspar’s killing and was said to turn it into a continuing divinatory technique.","why":"She appears not merely as a visionary but as a methodological innovator.","tags":["Clouds","Divination","Politics","Innovation"],"name":"Anthusa","dates":"5th c.","confidence":"medium"},"epiphanius":{"role":"Astronomer and mystery specialist","origin":"Alexandria","summary":"A custodian of Osiris and Aion mysteries, probably connected with Theon’s scientific circle.","why":"He represents the transitional generation that still knew the last bearers of the old order.","tags":["Aion","Astronomy","Osiris","Transmission"],"name":"Epiphanius","dates":"4th/5th c.","confidence":"medium"},"euprepius":{"role":"Leader of Persian mysteries","origin":"Alexandria","summary":"A ritual specialist who transmitted older pagan narratives after institutional continuity had broken.","why":"Tradition appears as a chain of personal contacts rather than an unbroken institution.","tags":["Mysteries","Transmission","Ritual"],"name":"Euprepius","dates":"4th/5th c.","confidence":"medium"},"olympos":{"role":"Charismatic priest of Sarapis","origin":"Cilicia","summary":"He taught the ancestral rites while their social world was collapsing and foretold that Sarapis would leave the temple.","why":"He shows how a religion ends when competent teachers disappear.","tags":["Sarapis","Serapeum","Charisma","End of religion"],"name":"Olympos","dates":"4th/5th c.","confidence":"medium"},"iacobus":{"role":"Physician and benefactor","origin":"Alexandria","summary":"He treated poor patients without payment and persuaded the wealthy to help; Isidore called his soul Asclepian.","why":"Technical mastery is understood as ethical and religious likeness to the patron god of an art.","tags":["Medicine","Poverty","Asclepius","Professional ethics"],"name":"Iacobus","dates":"5th c.","confidence":"high"},"marinus":{"role":"Successor of Proclus","origin":"Neapolis","summary":"After Isidore’s terse criticism he burned an unpublished commentary on the Philebus.","why":"His case reveals textual loss through internal censorship and the authority of the master.","tags":["Philebus","Parmenides","Self-censorship","Succession"],"name":"Marinus","dates":"5th c.","confidence":"high"},"proclus":{"role":"Platonic successor","origin":"Constantinople / Lycia","summary":"The commanding authority of the Athenian school; after his death his theology became both norm and object of internal criticism.","why":"He functions not only as an author but as an institutional field of gravity.","tags":["Theology","Succession","Authority","Theurgy"],"name":"Proclus","dates":"412–485","confidence":"high"},"hegias":{"role":"Philosopher and pagan activist","origin":"Athens","summary":"He secretly restored sanctuaries; Damascius criticises his zeal as politically dangerous.","why":"He forces a distinction between piety, activism, and judgement.","tags":["Theurgy","Sanctuaries","Activism","Risk"],"name":"Hegias","dates":"5th/6th c.","confidence":"high"},"pamprepius":{"role":"Poet, politician, prophet","origin":"Panopolis","summary":"He linked the revolt of Illus with hopes for pagan restoration; Damascius casts him as the Typhonian opposite of Sarapio.","why":"Religious hope, propaganda, and personal ambition merge in him.","tags":["Propaganda","Illus","Typhon","Revolt"],"name":"Pamprepius","dates":"c. 440–484","confidence":"medium"},"peter-mongus":{"role":"Patriarch of Alexandria","origin":"Alexandria","summary":"A Miaphysite patriarch whom Athanassiadi’s reconstruction places within the persecution of the pagan school milieu.","why":"He reminds us both of Damascius’ partisanship and of the multiple fronts of church politics.","tags":["Church politics","Persecution","Alexandria"],"name":"Peter Mongos","dates":"† 490","confidence":"medium"},"photius":{"role":"Patriarch and excerptor","origin":"Constantinople","summary":"Codex 242 of his Bibliotheca preserves the most important continuous epitome of the lost work.","why":"Without Photius the work would scarcely survive, yet we see it through a ninth-century Christian reader.","tags":["Bibliotheca","Epitome","Transmission","Filter"],"name":"Photius","dates":"c. 810–893","confidence":"high"},"theodora":{"role":"Student and dedicatee","origin":"Emesene dynasty","summary":"A learned pupil of Damascius and Isidore who, with others, requested the composition of the work.","why":"The Philosophical History is also the result of female demand and patronage.","tags":["Dedication","Student","Patronage"],"name":"Theodora","dates":"5th/6th c.","confidence":"high"},"zosime":{"role":"Formerly enslaved woman","origin":"Syria","summary":"On her grave she says that she was once enslaved only in body and has now found bodily freedom as well.","why":"Two verses apply Platonic inner freedom to a woman without social rights.","tags":["Slavery","Freedom","Funerary epigram","Soul"],"name":"Zosime","dates":"6th c.","confidence":"high"},"ulpian":{"role":"Mathematician, brother of Isidore","origin":"Alexandria","summary":"Famous for new mathematical problems and solutions; he died young and remained outside politics.","why":"Damascius respects mathematical brilliance while ranking it below theoretical philosophy.","tags":["Mathematics","Problems","Athens"],"name":"Ulpian","dates":"5th c.","confidence":"high"},"severus":{"role":"Roman senator and host","origin":"Rome","summary":"A learned host who received philosophers and Indian Brahmans in Alexandria.","why":"His household shows scholarship as social infrastructure.","tags":["Hospitality","Brahmans","Books"],"name":"Severus","dates":"5th c.","confidence":"medium"},"brahmans":{"role":"Religious intermediaries","origin":"India","summary":"They lived ascetically in Severus’ house and described themselves as mediators between cities and mountain Brahmans.","why":"The episode documents a concrete social role for transcultural brokers.","tags":["India","Asceticism","Mediation","Travel lore"],"name":"The unnamed Brahmans","dates":"5th c.","confidence":"medium"}},"places":{"alexandria":{"type":"Metropolis","summary":"Horapollo’s school, a zone of contact and conflict among pagan, Christian, and Jewish milieus; site of the persecution of 488/89.","name":"Alexandria","geography":"A major port on Egypt’s Mediterranean coast. The marker indicates the ancient urban area, not a specific school building.","precision":"approximate ancient-site centroid","years":"c. 480–490"},"menouthis":{"type":"Sanctuary","summary":"A hidden sanctuary of Isis whose cult objects were discovered and publicly destroyed.","name":"Menouthis / Abukir","geography":"A sanctuary located in the Canopus/Abukir area. The marker is deliberately approximate and does not claim a precise identification of the ancient cult site.","precision":"approximate identification","years":"c. 485–488"},"athens":{"type":"School centre","summary":"Platonic succession, struggles for leadership, institutional reform, and finally the ban on teaching.","name":"Athens","geography":"The Attic city and centre of the late antique Platonic school. The map distinguishes the city from the wider cult landscape of Attica.","precision":"approximate ancient-site centroid","years":"485–529"},"aphrodisias":{"type":"Philosophical centre","summary":"Asclepiodotus built a materially and institutionally strong pagan centre.","name":"Aphrodisias","geography":"A city in Caria in south-western Asia Minor, associated with Asclepiodotus as a philosophical, religious, and institutional centre.","precision":"approximate ancient-site centroid","years":"late 5th c."},"hierapolis":{"type":"Sacred landscape","summary":"Subterranean vapours, hot springs, Damascius’ Attis dream, and Asclepiodotus’ experiments.","name":"Hierapolis","geography":"A Phrygian healing and cult centre by the thermal springs of modern Pamukkale, and the setting of the story about subterranean vapour.","precision":"approximate ancient-site centroid","years":"c. 490"},"damascus":{"type":"Place of origin","summary":"Birthplace of Damascius and a stage on his journey with Isidore.","name":"Damascus","geography":"A major Syrian city, birthplace of Damascius, and a stage in his journey with Isidore.","precision":"approximate historic-city centroid","years":"5th c."},"heliopolis":{"type":"Sacred city","summary":"Local theologies, priestly tales, and the contrast between genuine and pretended philosophy.","name":"Heliopolis / Baalbek","geography":"Baalbek in the Lebanon range, a major late antique cult centre with local theological traditions.","precision":"approximate ancient-site centroid","years":"c. 490"},"berytius":{"type":"City and cult site","summary":"Damascius heard local Phoenician traditions here, including the myth of Eshmun.","name":"Berytus / Beirut","geography":"The coastal city of Berytus, modern Beirut; in the journey narrative it preserves Phoenician local traditions, including the myth of Eshmun.","precision":"approximate historic-city centroid","years":"c. 490"},"bostra":{"type":"Provincial capital","summary":"Encounters with Arabian cults, Dusares, and sacred landscapes.","name":"Bostra","geography":"Bosra in the Hauran, a Roman provincial capital and point of departure for reports about Arabian cults and sacred landscapes.","precision":"approximate ancient-site centroid","years":"c. 490"},"gaza":{"type":"Educational centre","summary":"Antony assisted Damascius and Isidore during their flight.","name":"Gaza","geography":"A major educational centre on the southern Levantine coast; in the reconstructed journey it is a place of assistance for the fugitives.","precision":"approximate historic-city centroid","years":"c. 489"},"emesa":{"type":"Sacred homeland","summary":"City of the Iamblichean tradition; possible last home of Damascius and findspot of Zosime’s epigram.","name":"Emesa / Homs","geography":"Homs in Syria, a sacred homeland for several philosophical traditions; Damascius’ possible later residence in the region remains a reconstruction.","precision":"approximate historic-city centroid","years":"6th c."},"harran":{"type":"Frontier city","summary":"A strongly pagan city and, in a disputed hypothesis, a possible refuge for the philosophers.","name":"Harran","geography":"A city in Upper Mesopotamia with a long-lived non-Christian religious culture. Its role as a refuge for the philosophers is a disputed hypothesis.","precision":"approximate ancient-site centroid","years":"after 532?"},"ctesiphon":{"type":"Sasanian capital","summary":"Destination of the seven philosophers in their hope for intellectual freedom under Khusrau I.","name":"Ctesiphon","geography":"The Sasanian residence on the Tigris south-east of modern Baghdad, and destination of the philosophers’ journey to Khusrau I.","precision":"approximate ancient-site centroid","years":"c. 531–532"},"constantinople":{"type":"Imperial capital","summary":"Court politics, the killing of Aspar, careers, and struggles over religious power.","name":"Constantinople","geography":"The imperial capital on the Bosporus, political horizon of the Aspar story and of many fifth-century careers.","precision":"approximate historic-city centroid","years":"5th c."},"rome":{"type":"Imperial memory","summary":"A symbolic horizon in tales about Attila, Severus, and portents.","name":"Rome","geography":"The western imperial city and a field of memory in stories of power, omens, and battles.","precision":"approximate historic-city centroid","years":"5th c."},"aegae":{"type":"Place of origin","summary":"Home of Anthusa, credited with inventing cloud divination.","name":"Aegae in Cilicia","geography":"Aegae in Cilicia, approximately in the area of modern Yumurtalık/Ayas, marked as Anthusa’s place of origin.","precision":"approximate identification","years":"5th c."},"attica":{"type":"Cult landscape","summary":"Hegias secretly restored sanctuaries and renewed rites.","name":"Attica","geography":"The region around Athens. The point is a cartographic anchor for a landscape, not a single ancient site.","precision":"regional marker","years":"c. 500"},"india":{"type":"Distant region","summary":"The homeland attributed to the Brahmans staying in Severus’ house.","name":"India (region unspecified)","geography":"Damascius names India as the origin and narrative horizon of the Brahmans without specifying a precise location. The marker therefore denotes a broad region.","precision":"regional marker","years":"5th c."}},"timeline":{"412-Geburt des Proklos":{"title":"Birth of Proclus","detail":"Later the commanding authority of the Athenian school."},"415-Ermordung Hypatias":{"title":"Murder of Hypatia","detail":"Damascius presents envy and religious power as a complex of motives."},"450-Blüte paganer Schulen in Alexandria":{"title":"Pagan schools flourish in Alexandria","detail":"Horapollo, Aedesia, Ammonius, Heraiscus, and Isidore form a dense milieu."},"468-Vandalenexpedition Leos I.":{"title":"Leo I’s Vandal expedition","detail":"Anthusa’s anxiety for her husband forms the background to the cloud vision."},"471-Ermordung Aspars":{"title":"Killing of Aspar","detail":"In Anthusa’s vision a lion devours the figure of a Goth."},"480-Damascius in Alexandria":{"title":"Damascius in Alexandria","detail":"Study and practice of rhetoric in Horapollo’s circle."},"484-Aufstand des Illus":{"title":"Revolt of Illus","detail":"Pamprepius joins rebellion to hopes for pagan restoration."},"485-Tod des Proklos":{"title":"Death of Proclus","detail":"The open crisis of succession begins."},"488-Verfolgung des alexandrinischen Milieus":{"title":"Persecution of the Alexandrian milieu","detail":"Arrest, torture, flight, and suspected bargains tear the network apart."},"489-Philosophische Wende und Flucht":{"title":"Philosophical turn and flight","detail":"Under Isidore’s influence Damascius abandons rhetoric."},"490-Aphrodisias und Ankunft in Athen":{"title":"Aphrodisias and arrival in Athens","detail":"Encounter with Asclepiodotus and entry into the Athenian school world."},"500-Hegias’ Restaurationsaktivismus":{"title":"Hegias’ restoration activism","detail":"Sanctuaries are renewed; Damascius criticises the political imprudence."},"515-Damascius als Diadochos":{"title":"Damascius as successor","detail":"Approximate date of his leadership and reforms."},"517-Möglicher Beginn der Abfassung":{"title":"Possible beginning of composition","detail":"Athanassiadi dates the work between 517 and 526."},"529-Unterrichtsverbot in Athen":{"title":"Ban on teaching in Athens","detail":"An imperial edict ends public philosophical teaching."},"531-Reise der sieben Philosophen nach Persien":{"title":"Journey of the seven philosophers to Persia","detail":"Hope for intellectual freedom under Khusrau I."},"532-Friedensvertrag und Rückkehrgarantie":{"title":"Peace treaty and guarantee of return","detail":"No forced change of their convictions."},"850-Photios exzerpiert das Werk":{"title":"Photius excerpts the work","detail":"His epitome preserves large portions while reshaping them."},"975-Suda-Exzerpte":{"title":"Suda excerpts","detail":"Lexicographical fragmentation preserves additional pieces."},"1999-Athanassiadis Rekonstruktion":{"title":"Athanassiadi’s reconstruction","detail":"Text, translation, commentary, and a new overall ordering."}},"stories":{"alexandria-collapse":{"title":"Alexandria 488/89 — A Network Breaks Apart","subtitle":"Persecution, torture, flight, and compromise","intro":"A school is at once a teaching institution, family, cult community, career path, and protection network","scenes":[{"title":"The school as a node","text":"Horapollo’s institution gathers pagan and Christian students, rhetoricians, philosophers, families, and ritual specialists."},{"title":"The trigger","text":"A dispute involving a converted student, a hidden sanctuary of Isis, and church rivalries becomes an operation against the pagan milieu."},{"title":"Torture and silence","text":"Horapollo and Heraiscus are tortured for information about hiding places. Damascius turns their silence into a moral test."},{"title":"The open case of Ammonius","text":"Ammonius survives professionally and reaches an agreement with the patriarch. Its terms are lost."},{"title":"Damascius changes course","text":"The crisis destroys his trust in rhetoric. Philosophy becomes the question whether words withstand action."}],"significance":"The episode presents the school not as an isolated classroom but as a vulnerable web of families, careers, cults, patronage, and personal loyalty. Because Damascius is partisan and the terms of Ammonius’ agreement are lost, his role must remain open.","sourceNote":"The sequence is reconstructed from fragments of Damascius and near-contemporary Christian sources. The app distinguishes preserved details from Athanassiadi’s modern synthesis.","tone":"investigative"},"sarapio-path":{"title":"The Man with Only Three Books","subtitle":"Sarapio and the politics of intellectual poverty","intro":"What if a library became philosophical not by growing, but by radical selection?","scenes":[{"title":"The small house","text":"Sarapio lives almost invisibly in Alexandria and receives scarcely anyone."},{"title":"Two or three books","text":"He owns only a few texts, among them Orpheus. Books are judged by their power to gather the mind."},{"title":"Cronus in the present","text":"Damascius treats him as evidence of a golden, Cronian life within a Typhonian age."},{"title":"The problem","text":"Is withdrawal the highest concentration, or does it remove virtue from political testing?"}],"significance":"Sarapio serves Damascius as a Cronian counter-image to a dispersed, “Typhonian” present. Yet elsewhere Damascius insists that virtue must be tested in action. The portrait therefore contains a real tension between withdrawal and public testing.","sourceNote":"The few biographical details come from the fragmentary transmission; the reading of book-poverty as an epistemic policy is explicitly the app’s interpretation.","tone":"contemplative"},"asclepiodotus-path":{"title":"The Lost Interval","subtitle":"Asclepiodotus between laboratory and metaphysics","intro":"A polymath tries to recover a sound-world that his own age can no longer hear.","scenes":[{"title":"220 positions","text":"On a monochord Asclepiodotus moves the bridge through at least 220 positions to reconstruct the enharmonic diesis."},{"title":"The historical ear","text":"A culture can lose the capacity to perceive an interval at all."},{"title":"The poisonous descent","text":"At Hierapolis he uses trapped outside air as improvised protection while investigating lethal subterranean vapour."},{"title":"Medicine as reconstruction","text":"He recovers the medicinal use of white hellebore."},{"title":"Damascius resists","text":"His empirical brilliance makes him a particularly dangerous counter-model."}],"significance":"The unusual density of technical anecdotes makes Asclepiodotus a rival model of the philosopher. Damascius’ criticism is therefore evidence for competing standards of knowledge, not a neutral verdict to be adopted.","sourceNote":"The monochord, medical practice, and vapour experiment are preserved as reports by Damascius. The app separates the report from modern scientific interpretation.","tone":"experimental"},"anthusa-path":{"title":"The Woman Who Read the Clouds","subtitle":"Anthusa and a newly invented divination","intro":"Personal anxiety, a dream, and a political event become the founding story of a method.","scenes":[{"title":"Prayer to both horizons","text":"Anthusa prays to the rising sun; her dead father appears in a dream and tells her to invoke the setting sun as well."},{"title":"Man, lion, devouring","text":"Two clouds take shape. A lion swallows a man who looks like a Goth."},{"title":"Political fulfilment","text":"Damascius connects the image with the killing of Aspar by Emperor Leo."},{"title":"From vision to technique","text":"Anthusa was said to continue practising cloud divination afterwards."}],"significance":"The story joins personal anxiety, dream instruction, cloud observation, and political memory. Damascius credits Anthusa with turning a single sign into an ongoing art, but the method cannot be independently verified.","sourceNote":"The historical killing of Aspar must be distinguished from the divinatory frame. The app does not assert a successful prediction as fact.","tone":"visual"},"journey-conversion":{"title":"The Journey of Conversion","subtitle":"From Alexandria to Athens through sacred landscapes","intro":"Flight, educational travel, pilgrimage, and field research overlap.","scenes":[{"title":"Gaza: assistance","text":"Antony helps the fugitives. Gratitude becomes a point in Damascius’ remembered geography."},{"title":"Bostra and Arabia","text":"With Dorus they visit cult places, holy waters, and local theologies."},{"title":"Heliopolis","text":"Local priests and self-styled philosophers become tests of genuine and pretended wisdom."},{"title":"Berytus","text":"Damascius hears the Eshmun myth and preserves a Phoenician voice in Greek."},{"title":"Aphrodisias","text":"Asclepiodotus introduces the travellers to a world of experiment, cult, and institution building."},{"title":"Athens","text":"The journey ends in an ageing and contentious school that Damascius will later try to reform."}],"significance":"The route turns flight into intellectual fieldwork. Local informants, landscapes, and cult traditions enter the work; at the same time, the exact order of stages depends on a modern arrangement of scattered fragments.","sourceNote":"The drawn line is a source-based reconstruction, not an ancient itinerary preserved stage by stage.","tone":"atlas"},"golden-chain":{"title":"The Golden Chain and Its Dark Underside","subtitle":"Succession, families, books, and power","intro":"Metaphysical succession appears in practice as a struggle over chairs, texts, and legitimacy.","scenes":[{"title":"The ageing Proclus","text":"During Proclus’ illness the question begins: who can inherit Platonic authority?"},{"title":"Marinus burns his book","text":"One courteous sentence from Isidore is enough: the lengthy commentary on the Philebus is destroyed."},{"title":"Parmenides as a battleground","text":"Whether the dialogue concerns species or gods determines the school’s theological identity."},{"title":"A freelance successor?","text":"Isidore may have received an honorary status without regularly leading the school."}],"significance":"Philosophical succession appears not only as a metaphysical “golden chain” but as a struggle over authority, money, manuscripts, families, and institutional legitimacy. The destruction of texts exposes an internal mechanism of cultural loss.","sourceNote":"Damascius is both participant and moral judge in these conflicts. His portraits are evidence, not impartial records.","tone":"institutional"},"persian-exile":{"title":"The Seven Philosophers in Persia","subtitle":"Utopia, culture shock, and a negotiated return","intro":"When teaching is forbidden, Damascius tries to transfer an entire institution into another world.","scenes":[{"title":"Hiding and packing","text":"Sacred objects are hidden in wells and manuscripts are packed."},{"title":"Hope in Khusrau","text":"Platonic ideals of kingship make Ctesiphon seem a possible home of philosophical freedom."},{"title":"Culture shock","text":"The court is not a free school; the philosophers become foreign advisers."},{"title":"Freedom of conscience","text":"According to Agathias, the peace treaty protects them from forced conversion."},{"title":"Harran?","text":"Whether the returnees actually settled in Harran remains disputed."}],"significance":"The story asks whether an institution can be moved into another political world. The Persian court disappoints hopes for a philosopher-king; according to Agathias, the peace treaty at least protects the philosophers from forced conversion.","sourceNote":"The journey to Persia is anciently attested. Hidden cult objects, transported manuscripts, and a later residence at Harran belong partly to modern reconstruction and carry different levels of certainty.","tone":"political"},"zosime-path":{"title":"Zosime’s Freedom","subtitle":"Two verses against the social definition of a human being","intro":"The smallest story may contain the strongest philosophical compression.","scenes":[{"title":"The gravestone","text":"Zosime says that she had been enslaved only in body; in death the body too is free."},{"title":"Inner freedom","text":"Her soul had never been another person’s property."},{"title":"Damascius in old age","text":"The epigram is slight evidence for his return to his Syrian homeland."}],"significance":"The brief epigram condenses the distinction between inner and bodily-social freedom in the voice of an enslaved woman. Its possible connection with Damascius’ final years is moving but only weak biographical evidence.","sourceNote":"The public app does not reproduce a modern translation of the epigram; it offers an independent paraphrase.","tone":"minimal"},"sacred-geography":{"title":"The Arabian Styx","subtitle":"Natural phenomenon, oath, and divine judgement","intro":"In sacred geography nature, law, ritual, and body are not separate.","scenes":[{"title":"The descent","text":"Suitable women too descend into the ravine; gardens and farms lie below."},{"title":"The water decides","text":"Light offerings sink and heavy ones are rejected, depending on divine approval."},{"title":"Oath and body","text":"False swearing at the water is said to bring fatal dropsy within a year."},{"title":"Field research","text":"Local experience, Homeric language, and religious interpretation are assembled into one report."}],"significance":"The report joins landscape, law, body, and ritual. It is especially revealing of a world in which natural phenomenon and divine judgement are not treated as separate categories.","sourceNote":"The app asserts neither the physical operation of the offering test nor the reported punishment for perjury. It examines the story as sacred geography.","tone":"landscape"},"phantom-wars":{"title":"Battles after Death","subtitle":"Phantom warriors, sounds, and recurring places","intro":"Damascius compares a recurring type of apparition.","scenes":[{"title":"Three days of combat","text":"After a great battle, the souls of the dead are said to have fought for three days and nights."},{"title":"A geography of repetition","text":"Similar phantoms appear in Caria, Sicily, and other plains."},{"title":"A type of anomaly","text":"The text collects witnesses, places, and variants of one phenomenon."}],"significance":"The collection of similar reports shows Damascius’ interest in recurring types of anomaly. The comparative impulse is historically significant; it does not prove that the apparitions occurred.","sourceNote":"Places and variants are presented as ancient reports, not as confirmed events.","tone":"paradoxographical"},"eshmun-path":{"title":"Eshmun, the Eighth Son","subtitle":"A Phoenician healing god between castration and rebirth","intro":"A local oral tradition enters a Greek philosophical travel narrative.","scenes":[{"title":"Astronoe’s pursuit","text":"The goddess pursues the beautiful hunter Eshmun; in panic he mutilates himself."},{"title":"Life-giving warmth","text":"Astronoe revives him with warmth and the youth becomes a healing god."},{"title":"The number eight","text":"A second etymology makes him the eighth son and opens a cosmological symbolism."},{"title":"A local voice","text":"The narrative manner suggests a local informant."}],"significance":"The episode may preserve a local Phoenician tradition, but it reaches us through a Greek philosophical travel narrative. This translation between local and learned systems of interpretation is precisely what makes it important.","sourceNote":"The inference of a local informant is plausible but not directly stated in the surviving text.","tone":"mythological"},"hypatia-path":{"title":"Hypatia in Damascius’ Mirror","subtitle":"Admiration, murder narrative, and disciplinary hierarchy","intro":"A source can be both valuable testimony and a partisan judgement.","scenes":[{"title":"Public authority","text":"Hypatia teaches publicly, advises officials, and is honoured by the city."},{"title":"Envy and murder","text":"Damascius makes Cyril’s envy the beginning of the plot against her."},{"title":"“True philosopher” versus mathematician","text":"Elsewhere Hypatia serves as a foil for Isidore’s supposedly higher philosophy."},{"title":"Source criticism","text":"The unfair comparison itself documents Damascius’ hierarchy."}],"significance":"Damascius provides valuable evidence for Hypatia’s public authority while also using her as a foil for Isidore’s supposedly higher philosophy. His bias is not a reason to discard the source; it is itself part of the historical evidence.","sourceNote":"The app explicitly distinguishes PH 43E (public authority and death) from PH 106A (comparison with Isidore).","tone":"critical"},"brahmans-path":{"title":"Brahmans in a Roman Senator’s House","subtitle":"Alexandria as a transcultural node","intro":"The more revealing figure is not the legendary mountain ascetic but the mediator between two social worlds.","scenes":[{"title":"Ascetic life in the house","text":"The guests scarcely leave, eat dates and rice, and drink water."},{"title":"Between two worlds","text":"They represent mountain Brahmans in city affairs and the cities before the Brahmans."},{"title":"Marvels and travel lore","text":"Rain prayers, protection from epidemics, and seven-headed snakes mingle experience with literary tradition."}],"significance":"The most historically suggestive element is not the catalogue of marvels but the described social brokerage between cities and ascetic groups. It reveals Alexandria as a node of transcultural knowledge movement.","sourceNote":"Diet and brokerage are presented as Damascius’ report; rain prayers, protection from epidemics, and many-headed animals belong to travel and marvel tradition.","tone":"ethnographic"}},"cases":{"ammonius-case":{"title":"What happened between Ammonius and Peter Mongus?","status":"open","question":"Was Ammonius a betrayer, a pragmatic survivor, or the rescuer of an institution?","evidence":[{"kind":"Damascius","text":"He calls Ammonius greedy and reports an agreement with the overseer of the prevailing religion."},{"kind":"Context","text":"Ammonius alone among the inner school circle remained professionally unharmed."},{"kind":"Counter-evidence","text":"He continued to teach doctrines such as the eternity of the world, opposed by Christian students."},{"kind":"Bias","text":"Damascius was the theological opponent and moral accuser of this pragmatic rationalist."}],"hypotheses":[{"name":"Protective or teaching compromise","note":"Plausible, but the terms are not preserved."},{"name":"Denunciation of colleagues","note":"A suspicion that cannot be proved."},{"name":"Pure polemical distortion","note":"It does not explain his privileged survival."}],"open":"No contract and no direct reply survive."},"asclepiodotus-bias":{"title":"Why does Damascius attack Asclepiodotus so fiercely?","status":"open","question":"Is the criticism philosophical, personal, or institutional?","evidence":[{"kind":"Admiration","text":"Damascius preserves an exceptional number of technical achievements and adventures."},{"kind":"Philosophy","text":"He accuses Asclepiodotus of reducing the invisible to visible analogies."},{"kind":"Dependence","text":"Asclepiodotus helped Damascius during a critical period."},{"kind":"Imitation","text":"Damascius’ reforms resemble the building of the centre at Aphrodisias."}],"hypotheses":[{"name":"Defence against a rival ideal of philosophy","note":"Empirical polymathy threatens Damascius’ hierarchy of intuition."},{"name":"Personal ambivalence and obligation","note":"Gratitude and distancing explain the unusual detail."},{"name":"Purely objective criticism","note":"Too weak to explain the emotional intensity."}],"open":"Asclepiodotus’ own writings are lost."},"harran-case":{"title":"Did the philosophers live in Harran after their return?","status":"disputed","question":"Can Harran be regarded as a late refuge of the Athenian school?","evidence":[{"kind":"Treaty","text":"Agathias reports a guarantee of freedom of conviction after their return."},{"kind":"Place","text":"Harran remained strongly pagan and lay on a plausible route."},{"kind":"Gap","text":"No direct source says that they settled there permanently."}],"hypotheses":[{"name":"Long-term refuge","note":"Stimulating, but more reconstructed than demonstrated."},{"name":"Brief stay","note":"Geographically and religiously plausible."},{"name":"Return to different places","note":"The most economical assumption."}],"open":"Direct evidence of residence is missing."},"isidore-diadochus":{"title":"Was Isidore really a successor?","status":"open","question":"Did he lead the school or hold only an honorary status?","evidence":[{"kind":"Damascius","text":"Isidore was elected successor in honour rather than in actual office."},{"kind":"Title history","text":"Photius’ title Life of Isidore encouraged later assumptions about succession."},{"kind":"Institution","text":"Secondary or parallel successor status is conceivable."}],"hypotheses":[{"name":"Honorary successor without leadership","note":"Best fits the explicit wording."},{"name":"Short-term head","note":"Not impossible, but poorly attested."},{"name":"Travelling freelance successor","note":"Athanassiadi’s suggestive reconstruction."}],"open":"Chronology and terminology remain imprecise."},"heraiscus-interpolation":{"title":"Which Heraiscus anecdotes come from Damascius?","status":"text-critical","question":"Did the Suda excerptor add sensational details?","evidence":[{"kind":"Transmission","text":"The menstruation anecdote is absent from Photius."},{"kind":"Style","text":"It reads like an explanatory intensification of a purity motif."},{"kind":"Core","text":"Other reports of sacred perception are multiply anchored."}],"hypotheses":[{"name":"Suda explanation rather than original sentence","note":"Athanassiadi considers intervention possible."},{"name":"Original sentence omitted by Photius","note":"Epitomes often remove side details."}],"open":"The lost full manuscript would decide the issue."},"house-case":{"title":"Was the house near the Areopagus Damascius’ school?","status":"disputed","question":"How far do architecture, location, and finds support a personal identification?","evidence":[{"kind":"Archaeology","text":"A wealthy late-antique house suits a philosophical school milieu."},{"kind":"Context","text":"Damascius reformed a materially equipped institution."},{"kind":"Caution","text":"Athanassiadi explicitly avoids stating the identification as fact."}],"hypotheses":[{"name":"House of Damascius or his school","note":"Tempting, but not secured by an inscription."},{"name":"Another philosophical-pagan town house","note":"The more general identification is stronger."}],"open":"No naming inscription or chain of ownership survives."},"anthusa-case":{"title":"Prediction or retrospective construction?","status":"open","question":"How did Anthusa’s cloud vision become linked to the killing of Aspar?","evidence":[{"kind":"Historical core","text":"Aspar and Ardabur were attacked in 471; Aspar was killed."},{"kind":"Narrative form","text":"The cloud figures form a clear political allegory."},{"kind":"Transmission","text":"Damascius writes decades later and probably at second hand."}],"hypotheses":[{"name":"Real vision, interpreted later","note":"Psychologically plausible, historically untestable."},{"name":"Retrospective divinatory legend","note":"A common form of political portent story."},{"name":"Deliberate invention","note":"No source permits a judgement about motive."}],"open":"The date of the first version is unknown."},"hegias-case":{"title":"Courageous restorer or dangerous activist?","status":"value-dependent","question":"How should religious visibility be judged under persecution?","evidence":[{"kind":"Action","text":"Hegias restored sanctuaries and renewed rites."},{"kind":"Damascius","text":"His zeal was imprudent and drew enemies against the community."},{"kind":"Isidore","text":"Theurgy presupposes human and philosophical maturity."}],"hypotheses":[{"name":"Moral courage with strategic errors","note":"Reconciles both sides."},{"name":"Self-dramatising piety","note":"Suggested, not proved."}],"open":"The views of the local cult communities are missing."}},"wonders":{"animated-statues":{"title":"Animated and inert statues","category":"Cult objects","report":"Heraiscus reacts bodily only to statues believed to be divinely animated.","meaning":"The purified human being functions as a sensor of sacred presence.","natural":"Suggestion, ritualised bodily response, or hagiography.","reliability":"medium"},"aion-union":{"title":"Aion as Osiris and Adonis","category":"Theology","report":"An Alexandrian statue is recognised as the mystical unity of several gods.","meaning":"Local cults are understood as a real theological union.","natural":"Religious-historical syncretism.","reliability":"high as evidence for an interpretation"},"mystical-birth":{"title":"Heraiscus’ finger of silence","category":"Body","report":"He was said to have been born with a finger attached to his lip, like Harpocrates.","meaning":"Biography is read through a divine iconographic pattern.","natural":"Congenital anomaly plus mythological interpretation.","reliability":"low"},"cloud-divination":{"title":"Anthusa’s cloud divination","category":"Divination","report":"Clouds form a Goth and a lion; the image is linked to Aspar’s death.","meaning":"Cosmic images comment on imperial politics.","natural":"Pareidolia and retrospective interpretation.","reliability":"medium"},"water-scrying":{"title":"Scrying in a glass of water","category":"Divination","report":"A holy woman sees future events in clear water; Damascius claims personal experience.","meaning":"Purity of medium and seer mirror one another.","natural":"Scrying, expectation effects, selective memory.","reliability":"medium"},"stygian-water":{"title":"Offerings in the Styx","category":"Sacred landscape","report":"Light offerings sink and heavy ones float, depending on divine approval.","meaning":"A natural place acts as oracle and court.","natural":"Current, shape, density, and selective observation.","reliability":"medium"},"oath-dropsy":{"title":"Dropsy after perjury","category":"Sacred landscape","report":"A false oath at the Styx water is said to bring death by dropsy within a year.","meaning":"Law, body, and deity form a system of sanctions.","natural":"Social control and remembered cases.","reliability":"low"},"phantom-battle":{"title":"Dead souls continuing the battle","category":"Apparitions","report":"The fallen continue as visible and audible phantoms; similar places are compared.","meaning":"Violence marks landscapes beyond death.","natural":"Light effects, sounds, collective memory.","reliability":"low"},"electric-sparks":{"title":"Sparks from body and clothing","category":"Natural phenomenon","report":"Damascius observes crackling sparks and flame-like light while dressing.","meaning":"Rare physics can also be read as an omen.","natural":"Tribo-electric discharge.","reliability":"high as a possible observation"},"gorgon-plant":{"title":"The Gorgon plant","category":"Natural history","report":"Severus sees a root shaped like a girl’s head with serpentine hair.","meaning":"Nature produces iconic likenesses to mythical figures.","natural":"Anthropomorphic root form and pareidolia.","reliability":"medium"},"seven-headed-snakes":{"title":"Seven-headed snakes","category":"Ethnography","report":"Brahmans report enormous seven-headed snakes and one-legged people.","meaning":"The distant world becomes a reservoir of marvels.","natural":"Traditional motifs of travel literature.","reliability":"very low"},"cave-gas":{"title":"The lethal vapour of Hierapolis","category":"Natural phenomenon","report":"A subterranean passage kills living beings; Asclepiodotus enters with improvised breathing protection.","meaning":"Sacred danger is investigated both ritually and experimentally.","natural":"Carbon dioxide or other volcanic gases.","reliability":"high in its core"},"attis-dream":{"title":"Damascius as Attis","category":"Dream","report":"At Hierapolis Damascius dreams that he celebrates the Hilaria as Attis and is saved from death.","meaning":"Personal crisis is integrated into a myth of death and return.","natural":"A dream shaped by ritual knowledge.","reliability":"high as self-report"},"eshmun":{"title":"Eshmun’s castration and deification","category":"Myth","report":"The pursued youth mutilates himself; Astronoe revives him and makes him a healing god.","meaning":"Healing arises through death, warmth, and transformation.","natural":"Local cult aetiology.","reliability":"high as a report of myth"},"animal-omens":{"title":"Oryx, Sirius, and the moon-ape","category":"Animal symbolism","report":"The oryx announces Sirius by sneezing; an ape reacts to the conjunction of sun and moon.","meaning":"Animal behaviour is read as cosmic writing.","natural":"Seasonal behaviour or symbolic construction.","reliability":"low"},"ring-continence":{"title":"The ring of continence","category":"Ritualised ethics","report":"Theosebius gives his wife a ring as a sign of voluntary continence.","meaning":"An object materialises a new ethical contract.","natural":"A social and psychological mechanism of commitment.","reliability":"high"},"syncretic-exorcism":{"title":"Helios and the God of the Jews","category":"Ritual","report":"Theosebius invokes both powers in an exorcism.","meaning":"Practical religion crosses confessional boundaries.","natural":"Syncretic incantatory practice.","reliability":"medium"},"serapis-departure":{"title":"Sarapis leaves the temple","category":"Prophecy","report":"Olympos foretells the god’s withdrawal from the temple.","meaning":"The destruction of a temple is understood as the deity’s own departure.","natural":"Theological processing of an expected collapse.","reliability":"medium"}},"fragments":{"f111":{"title":"Sarapio’s two or three books","status":"reconstructed fragment","paraphrase":"Sarapio owns almost no books, lives alone, and directs thought toward the inward and indivisible.","notes":"A key text in the critique of a mere multiplicity of opinions.","verificationCue":"Two or three books; Orpheus; Isidore as intellectual heir.","witness":"Photius + Suda"},"f85b":{"title":"220 trials on the monochord","status":"reconstructed fragment","paraphrase":"Asclepiodotus tries to reconstruct the lost enharmonic scale by systematic variation.","notes":"A rare source for experimental musical archaeology.","verificationCue":"220 changes on the monochord and the loss of the enharmonic diesis.","witness":"Photius + Suda"},"f87a":{"title":"Descent into the poisonous passage","status":"Photius excerpt","paraphrase":"Asclepiodotus protects his breathing with his cloak and enters a lethal subterranean space.","notes":"Sacred topography, self-experiment, and natural observation.","verificationCue":"Hierapolis, lethal vapours, cloak over the nostrils, artificially produced vapour.","witness":"Photius; parallel in the Suda"},"f52":{"title":"Anthusa’s cloud divination","status":"Photius excerpt","paraphrase":"A woman develops a new form of political divination from a cloud vision.","notes":"The attribution of an invention is unusually explicit.","verificationCue":"Anthusa, prayer to the sun, cloud-man and lion, death of Aspar.","witness":"Photius"},"f46":{"title":"Theosebius’ exorcism","status":"Photius excerpt","paraphrase":"Theosebius invokes Helios and the God of the Jews against a demon.","notes":"Practical religious border crossing.","verificationCue":"Exorcism through the rays of Helios and the God of the Jews.","witness":"Photius"},"f41":{"title":"The last transmitters of the mysteries","status":"Suda excerpt","paraphrase":"Epiphanius and Euprepius had still known people formed by the old way of life.","notes":"A micro-theory of broken tradition.","verificationCue":"Epiphanius and Euprepius as transmitters of ancient narratives.","witness":"Suda"},"f42":{"title":"Olympos as teacher of religion","status":"reconstructed fragment","paraphrase":"Olympos teaches ancestral rites while their social world is already collapsing.","notes":"A sociology of the end of a cult.","verificationCue":"Olympos as teacher of rites; Sarapis will leave the temple.","witness":"Photius + Suda"},"f76":{"title":"Heraiscus and the animated statue","status":"reconstructed fragment","paraphrase":"Heraiscus was said to distinguish ritually effective images from merely material statues.","notes":"Some details may have been expanded by the Suda excerptor.","verificationCue":"Distinction between animated and inert statues; Aion as Osiris and Adonis.","witness":"Photius + Suda"},"f51d":{"title":"Brahmans between cities and mountains","status":"Photius excerpt","paraphrase":"The Indian guests describe themselves as inhabitants of two worlds and as mediators.","notes":"Their social function matters more than the marvellous ethnography.","verificationCue":"Brahmans as brokers between mountain ascetics and cities.","witness":"Photius"},"f56":{"title":"Aedesia’s economy of care","status":"Suda excerpt","paraphrase":"Aedesia assists the needy even into debt and organises her sons’ education.","notes":"Institutional history from the perspective of material reproduction.","verificationCue":"Charity, debt, and the preservation of her sons’ philosophical education.","witness":"Suda"},"f84e":{"title":"Iacobus as an Asclepian soul","status":"Suda excerpt","paraphrase":"The physician is described as naturally healing and akin to the divine patron of his art.","notes":"Mastery of an art as ontological assimilation.","verificationCue":"Iacobus as an Asclepian soul with an innate power to heal.","witness":"Suda"},"f38a":{"title":"Marinus burns his Philebus commentary","status":"Photius excerpt","paraphrase":"After Isidore’s brief criticism Marinus destroys his unpublished commentary.","notes":"Textual loss through internal norms of quality and authority.","verificationCue":"Marinus burns the commentary after Isidore’s judgement.","witness":"Photius"},"f97":{"title":"Parmenides: species or gods?","status":"reconstructed fragment","paraphrase":"Marinus reads Plato’s hypotheses as a theory of species; Isidore defends the theological interpretation.","notes":"Exegetical conflict as identity politics.","verificationCue":"Marinus: species rather than gods; Isidore’s rebuttal.","witness":"Photius + Suda"},"f124":{"title":"Virtue must act","status":"reconstructed fragment","paraphrase":"Political practice tests virtue; discourse without action remains empty.","notes":"A correction to the image of world-fleeing Neoplatonists.","verificationCue":"Political practice tests virtue; words without deeds are empty.","witness":"Photius + Suda"},"f118b":{"title":"Ammonius’ agreement","status":"Photius excerpt","paraphrase":"Ammonius reaches an agreement with the overseer of the prevailing religion.","notes":"Its contents are lost; stronger accusations remain hypotheses.","verificationCue":"An agreement with the overseer of the prevailing religion.","witness":"Photius"},"f117":{"title":"Torture and silence","status":"Suda excerpt","paraphrase":"Horapollo and Heraiscus withstand torture and do not betray those being hunted.","notes":"Crisis as moral epistemology.","verificationCue":"Horapollo and Heraiscus remain silent under torture.","witness":"Suda"},"f43e":{"title":"Hypatia and the political city","status":"Suda excerpt","paraphrase":"Hypatia is described as dialectical, wise, and politically intelligent; her murder as barbaric violence.","notes":"The separate fragment PH 106A contrasts Isidore as a “true philosopher” with Hypatia as a mathematician. This card presents PH 43E.","verificationCue":"Hypatia’s political intelligence, Cyril’s envy, and her murder.","witness":"Suda"},"f142b":{"title":"The local myth of Eshmun","status":"Photius excerpt","paraphrase":"Eshmun is revived by Astronoe’s life-giving warmth and made a god.","notes":"Possibly a nearly oral local tradition.","verificationCue":"Astronoe revives Eshmun with life-giving warmth and deifies him.","witness":"Photius"},"f135":{"title":"The Styx in the borderlands","status":"Photius excerpt","paraphrase":"A waterfall serves as oracle, guarantor of oaths, and sacred natural phenomenon.","notes":"Geography, law, and religion remain inseparable.","verificationCue":"The Arabian Styx, accepted or rejected offerings, and perjury.","witness":"Photius"},"f50":{"title":"Phantom battles","status":"Photius excerpt","paraphrase":"Fallen warriors appear at several places continuing their combat.","notes":"Paradoxography with a comparative impulse.","verificationCue":"Souls fight for three days; comparable phantom battles elsewhere.","witness":"Photius"},"f51a":{"title":"Tribo-electric omens","status":"Photius excerpt","paraphrase":"Crackling sparks leap from Damascius’ body and clothing as he changes.","notes":"A plausible natural observation in a divinatory frame.","verificationCue":"Sparks while dressing; clothes shine without burning.","witness":"Photius; parallel in the Suda"},"f145":{"title":"Hegias’ secret restorations","status":"Photius excerpt","paraphrase":"Hegias renews sanctuaries; Damascius regards the effect as dangerous.","notes":"Piety is measured by strategic judgement.","verificationCue":"Hegias secretly revives rites and long-dormant sanctuaries or cult customs.","witness":"Photius"},"f150":{"title":"First human, then god","status":"Photius excerpt","paraphrase":"Isidore demands philosophical and human maturity before theurgy.","notes":"Internal pagan criticism of ritual activism.","verificationCue":"Isidore to Hegias: those who are to become gods must first become human.","witness":"Photius"},"zosime-epi":{"title":"Zosime’s funerary epigram","status":"external self-testimony","paraphrase":"The dead woman had been enslaved only in body; now the body too finds freedom.","notes":"Not a fragment of the work, but central to Damascius’ late biography.","verificationCue":"Funerary epigram: formerly enslaved only in body, now bodily free as well.","witness":"Inscription + Greek Anthology"}},"glossary":{"Kronisches Leben":{"term":"Cronian life","definition":"A way of life governed by reason, unity, and inward concentration; Sarapio is its ideal figure."},"Typhonisches Leben":{"term":"Typhonian life","definition":"Fragmentation through appetite, ambition, falsehood, and social violence."},"Bacchus":{"term":"Bacchus","definition":"A metaphor for the true philosopher who unites philosophical insight and hieratic experience."},"Theurgie":{"term":"Theurgy","definition":"Ritual practice intended to raise the soul through divine symbols and causes."},"Diadochos":{"term":"Successor","definition":"The successor or head of a philosophical school: both spiritual rank and contested office."},"Polydoxia":{"term":"Polydoxy","definition":"A multiplicity of opinions; the danger of undirected learning from books and hearsay."},"Genesis":{"term":"Generation","definition":"The realm of becoming and embodiment, opposed to intelligible being and unity."},"Eumoiria":{"term":"Eumoiria","definition":"Innate fortunate intuition or exceptional natural endowment."},"Patria":{"term":"Patria","definition":"Local traditions and stories of origins and places."},"Paradoxa":{"term":"Paradoxa","definition":"Reports of marvels and anomalies; in Damascius, a mode of inquiry."},"Prosopographie":{"term":"Prosopography","definition":"History through networks of persons, families, schools, and offices."},"Suda":{"term":"Suda","definition":"A tenth-century Byzantine lexicon preserving many fragments of Damascius."},"Photios-Epitome":{"term":"Photius’ epitome","definition":"The most important continuous witness to the lost work."},"Hellenismus":{"term":"Hellenism","definition":"A pagan religious-philosophical way of life, not merely language or education."},"Heilige Geographie":{"term":"Sacred geography","definition":"Landscapes, springs, caves, and cities as bearers of divine presence."},"Rhetorik":{"term":"Rhetoric","definition":"A necessary technique, but dangerous when career and display displace truth."}},"sources":{"athanassiadi":{"title":"Polymnia Athanassiadi, Damascius: The Philosophical History","type":"Modern edition","note":"Basis for the project’s bibliographic orientation: reconstructed Greek text, English translation, commentary, testimonia, and appendices. No modern translation or commentary is reproduced in this public app.","date":"1999"},"photius-source":{"title":"Photius, Bibliotheca, Codex 242","type":"Byzantine epitome","note":"The chief continuous witness; it abbreviates and evaluates the work from a Christian perspective.","date":"9th c."},"suda-source":{"title":"The Suda","type":"Lexicographical excerpts","note":"Preserves additional pieces, often stripped of original sequence and context.","date":"10th c."},"marinus-source":{"title":"Marinus, Life of Proclus","type":"Near-contemporary hagiography","note":"A comparative source for the Athenian school and the image of Proclus.","date":"late 5th c."},"zacharias-source":{"title":"Zacharias of Mytilene, Life of Severus / Ammonius","type":"Christian parallel source","note":"Allows the Alexandrian school milieu to be read from another side.","date":"5th/6th c."},"agathias-source":{"title":"Agathias, Histories II","type":"Historical parallel source","note":"Principal source for the Persian journey and the guarantee of return.","date":"6th c."},"socrates-source":{"title":"Socrates Scholasticus, Ecclesiastical History VII.15","type":"Historical parallel source","note":"An earlier source for the murder of Hypatia.","date":"5th c."},"inscriptions-source":{"title":"Inscriptions and papyri","type":"Documentary sources","note":"Including the epigram for Zosime and evidence from Aphrodisias.","date":"Late antiquity"}},"routes":{"r1":{"kind":"flight / journey","note":"Flight and travel after the Alexandrian crisis; the exact sequence is reconstructed from fragments.","certainty":"reconstructed"},"r2":{"kind":"journey","note":"Continuation of the journey into the Syrian-Arabian region.","certainty":"reconstructed"},"r3":{"kind":"sacred journey","note":"Route towards local cults and sacred landscapes.","certainty":"reconstructed"},"r4":{"kind":"sacred journey","note":"Short connection between Damascus and Heliopolis/Baalbek."," e und Damascius’ Werk sind gemeinfrei; die App verwendet jedoch keine vollständige moderne Edition.","Moderne englische Übersetzung, Kommentar, Einleitung, kritischer Apparat und Seitenbilder werden nicht reproduziert.","Alle deutschen und englischen Erläuterungen sind eigenständige redaktionelle Paraphrasen. Kurze griechische Wendungen dienen der Identifikation und Kommentierung der jeweiligen Quelle.","Szenenbilder, Personenmedaillons, Symbole und Animationen sind eigens programmierte SVG/CSS-Visualisierungen. Die Atlasgeometrie beruht auf gemeinfreien Natural-Earth-Daten und wurde für diese App neu gestaltet und annotiert.","Die optionale PDF-Auswahl geschieht ausschließlich lokal im Browser. Die App enthält, lädt und überträgt keine PDF.","Code: MIT-Lizenz. Eigenständige App-Texte und originale SVG/CSS-Visualisierungen: CC BY 4.0 unter der Attribution „Damascius Atlas, 2026“. Die eingebettete Natural-Earth-Geometrie bleibt Public Domain; bibliographische Fakten und gemeinfreie antike Inhalte werden nicht beansprucht.","Die Küsten- und Landgeometrien der Atlasansicht beruhen auf Natural Earth, dessen Raster- und Vektordaten als Public Domain freigegeben sind. Die kartographische Gestaltung und Annotationen dieser App sind neu erstellt."],"caveat":"Dies ist eine konservative Publikationsstrategie, keine individuelle Rechtsberatung."},"en":{"headline":"Copyright-conscious public edition","intro":"This build is designed for public hosting without distributing the modern Athanassiadi edition or any downloaded PDF.","points":["Ancient names, events, and Damascius’ work are in the public domain; the app does not reproduce a complete modern edition.","The modern English translation, commentary, introduction, critical apparatus, and page images are not reproduced.","All German and English explanations are independent editorial paraphrases. Short Greek phrases identify and support discussion of the source passage.","Scene images, person medallions, symbols, and animations are original SVG/CSS visualisations. The atlas geometry is based on public-domain Natural Earth data and has been newly styled and annotated for this app.","The optional PDF picker operates only inside the browser. The app contains, fetches, and uploads no PDF.","Code: MIT License. Independent app prose and original SVG/CSS artwork: CC BY 4.0 with the attribution “Damascius Atlas, 2026”. Embedded Natural Earth geometry remains in the public domain; no claim is made over bibliographic facts or public-domain ancient material.","The land and coastline geometries in the atlas view are based on Natural Earth, whose raster and vector data are released into the public domain. The cartographic design and annotations in this app are newly created."],"caveat":"This is a conservative publication strategy, not individual legal advice."}},"relationshipLabelsEn":{"Schüler / Lehrer":"student / teacher","geistige Verwandtschaft":"spiritual kinship","Lehrer":"teacher","Lehrer / Nachfolger":"teacher / successor","Lehrer / eigenwilliger Schüler":"teacher / independent pupil","Lehrer und Kritiker":"teacher and critic","Mutter / institutionelle Förderin":"mother / institutional patron","Familien- und Schulkreis":"family and school circle","Kollegen im Schulmilieu":"colleagues in the school milieu","Schulmilieu":"school milieu","junger Redner der Grabrede":"young author of her funeral speech","Bewunderung und Polemik":"admiration and polemic","politischer Kompromiss?":"political compromise?","theologische Ausbildung":"theological training","Schülerin / Auftraggeberin":"student / commissioner","Schülerin":"student","Gastgeber":"host","Ritualkollegen":"ritual colleagues","Exzerptor / überlieferter Autor":"excerptor / transmitted author","Verfasser des Grabepigramms":"author of the funerary epigram","Brüder":"brothers"},"routeLabelsEn":{"Flucht / Reise":"flight / journey","Reise":"journey","Sakrale Reise":"sacred journey","Exilroute, hypothetisch":"hypothetical exile route","Exilroute":"exile route","Rückkehrhypothese":"hypothesised return","mögliche letzte Reise":"possible final journey"},"commonEn":{"hoch":"high","mittel":"medium","niedrig":"low","sehr niedrig":"very low","offen":"open","umstritten":"disputed","textkritisch":"text-critical","wertungsabhängig":"value-dependent","Philosoph":"Philosopher","Frau":"Woman","Ritual":"Ritual","Wissenschaft":"Science","Medizin":"Medicine","Lehrer":"Teacher","Askese":"Asceticism","Metropole":"Metropolis","Heiligtum":"Sanctuary","Schulzentrum":"School centre","Philosophisches Zentrum":"Philosophical centre","Heilige Landschaft":"Sacred landscape","Herkunftsort":"Place of origin","Heilige Stadt":"Sacred city","Stadt und Kultort":"City and cult site","Provinzhauptstadt":"Provincial capital","Bildungszentrum":"Educational centre","Sakrale Heimat":"Sacred homeland","Grenzstadt":"Frontier city","Sassanidische Hauptstadt":"Sasanian capital","Kaiserliche Hauptstadt":"Imperial capital","Imperiale Erinnerung":"Imperial memory","Kultlandschaft":"Cult landscape","Fernraum":"Distant region"},"homeIntro":{"de":{"lead":"Damascius’ Philosophische Geschichte ist weder eine gewöhnliche Biographie noch eine systematische Philosophiegeschichte. Das verlorene Werk, heute vor allem durch Photios und die Suda fragmentarisch bewahrt, führt in die dichten Lebenswelten des 5. und frühen 6. Jahrhunderts: Schulen und Familien, Kultgemeinschaften und Reisewege, politische Konflikte, Freundschaften, Abhängigkeiten und Verrat.","paragraphs":["Neben berühmten Philosophen erscheinen Witwen, Ärzte, Ritualexperten, Gastgeber, versklavte Menschen, Reisende und beinahe vergessene Mittlerfiguren. Dadurch entsteht weniger ein Pantheon großer Denker als eine moralische Ethnographie einer untergehenden Intelligenzija: Damascius fragt immer wieder, ob Einsicht, Lebensform und Handeln unter Druck zusammenpassen.","Für heutige Leser ist diese Welt nicht nur wegen ihrer Fremdheit interessant. Sie stellt erstaunlich gegenwärtige Fragen: Wie überleben Wissensgemeinschaften unter politischem und religiösem Druck? Wann ist Anpassung Klugheit und wann Verrat? Wie hängen Erkenntnis, institutionelle Macht, materielle Fürsorge und soziale Netzwerke zusammen? Und was geschieht mit einem Werk, das nur in Auszügen, Zitaten und späteren Rekonstruktionen fortlebt?","Der Atlas macht diese Fragen räumlich und quellenkritisch sichtbar. Er trennt antiken Bericht, Überlieferungszeugen, moderne Rekonstruktion und eigene Interpretation. Wundererzählungen werden weder als Tatsachen behauptet noch als bloßer Aberglaube abgetan; sie erscheinen als Bestandteile einer historischen Erfahrungswelt, deren Kategorien nicht mit unseren heutigen Disziplingrenzen übereinstimmen."],"why":[{"title":"Institutionen unter Druck","text":"Die Schule ist Unterrichtsort, Familie, Karriereweg, Kultgemeinschaft und Schutznetz zugleich. Ihr Zerfall zeigt, wie verletzlich Wissen wird, wenn die soziale Infrastruktur zerbricht."},{"title":"Konkurrierende Formen des Wissens","text":"Experiment, Mathematik, Ritual, Vision, mündliche Tradition und philosophische Intuition stehen nebeneinander und werden von Damascius hierarchisiert."},{"title":"Erinnerung aus Fragmenten","text":"Photios, Suda und moderne Editionen bewahren das Werk, verändern aber zugleich seine Form. Quellenkritik wird dadurch selbst zum Gegenstand der App."}]},"en":{"lead":"Damascius’ Philosophical History is neither an ordinary biography nor a systematic history of philosophy. The lost work, now preserved mainly in fragments through Photius and the Suda, opens onto the dense lifeworlds of the fifth and early sixth centuries: schools and families, cult communities and journeys, political conflicts, friendships, dependencies, and betrayal.","paragraphs":["Alongside famous philosophers appear widows, physicians, ritual specialists, hosts, enslaved people, travellers, and nearly forgotten mediators. The result is less a pantheon of great thinkers than a moral ethnography of a disappearing intelligentsia: Damascius repeatedly asks whether insight, way of life, and action remain coherent under pressure.","For modern readers this world matters for more than its strangeness. It raises strikingly current questions: How do communities of knowledge survive political and religious pressure? When is accommodation prudent, and when is it betrayal? How are knowledge, institutional power, material care, and social networks connected? What happens to a work that survives only through excerpts, quotations, and later reconstruction?","The atlas makes these questions spatial and source-critical. It distinguishes ancient report, textual witness, modern reconstruction, and its own interpretation. Marvel stories are neither asserted as facts nor dismissed as mere superstition; they are examined as elements of a historical world of experience whose categories do not match modern disciplinary boundaries."],"why":[{"title":"Institutions under pressure","text":"A school is simultaneously a place of teaching, a family, a career structure, a cult community, and a protective network. Its breakdown shows how vulnerable knowledge becomes when social infrastructure collapses."},{"title":"Competing forms of knowledge","text":"Experiment, mathematics, ritual, vision, oral tradition, and philosophical intuition coexist and are ranked by Damascius."},{"title":"Memory from fragments","text":"Photius, the Suda, and modern editions preserve the work while also changing its form. Source criticism therefore becomes part of the subject itself."}]}},"sourceLabels":{"de":{"Athanassiadi 1999, Introduction":"Athanassiadi 1999, Einleitung","Athanassiadi 1999, commentary":"Athanassiadi 1999, Kommentar","Athanassiadi 1999, Technicalities":"Athanassiadi 1999, Technische Hinweise","Athanassiadi 1999, Introduction; contrast PH 124":"Athanassiadi 1999, Einleitung; Kontrast PH 124","PH 134–142, reconstructed sequence":"PH 134–142, rekonstruierte Abfolge","Interpretative Analyse":"Interpretative Analyse","Kommentar zu PH 135":"Kommentar zu PH 135","Kommentar zu PH 142B":"Kommentar zu PH 142B","Kontrast PH 111 / PH 124":"Kontrast PH 111 / PH 124"},"en":{"Athanassiadi 1999, Introduction":"Athanassiadi 1999, Introduction","Athanassiadi 1999, commentary":"Athanassiadi 1999, commentary","Athanassiadi 1999, Technicalities":"Athanassiadi 1999, Technicalities","Athanassiadi 1999, Introduction; contrast PH 124":"Athanassiadi 1999, Introduction; contrast PH 124","PH 134–142, reconstructed sequence":"PH 134–142, reconstructed sequence","Interpretative Analyse":"Interpretative analysis","Kommentar zu PH 135":"Commentary on PH 135","Kommentar zu PH 142B":"Commentary on PH 142B","Kontrast PH 111 / PH 124":"Contrast PH 111 / PH 124"}},"map":{"basis":"Natural Earth low-resolution land geometries, public domain; transformed and restyled for this app.","regionalBounds":[8,26,48,46],"wideBounds":[8,5,92,46],"coordinatePolicy":"Approximate site centroids. Regions and disputed identifications are marked as such. No modern political boundaries are displayed."}};

function mapLabels(cfg){const set=state.mapMode==='regional'?labelsRegional:labelsWide;return set.regions.map(([n,lon,lat])=>{const [x,y]=project(lon,lat,cfg);const name=state.lang==='de'?({'Hellas':'Hellas','Asia Minor':'Kleinasien','Aegyptus':'Ägypten','Syria':'Syrien','Mesopotamia':'Mesopotamien','Arabia':'Arabien','Persia':'Persien','India':'Indien','Italia':'Italia'}[n]||n):n;return `<text class="region-label" x="${x}" y="${y}" text-anchor="middle">${esc(name)}</text>`}).join('')+set.seas.map(([n,lon,lat])=>{const [x,y]=project(lon,lat,cfg);const name=state.lang==='de'?({'Mediterraneum':'Mittelmeer','Aegean Sea':'Ägäis','Black Sea':'Schwarzes Meer','Red Sea':'Rotes Meer','Arabian Sea':'Arabisches Meer'}[n]||n):n;return `<text class="sea-label" x="${x}" y="${y}" text-anchor="middle">${esc(name)}</text>`}).join('')}
function routePath(r,cfg,i){const a=find(D.places,r.from),b=find(D.places,r.to);if(!a||!b||!inBounds(a,cfg)||!inBounds(b,cfg))return'';if(state.routeFilter!=='all'&&r.group!==state.routeFilter)return'';const [x1,y1]=project(a.lon,a.lat,cfg),[x2,y2]=project(b.lon,b.lat,cfg);const bend=Math.max(22,Math.min(90,Math.abs(x2-x1)*.13))*(i%2?1:-1);const cx=(x1+x2)/2,cy=(y1+y2)/2+bend;const hyp=r.certainty==='hypothetical'?' hyp':'';return `<path class="route ${r.group}${hyp}" data-route="${r.id}" d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}"/>`}
function mapNode(p,cfg){if(!inBounds(p,cfg))return'';const [x,y]=project(p.lon,p.lat,cfg),col=mapColors[p.mapCategory]||'#6aa7c7',dx=p.labelDx||10,dy=p.labelDy||-8,anchor=p.labelAnchor||'start';return `<g class="map-node" data-place="${p.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><line class="leader" x1="0" y1="0" x2="${dx*.72}" y2="${dy*.72}"/><circle class="pulse" r="13" stroke="${col}"/><circle r="5.5" fill="${col}"/><text x="${dx}" y="${dy}" text-anchor="${anchor}">${esc(placeName(p))}</text><title>${esc(placeName(p))} · ${fmtCoord(p)}</title></g>`}
function indiaInset(){const p=find(D.places,'india');return `<g transform="translate(790 418)"><rect class="inset-frame" width="285" height="205" rx="12"/><g transform="translate(3 10)"><path class="inset-land" d="${INSET_LAND}" transform="scale(1 .97)"/></g><text class="inset-label" x="18" y="25">${state.lang==='de'?'Indien: Herkunftsraum nicht präzisiert':'India: precise origin unspecified'}</text><g class="map-node" data-place="india" transform="translate(153 115)"><circle class="pulse" r="18" stroke="#85b889"/><circle r="6" fill="#85b889"/><text x="12" y="-8">${esc(placeName(p))}</text></g></g>`}
function mapSvg(){const cfg=MAPCFG[state.mapMode];const routes=D.routes.map((r,i)=>routePath(r,cfg,i)).join('');const nodes=D.places.map(p=>mapNode(p,cfg)).join('');return `<svg class="atlas-map" viewBox="0 0 ${cfg.w} ${cfg.h}" role="img" aria-label="${esc(state.lang==='de'?'Geografischer Atlas der Orte und Routen':'Geographic atlas of places and routes')}"><defs><linearGradient id="seaGrad" x2="0" y2="1"><stop stop-color="#11243a"/><stop offset="1" stop-color="#07111c"/></linearGradient><filter id="mapGlow"><feGaussianBlur stdDeviation="5"/></filter></defs><rect width="${cfg.w}" height="${cfg.h}" fill="url(#seaGrad)"/>${graticule(cfg)}<path class="coast-glow" d="${cfg.land}"/><path class="land" d="${cfg.land}"/>${mapLabels(cfg)}<g>${routes}</g><g>${nodes}</g>${state.mapMode==='regional'?indiaInset():''}</svg>`}
