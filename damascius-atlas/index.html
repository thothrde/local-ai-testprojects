","report":"Brahmans report enormous seven-headed snakes and one-legged people.","meaning":"The distant world becomes a reservoir of marvels.","natural":"Traditional motifs of travel literature.","reliability":"very low"},"cave-gas":{"title":"The lethal vapour of Hierapolis","category":"Natural phenomenon","report":"A subterranean passage kills living beings; Asclepiodotus enters with improvised breathing protection.","meaning":"Sacred danger is investigated both ritually and experimentally.","natural":"Carbon dioxide or other volcanic gases.","reliability":"high in its core"},"attis-dream":{"title":"Damascius as Attis","category":"Dream","report":"At Hierapolis Damascius dreams that he celebrates the Hilaria as Attis and is saved from death.","meaning":"Personal crisis is integrated into a myth of death and return.","natural":"A dream shaped by ritual knowledge.","reliability":"high as self-report"},"eshmun":{"title":"Eshmun’s castration and deification","category":"Myth","report":"The pursued youth mutilates himself; Astronoe revives him and makes him a healing god.","meaning":"Healing arises through death, warmth, and transformation.","natural":"Local cult aetiology.","reliability":"high as a report of myth"},"animal-omens":{"title":"Oryx, Sirius, and the moon-ape","category":"Animal symbolism","report":"The oryx announces Sirius by sneezing; an ape reacts to the conjunction of sun and moon.","meaning":"Animal behaviour is read as cosmic writing.","natural":"Seasonal behaviour or symbolic construction.","reliability":"low"},"ring-continence":{"title":"The ring of continence","category":"Ritualised ethics","report":"Theosebius gives his wife a ring as a sign of voluntary continence.","meaning":"An object materialises a new ethical contract.","natural":"A social and psychological mechanism of commitment.","reliability":"high"},"syncretic-exorcism":{"title":"Helios and the God of the Jews","category":"Ritual","report":"Theosebius invokes both powers in an exorcism.","meaning":"Practical religion crosses confessional boundaries.","natural":"Syncretic incantatory practice.","reliability":"medium"},"serapis-departure":{"title":"Sarapis leaves the temple","category":"Prophecy","report":"Olympos foretells the god’s withdrawal from the temple.","meaning":"The destruction of a temple is understood as the deity’s own departure.","natural":"Theological processing of an expected collapse.","reliability":"medium"}},"fragments":{"f111":{"title":"Sarapio’s two or three books","status":"reconstructed fragment","paraphrase":"Sarapio owns almost no books, lives alone, and directs thought toward the inward and indivisible.","notes":"A key text in the critique of a mere multiplicity of opinions.","verificationCue":"Two or three books; Orpheus; Isidore as intellectual heir.","witness":"Photius + Suda"},"f85b":{"title":"220 trials on the monochord","status":"reconstructed fragment","paraphrase":"Asclepiodotus tries to reconstruct the lost enharmonic scale by systematic variation.","notes":"A rare source for experimental musical archaeology.","verificationCue":"220 changes on the monochord and the loss of the enharmonic diesis.","witness":"Photius + Suda"},"f87a":{"title":"Descent into the poisonous passage","status":"Photius excerpt","paraphrase":"Asclepiodotus protects his breathing with his cloak and enters a lethal subterranean space.","notes":"Sacred topography, self-experiment, and natural observation.","verificationCue":"Hierapolis, lethal vapours, cloak over the nostrils, artificially produced vapour.","witness":"Photius; parallel in the Suda"},"f52":{"title":"Anthusa’s cloud divination","status":"Photius excerpt","paraphrase":"A woman develops a new form of political divination from a cloud vision.","notes":"The attribution of an invention is unusually explicit.","verificationCue":"Anthusa, prayer to the sun, cloud-man and lion, death of Aspar.","witness":"Photius"},"f46":{"title":"Theosebius’ exorcism","status":"Photius excerpt","paraphrase":"Theosebius invokes Helios and the God of the Jews against a demon.","notes":"Practical religious border crossing.","verificationCue":"Exorcism through the rays of Helios and the God of the Jews.","witness":"Photius"},"f41":{"title":"The last transmitters of the mysteries","status":"Suda excerpt","paraphrase":"Epiphanius and Euprepius had still known people formed by the old way of life.","notes":"A micro-theory of broken tradition.","verificationCue":"Epiphanius and Euprepius as transmitters of ancient narratives.","witness":"Suda"},"f42":{"title":"Olympos as teacher of religion","status":"reconstructed fragment","paraphrase":"Olympos teaches ancestral rites while their social world is already collapsing.","notes":"A sociology of the end of a cult.","verificationCue":"Olympos as teacher of rites; Sarapis will leave the temple.","witness":"Photius + Suda"},"f76":{"title":"Heraiscus and the animated statue","status":"reconstructed fragment","paraphrase":"Heraiscus was said to distinguish ritually effective images from merely material statues.","notes":"Some details may have been expanded by the Suda excerptor.","verificationCue":"Distinction between animated and inert statues; Aion as Osiris and Adonis.","witness":"Photius + Suda"},"f51d":{"title":"Brahmans between cities and mountains","status":"Photius excerpt","paraphrase":"The Indian guests describe themselves as inhabitants of two worlds and as mediators.","notes":"Their social function matters more than the marvellous ethnography.","verificationCue":"Brahmans as brokers between mountain ascetics and cities.","witness":"Photius"},"f56":{"title":"Aedesia’s economy of care","status":"Suda excerpt","paraphrase":"Aedesia assists the needy even into debt and organises her sons’ education.","notes":"Institutional history from the perspective of material reproduction.","verificationCue":"Charity, debt, and the preservation of her sons’ philosophical education.","witness":"Suda"},"f84e":{"title":"Iacobus as an Asclepian soul","status":"Suda excerpt","paraphrase":"The physician is described as naturally healing and akin to the divine patron of his art.","notes":"Mastery of an art as ontological assimilation.","verificationCue":"Iacobus as an Asclepian soul with an innate power to heal.","witness":"Suda"},"f38a":{"title":"Marinus burns his Philebus commentary","status":"Photius excerpt","paraphrase":"After Isidore’s brief criticism Marinus destroys his unpublished commentary.","notes":"Textual loss through internal norms of quality and authority.","verificationCue":"Marinus burns the commentary after Isidore’s judgement.","witness":"Photius"},"f97":{"title":"Parmenides: species or gods?","status":"reconstructed fragment","paraphrase":"Marinus reads Plato’s hypotheses as a theory of species; Isidore defends the theological interpretation.","notes":"Exegetical conflict as identity politics.","verificationCue":"Marinus: species rather than gods; Isidore’s rebuttal.","witness":"Photius + Suda"},"f124":{"title":"Virtue must act","status":"reconstructed fragment","paraphrase":"Political practice tests virtue; discourse without action remains empty.","notes":"A correction to the image of world-fleeing Neoplatonists.","verificationCue":"Political practice tests virtue; words without deeds are empty.","witness":"Photius + Suda"},"f118b":{"title":"Ammonius’ agreement","status":"Photius excerpt","paraphrase":"Ammonius reaches an agreement with the overseer of the prevailing religion.","notes":"Its contents are lost; stronger accusations remain hypotheses.","verificationCue":"An agreement with the overseer of the prevailing religion.","witness":"Photius"},"f117":{"title":"Torture and silence","status":"Suda excerpt","paraphrase":"Horapollo and Heraiscus withstand torture and do not betray those being hunted.","notes":"Crisis as moral epistemology.","verificationCue":"Horapollo and Heraiscus remain silent under torture.","witness":"Suda"},"f43e":{"title":"Hypatia and the political city","status":"Suda excerpt","paraphrase":"Hypatia is described as dialectical, wise, and politically intelligent; her murder as barbaric violence.","notes":"The separate fragment PH 106A contrasts Isidore as a “true philosopher” with Hypatia as a mathematician. This card presents PH 43E.","verificationCue":"Hypatia’s political intelligence, Cyril’s envy, and her murder.","witness":"Suda"},"f142b":{"title":"The local myth of Eshmun","status":"Photius excerpt","paraphrase":"Eshmun is revived by Astronoe’s life-giving warmth and made a god.","notes":"Possibly a nearly oral local tradition.","verificationCue":"Astronoe revives Eshmun with life-giving warmth and deifies him.","witness":"Photius"},"f135":{"title":"The Styx in the borderlands","status":"Photius excerpt","paraphrase":"A waterfall serves as oracle, guarantor of oaths, and sacred natural phenomenon.","notes":"Geography, law, and religion remain inseparable.","verificationCue":"The Arabian Styx, accepted or rejected offerings, and perjury.","witness":"Photius"},"f50":{"title":"Phantom battles","status":"Photius excerpt","paraphrase":"Fallen warriors appear at several places continuing their combat.","notes":"Paradoxography with a comparative impulse.","verificationCue":"Souls fight for three days; comparable phantom battles elsewhere.","witness":"Photius"},"f51a":{"title":"Tribo-electric omens","status":"Photius excerpt","paraphrase":"Crackling sparks leap from Damascius’ body and clothing as he changes.","notes":"A plausible natural observation in a divinatory frame.","verificationCue":"Sparks while dressing; clothes shine without burning.","witness":"Photius; parallel in the Suda"},"f145":{"title":"Hegias’ secret restorations","status":"Photius excerpt","paraphrase":"Hegias renews sanctuaries; Damascius regards the effect as dangerous.","notes":"Piety is measured by strategic judgement.","verificationCue":"Hegias secretly revives rites and long-dormant sanctuaries or cult customs.","witness":"Photius"},"f150":{"title":"First human, then god","status":"Photius excerpt","paraphrase":"Isidore demands philosophical and human maturity before theurgy.","notes":"Internal pagan criticism of ritual activism.","verificationCue":"Isidore to Hegias: those who are to become gods must first become human.","witness":"Photius"},"zosime-epi":{"title":"Zosime’s funerary epigram","status":"external self-testimony","paraphrase":"The dead woman had been enslaved only in body; now the body too finds freedom.","notes":"Not a fragment of the work, but central to Damascius’ late biography.","verificationCue":"Funerary epigram: formerly enslaved only in body, now bodily free as well.","witness":"Inscription + Greek Anthology"}},"glossary":{"Kronisches Leben":{"term":"Cronian life","definition":"A way of life governed by reason, unity, and inward concentration; Sarapio is its ideal figure."},"Typhonisches Leben":{"term":"Typhonian life","definition":"Fragmentation through appetite, ambition, falsehood, and social violence."},"Bacchus":{"term":"Bacchus","definition":"A metaphor for the true philosopher who unites philosophical insight and hieratic experience."},"Theurgie":{"term":"Theurgy","definition":"Ritual practice intended to raise the soul through divine symbols and causes."},"Diadochos":{"term":"Successor","definition":"The successor or head of a philosophical school: both spiritual rank and contested office."},"Polydoxia":{"term":"Polydoxy","definition":"A multiplicity of opinions; the danger of undirected learning from books and hearsay."},"Genesis":{"term":"Generation","definition":"The realm of becoming and embodiment, opposed to intelligible being and unity."},"Eumoiria":{"term":"Eumoiria","definition":"Innate fortunate intuition or exceptional natural endowment."},"Patria":{"term":"Patria","definition":"Local traditions and stories of origins and places."},"Paradoxa":{"term":"Paradoxa","definition":"Reports of marvels and anomalies; in Damascius, a mode of inquiry."},"Prosopographie":{"term":"Prosopography","definition":"History through networks of persons, families, schools, and offices."},"Suda":{"term":"Suda","definition":"A tenth-century Byzantine lexicon preserving many fragments of Damascius."},"Photios-Epitome":{"term":"Photius’ epitome","definition":"The most important continuous witness to the lost work."},"Hellenismus":{"term":"Hellenism","definition":"A pagan religious-philosophical way of life, not merely language or education."},"Heilige Geographie":{"term":"Sacred geography","definition":"Landscapes, springs, caves, and cities as bearers of divine presence."},"Rhetorik":{"term":"Rhetoric","definition":"A necessary technique, but dangerous when career and display displace truth."}},"sources":{"athanassiadi":{"title":"Polymnia Athanassiadi, Damascius: The Philosophical History","type":"Modern edition","note":"Basis for the project’s bibliographic orientation: reconstructed Greek text, English translation, commentary, testimonia, and appendices. No modern translation or commentary is reproduced in this public app.","date":"1999"},"photius-source":{"title":"Photius, Bibliotheca, Codex 242","type":"Byzantine epitome","note":"The chief continuous witness; it abbreviates and evaluates the work from a Christian perspective.","date":"9th c."},"suda-source":{"title":"The Suda","type":"Lexicographical excerpts","note":"Preserves additional pieces, often stripped of original sequence and context.","date":"10th c."},"marinus-source":{"title":"Marinus, Life of Proclus","type":"Near-contemporary hagiography","note":"A comparative source for the Athenian school and the image of Proclus.","date":"late 5th c."},"zacharias-source":{"title":"Zacharias of Mytilene, Life of Severus / Ammonius","type":"Christian parallel source","note":"Allows the Alexandrian school milieu to be read from another side.","date":"5th/6th c."},"agathias-source":{"title":"Agathias, Histories II","type":"Historical parallel source","note":"Principal source for the Persian journey and the guarantee of return.","date":"6th c."},"socrates-source":{"title":"Socrates Scholasticus, Ecclesiastical History VII.15","type":"Historical parallel source","note":"An earlier source for the murder of Hypatia.","date":"5th c."},"inscriptions-source":{"title":"Inscriptions and papyri","type":"Documentary sources","note":"Including the epigram for Zosime and evidence from Aphrodisias.","date":"Late antiquity"}},"routes":{"r1":{"kind":"flight / journey","note":"Flight and travel after the Alexandrian crisis; the exact sequence is reconstructed from fragments.","certainty":"reconstructed"},"r2":{"kind":"journey","note":"Continuation of the journey into the Syrian-Arabian region.","certainty":"reconstructed"},"r3":{"kind":"sacred journey","note":"Route towards local cults and sacred landscapes.","certainty":"reconstructed"},"r4":{"kind":"sacred journey","note":"Short connection between Damascus and Heliopolis/Baalbek.","certainty":"reconstructed"},"r5":{"kind":"journey","note":"Onward travel to the Phoenician coast.","certainty":"reconstructed"},"r6":{"kind":"journey","note":"A long travel segment to Asia Minor that can be reconstructed only broadly.","certainty":"reconstructed"},"r7":{"kind":"journey","note":"Transition into the Athenian school world.","certainty":"reconstructed"},"r8":{"kind":"hypothetical exile route","note":"A plausible large-scale route for the Persian journey; Harran as a specific stop or refuge remains hypothetical.","certainty":"hypothetical"},"r9":{"kind":"exile route","note":"Journey into the Sasanian realm.","certainty":"reconstructed"},"r10":{"kind":"hypothesised return","note":"Return movement after the peace treaty; the precise path and residences are not preserved.","certainty":"hypothetical"},"r11":{"kind":"possible final journey","note":"A possible later movement towards Syria, not a secure biographical fact.","certainty":"hypothetical"}},"insights":{"sarapio-minimal-library":{"title":"Sarapio: book poverty as an epistemology","thesis":"Sarapio’s two or three books are not merely a sign of ascetic poverty but a model of intellectual concentration against fragmentation by a mere multiplicity of borrowed opinions.","basis":"PH 111 portrays the nearly invisible Alexandrian recluse, his few books—including Orpheus—and his orientation toward the inward and indivisible.","analysis":"Damascius turns Sarapio into an instance of a “Cronian” life. The deliberately tiny library acts as a filter: texts matter when they enable recollection and unity, not simply when they increase erudition. An anti-academic ideal thus emerges inside a highly learned culture.","caution":"The reading of book poverty as a critique of polydoxia is sharpened by Athanassiadi’s introduction; it is an editorial interpretation of the portrait, not a verbatim doctrine of Sarapio.","category":"Persons and lives"},"asclepiodotus-rival-ideal":{"title":"Asclepiodotus: a rival ideal of intellectual greatness","thesis":"Damascius’ demotion of Asclepiodotus reveals how seriously he took the experimental polymath as a rival to his own ideal of the philosopher.","basis":"The fragments combine mathematics, musical experiment, medicine, natural observation, and the dangerous descent at Hierapolis with the charge that Asclepiodotus lacked corresponding insight into the intelligible.","analysis":"Two styles of knowledge collide: reconstruction through experiment, analogy, and observation; and truth through inward kinship and intellectual conversion. The detail with which Damascius preserves technical achievements while metaphysically subordinating them makes the tension visible.","caution":"The suggestion that fascination and resistance were psychologically intertwined is a grounded interpretation. Damascius does not state that motive explicitly.","category":"Knowledge and methods"},"anthusa-inventor":{"title":"Anthusa: a woman as inventor of a divinatory technique","thesis":"Anthusa appears not only as the recipient of a vision but as the developer of a repeatable form of cloud divination.","basis":"PH 52 narrates prayer, dream instruction, and the cloud figures of a Goth and a lion; Damascius then credits Anthusa with continuing the new practice.","analysis":"A woman is thereby made visible as a religious specialist and methodological innovator. The episode is placed alongside other extraordinary forms of knowledge, natural observations, and travel reports rather than being isolated as mere “women’s piety.”","caution":"The political reading of the clouds is retrospectively linked to the killing of Aspar. The app treats it as an ancient report, not as a confirmed prediction.","category":"Knowledge and methods"},"theosebius-practical-ethics":{"title":"Theosebius: practical ethics and religious multilingualism","thesis":"For Damascius, Theosebius is less a metaphysician than a credible practitioner of life: self-ordering, care, and continence matter more than theoretical rank.","basis":"PH 46B reports the exorcism invoking both the rays of Helios and the God of the Jews; PH 46E the voluntarily continent marriage and the “ring of continence.”","analysis":"The stories display an urban pagan asceticism that resembles Christian forms while remaining philosophically grounded. Religious efficacy also appears not as a closed confessional system but as a situational combination of powerful names and ethical authority.","caution":"The comparison with Epictetus is a modern characterization. The episode does not prove a systematic syncretistic theology.","category":"Persons and lives"},"mystery-mediators":{"title":"Epiphanius and Euprepius: the intermediate generation of tradition","thesis":"Traditions do not vanish in a single instant; a crucial role belongs to a generation no longer born into the old order but still personally acquainted with its last bearers.","basis":"PH 41 names Epiphanius and Euprepius as mediators of Egyptian, Aion, and “Persian” mysteries and stresses their contact with the preceding generation.","analysis":"They stand between lived self-evidence and antiquarian reconstruction. That intermediate position makes them cultural memory-bearers while revealing the fragility of transmission that depends on persons.","caution":"Athanassiadi’s identification of Epiphanius with an astronomer from Theon’s circle is plausible but not certain.","category":"Transmission and memory"},"olympos-religious-decline":{"title":"Olympos: religious decline as the loss of teachers","thesis":"A cult ends not only through prohibitions and temple destruction but when competent teachers can no longer produce a durable succession.","basis":"PH 42 depicts Olympos as a charismatic servant of Sarapis who instructs people in the old rites and finally announces that Sarapis will leave the temple.","analysis":"The portrait makes the decline of a religion visible as a social process: knowledge, persuasive authority, ritual competence, and institutional continuity must coincide. Olympos can still gather and teach, but no longer reproduce the community securely.","caution":"The departure of Sarapis belongs to Damascius’ religious interpretation. The sociological conclusion is a modern synthesis.","category":"Institutions and power"},"heraiscus-body-instrument":{"title":"Heraiscus: the sanctified body as an instrument of knowledge","thesis":"Heraiscus embodies an epistemology in which a purified person physically registers divine presence—an alternative to detached experiment.","basis":"PH 76 reports his response to “animated” statues, the interpretation of Aion as Osiris and Adonis, the Harpocrates sign at birth, and posthumous lights.","analysis":"The body is not an obstacle to knowledge but a resonant organ. In comparison with Asclepiodotus, two competing “instruments” emerge: experimental arrangement and sanctified person.","caution":"The menstruation anecdote is textually uncertain and may be an explanatory addition in the Suda excerpt. The app therefore separates it from more securely witnessed motifs.","category":"Knowledge and methods"},"brahmans-cultural-brokers":{"title":"The unnamed Brahmans as cultural brokers","thesis":"The historically most interesting figures in the India episode are not the fabulous mountain sages but the guests who mediate between ascetic groups and cities.","basis":"PH 51D describes Brahmans living in the house of Severus, their ascetic habits, their mediating role, and the marvel stories they relate.","analysis":"The episode presents Alexandria as a node of transregional communication. Personal encounter, ethnography, religious authority, and paradoxography merge. Mediation is a social practice, not merely the transmission of texts.","caution":"One-legged people and seven-headed snakes are presented as reported stories, not historical information about India.","category":"Transmission and memory"},"aedesia-infrastructure":{"title":"Aedesia: the invisible infrastructure of a philosophical dynasty","thesis":"Philosophical succession depends not only on teachers but on care, money, stipends, travel, and women’s organizational labour.","basis":"PH 56 describes Aedesia’s charity, her securing of the public allowance for her sons, and their education in Athens.","analysis":"After Hermeias’ death, Aedesia holds family, reputation, and education together. The material reproduction of a school becomes visible—a dimension usually excluded from linear lists of teachers.","caution":"The claim that Ammonius’ later school would not have existed without Aedesia is a plausible counterfactual, not something that can be proved.","category":"Institutions and power"},"iacobus-art-embodied":{"title":"Iacobus: when a physician becomes like his art","thesis":"Iacobus combines diagnostic mastery, social obligation, and religious interpretation in an ideal of embodied art.","basis":"PH 84E reports his confident prognosis, the duty to bring an accepted patient to real improvement, free treatment, and the “Asclepian” soul.","analysis":"Mastery is more than technique. A person wholly devoted to an art may become like its divine archetype. Medicine is simultaneously civic and moral practice: municipal salary, free care, and redistribution toward poor patients.","caution":"The Asclepian soul is Isidore’s interpretation within the ancient religious world, not a medical diagnosis.","category":"Persons and lives"},"eshmun-local-memory":{"title":"Eshmun: local mythology at the edge of disappearance","thesis":"The Beirut Eshmun narrative may preserve a rare local variant transmitted by Damascius through travel, conversation, and philosophical interpretation.","basis":"PH 142B tells of Eshmun’s self-castration, revival by Astronoe, and divinization as the “Eighth.”","analysis":"The myth joins sexuality, death, healing, and deification. The number eight can be related cosmologically to a sphere beyond the seven planets. Athanassiadi reads the narrative tone as relatively close to local oral tradition.","caution":"Oral proximity and the cosmological reading of eight are modern interpretations; no independent version of precisely this local story survives.","category":"Transmission and memory"},"styx-sacred-geography":{"title":"The Arabian Styx: landscape as law, oracle, and bodily judgment","thesis":"The Styx episode presents a sacred geography in which natural phenomenon, oath, law, body, and divine judgment are not separate domains.","basis":"PH 135 reports the waterfall, the counter-intuitive behaviour of light and heavy offerings, and dropsy as the punishment of perjury.","analysis":"Damascius and Isidore treat the landscape as a site where metaphysical order might become sensibly manifest. Their journey can be read as religious fieldwork: places are visited, tested, and connected with local traditions.","caution":"The app asserts neither the paradoxical behaviour of the offerings nor supernatural punishment as fact. “Religious fieldwork” is a modern analytical phrase.","category":"Knowledge and methods"},"phantom-battles-comparison":{"title":"Phantom battles: a typology of recurring anomalies","thesis":"Damascius does not merely preserve one ghost story; he compares geographically separated reports into a recurring type.","basis":"PH 50 links souls fighting for three days with other battlefield apparitions in several regions.","analysis":"The procedure begins with historical narrative, adds testimony, and arranges analogies. It is not modern critical science, but it is more than a single tale: a comparative paradoxography.","caution":"The reports do not confirm real battles among the dead. What is historically accessible is Damascius’ practice of collecting and typing extraordinary narratives.","category":"Knowledge and methods"},"electric-sparks-boundary":{"title":"Electric sparks: observation and omen at once","thesis":"A probably real triboelectric phenomenon can be, for Damascius, natural observation, anomaly, and portent simultaneously.","basis":"PH 51A reports sparks from a horse, from people, and from Damascius’ own clothing, sometimes with crackling and flame-like light without burning.","analysis":"The episode warns against projecting modern boundaries between physics, curiosity collecting, and divination backward. An observation can be precise and still enter a religious framework of meaning.","caution":"“Triboelectric” is the plausible modern explanation for some descriptions; it does not prove that every transmitted detail was observed exactly.","category":"Knowledge and methods"},"ammonius-survival":{"title":"Ammonius: betrayal, compromise, or institutional survival?","thesis":"Ammonius forces moral judgment and institutional consequence apart: a suspicious compromise may also have preserved philosophical teaching.","basis":"PH 117–118 connects torture and flight in the circle with Ammonius’ agreement with the representative of the prevailing doctrine; the terms are lost.","analysis":"Damascius explains Ammonius through greed. Alternatively, one may imagine a scientifically oriented teacher who secured a protective or curricular compromise. His continued professional activity is more certain than his motives or the content of the agreement.","caution":"No contract survives, and there is no proof that Ammonius disclosed hiding places. Stronger judgments remain hypotheses.","category":"Institutions and power"},"active-virtue":{"title":"Virtue must prove itself in action","thesis":"Damascius rejects purely inactive virtue: political and existential stress reveals whether philosophical habits genuinely hold.","basis":"PH 124 attacks scholars who speak impressively about justice and moderation in a corner but fail in action; PH 117 provides the historical resonance of torture and silence.","analysis":"This corrects the stereotype of the wholly world-renouncing Neoplatonist. Public action strengthens the soul, exposes hidden weaknesses, and creates occasions for courage and beneficence.","caution":"Damascius’ particular heroes and enemies are partisan. The general thesis of active virtue is nevertheless clearly attested.","category":"Ethics and character"},"marinus-self-censorship":{"title":"Marinus: self-censorship within the school","thesis":"Ancient texts disappeared not only through external persecution but through voluntary destruction in the name of school authority and loyalty to a master.","basis":"PH 38A says Marinus burned his Philebus commentary after Isidore’s restrained judgment; PH 97I–J mentions a divergent Parmenides reading he might also have destroyed.","analysis":"The stories show both productive and destructive aspects of intellectual succession. Criticism can correct error, yet reverence for a master can erase variants and alternative research paths.","caution":"Damascius narrates these events from Isidore’s side and within his own school politics. The quality of the lost works cannot be judged.","category":"Transmission and memory"},"golden-chain-social-underside":{"title":"The “golden chain” has a social underside","thesis":"Metaphysical succession is carried by rivalry, wealth, family interest, patronage, and tactical alliances.","basis":"The sections on succession after Proclus and Athanassiadi’s summary reveal weak successors, factions, inheritances, and conflicts over leadership.","analysis":"The point is not that spiritual tradition was simply fraudulent. Every sacralized lineage also exists as an institution with material and psychological conditions. Damascius demythologizes his own school in order to rebuild it on stricter moral terms.","caution":"“Brutal succession struggle” condenses many partisan portraits; individual motives may be sharpened by Damascius’ polemic.","category":"Institutions and power"},"hegias-ritual-activism":{"title":"Hegias: piety without judgment","thesis":"Damascius criticizes not only opponents of theurgy but pagan ritual activism that endangers its own community through public imprudence.","basis":"PH 145 describes secret restorations and dangerously visible zeal; PH 150 states Isidore’s principle that one who wishes to become a god must first become human.","analysis":"Theurgy is not rejected but subordinated to philosophical virtue and political judgment. Damascius distinguishes religious practice, technical magic, activism, and moral maturity.","caution":"The judgment of Hegias comes from an internal pagan conflict and is not a neutral account of his intentions or effects.","category":"Ethics and character"},"hypatia-hierarchy":{"title":"Hypatia: admiration and disciplinary demotion","thesis":"Damascius’ positive memory of Hypatia’s civic authority coexists with a hierarchy that places the “true philosopher” above the mathematician.","basis":"PH 43E praises Hypatia’s character and public esteem and condemns her murder; PH 106A nevertheless contrasts her with Isidore.","analysis":"The tension reveals Damascius’ hierarchy: inspired, theologically transformative philosophy ranks above mathematics and specialist learning. The bias itself is historically valuable evidence of Neoplatonic memory politics.","caution":"This is Damascius’ judgment, not an objective measure of Hypatia’s philosophical importance. The app analyses rather than adopts it.","category":"Biases and asymmetries"},"anti-rhetoric-paradox":{"title":"Anti-rhetoric with rhetorical brilliance","thesis":"Damascius rejects rhetoric as a career technology while retaining its sharpest tools for philosophical criticism.","basis":"PH 124 and the reconstructed turn after 488/89 stand beside a work full of pointed portraits, contrasts, anecdotes, and polemical compression.","analysis":"The “conversion” is therefore not the abolition of rhetoric. Damascius subordinates it to philosophy and turns its means against an educational culture that confuses verbal virtuosity with truth and character.","caution":"The comprehensive attack on the late antique educational system is especially Athanassiadi’s interpretation; the fragmented work does not preserve a complete theory of rhetoric.","category":"Method and authorship"},"zosime-inner-freedom":{"title":"Zosime: philosophical freedom without social rank","thesis":"The funerary epigram applies the distinction between outward bondage and inward freedom to an enslaved woman, not to a famous philosopher.","basis":"Anthologia Graeca VII.553, attributed to Damascius, says in effect that Zosime was formerly enslaved only in body and is now bodily free as well.","analysis":"The few verses make a marginal figure the bearer of a central Platonic motif of freedom. Their force comes from the social asymmetry: inward rank and outward status diverge.","caution":"Almost nothing is known about Zosime. Claims about Damascius’ last years in Syria depend on linking the epigram with other testimony.","category":"Persons and lives"},"lost-marvel-encyclopedia":{"title":"The work as a remnant of a lost encyclopedia of the extraordinary","thesis":"The digressions of the Philosophical History are not mere disorder but part of a method that connects doctrines with bodies, landscapes, rumours, and anomalies.","basis":"Athanassiadi points to Damascius’ lost collection of 572 marvel stories arranged by type; the Philosophical History also contains many paradoxa and local narratives.","analysis":"Intellectual history here is not made of propositions alone. It includes dreams, animals, plants, sacred places, political disasters, and the stories through which a community interprets itself. Apparent disorder becomes an archive of different kinds of reality.","caution":"The number 572 and the characterization of the lost collection come from the ancient and editorially reconstructed work tradition; its content is accessible only indirectly.","category":"Transmission and memory"},"three-ways-of-life":{"title":"Cronian, heroic, Typhonian: a moral deep structure","thesis":"Damascius orders characters not only by doctrine but along ways of life: inward unity, heroic agency, and appetitive fragmentation.","basis":"The Sarapio portrait and Athanassiadi’s analysis connect the three ways with the tripartition of soul and mythological figures.","analysis":"Sarapio forms the Cronian extreme, Pamprepius the Typhonian. The more interesting figures lie between: brilliant and limited, pious and imprudent, scientifically important and morally suspect. The typology explains ambivalent portraits better than a simple friend-enemy scheme.","caution":"The systematic threefold order becomes especially clear through Athanassiadi’s reconstruction; the fragmentary evidence does not preserve a complete theory in one continuous passage.","category":"Ethics and character"},"history-from-below":{"title":"An intellectual history from below and from the margins","thesis":"Although Damascius thinks aristocratically and hierarchically, his work preserves an unusual history of the people who practically carry tradition.","basis":"Alongside Proclus, Isidore, and Hypatia appear Aedesia, Anthusa, Olympos, Iacobus, Zosime, unnamed Brahmans, hosts, and local storytellers.","analysis":"The philosophical world becomes an ecology of teaching, care, money, travel, ritual competence, medical practice, memory, and protection. Secondary figures are conditions of intellectual continuity, not decoration.","caution":"“From below” is a modern heuristic label. Damascius remains socially hierarchical and is not interested in all groups in a modern egalitarian sense.","category":"Editorial syntheses"},"character-under-pressure":{"title":"Character tests rather than a mere history of doctrines","thesis":"The guiding question is how a philosopher can be recognized when institutions collapse and learned words no longer suffice.","basis":"Portraits are repeatedly intensified by persecution, torture, poverty, illness, institutional conflict, or political danger; PH 124 explicitly criticizes untested virtue.","analysis":"Damascius defines philosophy narratively: insight, way of life, and conduct must cohere under danger. Education may produce wisdom, but also technical virtuosity, social pose, or cowardice.","caution":"This guiding question is an editorial synthesis of the fragmented work, not a preserved subtitle or verbatim programmatic statement.","category":"Editorial syntheses"},"distributed-philosophy":{"title":"Philosophy as distributed infrastructure","thesis":"Tradition functions like a distributed system: teachers alone do not suffice; failures of care, finance, protection, ritual knowledge, or travel routes can interrupt the whole.","basis":"Aedesia secures education and resources; Olympos and the mystery mediators preserve practice; Ammonius keeps teaching institutionally open; travel connects local fields of knowledge.","analysis":"This synthesis explains why apparently “secondary” people matter so much. Philosophical knowledge is not only content in minds or books but a dependent social infrastructure with several possible points of failure.","caution":"The distributed-system comparison is a modern analytical metaphor, not a theory formulated by Damascius.","category":"New app syntheses"},"epistemic-instruments":{"title":"A competition among epistemic instruments","thesis":"The work can be read as a competition among instruments of knowledge: monochord and experiment, purified body, dream, cloud, statue, landscape, text, and personal transmission.","basis":"Asclepiodotus experiments; Heraiscus reacts bodily; Anthusa develops divination; the Styx is spatially examined; Photius and the Suda preserve textual remains.","analysis":"Damascius ranks these instruments, yet the transmission makes their diversity visible. For modern readers, the point is that observation is never presuppositionless: every instrument entails a theory of what can count as a sign.","caution":"This is a new synthesis explicitly identified as such. It connects several passages without attributing a unified ancient methodology to them.","category":"New app syntheses"},"transmission-bottlenecks":{"title":"Transmission has bottlenecks and last bearers","thesis":"Several stories show how a tradition can depend on very few people and therefore break at biographical bottlenecks.","basis":"Epiphanius and Euprepius still know the older generation; Olympos teaches without secure succession; Aedesia preserves a family; Marinus destroys his own texts.","analysis":"Traditions do not vanish only through a great prohibition. They may expire through missing teachers, broken families, destroyed manuscripts, or the absence of suitable pupils. The fragmentary form of the work mirrors this on the textual level.","caution":"“Bottleneck” is a modern model. The cases are historically different and must not be generalized into a single law of decline.","category":"New app syntheses"},"archive-of-absences":{"title":"An archive that speaks through its gaps","thesis":"Burned commentaries, lost marvel books, interrupted lives, and conflicting excerpts make absence itself a form of historical information.","basis":"Marinus destroys works; Damascius’ paradoxography is lost; the Philosophical History survives through Photius and the Suda.","analysis":"The app therefore does not treat gaps as empty spaces to be filled at will. It asks what social or textual process produced an absence: self-censorship, excerptorial selection, material transmission, or institutional collapse.","caution":"A gap does not automatically reveal its cause. Several mechanisms of loss are possible and must remain distinct.","category":"New app syntheses"},"adaptation-ambiguity":{"title":"Accommodation and fidelity remain morally ambiguous","thesis":"Ammonius, Hegias, and Damascius display three risks: too much accommodation, overly visible resistance, and retrospective moral self-fashioning.","basis":"Ammonius’ agreement is unclear; Hegias’ restoration activism is called dangerous; Damascius writes as participant and judge.","analysis":"The work gives no simple rule for when compromise is cowardly or prudent, resistance brave or foolish. That is precisely why it remains current: decisions under pressure are made without complete information and later judged through partisan memories.","caution":"This triad is a new synthesis of the app. It must not flatten very different historical situations.","category":"New app syntheses"}},"registerPeople":{"hermeias":{"name":"Hermeias","summary":"Hermeias was Aedesia’s husband and the father of Ammonius and Heliodorus; he studied with Proclus under Syrianus.","role":"Philosopher; husband of Aedesia","origin":"Alexandria / Athens","dates":"5. Jh."},"heliodorus":{"name":"Heliodorus","summary":"Younger brother of Ammonius; Aedesia took both sons to Athens to study with Proclus. Damascius judges Heliodorus simpler and more superficial than his brother.","role":"Son of Hermeias and Aedesia","origin":"Alexandria / Athens","dates":"5. Jh."},"hierax":{"name":"Hierax","summary":"Brother of a man named Synesius; he travelled to Athens with Aedesia and her sons and later appears as an observer of extraordinary animals.","role":"Alexandrian contemporary of Ammonius","origin":"Alexandria / Athens","dates":"5. Jh."},"asclepiades":{"name":"Asclepiades","summary":"Horapollo’s father and Heraiscus’ elder brother; he combined Egyptian religious learning, hymn composition, and an unfinished comparative theology.","role":"Scholar of Egyptian religion","origin":"Alexandria","dates":"5. Jh."},"dorus":{"name":"Dorus","summary":"He accompanied Isidore and Damascius during parts of their Syrian-Arabian journey; Athanassiadi considers him a possible host at Bostra.","role":"Travelling companion and possible host","origin":"Bostra / Hauran","dates":"5. Jh."},"harpocras":{"name":"Harpocras","summary":"An acquaintance of Ammonius whose hiding place was sought during the persecution; Isidore tried to warn him.","role":"Egyptian intellectual in the persecution context","origin":"Alexandria","dates":"5. Jh."},"julian-damascius":{"name":"Julian","summary":"Damascius’ younger brother; like him he pursued higher studies and remained silent despite being beaten during the crisis of 488/89.","role":"Younger brother of Damascius","origin":"Damascus / Alexandria","dates":"5. Jh."},"gessius":{"name":"Gessius","summary":"A physician from the Alexandrian milieu whom Damascius treats as another example of adversity revealing hidden strength of character.","role":"Physician and former student","origin":"Alexandria","dates":"5./6. Jh."},"antony-gaza":{"name":"Antony of Gaza","summary":"He assisted Isidore and Damascius during their flight; decades later Damascius remembers him with exceptional gratitude.","role":"Pagan confidant and helper","origin":"Gaza","dates":"5. Jh."},"severianus":{"name":"Severianus","summary":"A well-born fellow Damascene and family friend under whom Damascius and Julian probably received early rhetorical training.","role":"Rhetorical teacher from Damascus","origin":"Damascus","dates":"5. Jh."},"zacharias-mytilene":{"name":"Zacharias of Mytilene","summary":"A pupil of Ammonius and author of the Life of Severus, a major Christian parallel source for the Alexandrian school and the events of the 480s.","role":"Christian student and parallel witness","origin":"Alexandria","dates":"ca. 465–nach 536"},"severus-antioch":{"name":"Severus of Antioch","summary":"His biography by Zacharias mirrors the Alexandrian educational and conflict milieu from a Christian perspective.","role":"Christian student and later bishop","origin":"Alexandria / Beirut","dates":"5./6. Jh."},"aeneas-gaza":{"name":"Aeneas of Gaza","summary":"His dialogue Theophrastus preserves relations and teaching traditions from the Alexandrian milieu, including evidence about Hierocles and Gessius.","role":"Christian Platonist and parallel witness","origin":"Gaza / Alexandria","dates":"5./6. Jh."},"theon-alexandria":{"name":"Theon of Alexandria","summary":"Mathematician and astronomer and Hypatia’s father; important for the scientific background of Alexandrian education.","role":"Mathematician; father of Hypatia","origin":"Alexandria","dates":"4./5. Jh."},"cyril-alexandria":{"name":"Cyril of Alexandria","summary":"Ecclesiastical leader whose envy Damascius connects with Hypatia’s murder; the precise responsibility requires source-critical differentiation.","role":"Bishop of Alexandria","origin":"Alexandria","dates":"ca. 376–444"},"aspar":{"name":"Aspar","summary":"His killing in 471 provides the historical point of reference for Anthusa’s cloud vision.","role":"Generalissimo at the eastern Roman court","origin":"Constantinople","dates":"† 471"},"leo-i":{"name":"Leo I","summary":"Eastern Roman emperor during the Vandal expedition and Aspar’s killing; the political frame of the Anthusa episode.","role":"Eastern Roman emperor","origin":"Constantinople","dates":"Reg. 457–474"},"illus":{"name":"Illus","summary":"Leader of the revolt against Zeno; Pamprepius joined his camp and hopes of pagan restoration.","role":"General and rebel","origin":"Constantinople","dates":"† 488"},"zeno":{"name":"Zeno","summary":"Eastern Roman emperor during the revolt of Illus and the Alexandrian crisis years.","role":"Eastern Roman emperor","origin":"Constantinople","dates":"Reg. 474–491"},"justinian":{"name":"Justinian I","summary":"His legislation and the teaching prohibition of 529 form the political context for the philosophers’ departure from Athens.","role":"Eastern Roman emperor","origin":"Constantinople / Athens","dates":"Reg. 527–565"},"khusrau":{"name":"Khusrau I","summary":"He received the philosophers from Athens and discussed philosophical questions with them; idealised expectations soon gave way to an ambivalent experience.","role":"Sasanian king","origin":"Ctesiphon","dates":"Reg. 531–579"},"agathias":{"name":"Agathias","summary":"The principal literary witness for the Persian journey and the protective clause in the peace of 532.","role":"Historian and poet","origin":"Constantinople","dates":"6. Jh."},"simplicius":{"name":"Simplicius","summary":"A philosopher from Damascius’ circle; the testimonia name him as a companion, and his commentaries preserve differing assessments of several teachers.","role":"Neoplatonic commentator and companion in exile","origin":"Athens / Persia","dates":"6. Jh."},"eulalius":{"name":"Eulalius of Phrygia","summary":"Named in a testimonium as a Phrygian companion of Damascius and Simplicius.","role":"Philosopher and companion of Damascius","origin":"Athens / Persia","dates":"6. Jh."},"priscian":{"name":"Priscian of Lydia","summary":"His work preserved in Latin translation answers Khusrau’s questions on soul, body, fate, dreams, geography, and anthropology.","role":"Philosopher and author of the Answers to Khusrau","origin":"Athens / Ctesiphon","dates":"6. Jh."},"syrianus":{"name":"Syrianus","summary":"Teacher of Proclus and Hermeias; Aedesia was related to him. He belongs to the institutional prehistory of the later succession struggles.","role":"Head of the Athenian school","origin":"Athens","dates":"† ca. 437"},"plutarch-athens":{"name":"Plutarch of Athens","summary":"Predecessor of Syrianus and an important early node in the late-antique Athenian school tradition.","role":"Earlier head of the Athenian school","origin":"Athens","dates":"† ca. 431"},"hierocles":{"name":"Hierocles","summary":"Teacher of Theosebius; Damascius admires the breadth of his mind and reports persecution, beating, exile, and eventual return to Alexandria.","role":"Alexandrian philosopher and rhetor","origin":"Alexandria / Constantinople","dates":"5. Jh."},"salustius":{"name":"Salustius","summary":"He came from Athens to Alexandria with Isidore; Damascius portrays his sharp speech, contradictory way of life, and distance from conventional school roles.","role":"Philosopher and rhetor with a Cynic way of life","origin":"Alexandria / Athens / Emesa","dates":"5. Jh."},"john-philoponus":{"name":"John Philoponus","summary":"A pupil of Ammonius and later a major Christian critic of Aristotelian and Neoplatonic positions; important for the school’s afterlife.","role":"Christian philosopher and commentator","origin":"Alexandria","dates":"5./6. Jh."}},"modules":{"monochord":{"title":"Monochord laboratory","intro":"A modern acoustic demonstration makes intelligible why very small intervals become difficult to perceive.","basis":"PH 85B reports at least 220 bridge positions in Asclepiodotus’ attempt to recover a lost enharmonic scale.","caution":"The tones, cent values, and bridge positions are modern illustrations. They reconstruct neither the specific tuning nor the 220 historical trials."},"transmission":{"title":"Transmission mosaic","intro":"The 24 verified fragment cards are grouped by surviving witness: Photius, Suda, both, or other combinations.","basis":"The module uses only the witness data already verified for the app’s 24 fragment cards.","caution":"The distribution concerns only the app’s curated selection, not the entire lost Philosophical History."},"epistemic":{"title":"Laboratory of epistemic instruments","intro":"Eight forms of knowing are compared by repeatability, public checkability, embodiment, and ritual prerequisite.","basis":"The features are editorial analyses of episodes involving Asclepiodotus, Heraiscus, Anthusa, Iacobus, Sarapio, the Styx, dreams, and cult statues.","caution":"The matrix is a modern comparative heuristic. Damascius does not formulate such a table and does not use modern philosophy-of-science categories."}},"epistemicInstruments":{"monochord":{"name":"Monochord and experiment","episode":"Asclepiodotus","authority":"Measurement, hearing, and repeated trial"},"medical":{"name":"Diagnosis and medical experience","episode":"Iacobus","authority":"Long training, clinical experience, and personal craft"},"sacred-body":{"name":"Consecrated body","episode":"Heraiscus","authority":"Sympathy between purified person and deity"},"clouds":{"name":"Cloud divination","episode":"Anthusa","authority":"Prayer, dream instruction, and symbolic interpretation"},"sacred-landscape":{"name":"Sacred landscape","episode":"Arabian Styx","authority":"Local tradition, offering, and observed response"},"dream":{"name":"Dream and vision","episode":"Damascius / Heraiscus","authority":"Personal experience and retrospective interpretation"},"minimal-reading":{"name":"Radical selection of reading","episode":"Sarapio","authority":"Inner concentration and spiritual kinship"},"cult-statue":{"name":"Indwelt cult statue","episode":"Heraiscus / Aion","authority":"Divine indwelling and bodily reaction"}}},"ui":{"de":{"overview":"Überblick","atlas":"Atlas","network":"Netzwerk","timeline":"Zeitleiste","stories":"Erzählpfade","cases":"Offene Fälle","wonders":"Paradoxa","fragments":"Fragmentmikroskop","people":"Prosopographie","glossary":"Begriffe","transmission":"Überlieferung","rights":"Rechte & Quellen","search":"Person, Ort, Motiv oder Fragment …","sourceMode":"Quellenmodus","on":"an","off":"aus","language":"Sprache","readStory":"Erzählpfad öffnen",
