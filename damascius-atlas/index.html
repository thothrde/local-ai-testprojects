t keine PDF.","Code: MIT-Lizenz. Eigenständige App-Texte und originale SVG/CSS-Visualisierungen: CC BY 4.0 unter der Attribution „Damascius Atlas, 2026“. Die eingebettete Natural-Earth-Geometrie bleibt Public Domain; bibliographische Fakten und gemeinfreie antike Inhalte werden nicht beansprucht.","Die Küsten- und Landgeometrien der Atlasansicht beruhen auf Natural Earth, dessen Raster- und Vektordaten als Public Domain freigegeben sind. Die kartographische Gestaltung und Annotationen dieser App sind neu erstellt.","Für Alexandria, Athen, Aphrodisias und Rom sind verifizierte stabile Pleiades-URIs verlinkt. Die App lädt keine Pleiades-Daten zur Laufzeit; die Gazetteer-Zuordnung wird unter Nennung von Pleiades und der CC-BY-3.0-Lizenz dokumentiert."],"caveat":"Dies ist eine konservative Publikationsstrategie, keine individuelle Rechtsberatung."},"en":{"headline":"Copyright-conscious public edition","intro":"This build is designed for public hosting without distributing the modern Athanassiadi edition or any downloaded PDF.","points":["Ancient names, events, and Damascius’ work are in the public domain; the app does not reproduce a complete modern edition.","The modern English translation, commentary, introduction, critical apparatus, and page images are not reproduced.","All German and English explanations are independent editorial paraphrases. Short Greek phrases identify and support discussion of the source passage.","Scene images, person medallions, symbols, and animations are original SVG/CSS visualisations. The atlas geometry is based on public-domain Natural Earth data and has been newly styled and annotated for this app.","The optional PDF picker operates only inside the browser. The app contains, fetches, and uploads no PDF.","Code: MIT License. Independent app prose and original SVG/CSS artwork: CC BY 4.0 with the attribution “Damascius Atlas, 2026”. Embedded Natural Earth geometry remains in the public domain; no claim is made over bibliographic facts or public-domain ancient material.","The land and coastline geometries in the atlas view are based on Natural Earth, whose raster and vector data are released into the public domain. The cartographic design and annotations in this app are newly created.","Verified stable Pleiades URIs are linked for Alexandria, Athens, Aphrodisias, and Rome. The app fetches no Pleiades data at runtime; the gazetteer linkage is documented with attribution to Pleiades and its CC BY 3.0 licence."],"caveat":"This is a conservative publication strategy, not individual legal advice."}},"relationshipLabelsEn":{"Schüler / Lehrer":"student / teacher","geistige Verwandtschaft":"spiritual kinship","Lehrer":"teacher","Lehrer / Nachfolger":"teacher / successor","Lehrer / eigenwilliger Schüler":"teacher / independent pupil","Lehrer und Kritiker":"teacher and critic","Mutter / institutionelle Förderin":"mother / institutional patron","Familien- und Schulkreis":"family and school circle","Kollegen im Schulmilieu":"colleagues in the school milieu","Schulmilieu":"school milieu","junger Redner der Grabrede":"young author of her funeral speech","Bewunderung und Polemik":"admiration and polemic","politischer Kompromiss?":"political compromise?","theologische Ausbildung":"theological training","Schülerin / Auftraggeberin":"student / commissioner","Schülerin":"student","Gastgeber":"host","Ritualkollegen":"ritual colleagues","Exzerptor / überlieferter Autor":"excerptor / transmitted author","Verfasser des Grabepigramms":"author of the funerary epigram","Brüder":"brothers","Ehe / gemeinsame Dynastie":"marriage / shared dynasty","Vater / Sohn":"father / son","Lehrer / Schüler":"teacher / pupil","Vorgänger / Nachfolger":"predecessor / successor","Reisegefährten":"travelling companions","Bekannte":"acquaintances","Hilfe bei der Flucht":"assistance during flight","Biograph / biographierte Person":"biographer / subject","Vater / Tochter":"father / daughter","politischer und religiöser Konflikt":"political and religious conflict","Gegenstand der Vision":"subject of the vision","Kaiser / Heermeister":"emperor / generalissimo","politisches Bündnis":"political alliance","Kaiser / Rebell":"emperor / rebel","kaiserliches Unterrichtsverbot":"imperial teaching prohibition","Gastgeber / philosophischer Gast":"host / philosophical guest","späterer Berichterstatter":"later reporter","Gefährten im Exil":"companions in exile","Gefährten":"companions","Antwortender / Fragender":"respondent / questioner","Reise- und Schulgefährten":"travel and school companions"},"routeLabelsEn":{"Flucht / Reise":"flight / journey","Reise":"journey","Sakrale Reise":"sacred journey","Exilroute, hypothetisch":"hypothetical exile route","Exilroute":"exile route","Rückkehrhypothese":"hypothesised return","mögliche letzte Reise":"possible final journey"},"commonEn":{"hoch":"high","mittel":"medium","niedrig":"low","sehr niedrig":"very low","offen":"open","umstritten":"disputed","textkritisch":"text-critical","wertungsabhängig":"value-dependent","Philosoph":"Philosopher","Frau":"Woman","Ritual":"Ritual","Wissenschaft":"Science","Medizin":"Medicine","Lehrer":"Teacher","Askese":"Asceticism","Metropole":"Metropolis","Heiligtum":"Sanctuary","Schulzentrum":"School centre","Philosophisches Zentrum":"Philosophical centre","Heilige Landschaft":"Sacred landscape","Herkunftsort":"Place of origin","Heilige Stadt":"Sacred city","Stadt und Kultort":"City and cult site","Provinzhauptstadt":"Provincial capital","Bildungszentrum":"Educational centre","Sakrale Heimat":"Sacred homeland","Grenzstadt":"Frontier city","Sassanidische Hauptstadt":"Sasanian capital","Kaiserliche Hauptstadt":"Imperial capital","Imperiale Erinnerung":"Imperial memory","Kultlandschaft":"Cult landscape","Fernraum":"Distant region"},"homeIntro":{"de":{"lead":"Damascius’ Philosophische Geschichte ist weder eine gewöhnliche Biographie noch eine systematische Philosophiegeschichte. Das verlorene Werk, heute vor allem durch Photios und die Suda fragmentarisch bewahrt, führt in die dichten Lebenswelten des 5. und frühen 6. Jahrhunderts: Schulen und Familien, Kultgemeinschaften und Reisewege, politische Konflikte, Freundschaften, Abhängigkeiten und Verrat.","paragraphs":["Neben berühmten Philosophen erscheinen Witwen, Ärzte, Ritualexperten, Gastgeber, versklavte Menschen, Reisende und beinahe vergessene Mittlerfiguren. Dadurch entsteht weniger ein Pantheon großer Denker als eine moralische Ethnographie einer untergehenden Intelligenzija: Damascius fragt immer wieder, ob Einsicht, Lebensform und Handeln unter Druck zusammenpassen.","Für heutige Leser ist diese Welt nicht nur wegen ihrer Fremdheit interessant. Sie stellt erstaunlich gegenwärtige Fragen: Wie überleben Wissensgemeinschaften unter politischem und religiösem Druck? Wann ist Anpassung Klugheit und wann Verrat? Wie hängen Erkenntnis, institutionelle Macht, materielle Fürsorge und soziale Netzwerke zusammen? Und was geschieht mit einem Werk, das nur in Auszügen, Zitaten und späteren Rekonstruktionen fortlebt?","Der Atlas macht diese Fragen räumlich und quellenkritisch sichtbar. Er trennt antiken Bericht, Überlieferungszeugen, moderne Rekonstruktion und eigene Interpretation. Wundererzählungen werden weder als Tatsachen behauptet noch als bloßer Aberglaube abgetan; sie erscheinen als Bestandteile einer historischen Erfahrungswelt, deren Kategorien nicht mit unseren heutigen Disziplingrenzen übereinstimmen."],"why":[{"title":"Institutionen unter Druck","text":"Die Schule ist Unterrichtsort, Familie, Karriereweg, Kultgemeinschaft und Schutznetz zugleich. Ihr Zerfall zeigt, wie verletzlich Wissen wird, wenn die soziale Infrastruktur zerbricht."},{"title":"Konkurrierende Formen des Wissens","text":"Experiment, Mathematik, Ritual, Vision, mündliche Tradition und philosophische Intuition stehen nebeneinander und werden von Damascius hierarchisiert."},{"title":"Erinnerung aus Fragmenten","text":"Photios, Suda und moderne Editionen bewahren das Werk, verändern aber zugleich seine Form. Quellenkritik wird dadurch selbst zum Gegenstand der App."}]},"en":{"lead":"Damascius’ Philosophical History is neither an ordinary biography nor a systematic history of philosophy. The lost work, now preserved mainly in fragments through Photius and the Suda, opens onto the dense lifeworlds of the fifth and early sixth centuries: schools and families, cult communities and journeys, political conflicts, friendships, dependencies, and betrayal.","paragraphs":["Alongside famous philosophers appear widows, physicians, ritual specialists, hosts, enslaved people, travellers, and nearly forgotten mediators. The result is less a pantheon of great thinkers than a moral ethnography of a disappearing intelligentsia: Damascius repeatedly asks whether insight, way of life, and action remain coherent under pressure.","For modern readers this world matters for more than its strangeness. It raises strikingly current questions: How do communities of knowledge survive political and religious pressure? When is accommodation prudent, and when is it betrayal? How are knowledge, institutional power, material care, and social networks connected? What happens to a work that survives only through excerpts, quotations, and later reconstruction?","The atlas makes these questions spatial and source-critical. It distinguishes ancient report, textual witness, modern reconstruction, and its own interpretation. Marvel stories are neither asserted as facts nor dismissed as mere superstition; they are examined as elements of a historical world of experience whose categories do not match modern disciplinary boundaries."],"why":[{"title":"Institutions under pressure","text":"A school is simultaneously a place of teaching, a family, a career structure, a cult community, and a protective network. Its breakdown shows how vulnerable knowledge becomes when social infrastructure collapses."},{"title":"Competing forms of knowledge","text":"Experiment, mathematics, ritual, vision, oral tradition, and philosophical intuition coexist and are ranked by Damascius."},{"title":"Memory from fragments","text":"Photius, the Suda, and modern editions preserve the work while also changing its form. Source criticism therefore becomes part of the subject itself."}]}},"sourceLabels":{"de":{"Athanassiadi 1999, Introduction":"Athanassiadi 1999, Einleitung","Athanassiadi 1999, commentary":"Athanassiadi 1999, Kommentar","Athanassiadi 1999, Technicalities":"Athanassiadi 1999, Technische Hinweise","Athanassiadi 1999, Introduction; contrast PH 124":"Athanassiadi 1999, Einleitung; Kontrast PH 124","PH 134–142, reconstructed sequence":"PH 134–142, rekonstruierte Abfolge","Interpretative Analyse":"Interpretative Analyse","Kommentar zu PH 135":"Kommentar zu PH 135","Kommentar zu PH 142B":"Kommentar zu PH 142B","Kontrast PH 111 / PH 124":"Kontrast PH 111 / PH 124"},"en":{"Athanassiadi 1999, Introduction":"Athanassiadi 1999, Introduction","Athanassiadi 1999, commentary":"Athanassiadi 1999, commentary","Athanassiadi 1999, Technicalities":"Athanassiadi 1999, Technicalities","Athanassiadi 1999, Introduction; contrast PH 124":"Athanassiadi 1999, Introduction; contrast PH 124","PH 134–142, reconstructed sequence":"PH 134–142, reconstructed sequence","Interpretative Analyse":"Interpretative analysis","Kommentar zu PH 135":"Commentary on PH 135","Kommentar zu PH 142B":"Commentary on PH 142B","Kontrast PH 111 / PH 124":"Contrast PH 111 / PH 124"}},"map":{"basis":"Natural Earth low-resolution land geometries, public domain; transformed and restyled for this app.","regionalBounds":[8,26,48,46],"wideBounds":[8,5,92,46],"coordinatePolicy":"Approximate site centroids. Regions and disputed identifications are marked as such. No modern political boundaries are displayed."},"insights":[{"id":"sarapio-minimal-library","category":"persons","level":"editorial","title":"Sarapio: Bücherarmut als Erkenntnistheorie","thesis":"Sarapios zwei oder drei Bücher sind nicht bloß ein Zeichen asketischer Armut, sondern ein Modell geistiger Konzentration gegen die Zersplitterung durch eine bloße Vielheit fremder Meinungen.","basis":"PH 111 schildert den fast unsichtbaren alexandrinischen Einsiedler, seine wenigen Bücher – darunter Orpheus – und seine Ausrichtung auf das Innere und Ungeteilte.","analysis":"Damascius macht Sarapio zum Beispiel einer „kronischen“ Lebensform. Die bewusst winzige Bibliothek fungiert als Filter: Texte sind wertvoll, wenn sie Sammlung ermöglichen, nicht weil sie Gelehrsamkeit vermehren. So entsteht ein antiakademisches Ideal innerhalb einer hochgelehrten Kultur.","caution":"Die Deutung der Bücherarmut als Kritik an polydoxia wird durch Athanassiadis Einleitung zugespitzt; sie ist eine editorische Interpretation des Porträts, kein wörtlicher Lehrsatz Sarapios.","sources":["PH 111","Athanassiadi, Einleitung: Sarapio und die drei Lebensformen"],"people":["sarapio","isidore"],"fragments":["f111"],"stories":["sarapio-path"],"origin":"review"},{"id":"asclepiodotus-rival-ideal","category":"knowledge","level":"editorial","title":"Asclepiodotus: ein konkurrierendes Ideal geistiger Größe","thesis":"Damascius’ Herabsetzung des Asclepiodotus verrät, wie ernst er den experimentellen Universalgelehrten als Rivalen seines eigenen Philosophenideals nahm.","basis":"Die Fragmente verbinden Mathematik, Musikexperiment, Medizin, Naturbeobachtung und den gefährlichen Abstieg bei Hierapolis mit dem Vorwurf, Asclepiodotus besitze keine entsprechende Einsicht in das Intelligible.","analysis":"Hier kollidieren zwei Erkenntnisstile: Rekonstruktion durch Versuch, Analogie und Beobachtung einerseits; innere Verwandtschaft und geistige Umwendung andererseits. Dass Damascius technische Leistungen so ausführlich bewahrt und zugleich metaphysisch abwertet, macht die Spannung sichtbar.","caution":"Die Vermutung, Faszination und Abwehr seien persönlich miteinander verschränkt, ist eine begründete Deutung. Damascius nennt dieses psychologische Motiv nicht ausdrücklich.","sources":["PH 84A–87A","PH 85B","PH 87A","Athanassiadi, Zusammenfassung und Kommentar zu Asclepiodotus"],"people":["asclepiodotus","damascius","isidore"],"fragments":["f85b","f87a"],"stories":["asclepiodotus-path"],"origin":"review"},{"id":"anthusa-inventor","category":"knowledge","level":"textual","title":"Anthusa: eine Frau als Erfinderin einer mantischen Technik","thesis":"Anthusa erscheint nicht nur als Empfängerin einer Vision, sondern als Entwicklerin einer wiederholbaren Form der Wolkenmantik.","basis":"PH 52 erzählt von Gebet, Traumweisung und den Wolkengestalten eines Goten und eines Löwen; Damascius schreibt Anthusa anschließend die fortgesetzte Praxis der neuen Divinationsform zu.","analysis":"Damit wird eine Frau als religiöse Spezialistin und methodische Neuerin sichtbar. Die Episode steht nicht isoliert als „Frauenfrömmigkeit“, sondern neben anderen außergewöhnlichen Erkenntnisformen, Naturbeobachtungen und Reiseberichten.","caution":"Die politische Deutung der Wolken wird rückblickend mit Aspars Ermordung verbunden. Die App behandelt dies als antiken Bericht, nicht als bestätigte Vorhersage.","sources":["PH 52"],"people":["anthusa"],"fragments":["f52"],"stories":["anthusa-path"],"origin":"review"},{"id":"theosebius-practical-ethics","category":"persons","level":"editorial","title":"Theosebius: praktische Ethik und religiöse Mehrsprachigkeit","thesis":"Theosebius ist bei Damascius weniger Metaphysiker als glaubwürdiger Lebenspraktiker: Selbstordnung, Fürsorge und Enthaltsamkeit zählen mehr als theoretischer Rang.","basis":"PH 46B berichtet den Exorzismus unter Anrufung der Strahlen des Helios und des Gottes der Juden; PH 46E die freiwillig enthaltsame Ehe und den „Ring der Enthaltsamkeit“.","analysis":"Die beiden Geschichten zeigen eine urbane pagane Askese, die christlich anmutende Formen besitzt, aber philosophisch begründet wird. Zugleich erscheint religiöse Wirksamkeit nicht als konfessionell geschlossenes System, sondern als situationsbezogene Kombination mächtiger Namen und ethischer Autorität.","caution":"Der Vergleich mit Epiktet ist eine moderne Charakterisierung. Die Erzählung beweist keine systematische synkretistische Theologie des Theosebius.","sources":["PH 46B","PH 46E"],"people":["theosebius"],"fragments":["f46"],"stories":[],"origin":"review"},{"id":"mystery-mediators","category":"transmission","level":"editorial","title":"Epiphanius und Euprepius: die Zwischengeneration der Tradition","thesis":"Traditionen verschwinden nicht in einem einzigen Augenblick; entscheidend ist eine Generation, die nicht mehr in die alte Ordnung hineingeboren wurde, aber deren letzte Träger noch persönlich kannte.","basis":"PH 41 nennt Epiphanius und Euprepius als Vermittler ägyptischer, Aion- und „persischer“ Mysterientraditionen und betont ihren Kontakt mit der vorausgehenden Generation.","analysis":"Sie stehen zwischen gelebter Selbstverständlichkeit und antiquarischer Rekonstruktion. Gerade diese Zwischenposition macht sie zu kulturellen Gedächtnisträgern – und zugleich zu einem Hinweis auf die Fragilität personaler Überlieferung.","caution":"Athanassiadis Identifikation des Epiphanius mit einem Astronomen aus Theons Umfeld ist plausibel, aber nicht völlig sicher.","sources":["PH 41","Athanassiadi, Kommentar zu PH 41"],"people":["epiphanius","euprepius"],"fragments":["f41"],"stories":[],"origin":"review"},{"id":"olympos-religious-decline","category":"institutions","level":"editorial","title":"Olympos: Religionsende als Verlust von Lehrern","thesis":"Ein Kult endet nicht nur durch Verbote und Tempelzerstörung, sondern wenn kompetente Lehrer keine tragfähige Nachfolge mehr hervorbringen.","basis":"PH 42 zeichnet Olympos als charismatischen Sarapis-Diener, der Menschen in den alten Riten unterweist und schließlich das Verlassen des Tempels durch Sarapis ankündigt.","analysis":"Das Porträt macht den Niedergang einer Religion als sozialen Prozess sichtbar: Wissen, Überzeugungskraft, rituelle Kompetenz und institutionelle Kontinuität müssen zusammenkommen. Olympos kann noch sammeln und lehren, aber nicht mehr dauerhaft reproduzieren.","caution":"Die Aussage, Sarapis habe den Tempel verlassen, gehört zur religiösen Deutung des Damascius. Die soziologische Folgerung ist eine moderne Synthese.","sources":["PH 42"],"people":["olympos"],"fragments":["f42"],"stories":[],"origin":"review"},{"id":"heraiscus-body-instrument","category":"knowledge","level":"editorial","title":"Heraiscus: der geheiligte Körper als Erkenntnisinstrument","thesis":"Heraiscus verkörpert eine Erkenntnistheorie, in der ein gereinigter Mensch göttliche Gegenwart körperlich registriert – als Alternative zum distanzierten Experiment.","basis":"PH 76 berichtet seine Reaktion auf „beseelte“ Statuen, die Deutung des Aion als Osiris und Adonis, das Harpokrates-Zeichen bei der Geburt und postume Lichtzeichen.","analysis":"Der Körper ist hier kein Hindernis des Wissens, sondern ein Resonanzorgan. Im Vergleich mit Asclepiodotus entstehen zwei konkurrierende „Messinstrumente“: experimentelle Anordnung und geheiligte Person.","caution":"Die Menstruationsanekdote ist textkritisch unsicher und könnte erst im Suda-Exzerpt erläutert worden sein. Die App trennt sie deshalb von den sicherer bezeugten Motiven.","sources":["PH 76","Photios und Suda; Athanassiadi, textkritischer Kommentar"],"people":["heraiscus","asclepiodotus"],"fragments":["f76"],"stories":[],"origin":"review"},{"id":"brahmans-cultural-brokers","category":"transmission","level":"editorial","title":"Die namenlosen Brahmanen als kulturelle Makler","thesis":"Die historisch interessantesten Figuren der Indienepisode sind nicht die sagenhaften Bergweisen, sondern die Gäste, die zwischen asketischen Gruppen und Städten vermitteln.","basis":"PH 51D beschreibt im Haus des Severus lebende Brahmanen, ihre asketische Lebensweise, ihre Vermittlungsrolle und die von ihnen erzählten Wunderberichte.","analysis":"Die Episode zeigt Alexandria als Knoten transregionaler Kommunikation. Persönliche Begegnung, Ethnographie, religiöse Autorität und Paradoxographie gehen ineinander über. Vermittlung ist dabei eine soziale Tätigkeit, nicht bloß die Weitergabe von Texten.","caution":"Einbeinige Menschen und siebenköpfige Schlangen werden als überlieferte Erzählungen dargestellt; sie sind keine historischen Angaben über Indien.","sources":["PH 51D"],"people":["brahmans","severus"],"fragments":["f51d"],"stories":["brahmans-path"],"origin":"review"},{"id":"aedesia-infrastructure","category":"institutions","level":"editorial","title":"Aedesia: die unsichtbare Infrastruktur einer Philosophendynastie","thesis":"Philosophische Sukzession beruht nicht nur auf Lehrern, sondern auf Fürsorge, Geld, Stipendien, Reisen und weiblicher Organisationsarbeit.","basis":"PH 56 schildert Aedesias Wohltätigkeit, die Sicherung der öffentlichen Zahlung für ihre Söhne und deren Ausbildung in Athen.","analysis":"Aedesia hält nach dem Tod des Hermeias Familie, Ansehen und Ausbildung zusammen. Dadurch wird die materielle Reproduktion einer Schule sichtbar – eine Dimension, die lineare Lehrerlisten gewöhnlich ausblenden.","caution":"Die Aussage, ohne Aedesia hätte es die spätere Schule des Ammonius nicht gegeben, ist ein plausibles Gegenfaktum, aber nicht beweisbar.","sources":["PH 56"],"people":["aedesia","ammonius"],"fragments":["f56"],"stories":[],"origin":"review"},{"id":"iacobus-art-embodied","category":"persons","level":"editorial","title":"Iacobus: wenn ein Arzt seiner Kunst ähnlich wird","thesis":"Iacobus verbindet diagnostische Meisterschaft, soziale Verpflichtung und religiöse Deutung zu einem Ideal verkörperter Kunst.","basis":"PH 84E berichtet seine sichere Prognose, die Pflicht zur tatsächlichen Besserung des übernommenen Kranken, unentgeltliche Behandlung und die „asklepieische“ Seele.","analysis":"Meisterschaft bedeutet hier mehr als Technik. Wer sich einer Kunst vollkommen hingibt, kann ihrem göttlichen Urbild ähnlich werden. Medizin erscheint zugleich als kommunale und moralische Praxis: städtisches Gehalt, kostenlose Behandlung und Umverteilung zugunsten armer Patienten.","caution":"Die asklepieische Seele ist die Deutung Isidors innerhalb des antiken religiösen Weltbildes, nicht eine medizinische Diagnose.","sources":["PH 84E"],"people":["iacobus","isidore"],"fragments":["f84e"],"stories":[],"origin":"review"},{"id":"eshmun-local-memory","category":"transmission","level":"editorial","title":"Eshmun: lokale Mythologie an der Grenze des Verschwindens","thesis":"Die Beiruter Eshmun-Erzählung könnte eine seltene lokale Variante bewahren, die Damascius durch Reise, Gespräch und philosophische Deutung überliefert.","basis":"PH 142B erzählt Eshmuns Selbstkastration, Wiederbelebung durch Astronoe und Vergöttlichung als „Achter“.","analysis":"Der Mythos verbindet Sexualität, Tod, Heilung und Gottwerdung. Die Acht kann kosmologisch auf eine Sphäre jenseits der sieben Planeten bezogen werden. Der Erzählton legt nach Athanassiadi eine relativ unmittelbare lokale Überlieferung nahe.","caution":"Die Annahme mündlicher Nähe und die kosmologische Erklärung der Acht sind moderne Interpretationen; eine unabhängige Version derselben lokalen Erzählung ist nicht erhalten.","sources":["PH 142B","Athanassiadi, Kommentar zu PH 142B"],"people":["damascius","isidore"],"fragments":["f142b"],"stories":["eshmun-path"],"origin":"review"},{"id":"styx-sacred-geography","category":"knowledge","level":"editorial","title":"Die arabische Styx: Landschaft als Recht, Orakel und Körperurteil","thesis":"Die Styx-Episode zeigt eine heilige Geographie, in der Naturerscheinung, Eid, Recht, Körper und göttliches Urteil nicht getrennte Bereiche sind.","basis":"PH 135 berichtet den Wasserfall, das widersinnige Verhalten leichter und schwerer Opfergaben und die Wassersucht als Strafe des Meineids.","analysis":"Damascius und Isidor behandeln die Landschaft als Ort, an dem metaphysische Ordnung sinnlich erfahrbar werden soll. Ihre Reise lässt sich als religiöse Feldforschung lesen: Orte werden aufgesucht, geprüft und mit lokalen Überlieferungen verbunden.","caution":"Die App behauptet weder das physikalisch paradoxe Verhalten der Opfergaben noch die übernatürliche Strafe als Tatsache. „Religiöse Feldforschung“ ist eine moderne analytische Bezeichnung.","sources":["PH 135","Athanassiadi, Einleitung zur Reiseroute"],"people":["damascius","isidore"],"fragments":["f135"],"stories":["sacred-geography"],"origin":"review"},{"id":"phantom-battles-comparison","category":"knowledge","level":"editorial","title":"Phantomschlachten: eine Typologie wiederkehrender Anomalien","thesis":"Damascius sammelt nicht nur eine Geistergeschichte, sondern vergleicht räumlich getrennte Berichte zu einem wiederkehrenden Typus.","basis":"PH 50 verbindet die drei Tage weiterkämpfenden Totenseelen mit weiteren Schlachtfelderscheinungen in verschiedenen Regionen.","analysis":"Das Verfahren beginnt mit historischer Erzählung, fügt Zeugnisse hinzu und ordnet Analogien. Es ist keine moderne kritische Wissenschaft, aber mehr als eine einzelne Märchenanekdote: eine vergleichende Paradoxographie.","caution":"Die Berichte bestätigen keine realen Totenschlachten. Historisch greifbar ist Damascius’ Art, außergewöhnliche Erzählungen zu sammeln und zu typisieren.","sources":["PH 50"],"people":["damascius"],"fragments":["f50"],"stories":["phantom-wars"],"origin":"review"},{"id":"electric-sparks-boundary","category":"knowledge","level":"editorial","title":"Elektrische Funken: Beobachtung und Omen zugleich","thesis":"Ein wahrscheinlich reales triboelektrisches Phänomen kann bei Damascius zugleich Naturbeobachtung, Anomalie und Vorzeichen sein.","basis":"PH 51A berichtet Funken an einem Pferd, an Menschen und an Damascius’ eigener Kleidung, teils mit Knacken und flammenartigem Leuchten ohne Verbrennung.","analysis":"Die Episode zeigt, dass moderne Grenzziehungen zwischen Physik, Kuriositätensammlung und Mantik historisch nicht vorausgesetzt werden dürfen. Eine Beobachtung kann genau sein und dennoch in einen religiösen Sinnzusammenhang eingehen.","caution":"„Triboelektrisch“ ist die plausible moderne Erklärung einzelner Beschreibungen; sie beweist nicht, dass jede überlieferte Einzelheit exakt beobachtet wurde.","sources":["PH 51A"],"people":["damascius","severus"],"fragments":["f51a"],"stories":[],"origin":"review"},{"id":"ammonius-survival","category":"institutions","level":"hypothesis","title":"Ammonius: Verrat, Kompromiss oder institutionelles Überleben?","thesis":"Ammonius zwingt dazu, moralisches Urteil und institutionelle Folgen auseinanderzuhalten: Ein verdächtiger Kompromiss könnte zugleich philosophische Lehre gerettet haben.","basis":"PH 117–118 verbindet Folter und Flucht des Kreises mit Ammonius’ Vereinbarung mit dem Vertreter der herrschenden Lehre; die Bedingungen sind verloren.","analysis":"Damascius erklärt Ammonius durch Gewinnsucht. Alternativ lässt sich ein wissenschaftlich orientierter Lehrer denken, der unter Druck einen Schutz- oder Lehrkompromiss schloss. Dass er beruflich weiterwirkte, ist sicherer als die Motive oder der Inhalt der Vereinbarung.","caution":"Es gibt keinen erhaltenen Vertrag und keinen Beweis, dass Ammonius Verstecke verriet. Alle stärkeren Urteile bleiben Hypothesen und müssen als solche sichtbar bleiben.","sources":["PH 117B–C","PH 118B","Athanassiadi, Einleitung zur Verfolgung 488/89"],"people":["ammonius","peter-mongus","horapollo","heraiscus"],"fragments":["f117","f118b"],"stories":["alexandria-collapse"],"origin":"review"},{"id":"active-virtue","category":"ethics","level":"textual","title":"Tugend muss sich im Handeln bewähren","thesis":"Damascius verwirft eine rein inaktive Tugend: Erst politische und existentielle Belastung zeigt, ob philosophische Habitus wirklich tragen.","basis":"PH 124 kritisiert Gelehrte, die in ihrer Ecke groß über Gerechtigkeit und Besonnenheit reden, im Handeln aber versagen; PH 117 liefert mit Folter und Schweigen den historischen Resonanzraum.","analysis":"Das korrigiert das Bild des weltabgewandten Neuplatonikers. Öffentliches Handeln kräftigt die Seele, deckt verborgene Schwächen auf und schafft Gelegenheiten zu Mut und Wohltätigkeit.","caution":"Damascius’ konkrete Helden- und Feindbilder sind parteiisch. Die allgemeine These über handelnde Tugend ist dennoch im Text klar bezeugt.","sources":["PH 124","PH 117B–C"],"people":["damascius","horapollo","heraiscus"],"fragments":["f124","f117"],"stories":["alexandria-collapse"],"origin":"review"},{"id":"marinus-self-censorship","category":"transmission","level":"editorial","title":"Marinus: Selbstzensur innerhalb der Schule","thesis":"Antike Texte verschwanden nicht nur durch äußere Verfolgung, sondern auch durch freiwillige Vernichtung im Namen von Schulautorität und Meistertreue.","basis":"PH 38A berichtet, Marinus habe seinen Philebos-Kommentar nach Isidors zurückhaltendem Urteil verbrannt; PH 97I–J erwähnt eine abweichende Parmenides-Deutung, die er vermutlich ebenfalls vernichtet hätte.","analysis":"Die Geschichten zeigen die produktive und zerstörerische Seite geistiger Sukzession. Kritik kann Irrtümer korrigieren, aber die Verehrung eines Meisters kann auch Varianten und abweichende Forschungswege aus dem Archiv löschen.","caution":"Damascius erzählt diese Vorgänge aus der Perspektive Isidors und seiner eigenen Schulpolitik. Die Qualität der verlorenen Werke lässt sich nicht mehr beurteilen.","sources":["PH 38A","PH 97I–J"],"people":["marinus","isidore","proclus"],"fragments":["f38a","f97"],"stories":["golden-chain"],"origin":"review"},{"id":"golden-chain-social-underside","category":"institutions","level":"editorial","title":"Die „goldene Kette“ besitzt eine soziale Unterseite","thesis":"Metaphysische Sukzession wird von Rivalität, Vermögen, Familieninteressen, Patronage und taktischen Bündnissen mitgetragen.","basis":"Die Abschnitte zur Nachfolge des Proklos und Athanassiadis Zusammenfassung zeigen schwache Nachfolger, Fraktionen, Erbschaften und Konflikte um die Schulleitung.","analysis":"Die Pointe ist nicht, dass die geistige Tradition bloß Täuschung gewesen sei. Vielmehr existiert jede sakrale Lehrerfolge zugleich als Institution mit materiellen und psychologischen Bedingungen. Damascius entmythologisiert seine eigene Schule, um sie moralisch neu zu begründen.","caution":"„Brutaler Nachfolgekampf“ fasst eine Vielzahl parteiischer Porträts zusammen; einzelne Motive können durch Damascius’ Polemik zugespitzt sein.","sources":["PH 38–39","PH 97–105","Athanassiadi, Zusammenfassung: die goldene Kette"],"people":["proclus","marinus","isidore","damascius"],"fragments":["f38a","f97"],"stories":["golden-chain"],"origin":"review"},{"id":"hegias-ritual-activism","category":"ethics","level":"textual","title":"Hegias: Frömmigkeit ohne Urteilskraft","thesis":"Damascius kritisiert nicht nur Gegner der Theurgie, sondern auch paganen Ritualaktivismus, der durch öffentliche Unklugheit die eigene Gemeinschaft gefährdet.","basis":"PH 145 beschreibt heimliche Restaurierungen und gefährlich sichtbaren Eifer; PH 150 formuliert Isidors Grundsatz, wer Gott werden wolle, müsse zuerst Mensch werden.","analysis":"Theurgie wird nicht verworfen, aber an philosophische Tugend und politische Urteilskraft gebunden. Dadurch unterscheidet Damascius zwischen religiöser Praxis, technischer Magie, Aktionismus und moralischer Reife.","caution":"Die Bewertung des Hegias stammt aus dem innerpaganen Konflikt und ist keine neutrale Beschreibung seiner Absichten oder tatsächlichen Folgen.","sources":["PH 145","PH 150"],"people":["hegias","isidore","damascius"],"fragments":["f145","f150"],"stories":[],"origin":"review"},{"id":"hypatia-hierarchy","category":"bias","level":"editorial","title":"Hypatia: Bewunderung und disziplinäre Herabsetzung","thesis":"Damascius’ positive Erinnerung an Hypatias politische Autorität steht neben einer Hierarchie, die den „wahren Philosophen“ über die Mathematikerin stellt.","basis":"PH 43E rühmt Hypatias Charakter und städtisches Ansehen und verurteilt ihre Ermordung; PH 106A kontrastiert sie dennoch mit Isidor.","analysis":"Der Widerspruch macht Damascius’ Wertordnung sichtbar: inspirierte, theologisch verwandelnde Philosophie steht über Mathematik und Fachgelehrsamkeit. Gerade die Schieflage ist historisch aufschlussreich, weil sie Erinnerungspolitik innerhalb des Neuplatonismus zeigt.","caution":"Die Hierarchie ist Damascius’ Urteil, kein sachliches Maß für Hypatias philosophische Bedeutung. Die App übernimmt sie nicht, sondern analysiert sie.","sources":["PH 43E","PH 106A"],"people":["hypatia","isidore","damascius"],"fragments":["f43e"],"stories":["hypatia-path"],"origin":"review"},{"id":"anti-rhetoric-paradox","category":"method","level":"editorial","title":"Anti-Rhetorik mit rhetorischer Brillanz","thesis":"Damascius verwirft Rhetorik als Karrieretechnik, behält aber ihre schärfsten Werkzeuge für seine philosophische Kritik.","basis":"PH 124 und die autobiographisch rekonstruierte Wende nach 488/89 stehen neben einem Werk voller pointierter Charakterbilder, Kontraste, Anekdoten und polemischer Verdichtung.","analysis":"Die „Bekehrung“ ist daher keine Abschaffung der Rhetorik. Damascius ordnet sie der Philosophie unter und richtet ihre Mittel gegen eine Bildungskultur, die sprachliche Virtuosität mit Wahrheit und Charakter verwechselt.","caution":"Die umfassende Kritik des spätantiken Bildungssystems ist besonders Athanassiadis Interpretation; das erhaltene Werk ist fragmentarisch und erlaubt keine vollständige Theorie der Rhetorik.","sources":["PH 124","Athanassiadi, Einleitung: Damascius und die Rhetorik"],"people":["damascius","horapollo"],"fragments":["f124"],"stories":["alexandria-collapse"],"origin":"review"},{"id":"zosime-inner-freedom","category":"persons","level":"textual","title":"Zosime: philosophische Freiheit ohne sozialen Rang","thesis":"Das Grabepigramm überträgt die Unterscheidung von äußerer Knechtschaft und innerer Freiheit auf eine versklavte Frau – nicht auf einen berühmten Philosophen.","basis":"Anthologia Graeca VII.553, Damascius zugeschrieben, sagt sinngemäß, Zosime sei früher nur dem Körper nach Sklavin gewesen und nun auch körperlich frei.","analysis":"Die wenigen Verse machen eine Randfigur zur Trägerin eines zentralen platonischen Freiheitsmotivs. Gerade die soziale Asymmetrie verleiht dem Epigramm seine Kraft: innerer Rang und äußerer Status fallen auseinander.","caution":"Über Zosimes Biographie wissen wir fast nichts. Aussagen über Damascius’ letzte Lebensphase in Syrien beruhen auf der Verbindung des Epigramms mit weiteren Zeugnissen.","sources":["Anth. Gr. VII.553","Athanassiadi, Testimonia und Appendix zum späten Damascius"],"people":["zosime","damascius"],"fragments":["zosime-epi"],"stories":["zosime-path"],"origin":"review"},{"id":"lost-marvel-encyclopedia","category":"transmission","level":"editorial","title":"Das Werk als Rest einer verlorenen Enzyklopädie des Außergewöhnlichen","thesis":"Die Abschweifungen der Philosophischen Geschichte sind kein bloßes Durcheinander, sondern Teil eines Erkenntnisverfahrens, das Lehren mit Körpern, Landschaften, Gerüchten und Anomalien verbindet.","basis":"Athanassiadi verweist auf Damascius’ verlorene Sammlung von 572 nach Typen geordneten Wunder- und Seltsamkeitsgeschichten; auch die Philosophische Geschichte enthält zahlreiche paradoxa und lokale Erzählungen.","analysis":"Geistesgeschichte besteht hier nicht nur aus Lehrsätzen. Sie umfasst Träume, Tiere, Pflanzen, heilige Orte, politische Katastrophen und die Geschichten, durch die eine Gemeinschaft sich selbst deutet. Die scheinbare Unordnung ist ein Archiv verschiedener Wirklichkeitstypen.","caution":"Die Zahl 572 und die Charakterisierung der verlorenen Sammlung stammen aus der antiken beziehungsweise editorisch rekonstruierten Werküberlieferung; der Inhalt dieser Sammlung ist nur indirekt greifbar.","sources":["Athanassiadi, Einleitung zu Damascius’ paradoxographischen Werken","Testimonia zu den verlorenen Werken"],"people":["damascius"],"fragments":["f50","f51a","f51d","f135","f142b"],"stories":["phantom-wars","sacred-geography","eshmun-path"],"origin":"review"},{"id":"three-ways-of-life","category":"ethics","level":"editorial","title":"Kronisch, heroisch, typhonisch: eine moralische Tiefenstruktur","thesis":"Damascius ordnet Charaktere nicht nur nach Lehren, sondern entlang von Lebensformen: innere Einheit, heroische Tatkraft und begehrende Zersplitterung.","basis":"Das Sarapio-Porträt und Athanassiadis Analyse verbinden die drei Lebensformen mit der Dreiteilung der Seele und mythologischen Figuren.","analysis":"Sarapio bildet das kronische Extrem, Pamprepius das typhonische. Die interessanteren Figuren liegen dazwischen: genial und begrenzt, fromm und unklug, wissenschaftlich bedeutend und moralisch verdächtig. Die Typologie erklärt Damascius’ ambivalente Porträts besser als ein einfaches Freund-Feind-Schema.","caution":"Die systematische Dreierordnung wird besonders durch Athanassiadis Rekonstruktion sichtbar; die fragmentarische Überlieferung bietet keine vollständig erhaltene Theorie in einem zusammenhängenden Abschnitt.","sources":["PH 111","Athanassiadi, Einleitung: Cronian, heroic, and Typhonian lives"],"people":["sarapio","pamprepius","asclepiodotus","ammonius","hegias","theosebius"],"fragments":["f111","f118b","f145"],"stories":["sarapio-path","golden-chain"],"origin":"review"},{"id":"history-from-below","category":"synthesis","level":"editorial","title":"Eine Geistesgeschichte von unten und von den Rändern","thesis":"Obwohl Damascius aristokratisch und hierarchisch denkt, bewahrt sein Werk eine ungewöhnliche Geschichte der Personen, die Tradition praktisch tragen.","basis":"Neben Proklos, Isidor und Hypatia treten Aedesia, Anthusa, Olympos, Iacobus, Zosime, namenlose Brahmanen, Gastgeber und lokale Erzähler.","analysis":"Die philosophische Welt erscheint als Ökosystem aus Unterricht, Fürsorge, Geld, Reisen, Ritualkompetenz, medizinischer Praxis, Erinnerung und Schutz. Sekundäre Figuren werden dadurch nicht zu Dekoration, sondern zu Bedingungen der Möglichkeit geistiger Kontinuität.","caution":"„Von unten“ ist ein modernes heuristisches Etikett. Damascius selbst bleibt sozial hierarchisch und interessiert sich nicht in moderner egalitärer Weise für alle Gruppen.","sources":["PH 41–56","PH 84–87","PH 111–124","Anth. Gr. VII.553"],"people":["aedesia","anthusa","olympos","iacobus","zosime","brahmans","sarapio"],"fragments":["f41","f42","f52","f56","f84e","f111","zosime-epi"],"stories":["sarapio-path","anthusa-path","brahmans-path","zosime-path"],"origin":"review"},{"id":"character-under-pressure","category":"synthesis","level":"editorial","title":"Charakterproben statt bloßer Lehrgeschichte","thesis":"Die leitende Frage lautet, woran sich ein Philosoph erkennen lässt, wenn Institutionen zerfallen und gelehrte Worte nicht mehr genügen.","basis":"Die Porträts werden wiederholt durch Verfolgung, Folter, Armut, Krankheit, institutionellen Konflikt oder politische Gefahr zugespitzt; PH 124 formuliert die Kritik unbewährter Tugend ausdrücklich.","analysis":"Damascius definiert Philosophie erzählerisch: Einsicht, Lebensform und Verhalten müssen unter Gefahr zusammenpassen. Bildung kann Weisheit hervorbringen, aber auch technische Virtuosität, gesellschaftliche Pose oder Feigheit.","caution":"Diese Leitfrage ist eine editorische Synthese des ganzen fragmentarischen Werkes, kein überlieferter Buchtitel oder wörtlicher Programmsatz.","sources":["PH 117–124","Athanassiadi, Einleitung und Zusammenfassung"],"people":["damascius","isidore","ammonius","horapollo","heraiscus"],"fragments":["f117","f118b","f124"],"stories":["alexandria-collapse"],"origin":"review"},{"id":"distributed-philosophy","category":"synthesis","level":"hypothesis","title":"Philosophie als verteilte Infrastruktur","thesis":"Die Tradition funktioniert wie ein verteiltes System: Lehrer allein genügen nicht; Ausfälle von Fürsorge, Finanzierung, Schutz, Ritualwissen oder Reisewegen können das Ganze unterbrechen.","basis":"Aedesia sichert Ausbildung und Ressourcen; Olympos und die Mysterienvermittler bewahren Praxis; Ammonius hält Unterricht institutionell offen; Reisen verbinden lokale Wissensräume.","analysis":"Diese Zusammenschau erklärt, warum scheinbar „sekundäre“ Personen im Werk so bedeutsam sind. Philosophisches Wissen ist nicht nur Inhalt in Köpfen oder Büchern, sondern eine abhängige soziale Infrastruktur mit mehreren möglichen Bruchstellen.","caution":"Der Vergleich mit einem verteilten System ist eine moderne analytische Metapher. Er dient der Strukturierung, nicht der Behauptung, Damascius habe eine solche Theorie formuliert.","sources":["PH 41–56","PH 117–118","Athanassiadi, Zusammenfassung"],"people":["aedesia","olympos","epiphanius","euprepius","ammonius"],"fragments":["f41","f42","f56","f118b"],"stories":["alexandria-collapse"],"origin":"new"},{"id":"epistemic-instruments","category":"synthesis","level":"hypothesis","title":"Eine Konkurrenz epistemischer Instrumente","thesis":"Das Werk lässt sich als Wettbewerb verschiedener Erkenntnisinstrumente lesen: Monochord und Experiment, gereinigter Körper, Traum, Wolke, Statue, Landschaft, Text und persönliche Überlieferung.","basis":"Asclepiodotus experimentiert; Heraiscus reagiert körperlich; Anthusa entwickelt Mantik; die Styx wird räumlich geprüft; Photios und Suda bewahren Textreste.","analysis":"Damascius ordnet diese Instrumente hierarchisch, doch die Überlieferung macht gerade ihre Vielfalt sichtbar. Für heutige Leser ist interessant, dass „Beobachtung“ nie voraussetzungslos ist: Jedes Instrument setzt eine Theorie dessen voraus, was überhaupt als Zeichen gelten kann.","caution":"Dies ist eine neue, ausdrücklich als solche gekennzeichnete Synthese der App. Sie verbindet mehrere Passagen, ohne ihnen eine einheitliche antike Methodologie zu unterstellen.","sources":["PH 51–52","PH 76","PH 85–87","PH 135","Überlieferung durch Photios und Suda"],"people":["asclepiodotus","heraiscus","anthusa","damascius","photius"],"fragments":["f52","f76","f85b","f87a","f135"],"stories":["asclepiodotus-path","anthusa-path","sacred-geography"],"origin":"new"},{"id":"transmission-bottlenecks","category":"synthesis","level":"hypothesis","title":"Überlieferung besitzt Engpässe und letzte Träger","thesis":"Mehrere Geschichten zeigen, wie eine Tradition von wenigen Personen abhängt und deshalb an biographischen Engpässen abbrechen kann.","basis":"Epiphanius und Euprepius kennen noch die ältere Generation; Olympos unterrichtet ohne gesicherte Nachfolge; Aedesia erhält eine Familie; Marinus vernichtet eigene Texte.","analysis":"Nicht jede Tradition verschwindet durch ein großes Verbot. Sie kann an fehlenden Lehrern, unterbrochenen Familien, zerstörten Manuskripten oder dem Ausbleiben geeigneter Schüler erlöschen. Die Fragmentform des Werkes spiegelt diesen Prozess auf der Ebene der Textüberlieferung.","caution":"„Engpass“ ist eine moderne Modellierung. Die einzelnen Fälle sind historisch verschieden und dürfen nicht zu einem einheitlichen Niedergangsgesetz verallgemeinert werden.","sources":["PH 38A","PH 41–42","PH 56","Photios und Suda"],"people":["epiphanius","euprepius","olympos","aedesia","marinus"],"fragments":["f38a","f41","f42","f56"],"stories":["golden-chain"],"origin":"new"},{"id":"archive-of-absences","category":"synthesis","level":"hypothesis","title":"Ein Archiv, das durch seine Lücken spricht","thesis":"Verbrannte Kommentare, verlorene Wunderbücher, abgebrochene Biographien und widersprüchliche Exzerpte machen Abwesenheit selbst zu einer historischen Information.","basis":"Marinus vernichtet Werke; Damascius’ Paradoxographie ist verloren; die Philosophische Geschichte lebt in Photios- und Suda-Fragmenten weiter.","analysis":"Die App behandelt Lücken daher nicht als leere Stellen, die beliebig gefüllt werden dürften. Sie fragt, welcher soziale oder textuelle Prozess eine Abwesenheit erzeugt hat: Selbstzensur, Auswahl des Exzerptors, materielle Überlieferung oder institutioneller Zusammenbruch.","caution":"Aus einer Lücke folgt nicht automatisch ihre Ursache. Mehrere Verlustmechanismen sind möglich und müssen getrennt benannt werden.","sources":["PH 38A","PH 97I–J","Photios, Bibliotheca cod. 242","Suda","Athanassiadi, Rekonstruktionsbericht"],"people":["marinus","damascius","photius"],"fragments":["f38a","f97"],"stories":["golden-chain"],"origin":"new"},{"id":"adaptation-ambiguity","category":"synthesis","level":"hypothesis","title":"Anpassung und Treue bleiben moralisch mehrdeutig","thesis":"Ammonius, Hegias und Damascius zeigen drei Risiken: zu viel Anpassung, zu sichtbarer Widerstand und die nachträgliche moralische Selbststilisierung.","basis":"Ammonius’ Vereinbarung ist unklar; Hegias’ Restaurationsaktivismus gilt als gefährlich; Damascius schreibt als Beteiligter und Richter.","analysis":"Das Werk bietet keine einfache Regel, wann Kompromiss feige oder klug, Widerstand mutig oder töricht ist. Gerade deshalb bleibt es aktuell: Entscheidungen unter Druck müssen ohne vollständige Information getroffen und später von parteiischen Erinnerungen beurteilt werden.","caution":"Die Dreierkonstellation ist eine neue Synthese der App. Sie darf die sehr unterschiedlichen historischen Situationen nicht nivellieren.","sources":["PH 118B","PH 145","PH 150","Athanassiadi, Einleitung zur Autorsituation"],"people":["ammonius","hegias","damascius"],"fragments":["f118b","f145","f150"],"stories":["alexandria-collapse"],"origin":"new"}],"registerPeople":[{"id":"hermeias","name":"Hermeias","greek":"Ἑρμείας","dates":"5. Jh.","role":"Philosoph; Ehemann Aedesias","origin":"Alexandria / Athen","places":["alexandria","athens"],"summary":"Ehemann Aedesias und Vater von Ammonius und Heliodorus; er studierte gemeinsam mit Proklos bei Syrianus.","profileType":"source","sources":["PH 54; PH 57B"],"active":[420,455]},{"id":"heliodorus","name":"Heliodoros","greek":"Ἡλιόδωρος","dates":"5. Jh.","role":"Sohn von Hermeias und Aedesia","origin":"Alexandria / Athen","places":["alexandria","athens"],"summary":"Jüngerer Bruder des Ammonius; beide wurden von Aedesia nach Athen geführt und studierten bei Proklos. Damascius bewertet Heliodoros als schlichter und oberflächlicher als seinen Bruder.","profileType":"source","sources":["PH 57B"],"active":[440,500]},{"id":"hierax","name":"Hierax","greek":"Ἱέραξ","dates":"5. Jh.","role":"Alexandrinischer Zeitgenosse des Ammonius","origin":"Alexandria / Athen","places":["alexandria","athens"],"summary":"Bruder eines Synesios; er reiste zusammen mit Aedesia und ihren Söhnen nach Athen und erscheint später als Beobachter außergewöhnlicher Tiere.","profileType":"source","sources":["PH 57B; PH 58B"],"active":[445,500]},{"id":"asclepiades","name":"Asclepiades","greek":"Ἀσκληπιάδης","dates":"5. Jh.","role":"Ägyptischer Religionsgelehrter","origin":"Alexandria","places":["alexandria"],"summary":"Vater Horapollos und älterer Bruder des Heraiscus; er verband ägyptische Religionskunde, Hymnendichtung und den Versuch einer vergleichenden Theologie.","profileType":"source","sources":["PH 72A–D; Athanassiadi, Introduction"],"active":[420,485]},{"id":"dorus","name":"Dorus","greek":"Δῶρος","dates":"5. Jh.","role":"Reisegefährte und möglicher Gastgeber","origin":"Bostra / Hauran","places":["bostra","heliopolis"],"summary":"Begleitete Isidor und Damascius auf Teilen ihrer syrisch-arabischen Reise; Athanassiadi hält ihn möglicherweise für den Gastgeber in Bostra.","profileType":"source","sources":["PH 134–140; Athanassiadi, Introduction"],"active":[460,500]},{"id":"harpocras","name":"Harpocras","greek":"Ἁρποκρᾶς","dates":"5. Jh.","role":"Ägyptischer Intellektueller im Verfolgungskontext","origin":"Alexandria","places":["alexandria"],"summary":"Bekannter des Ammonius, dessen Aufenthaltsort während der Verfolgung gesucht wurde; Isidor versuchte ihn zu warnen.","profileType":"source","sources":["PH 117A–C"],"active":[450,490]},{"id":"julian-damascius","name":"Julian","greek":"Ἰουλιανός","dates":"5. Jh.","role":"Jüngerer Bruder des Damascius","origin":"Damaskus / Alexandria","places":["damascus","alexandria"],"summary":"Studierte wie Damascius und schwieg trotz Misshandlung während der Krise von 488/89; Athanassiadi nutzt ihn als Beispiel unerwarteter Tapferkeit.","profileType":"source","sources":["PH 119J; Athanassiadi, Introduction"],"active":[465,510]},{"id":"gessius","name":"Gessius","greek":"Γέσσιος","dates":"5./6. Jh.","role":"Arzt und ehemaliger Schüler","origin":"Alexandria","places":["alexandria"],"summary":"Ein Arzt aus dem alexandrinischen Milieu, den Damascius als weiteres Beispiel dafür behandelt, dass widrige Umstände verborgene Charakterstärke sichtbar machen können.","profileType":"source","sources":["PH 128; Athanassiadi, Introduction"],"active":[455,520]},{"id":"antony-gaza","name":"Antony von Gaza","greek":"Ἀντώνιος","dates":"5. Jh.","role":"Pagane Vertrauensperson und Helfer","origin":"Gaza","places":["gaza"],"summary":"Half Isidor und Damascius bei ihrer Flucht; Damascius erinnert sich Jahrzehnte später mit besonderer Dankbarkeit an ihn.","profileType":"source","sources":["PH 132–133; Athanassiadi, Introduction"],"active":[450,500]},{"id":"severianus","name":"Severianus","greek":"Σεβηριανός","dates":"5. Jh.","role":"Rhetorischer Lehrer aus Damaskus","origin":"Damaskus","places":["damascus"],"summary":"Ein wohlhabender Landsmann und Familienfreund, bei dem Damascius und Julian wahrscheinlich eine frühe rhetorische Ausbildung erhielten.","profileType":"source","sources":["PH 108; Athanassiadi, Introduction"],"active":[430,490]},{"id":"zacharias-mytilene","name":"Zacharias von Mytilene","greek":"Ζαχαρίας","dates":"ca. 465–nach 536","role":"Christlicher Schüler und Parallelzeuge","origin":"Alexandria","places":["alexandria"],"summary":"Schüler des Ammonius und Autor der Vita Severi, einer zentralen christlichen Parallelquelle für das alexandrinische Schulmilieu und die Ereignisse der 480er Jahre.","profileType":"parallel","sources":["Zacharias, Vita Severi; Athanassiadi, Introduction"],"active":[465,536]},{"id":"severus-antioch","name":"Severus von Antiochia","greek":"Σεβῆρος","dates":"5./6. Jh.","role":"Christlicher Student und späterer Bischof","origin":"Alexandria / Beirut","places":["alexandria","berytius"],"summary":"Seine von Zacharias verfasste Biographie spiegelt das alexandrinische Bildungs- und Konfliktmilieu aus einer christlichen Perspektive.","profileType":"parallel","sources":["Zacharias, Vita Severi"],"active":[465,538]},{"id":"aeneas-gaza","name":"Aeneas von Gaza","greek":"Αἰνείας","dates":"5./6. Jh.","role":"Christlicher Platoniker und Parallelzeuge","origin":"Gaza / Alexandria","places":["gaza","alexandria"],"summary":"Sein Dialog Theophrastus bewahrt Beziehungen und Lehrtraditionen aus dem alexandrinischen Milieu, darunter Hinweise auf Hierokles und Gessius.","profileType":"parallel","sources":["Aeneas of Gaza, Theophrastus; Athanassiadi notes"],"active":[450,520]},{"id":"theon-alexandria","name":"Theon von Alexandria","greek":"Θέων","dates":"4./5. Jh.","role":"Mathematiker; Vater Hypatias","origin":"Alexandria","places":["alexandria"],"summary":"Mathematiker und Astronom sowie Vater Hypatias; wichtig für den wissenschaftlichen Hintergrund der alexandrinischen Bildungstradition.","profileType":"context","sources":["Contextual source profile"],"active":[335,405]},{"id":"cyril-alexandria","name":"Kyrill von Alexandria","greek":"Κύριλλος","dates":"ca. 376–444","role":"Bischof von Alexandria","origin":"Alexandria","places":["alexandria"],"summary":"Kirchlicher Machthaber, dessen Neid Damascius mit der Ermordung Hypatias verbindet; die genaue Verantwortung ist quellenkritisch zu differenzieren.","profileType":"context","sources":["PH 43E; parallel late-antique sources"],"active":[376,444]},{"id":"aspar","name":"Aspar","greek":"Ἄσπαρ","dates":"† 471","role":"Heermeister am oströmischen Hof","origin":"Konstantinopel","places":["constantinople"],"summary":"Seine Ermordung im Jahr 471 bildet den historischen Bezugspunkt für Anthusas Wolkenvision.","profileType":"context","sources":["PH 52"],"active":[420,471]},{"id":"leo-i","name":"Leo I.","greek":"Λέων","dates":"Reg. 457–474","role":"Oströmischer Kaiser","origin":"Konstantinopel","places":["constantinople"],"summary":"Kaiser zur Zeit der Vandalenexpedition und der Ermordung Aspars; politischer Rahmen der Anthusa-Episode.","profileType":"context","sources":["PH 52; historical context"],"active":[457,474]},{"id":"illus","name":"Illus","greek":"Ἰλλοῦς","dates":"† 488","role":"General und Rebell","origin":"Konstantinopel","places":["constantinople"],"summary":"Anführer des Aufstands gegen Zeno; Pamprepius verband sich mit seinem Lager und mit Hoffnungen auf pagane Restauration.","profileType":"context","sources":["Athanassiadi, Introduction"],"active":[460,488]},{"id":"zeno","name":"Zeno","greek":"Ζήνων","dates":"Reg. 474–491","role":"Oströmischer Kaiser","origin":"Konstantinopel","places":["constantinople"],"summary":"Kaiser während des Aufstands des Illus und der alexandrinischen Krisenjahre.","profileType":"context","sources":["Athanassiadi, Introduction"],"active":[474,491]},{"id":"justinian","name":"Justinian I.","greek":"Ἰουστινιανός","dates":"Reg. 527–565","role":"Oströmischer Kaiser","origin":"Konstantinopel / Athen","places":["constantinople","athens"],"summary":"Seine Gesetzgebung und das Unterrichtsverbot von 529 bilden den politischen Rahmen für die Abreise der Philosophen aus Athen.","profileType":"context","sources":["Athanassiadi, Introduction; legal and narrative parallels"],"active":[527,565]},{"id":"khusrau","name":"Chosrau I.","greek":"Χοσρόης","dates":"Reg. 531–579","role":"Sasanidischer König","origin":"Ktesiphon","places":["ctesiphon"],"summary":"Empfing die aus Athen kommenden Philosophen und diskutierte mit ihnen philosophische Fragen; die idealisierte Erwartung wich rasch einer ambivalenten Erfahrung.","profileType":"parallel","sources":["Agathias II; Athanassiadi, Introduction"],"active":[531,579]},{"id":"agathias","name":"Agathias","greek":"Ἀγαθίας","dates":"6. Jh.","role":"Historiker und Dichter","origin":"Konstantinopel","places":["constantinople"],"summary":"Wichtigster literarischer Zeuge für die Persienreise und die Schutzklausel im Frieden von 532.","profileType":"parallel","sources":["Agathias, Histories II"],"active":[530,580]},{"id":"simplicius","name":"Simplikios","greek":"Σιμπλίκιος","dates":"6. Jh.","role":"Neuplatonischer Kommentator und Exilgefährte","origin":"Athen / Persien","places":["athens","ctesiphon"],"summary":"Philosoph aus dem Umfeld des Damascius; die Testimonien nennen ihn als Gefährten, und seine Kommentare bewahren abweichende Wertungen einzelner Lehrer.","profileType":"parallel","sources":["Testimonium I; Simplicius, commentaries"],"active":[500,560]},{"id":"eulalius","name":"Eulalios von Phrygien","greek":"Εὐλάλιος","dates":"6. Jh.","role":"Philosoph und Gefährte des Damascius","origin":"Athen / Persien","places":["athens","ctesiphon"],"summary":"In einem Testimonium als phrygischer Gefährte des Damascius und des Simplikios genannt.","profileType":"parallel","sources":["Testimonium I"],"active":[500,550]},{"id":"priscian","name":"Priscian von Lydien","greek":"Πρισκιανός","dates":"6. Jh.","role":"Philosoph und Autor der Chosrau-Antworten","origin":"Athen / Ktesiphon","places":["athens","ctesiphon"],"summary":"Sein in lateinischer Übersetzung erhaltenes Werk beantwortet Fragen Chosraus zu Seele, Körper, Schicksal, Träumen, Geographie und Anthropologie.","profileType":"parallel","sources":["Priscian, Solutiones; Athanassiadi, Introduction"],"active":[500,550]},{"id":"syrianus","name":"Syrianos","greek":"Συριανός","dates":"† ca. 437","role":"Leiter der Athener Schule","origin":"Athen","places":["athens"],"summary":"Lehrer des Proklos und des Hermeias; Aedesia war mit ihm verwandt. Er gehört zur institutionellen Vorgeschichte der späteren Nachfolgekämpfe.","profileType":"context","sources":["PH 54; PH 57B"],"active":[400,437]},{"id":"plutarch-athens","name":"Plutarch von Athen","greek":"Πλούταρχος","dates":"† ca. 431","role":"Früher Leiter der Athener Schule","origin":"Athen","places":["athens"],"summary":"Vorgänger des Syrianos und wichtiger früher Knoten der spätantiken athenischen Schultradition.","profileType":"context","sources":["Athanassiadi, summary and school genealogy"],"active":[350,431]},{"id":"hierocles","name":"Hierokles","greek":"Ἱεροκλῆς","dates":"5. Jh.","role":"Alexandrinischer Philosoph und Rhetor","origin":"Alexandria / Konstantinopel","places":["alexandria","constantinople"],"summary":"Lehrer des Theosebius; Damascius bewundert seine gedankliche Weite und berichtet von Verfolgung, Misshandlung und späterer Rückkehr nach Alexandria.","profileType":"source","sources":["PH 45A–B"],"active":[400,470]},{"id":"salustius","name":"Salustius","greek":"Σαλούστιος","dates":"5. Jh.","role":"Philosoph und Rhetor mit kynischer Lebensform","origin":"Alexandria / Athen / Emesa","places":["alexandria","athens","emesa"],"summary":"Kam mit Isidor von Athen nach Alexandria; Damascius porträtiert seine scharfe Rede, seine widersprüchliche Lebensform und seine Distanz zu konventionellen Schulrollen.","profileType":"source","sources":["PH 60–66"],"active":[440,500]},{"id":"john-philoponus","name":"Johannes Philoponos","greek":"Ἰωάννης Φιλόπονος","dates":"5./6. Jh.","role":"Christlicher Philosoph und Kommentator","origin":"Alexandria","places":["alexandria"],"summary":"Schüler des Ammonius und später ein bedeutender christlicher Kritiker aristotelischer und neuplatonischer Positionen; wichtig für die Nachgeschichte der Schule.","profileType":"context","sources":["Athanassiadi, Introduction"],"active":[490,570]}],"registerRelationships":[["hermeias","aedesia","Ehe / gemeinsame Dynastie"],["hermeias","ammonius","Vater / Sohn"],["hermeias","heliodorus","Vater / Sohn"],["syrianus","proclus","Lehrer / Schüler"],["syrianus","hermeias","Lehrer / Schüler"],["plutarch-athens","syrianus","Vorgänger / Nachfolge function mapLabels(cfg){const set=state.mapMode==='regional'?labelsRegional:labelsWide;return set.regions.map(([n,lon,lat])=>{const [x,y]=project(lon,lat,cfg);const name=state.lang==='de'?({'Hellas':'Hellas','Asia Minor':'Kleinasien','Aegyptus':'Ägypten','Syria':'Syrien','Mesopotamia':'Mesopotamien','Arabia':'Arabien','Persia':'Persien','India':'Indien','Italia':'Italia'}[n]||n):n;return `<text class="region-label" x="${x}" y="${y}" text-anchor="middle">${esc(name)}</text>`}).join('')+set.seas.map(([n,lon,lat])=>{const [x,y]=project(lon,lat,cfg);const name=state.lang==='de'?({'Mediterraneum':'Mittelmeer','Aegean Sea':'Ägäis','Black Sea':'Schwarzes Meer','Red Sea':'Rotes Meer','Arabian Sea':'Arabisches Meer'}[n]||n):n;return `<text class="sea-label" x="${x}" y="${y}" text-anchor="middle">${esc(name)}</text>`}).join('')}
function routePath(r,cfg,i){const a=find(D.places,r.from),b=find(D.places,r.to);if(!a||!b||!inBounds(a,cfg)||!inBounds(b,cfg))return'';if(state.routeFilter!=='all'&&r.group!==state.routeFilter)return'';const [x1,y1]=project(a.lon,a.lat,cfg),[x2,y2]=project(b.lon,b.lat,cfg);const bend=Math.max(22,Math.min(90,Math.abs(x2-x1)*.13))*(i%2?1:-1);const cx=(x1+x2)/2,cy=(y1+y2)/2+bend;const hyp=r.certainty==='hypothetical'?' hyp':'';return `<path class="route ${r.group}${hyp}" data-route="${r.id}" d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}"/>`}
function labelWidth(name){return Math.max(52,Math.min(190,18+[...String(name)].length*6.45))}
function rectOverlap(a,b,pad=5){return !(a.x+a.w+pad<=b.x||b.x+b.w+pad<=a.x||a.y+a.h+pad<=b.y||b.y+b.h+pad<=a.y)}
function labelCandidates(x,y,w,h){return[
 {x:x+12,y:y-24},{x:x+12,y:y+8},{x:x-w-12,y:y-24},{x:x-w-12,y:y+8},
 {x:x-w/2,y:y-36},{x:x-w/2,y:y+20},{x:x+24,y:y-8},{x:x-w-24,y:y-8},
 {x:x+34,y:y-38},{x:x-w-34,y:y+22},{x:x+34,y:y+18},{x:x-w-34,y:y-38}
]}
function collisionScore(r,placed,reserved){let score=0;for(const q of [...placed,...reserved]){if(rectOverlap(r,q,3)){const ox=Math.max(0,Math.min(r.x+r.w,q.x+q.w)-Math.max(r.x,q.x)),oy=Math.max(0,Math.min(r.y+r.h,q.y+q.h)-Math.max(r.y,q.y));score+=ox*oy+1000}}return score}
function layoutMainLabels(cfg,items,reserved=[]){const placed=[];const margin=8,h=22;const priority=['alexandria','menouthis','athens','attica','aphrodisias','hierapolis','constantinople','rome','ctesiphon'];const sorted=[...items].sort((a,b)=>priority.indexOf(a.id)-priority.indexOf(b.id));return sorted.map(p=>{const [px,py]=project(p.lon,p.lat,cfg),name=placeName(p),w=labelWidth(name);const candidates=labelCandidates(px,py,w,h).map(r=>({...r,w,h})).filter(r=>r.x>=margin&&r.y>=margin&&r.x+r.w<=cfg.w-margin&&r.y+r.h<=cfg.h-margin);let best=candidates.find(r=>![...placed,...reserved].some(q=>rectOverlap(r,q,5)));if(!best){best=[...candidates].sort((a,b)=>collisionScore(a,placed,reserved)-collisionScore(b,placed,reserved))[0]}placed.push(best);const tx=best.x+8,ty=best.y+15;const edgeX=px<best.x?best.x:px>best.x+best.w?best.x+best.w:Math.max(best.x+7,Math.min(px,best.x+best.w-7));const edgeY=py<best.y?best.y:py>best.y+best.h?best.y+best.h:Math.max(best.y+4,Math.min(py,best.y+best.h-4));const col=mapColors[p.mapCategory]||'#6aa7c7';return `<g data-place="${p.id}" class="map-node map-labelled"><line class="place-label-leader" x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${edgeX.toFixed(1)}" y2="${edgeY.toFixed(1)}"/><circle class="pulse" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="13" stroke="${col}"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5.5" fill="${col}"/><rect class="place-label-box" x="${best.x.toFixed(1)}" y="${best.y.toFixed(1)}" width="${best.w.toFixed(1)}" height="${best.h}" rx="7"/><text class="place-label-text" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}">${esc(name)}</text><title>${esc(name)} · ${fmtCoord(p)}</title></g>`}).join('')}
