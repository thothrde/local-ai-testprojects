ysik","duration":"11 Min.","tone":"experimentell","cover":"monochord","intro":"Ein Universalgelehrter versucht, eine Klangwelt wiederzugewinnen, die seine Zeit nicht mehr hören kann.","scenes":[{"title":"220 Positionen","text":"Am Monochord verschiebt Asclepiodotus den Steg in mindestens 220 Positionen, um die enharmonische Diesis zu rekonstruieren.","place":"aphrodisias","people":["asclepiodotus"],"source":"PH 85B"},{"title":"Das historische Ohr","text":"Eine Kultur kann die Fähigkeit verlieren, ein Intervall überhaupt wahrzunehmen.","place":"aphrodisias","people":["asclepiodotus"],"source":"PH 85B"},{"title":"Der giftige Abstieg","text":"In Hierapolis schützt er sich mit eingeschlossener Außenluft und untersucht einen tödlichen unterirdischen Dampf.","place":"hierapolis","people":["asclepiodotus","damascius"],"source":"PH 87A"},{"title":"Medizin als Rekonstruktion","text":"Er stellt den Gebrauch der weißen Nieswurz wieder her.","place":"aphrodisias","people":["asclepiodotus","iacobus"],"source":"PH 85D"},{"title":"Damascius’ Abwehr","text":"Gerade seine empirische Genialität macht ihn zum gefährlichen Gegenmodell.","place":"aphrodisias","people":["asclepiodotus","damascius","isidore"],"source":"Athanassiadi 1999, Introduction"}]},{"id":"anthusa-path","title":"Die Frau, die aus Wolken las","subtitle":"Anthusa und eine neu erfundene Mantik","duration":"7 Min.","tone":"visuell","cover":"clouds","intro":"Eine persönliche Sorge, ein Traum und ein politisches Ereignis werden zur Gründungsgeschichte einer Methode.","scenes":[{"title":"Gebet an beide Horizonte","text":"Anthusa betet zur aufgehenden Sonne; der verstorbene Vater fordert sie im Traum auf, auch die untergehende Sonne anzurufen.","place":"aegae","people":["anthusa"],"source":"PH 52"},{"title":"Mann, Löwe, Verschlingen","text":"Zwei Wolken nehmen Gestalt an. Ein Löwe verschlingt einen gotisch wirkenden Mann.","place":"constantinople","people":["anthusa"],"source":"PH 52"},{"title":"Politische Erfüllung","text": ange":"322–323","greekPages":"322","translationPages":"323","openPages":[323],"verificationCue":"Isidor zu Hegias: Künftige Götter müssen zuerst Menschen werden.","verified":true,"verifiedVersion":"1.0.1","verifiedDate":"2026-08-06"},{"id":"zosime-epi","title":"Zosimes Grabepigramm","fragment":"Anth. Gr. VII.553","witness":"Inschrift + Anthologia Graeca","page":49,"status":"externes Selbstzeugnis","greek":"ἡ πρὶν ἐοῦσα μόνῳ τῷ σώματι δούλη","paraphrase":"Die Tote war nur körperlich versklavt; nun findet auch der Körper Freiheit.","people":["zosime","damascius"],"places":["emesa"],"notes":"Kein Fragment des Werkes, aber zentral für Damascius’ späte Biographie.","pageRange":"48–49","greekPages":"48","translationPages":"49","openPages":[49],"verificationCue":"Grabepigramm: zuerst nur körperlich versklavt, nun auch körperlich frei.","verified":true,"verifiedVersion":"1.0.1","verifiedDate":"2026-08-06"}],"glossary":[{"term":"Kronisches Leben","greek":"Κρόνιος βίος","definition":"Von Vernunft, Einheit und innerer Sammlung geprägte Lebensform; Sarapio ist das Idealbild."},{"term":"Typhonisches Leben","greek":"Τυφώνιος βίος","definition":"Zersplitterung durch Begierde, Machtstreben, Unwahrheit und gesellschaftliche Gewaltsamkeit."},{"term":"Bacchus","greek":"Βάκχος","definition":"Metapher für den wahren Philosophen, der philosophische Einsicht und hieratische Erfahrung vereinigt."},{"term":"Theurgie","greek":"θεουργία","definition":"Rituelle Praxis, welche die Seele durch göttliche Symbole und Ursachen emporführen soll."},{"term":"Diadochos","greek":"διάδοχος","definition":"Nachfolger bzw. Leiter einer philosophischen Schule; spiritueller Rang und umkämpfte Institution."},{"term":"Polydoxia","greek":"πολυδοξία","definition":"Vielheit von Meinungen; Risiko ungerichteter Bücher- und Hörgelehrsamkeit."},{"term":"Genesis","greek":"γένεσις","definition":"Bereich des Werdens und der Verkörperung; Gegensatz zu intelligiblem Sein und Einheit."},{"term":"Eumoiria","greek":"εὐμοιρία","definition":"Angeborene glückliche Intuition oder besondere Begabung."},{"term":"Patria","greek":"πάτρια","definition":"Lokale Traditionen, Ursprungs- und Ortsgeschichten."},{"term":"Paradoxa","greek":"παράδοξα","definition":"Berichte über Wunderbares und Anomalien; bei Damascius eine Erkenntnisform."},{"term":"Prosopographie","greek":"προσωπογραφία","definition":"Geschichte durch Beziehungsnetze von Personen, Familien, Schulen und Ämtern."},{"term":"Suda","greek":"Σοῦδα","definition":"Byzantinisches Lexikon des 10. Jahrhunderts mit vielen Damascius-Fragmenten."},{"term":"Photios-Epitome","greek":"Βιβλιοθήκη, κώδιξ 242","definition":"Wichtigste zusammenhängende Überlieferung des verlorenen Werkes."},{"term":"Hellenismus","greek":"Ἑλληνισμός","definition":"Pagane religiös-philosophische Lebensordnung, nicht nur Sprache oder Bildung."},{"term":"Heilige Geographie","greek":"ἱερὰ τοπογραφία","definition":"Landschaften, Quellen, Höhlen und Städte als Träger göttlicher Präsenz."},{"term":"Rhetorik","greek":"ῥητορική","definition":"Notwendige Technik, aber gefährlich, wenn Karriere und Schein über Wahrheit gestellt werden."}],"sources":[{"id":"athanassiadi","title":"Polymnia Athanassiadi, Damascius: The Philosophical History","type":"Moderne Edition","date":"1999","note":"Grundlage der App: rekonstruierter griechischer Text, englische Übersetzung, Kommentar, Testimonien und Anhänge."},{"id":"photius-source","title":"Photios, Bibliotheca, Codex 242","type":"Byzantinische Epitome","date":"9. Jh.","note":"Wichtigster zusammenhängender Überlieferungszeuge; kürzt und beurteilt aus christlicher Perspektive."},{"id":"suda-source","title":"Suda-Lexikon","type":"Lexikographische Exzerpte","date":"10. Jh.","note":"Bewahrt zusätzliche Splitter; Reihenfolge und Kontext sind häufig verloren."},{"id":"marinus-source","title":"Marinus, Vita Procli","type":"Zeitnahe Hagiographie","date":"spätes 5. Jh.","note":"Vergleichsquelle zur Athener Schule und zum Proklosbild."},{"id":"zacharias-source","title":"Zacharias von Mytilene, Vita Severi / Ammonius","type":"Christliche Parallelquelle","date":"5./6. Jh.","note":"Ermöglicht Gegenlesen des alexandrinischen Schulmilieus."},{"id":"agathias-source","title":"Agathias, Historien II","type":"Historische Parallelquelle","date":"6. Jh.","note":"Hauptquelle für Persienreise und Rückkehrgarantie."},{"id":"socrates-source","title":"Sokrates Scholastikos, Kirchengeschichte VII.15","type":"Historische Parallelquelle","date":"5. Jh.","note":"Frühere Quelle zur Ermordung Hypatias."},{"id":"inscriptions-source","title":"Inschriften und Papyri","type":"Dokumentarische Quellen","date":"Spätantike","note":"Unter anderem das Zosime-Epigramm und Zeugnisse aus Aphrodisias."}],"i18n":{"people":{"damascius":{"role":"Philosopher, school head, historian","origin":"Damascus","summary":"A rhetorician who turned to philosophy after the Alexandrian persecutions and later led the Platonic school in Athens.","why":"He judges people not only by doctrines but by whether insight, way of life, and action remain coherent under pressure.","tags":["Rhetoric","Platonism","Exile","Institutions"]},"isidore":{"role":"Philosopher and teacher of Damascius","origin":"Alexandria","summary":"An eccentric, orally oriented philosopher whom Damascius idealises as an embodiment of immediate, Bacchic insight.","why":"He joins philosophical intuition and moral testing with distrust of mere book learning.","tags":["Socrates","Bacchus","Intuition","Teacher"]},"sarapio":{"role":"Urban hermit","origin":"Alexandria","summary":"He lived alone in a tiny house and owned only two or three books, including Orphic poetry.","why":"His voluntary poverty of books is an epistemic policy against fragmentation by borrowed opinions.","tags":["Orpheus","Asceticism","Cronian life","Silence"]},"asclepiodotus":{"role":"Polymath, physician, musician, mathematician","origin":"Alexandria / Aphrodisias","summary":"He experimented with musical intervals, medicine, toxic vapours, and natural phenomena; Damascius both admired and attacked him.","why":"He embodies a rival ideal of philosophy: truth through experiment, reconstruction, and technical mastery.","tags":["Experiment","Mathematics","Music","Medicine"]},"heraiscus":{"role":"Egyptian ritual specialist","origin":"Egypt","summary":"He was said to distinguish divinely animated cult images from inert ones and to perceive sacred presence bodily.","why":"His body becomes a resonant instrument of the sacred, opposed to detached experiment.","tags":["Aion","Osiris","Cult images","Divination"]},"horapollo":{"role":"Head of an Alexandrian school","origin":"Egypt","summary":"A rhetorician and teacher in an international pagan-Christian milieu; arrested and tortured during persecution.","why":"His life reveals the school as a social, religious, and political node.","tags":["School","Conversion","Torture","Network"]},"ammonius":{"role":"Philosopher and commentator on Aristotle","origin":"Alexandria","summary":"A pragmatic, scientifically minded teacher whom Damascius accuses of greed and of striking a bargain with Peter Mongus.","why":"The case remains open: betrayal, survival strategy, or institutional rescue?","tags":["Aristotle","Compromise","Survival","Rationalism"]},"aedesia":{"role":"Patron and bearer of a philosophical family","origin":"Alexandria","summary":"She secured her sons’ education, preserved public support, and helped the poor even at the cost of debt.","why":"She shows that philosophical succession depends on money, care, and women’s networks.","tags":["Care","Dynasty","Education","Patronage"]},"hypatia":{"role":"Mathematician, philosopher, public teacher","origin":"Alexandria","summary":"Admired for dialectic, political judgement, and public authority, yet ranked below the “true philosopher” in Damascius’ hierarchy.","why":"The tension between reverence and demotion exposes Damascius’ own ideal of philosophy.","tags":["Mathematics","Politics","Murder","Public life"]},"theosebius":{"role":"Practical ethicist","origin":"Unknown","summary":"He invoked Helios and the God of the Jews in an exorcism and later lived in a voluntarily continent marriage.","why":"He exemplifies an urban pagan asceticism that is neither simply theurgic nor Christian.","tags":["Asceticism","Marriage","Exorcism","Syncretism"]},"anthusa":{"role":"Inventor of cloud divination","origin":"Aegae in Cilicia","summary":"She interpreted a cloud vision as an omen of Aspar’s killing and was said to turn it into a continuing divinatory technique.","why":"She appears not merely as a visionary but as a methodological innovator.","tags":["Clouds","Divination","Politics","Innovation"]},"epiphanius":{"role":"Astronomer and mystery specialist","origin":"Alexandria","summary":"A custodian of Osiris and Aion mysteries, probably connected with Theon’s scientific circle.","why":"He represents the transitional generation that still knew the last bearers of the old order.","tags":["Aion","Astronomy","Osiris","Transmission"]},"euprepius":{"role":"Leader of Persian mysteries","origin":"Alexandria","summary":"A ritual specialist who transmitted older pagan narratives after institutional continuity had broken.","why":"Tradition appears as a chain of personal contacts rather than an unbroken institution.","tags":["Mysteries","Transmission","Ritual"]},"olympos":{"role":"Charismatic priest of Sarapis","origin":"Cilicia","summary":"He taught the ancestral rites while their social world was collapsing and foretold that Sarapis would leave the temple.","why":"He shows how a religion ends when competent teachers disappear.","tags":["Sarapis","Serapeum","Charisma","End of religion"]},"iacobus":{"role":"Physician and benefactor","origin":"Alexandria","summary":"He treated poor patients without payment and persuaded the wealthy to help; Isidore called his soul Asclepian.","why":"Technical mastery is understood as ethical and religious likeness to the patron god of an art.","tags":["Medicine","Poverty","Asclepius","Professional ethics"]},"marinus":{"role":"Successor of Proclus","origin":"Neapolis","summary":"After Isidore’s terse criticism he burned an unpublished commentary on the Philebus.","why":"His case reveals textual loss through internal censorship and the authority of the master.","tags":["Philebus","Parmenides","Self-censorship","Succession"]},"proclus":{"role":"Platonic successor","origin":"Constantinople / Lycia","summary":"The commanding authority of the Athenian school; after his death his theology became both norm and object of internal criticism.","why":"He functions not only as an author but as an institutional field of gravity.","tags":["Theology","Succession","Authority","Theurgy"]},"hegias":{"role":"Philosopher and pagan activist","origin":"Athens","summary":"He secretly restored sanctuaries; Damascius criticises his zeal as politically dangerous.","why":"He forces a distinction between piety, activism, and judgement.","tags":["Theurgy","Sanctuaries","Activism","Risk"]},"pamprepius":{"role":"Poet, politician, prophet","origin":"Panopolis","summary":"He linked the revolt of Illus with hopes for pagan restoration; Damascius casts him as the Typhonian opposite of Sarapio.","why":"Religious hope, propaganda, and personal ambition merge in him.","tags":["Propaganda","Illus","Typhon","Revolt"]},"peter-mongus":{"role":"Patriarch of Alexandria","origin":"Alexandria","summary":"A Miaphysite patriarch whom Athanassiadi’s reconstruction places within the persecution of the pagan school milieu.","why":"He reminds us both of Damascius’ partisanship and of the multiple fronts of church politics.","tags":["Church politics","Persecution","Alexandria"]},"photius":{"role":"Patriarch and excerptor","origin":"Constantinople","summary":"Codex 242 of his Bibliotheca preserves the most important continuous epitome of the lost work.","why":"Without Photius the work would scarcely survive, yet we see it through a ninth-century Christian reader.","tags":["Bibliotheca","Epitome","Transmission","Filter"]},"theodora":{"role":"Student and dedicatee","origin":"Emesene dynasty","summary":"A learned pupil of Damascius and Isidore who, with others, requested the composition of the work.","why":"The Philosophical History is also the result of female demand and patronage.","tags":["Dedication","Student","Patronage"]},"zosime":{"role":"Formerly enslaved woman","origin":"Syria","summary":"On her grave she says that she was once enslaved only in body and has now found bodily freedom as well.","why":"Two verses apply Platonic inner freedom to a woman without social rights.","tags":["Slavery","Freedom","Funerary epigram","Soul"]},"ulpian":{"role":"Mathematician, brother of Isidore","origin":"Alexandria","summary":"Famous for new mathematical problems and solutions; he died young and remained outside politics.","why":"Damascius respects mathematical brilliance while ranking it below theoretical philosophy.","tags":["Mathematics","Problems","Athens"]},"severus":{"role":"Roman senator and host","origin":"Rome","summary":"A learned host who received philosophers and Indian Brahmans in Alexandria.","why":"His household shows scholarship as social infrastructure.","tags":["Hospitality","Brahmans","Books"]},"brahmans":{"role":"Religious intermediaries","origin":"India","summary":"They lived ascetically in Severus’ house and described themselves as mediators between cities and mountain Brahmans.","why":"The episode documents a concrete social role for transcultural brokers.","tags":["India","Asceticism","Mediation","Travel lore"]}},"places":{"alexandria":{"type":"Metropolis","summary":"Horapollo’s school, a zone of contact and conflict among pagan, Christian, and Jewish milieus; site of the persecution of 488/89."},"menouthis":{"type":"Sanctuary","summary":"A hidden sanctuary of Isis whose cult objects were discovered and publicly destroyed."},"athens":{"type":"School centre","summary":"Platonic succession, struggles for leadership, institutional reform, and finally the ban on teaching."},"aphrodisias":{"type":"Philosophical centre","summary":"Asclepiodotus built a materially and institutionally strong pagan centre."},"hierapolis":{"type":"Sacred landscape","summary":"Subterranean vapours, hot springs, Damascius’ Attis dream, and Asclepiodotus’ experiments."},"damascus":{"type":"Place of origin","summary":"Birthplace of Damascius and a stage on his journey with Isidore."},"heliopolis":{"type":"Sacred city","summary":"Local theologies, priestly tales, and the contrast between genuine and pretended philosophy."},"berytius":{"type":"City and cult site","summary":"Damascius heard local Phoenician traditions here, including the myth of Eshmun."},"bostra":{"type":"Provincial capital","summary":"Encounters with Arabian cults, Dusares, and sacred landscapes."},"gaza":{"type":"Educational centre","summary":"Antony assisted Damascius and Isidore during their flight."},"emesa":{"type":"Sacred homeland","summary":"City of the Iamblichean tradition; possible last home of Damascius and findspot of Zosime’s epigram."},"harran":{"type":"Frontier city","summary":"A strongly pagan city and, in a disputed hypothesis, a possible refuge for the philosophers."},"ctesiphon":{"type":"Sasanian capital","summary":"Destination of the seven philosophers in their hope for intellectual freedom under Khusrau I."},"constantinople":{"type":"Imperial capital","summary":"Court politics, the killing of Aspar, careers, and struggles over religious power."},"rome":{"type":"Imperial memory","summary":"A symbolic horizon in tales about Attila, Severus, and portents."},"aegae":{"type":"Place of origin","summary":"Home of Anthusa, credited with inventing cloud divination."},"attica":{"type":"Cult landscape","summary":"Hegias secretly restored sanctuaries and renewed rites."},"india":{"type":"Distant region","summary":"The homeland attributed to the Brahmans staying in Severus’ house."}},"timeline":{"412-Geburt des Proklos":{"title":"Birth of Proclus","detail":"Later the commanding authority of the Athenian school."},"415-Ermordung Hypatias":{"title":"Murder of Hypatia","detail":"Damascius presents envy and religious power as a complex of motives."},"450-Blüte paganer Schulen in Alexandria":{"title":"Pagan schools flourish in Alexandria","detail":"Horapollo, Aedesia, Ammonius, Heraiscus, and Isidore form a dense milieu."},"468-Vandalenexpedition Leos I.":{"title":"Leo I’s Vandal expedition","detail":"Anthusa’s anxiety for her husband forms the background to the cloud vision."},"471-Ermordung Aspars":{"title":"Killing of Aspar","detail":"In Anthusa’s vision a lion devours the figure of a Goth."},"480-Damascius in Alexandria":{"title":"Damascius in Alexandria","detail":"Study and practice of rhetoric in Horapollo’s circle."},"484-Aufstand des Illus":{"title":"Revolt of Illus","detail":"Pamprepius joins rebellion to hopes for pagan restoration."},"485-Tod des Proklos":{"title":"Death of Proclus","detail":"The open crisis of succession begins."},"488-Verfolgung des alexandrinischen Milieus":{"title":"Persecution of the Alexandrian milieu","detail":"Arrest, torture, flight, and suspected bargains tear the network apart."},"489-Philosophische Wende und Flucht":{"title":"Philosophical turn and flight","detail":"Under Isidore’s influence Damascius abandons rhetoric."},"490-Aphrodisias und Ankunft in Athen":{"title":"Aphrodisias and arrival in Athens","detail":"Encounter with Asclepiodotus and entry into the Athenian school world."},"500-Hegias’ Restaurationsaktivismus":{"title":"Hegias’ restoration activism","detail":"Sanctuaries are renewed; Damascius criticises the political imprudence."},"515-Damascius als Diadochos":{"title":"Damascius as successor","detail":"Approximate date of his leadership and reforms."},"517-Möglicher Beginn der Abfassung":{"title":"Possible beginning of composition","detail":"Athanassiadi dates the work between 517 and 526."},"529-Unterrichtsverbot in Athen":{"title":"Ban on teaching in Athens","detail":"An imperial edict ends public philosophical teaching."},"531-Reise der sieben Philosophen nach Persien":{"title":"Journey of the seven philosophers to Persia","detail":"Hope for intellectual freedom under Khusrau I."},"532-Friedensvertrag und Rückkehrgarantie":{"title":"Peace treaty and guarantee of return","detail":"No forced change of their convictions."},"850-Photios exzerpiert das Werk":{"title":"Photius excerpts the work","detail":"His epitome preserves large portions while reshaping them."},"975-Suda-Exzerpte":{"title":"Suda excerpts","detail":"Lexicographical fragmentation preserves additional pieces."},"1999-Athanassiadis Rekonstruktion":{"title":"Athanassiadi’s reconstruction","detail":"Text, translation, commentary, and a new overall ordering."}},"stories":{"alexandria-collapse":{"title":"Alexandria 488/89 — A Network Breaks Apart","subtitle":"Persecution, torture, flight, and compromise","intro":"A school is at once a teaching institution, family, cult community, career path, and protection network","scenes":[{"title":"The school as a node","text":"Horapollo’s institution gathers pagan and Christian students, rhetoricians, philosophers, families, and ritual specialists."},{"title":"The trigger","text":"A dispute involving a converted student, a hidden sanctuary of Isis, and church rivalries becomes an operation against the pagan milieu."},{"title":"Torture and silence","text":"Horapollo and Heraiscus are tortured for information about hiding places. Damascius turns their silence into a moral test."},{"title":"The open case of Ammonius","text":"Ammonius survives professionally and reaches an agreement with the patriarch. Its terms are lost."},{"title":"Damascius changes course","text":"The crisis destroys his trust in rhetoric. Philosophy becomes the question whether words withstand action."}]},"sarapio-path":{"title":"The Man with Only Three Books","subtitle":"Sarapio and the politics of intellectual poverty","intro":"What if a library became philosophical not by growing, but by radical selection?","scenes":[{"title":"The small house","text":"Sarapio lives almost invisibly in Alexandria and receives scarcely anyone."},{"title":"Two or three books","text":"He owns only a few texts, among them Orpheus. Books are judged by their power to gather the mind."},{"title":"Cronus in the present","text":"Damascius treats him as evidence of a golden, Cronian life within a Typhonian age."},{"title":"The problem","text":"Is withdrawal the highest concentration, or does it remove virtue from political testing?"}]},"asclepiodotus-path":{"title":"The Lost Interval","subtitle":"Asclepiodotus between laboratory and metaphysics","intro":"A polymath tries to recover a sound-world that his own age can no longer hear.","scenes":[{"title":"220 positions","text":"On a monochord Asclepiodotus moves the bridge through at least 220 positions to reconstruct the enharmonic diesis."},{"title":"The historical ear","text":"A culture can lose the capacity to perceive an interval at all."},{"title":"The poisonous descent","text":"At Hierapolis he uses trapped outside air as improvised protection while investigating lethal subterranean vapour."},{"title":"Medicine as reconstruction","text":"He recovers the medicinal use of white hellebore."},{"title":"Damascius resists","text":"His empirical brilliance makes him a particularly dangerous counter-model."}]},"anthusa-path":{"title":"The Woman Who Read the Clouds","subtitle":"Anthusa and a newly invented divination","intro":"Personal anxiety, a dream, and a political event become the founding story of a method.","scenes":[{"title":"Prayer to both horizons","text":"Anthusa prays to the rising sun; her dead father appears in a dream and tells her to invoke the setting sun as well."},{"title":"Man, lion, devouring","text":"Two clouds take shape. A lion swallows a man who looks like a Goth."},{"title":"Political fulfilment","text":"Damascius connects the image with the killing of Aspar by Emperor Leo."},{"title":"From vision to technique","text":"Anthusa was said to continue practising cloud divination afterwards."}]},"journey-conversion":{"title":"The Journey of Conversion","subtitle":"From Alexandria to Athens through sacred landscapes","intro":"Flight, educational travel, pilgrimage, and field research overlap.","scenes":[{"title":"Gaza: assistance","text":"Antony helps the fugitives. Gratitude becomes a point in Damascius’ remembered geography."},{"title":"Bostra and Arabia","text":"With Dorus they visit cult places, holy waters, and local theologies."},{"title":"Heliopolis","text":"Local priests and self-styled philosophers become tests of genuine and pretended wisdom."},{"title":"Berytus","text":"Damascius hears the Eshmun myth and preserves a Phoenician voice in Greek."},{"title":"Aphrodisias","text":"Asclepiodotus introduces the travellers to a world of experiment, cult, and institution building."},{"title":"Athens","text":"The journey ends in an ageing and contentious school that Damascius will later try to reform."}]},"golden-chain":{"title":"The Golden Chain and Its Dark Underside","subtitle":"Succession, families, books, and power","intro":"Metaphysical succession appears in practice as a struggle over chairs, texts, and legitimacy.","scenes":[{"title":"The ageing Proclus","text":"During Proclus’ illness the question begins: who can inherit Platonic authority?"},{"title":"Marinus burns his book","text":"One courteous sentence from Isidore is enough: the lengthy commentary on the Philebus is destroyed."},{"title":"Parmenides as a battleground","text":"Whether the dialogue concerns species or gods determines the school’s theological identity."},{"title":"A freelance successor?","text":"Isidore may have received an honorary status without regularly leading the school."}]},"persian-exile":{"title":"The Seven Philosophers in Persia","subtitle":"Utopia, culture shock, and a negotiated return","intro":"When teaching is forbidden, Damascius tries to transfer an entire institution into another world.","scenes":[{"title":"Hiding and packing","text":"Sacred objects are hidden in wells and manuscripts are packed."},{"title":"Hope in Khusrau","text":"Platonic ideals of kingship make Ctesiphon seem a possible home of philosophical freedom."},{"title":"Culture shock","text":"The court is not a free school; the philosophers become foreign advisers."},{"title":"Freedom of conscience","text":"According to Agathias, the peace treaty protects them from forced conversion."},{"title":"Harran?","text":"Whether the returnees actually settled in Harran remains disputed."}]},"zosime-path":{"title":"Zosime’s Freedom","subtitle":"Two verses against the social definition of a human being","intro":"The smallest story may contain the strongest philosophical compression.","scenes":[{"title":"The gravestone","text":"Zosime says that she had been enslaved only in body; in death the body too is free."},{"title":"Inner freedom","text":"Her soul had never been another person’s property."},{"title":"Damascius in old age","text":"The epigram is slight evidence for his return to his Syrian homeland."}]},"sacred-geography":{"title":"The Arabian Styx","subtitle":"Natural phenomenon, oath, and divine judgement","intro":"In sacred geography nature, law, ritual, and body are not separate.","scenes":[{"title":"The descent","text":"Suitable women too descend into the ravine; gardens and farms lie below."},{"title":"The water decides","text":"Light offerings sink and heavy ones are rejected, depending on divine approval."},{"title":"Oath and body","text":"False swearing at the water is said to bring fatal dropsy within a year."},{"title":"Field research","text":"Local experience, Homeric language, and religious interpretation are assembled into one report."}]},"phantom-wars":{"title":"Battles after Death","subtitle":"Phantom warriors, sounds, and recurring places","intro":"Damascius compares a recurring type of apparition.","scenes":[{"title":"Three days of combat","text":"After a great battle, the souls of the dead are said to have fought for three days and nights."},{"title":"A geography of repetition","text":"Similar phantoms appear in Caria, Sicily, and other plains."},{"title":"A type of anomaly","text":"The text collects witnesses, places, and variants of one phenomenon."}]},"eshmun-path":{"title":"Eshmun, the Eighth Son","subtitle":"A Phoenician healing god between castration and rebirth","intro":"A local oral tradition enters a Greek philosophical travel narrative.","scenes":[{"title":"Astronoe’s pursuit","text":"The goddess pursues the beautiful hunter Eshmun; in panic he mutilates himself."},{"title":"Life-giving warmth","text":"Astronoe revives him with warmth and the youth becomes a healing god."},{"title":"The number eight","text":"A second etymology makes him the eighth son and opens a cosmological symbolism."},{"title":"A local voice","text":"The narrative manner suggests a local informant."}]},"hypatia-path":{"title":"Hypatia in Damascius’ Mirror","subtitle":"Admiration, murder narrative, and disciplinary hierarchy","intro":"A source can be both valuable testimony and a partisan judgement.","scenes":[{"title":"Public authority","text":"Hypatia teaches publicly, advises officials, and is honoured by the city."},{"title":"Envy and murder","text":"Damascius makes Cyril’s envy the beginning of the plot against her."},{"title":"“True philosopher” versus mathematician","text":"Elsewhere Hypatia serves as a foil for Isidore’s supposedly higher philosophy."},{"title":"Source criticism","text":"The unfair comparison itself documents Damascius’ hierarchy."}]},"brahmans-path":{"title":"Brahmans in a Roman Senator’s House","subtitle":"Alexandria as a transcultural node","intro":"The more revealing figure is not the legendary mountain ascetic but the mediator between two social worlds.","scenes":[{"title":"Ascetic life in the house","text":"The guests scarcely leave, eat dates and rice, and drink water."},{"title":"Between two worlds","text":"They represent mountain Brahmans in city affairs and the cities before the Brahmans."},{"title":"Marvels and travel lore","text":"Rain prayers, protection from epidemics, and seven-headed snakes mingle experience with literary tradition."}]}},"cases":{"ammonius-case":{"title":"What happened between Ammonius and Peter Mongus?","status":"open","question":"Was Ammonius a betrayer, a pragmatic survivor, or the rescuer of an institution?","evidence":[{"kind":"Damascius","text":"He calls Ammonius greedy and reports an agreement with the overseer of the prevailing religion."},{"kind":"Context","text":"Ammonius alone among the inner school circle remained professionally unharmed."},{"kind":"Counter-evidence","text":"He continued to teach doctrines such as the eternity of the world, opposed by Christian students."},{"kind":"Bias","text":"Damascius was the theological opponent and moral accuser of this pragmatic rationalist."}],"hypotheses":[{"name":"Protective or teaching compromise","note":"Plausible, but the terms are not preserved."},{"name":"Denunciation of colleagues","note":"A suspicion that cannot be proved."},{"name":"Pure polemical distortion","note":"It does not explain his privileged survival."}],"open":"No contract and no direct reply survive."},"asclepiodotus-bias":{"title":"Why does Damascius attack Asclepiodotus so fiercely?","status":"open","question":"Is the criticism philosophical, personal, or institutional?","evidence":[{"kind":"Admiration","text":"Damascius preserves an exceptional number of technical achievements and adventures."},{"kind":"Philosophy","text":"He accuses Asclepiodotus of reducing the invisible to visible analogies."},{"kind":"Dependence","text":"Asclepiodotus helped Damascius during a critical period."},{"kind":"Imitation","text":"Damascius’ reforms resemble the building of the centre at Aphrodisias."}],"hypotheses":[{"name":"Defence against a rival ideal of philosophy","note":"Empirical polymathy threatens Damascius’ hierarchy of intuition."},{"name":"Personal ambivalence and obligation","note":"Gratitude and distancing explain the unusual detail."},{"name":"Purely objective criticism","note":"Too weak to explain the emotional intensity."}],"open":"Asclepiodotus’ own writings are lost."},"harran-case":{"title":"Did the philosophers live in Harran after their return?","status":"disputed","question":"Can Harran be regarded as a late refuge of the Athenian school?","evidence":[{"kind":"Treaty","text":"Agathias reports a guarantee of freedom of conviction after their return."},{"kind":"Place","text":"Harran remained strongly pagan and lay on a plausible route."},{"kind":"Gap","text":"No direct source says that they settled there permanently."}],"hypotheses":[{"name":"Long-term refuge","note":"Stimulating, but more reconstructed than demonstrated."},{"name":"Brief stay","note":"Geographically and religiously plausible."},{"name":"Return to different places","note":"The most economical assumption."}],"open":"Direct evidence of residence is missing."},"isidore-diadochus":{"title":"Was Isidore really a successor?","status":"open","question":"Did he lead the school or hold only an honorary status?","evidence":[{"kind":"Damascius","text":"Isidore was elected successor in honour rather than in actual office."},{"kind":"Title history","text":"Photius’ title Life of Isidore encouraged later assumptions about succession."},{"kind":"Institution","text":"Secondary or parallel successor status is conceivable."}],"hypotheses":[{"name":"Honorary successor without leadership","note":"Best fits the explicit wording."},{"name":"Short-term head","note":"Not impossible, but poorly attested."},{"name":"Travelling freelance successor","note":"Athanassiadi’s suggestive reconstruction."}],"open":"Chronology and terminology remain imprecise."},"heraiscus-interpolation":{"title":"Which Heraiscus anecdotes come from Damascius?","status":"text-critical","question":"Did the Suda excerptor add sensational details?","evidence":[{"kind":"Transmission","text":"The menstruation anecdote is absent from Photius."},{"kind":"Style","text":"It reads like an explanatory intensification of a purity motif."},{"kind":"Core","text":"Other reports of sacred perception are multiply anchored."}],"hypotheses":[{"name":"Suda explanation rather than original sentence","note":"Athanassiadi considers intervention possible."},{"name":"Original sentence omitted by Photius","note":"Epitomes often remove side details."}],"open":"The lost full manuscript would decide the issue."},"house-case":{"title":"Was the house near the Areopagus Damascius’ school?","status":"disputed","question":"How far do architecture, location, and finds support a personal identification?","evidence":[{"kind":"Archaeology","text":"A wealthy late-antique house suits a philosophical school milieu."},{"kind":"Context","text":"Damascius reformed a materially equipped institution."},{"kind":"Caution","text":"Athanassiadi explicitly avoids stating the identification as fact."}],"hypotheses":[{"name":"House of Damascius or his school","note":"Tempting, but not secured by an inscription."},{"name":"Another philosophical-pagan town house","note":"The more general identification is stronger."}],"open":"No naming inscription or chain of ownership survives."},"anthusa-case":{"title":"Prediction or retrospective construction?","status":"open","question":"How did Anthusa’s cloud vision become linked to the killing of Aspar?","evidence":[{"kind":"Historical core","text":"Aspar and Ardabur were attacked in 471; Aspar was killed."},{"kind":"Narrative form","text":"The cloud figures form a clear political allegory."},{"kind":"Transmission","text":"Damascius writes decades later and probably at second hand."}],"hypotheses":[{"name":"Real vision, interpreted later","note":"Psychologically plausible, historically untestable."},{"name":"Retrospective divinatory legend","note":"A common form of political portent story."},{"name":"Deliberate invention","note":"No source permits a judgement about motive."}],"open":"The date of the first version is unknown."},"hegias-case":{"title":"Courageous restorer or dangerous activist?","status":"value-dependent","question":"How should religious visibility be judged under persecution?","evidence":[{"kind":"Action","text":"Hegias restored sanctuaries and renewed rites."},{"kind":"Damascius","text":"His zeal was imprudent and drew enemies against the community."},{"kind":"Isidore","text":"Theurgy presupposes human and philosophical maturity."}],"hypotheses":[{"name":"Moral courage with strategic errors","note":"Reconciles both sides."},{"name":"Self-dramatising piety","note":"Suggested, not proved."}],"open":"The views of the local cult communities are missing."}},"wonders":{"animated-statues":{"title":"Animated and inert statues","category":"Cult objects","report":"Heraiscus reacts bodily only to statues believed to be divinely animated.","meaning":"The purified human being functions as a sensor of sacred presence.","natural":"Suggestion, ritualised bodily response, or hagiography.","reliability":"medium"},"aion-union":{"title":"Aion as Osiris and Adonis","category":"Theology","report":"An Alexandrian statue is recognised as the mystical unity of several gods.","meaning":"Local cults are understood as a real theological union.","natural":"Religious-historical syncretism.","reliability":"high as evidence for an interpretation"},"mystical-birth":{"title":"Heraiscus’ finger of silence","category":"Body","report":"He was said to have been born with a finger attached to his lip, like Harpocrates.","meaning":"Biography is read through a divine iconographic pattern.","natural":"Congenital anomaly plus mythological interpretation.","reliability":"low"},"cloud-divination":{"title":"Anthusa’s cloud divination","category":"Divination","report":"Clouds form a Goth and a lion; the image is linked to Aspar’s death.","meaning":"Cosmic images comment on imperial politics.","natural":"Pareidolia and retrospective interpretation.","reliability":"medium"},"water-scrying":{"title":"Scrying in a glass of water","category":"Divination","report":"A holy woman sees future events in clear water; Damascius claims personal experience.","meaning":"Purity of medium and seer mirror one another.","natural":"Scrying, expectation effects, selective memory.","reliability":"medium"},"stygian-water":{"title":"Offerings in the Styx","category":"Sacred landscape","report":"Light offerings sink and heavy ones float, depending on divine approval.","meaning":"A natural place acts as oracle and court.","natural":"Current, shape, density, and selective observation.","reliability":"medium"},"oath-dropsy":{"title":"Dropsy after perjury","category":"Sacred landscape","report":"A false oath at the Styx water is said to bring death by dropsy within a year.","meaning":"Law, body, and deity form a system of sanctions.","natural":"Social control and remembered cases.","reliability":"low"},"phantom-battle":{"title":"Dead souls continuing the battle","category":"Apparitions","report":"The fallen continue as visible and audible phantoms; similar places are compared.","meaning":"Violence marks landscapes beyond death.","natural":"Light effects, sounds, collective memory.","reliability":"low"},"electric-sparks":{"title":"Sparks from body and clothing","category":"Natural phenomenon","report":"Damascius observes crackling sparks and flame-like light while dressing.","meaning":"Rare physics can also be read as an omen.","natural":"Tribo-electric discharge.","reliability":"high as a possible observation"},"gorgon-plant":{"title":"The Gorgon plant","category":"Natural history","report":"Severus sees a root shaped like a girl’s head with serpentine hair.","meaning":"Nature produces iconic likenesses to mythical figures.","natural":"Anthropomorphic root form and pareidolia.","reliability":"medium"},"seven-headed-snakes":{"title":"Seven-headed snakes","category":"Ethnography","report":"Brahmans report enormous seven-headed snakes and one-legged people.","meaning":"The distant world becomes a reservoir of marvels.","natural":"Traditional motifs of travel literature.","reliability":"very low"},"cave-gas":{"title":"The lethal vapour of Hierapolis","category":"Natural phenomenon","report":"A subterranean passage kills living beings; Asclepiodotus enters with improvised breathing protection.","meaning":"Sacred danger is investigated both ritually and experimentally.","natural":"Carbon dioxide or other volcanic gases.","reliability":"high in its core"},"attis-dream":{"title":"Damascius as Attis","category":"Dream","report":"At Hierapolis Damascius dreams that he celebrates the Hilaria as Attis and is saved from death.","meaning":"Personal crisis is integrated into a myth of death and return.","natural":"A dream shaped by ritual knowledge.","reliability":"high as self-report"},"eshmun":{"title":"Eshmun’s castration and deification","category":"Myth","report":"The pursued youth mutilates himself; Astronoe revives him and makes him a healing god.","meaning":"Healing arises through death, warmth, and transformation.","natural":"Local cult aetiology.","reliability":"high as a report of myth"},"animal-omens":{"title":"Oryx, Sirius, and the moon-ape","category":"Animal symbolism","report":"The oryx announces Sirius by sneezing; an ape reacts to the conjunction of sun and moon.","meaning":"Animal behaviour is read as cosmic writing.","natural":"Seasonal behaviour or symbolic construction.","reliability":"low"},"ring-continence":{"title":"The ring of continence","category":"Ritualised ethics","report":"Theosebius gives his wife a ring as a sign of voluntary continence.","meaning":"An object materialises a new ethical contract.","natural":"A social and psychological mechanism of commitment.","reliability":"high"},"syncretic-exorcism":{"title":"Helios and the God of the Jews","category":"Ritual","report":"Theosebius invokes both powers in an exorcism.","meaning":"Practical religion crosses confessional boundaries.","natural":"Syncretic incantatory practice.","reliability":"medium"},"serapis-departure":{"title":"Sarapis leaves the temple","category":"Prophecy","report":"Olympos foretells the god’s withdrawal from the temple.","meaning":"The destruction of a temple is understood as the deity’s own departure.","natural":"Theological processing of an expected collapse.","reliability":"medium"}},"fragments":{"f111":{"title":"Sarapio’s two or three books","status":"reconstructed fragment","paraphrase":"Sarapio owns almost no books, lives alone, and directs thought toward the inward and indivisible.","notes":"A key text in the critique of a mere multiplicity of opinions.","verificationCue":"Two or three books; Orpheus; Isidore as intellectual heir.","witness":"Photius + Suda"},"f85b":{"title":"220 trials on the monochord","status":"reconstructed fragment","paraphrase":"Asclepiodotus tries to reconstruct the lost enharmonic scale by systematic variation.","notes":"A rare source for experimental musical archaeology.","verificationCue":"220 changes on the monochord and the loss of the enharmonic diesis.","witness":"Photius + Suda"},"f87a":{"title":"Descent into the poisonous passage","status":"Photius excerpt","paraphrase":"Asclepiodotus protects his breathing with his cloak and enters a lethal subterranean space.","notes":"Sacred topography, self-experiment, and natural observation.","verificationCue":"Hierapolis, lethal vapours, cloak over the nostrils, artificially produced vapour.","witness":"Photius; parallel in the Suda"},"f52":{"title":"Anthusa’s cloud divination","status":"Photius excerpt","paraphrase":"A woman develops a new form of political divination from a cloud vision.","notes":"The attribution of an invention is unusually explicit.","verificationCue":"Anthusa, prayer to the sun, cloud-man and lion, death of Aspar.","witness":"Photius"},"f46":{"title":"Theosebius’ exorcism","status":"Photius excerpt","paraphrase":"Theosebius invokes Helios and the God of the Jews against a demon.","notes":"Practical religious border crossing.","verificationCue":"Exorcism through the rays of Helios and the God of the Jews.","witness":"Photius"},"f41":{"title":"The last transmitters of the mysteries","status":"Suda excerpt","paraphrase":"Epiphanius and Euprepius had still known people formed by the old way of life.","notes":"A micro-theory of broken tradition.","verificationCue":"Epiphanius and Euprepius as transmitters of ancient narratives.","witness":"Suda"},"f42":{"title":"Olympos as teacher of religion","status":"reconstructed fragment","paraphrase":"Olympos teaches ancestral rites while their social world is already collapsing.","notes":"A sociology of the end of a cult.","verificationCue":"Olympos as teacher of rites; Sarapis will leave the temple.","witness":"Photius + Suda"},"f76":{"title":"Heraiscus and the animated statue","status":"reconstructed fragment","paraphrase":"Heraiscus was said to distinguish ritually effective images from merely material statues.","notes":"Some details may have been expanded by the Suda excerptor.","verificationCue":"Distinction between animated and inert statues; Aion as Osiris and Adonis.","witness":"Photius + Suda"},"f51d":{"title":"Brahmans between cities and mountains","status":"Photius excerpt","paraphrase":"The Indian guests describe themselves as inhabitants of two worlds and as mediators.","notes":"Their social function matters more than the marvellous ethnography.","verificationCue":"Brahmans as brokers between mountain ascetics and cities.","witness":"Photius"},"f56":{"title":"Aedesia’s economy of care","status":"Suda excerpt","paraphrase":"Aedesia assists the needy even into debt and organises her sons’ education.","notes":"Institutional history from the perspective of material reproduction.","verificationCue":"Charity, debt, and the preservation of her sons’ philosophical education.","witness":"Suda"},"f84e":{"title":"Iacobus as an Asclepian soul","status":"Suda excerpt","paraphrase":"The physician is described as naturally healing and akin to the divine patron of his art.","notes":"Mastery of an art as ontological assimilation.","verificationCue":"Iacobus as an Asclepian soul with an innate power to heal.","witness":"Suda"},"f38a":{"title":"Marinus burns his Philebus commentary","status":"Photius excerpt","paraphrase":"After Isidore’s brief criticism Marinus destroys his unpublished commentary.","notes":"Textual loss through internal norms of quality and authority.","verificationCue":"Marinus burns the commentary after Isidore’s judgement.","witness":"Photius"},"f97":{"title":"Parmenides: species or gods?","status":"reconstructed fragment","paraphrase":"Marinus reads Plato’s hypotheses as a theory of species; Isidore defends the theological interpretation.","notes":"Exegetical conflict as identity politics.","verificationCue":"Marinus: species rather than gods; Isidore’s rebuttal.","witness":"Photius + Suda"},"f124":{"title":"Virtue must act","status":"reconstructed fragment","paraphrase":"Political practice tests virtue; discourse without action remains empty.","notes":"A correction to the image of world-fleeing Neoplatonists.","verificationCue":"Political practice tests virtue; words without deeds are empty.","witness":"Photius + Suda"},"f118b":{"title":"Ammonius’ agreement","status":"Photius excerpt","paraphrase":"Ammonius reaches an agreement with the overseer of the prevailing religion.","notes":"Its contents are lost; stronger accusations remain hypotheses.","verificationCue":"An agreement with the overseer of the prevailing religion.","witness":"Photius"},"f117":{"title":"Torture and silence","status":"Suda excerpt","paraphrase":"Horapollo and Heraiscus withstand torture and do not betray those being hunted.","notes":"Crisis as moral epistemology.","verificationCue":"Horapollo and Heraiscus remain silent under torture.","witness":"Suda"},"f43e":{"title":"Hypatia and the political city","status":"Suda excerpt","paraphrase":"Hypatia is described as dialectical, wise, and politically intelligent; her murder as barbaric violence.","notes":"The separate fragment PH 106A contrasts Isidore as a “true philosopher” with Hypatia as a mathematician. This card presents PH 43E.","verificationCue":"Hypatia’s political intelligence, Cyril’s envy, and her murder.","witness":"Suda"},"f142b":{"title":"The local myth of Eshmun","status":"Photius excerpt","paraphrase":"Eshmun is revived by Astronoe’s life-giving warmth and made a god.","notes":"Possibly a nearly oral local tradition.","verificationCue":"Astronoe revives Eshmun with life-giving warmth and deifies him.","witness":"Photius"},"f135":{"title":"The Styx in the borderlands","status":"Photius excerpt","paraphrase":"A waterfall serves as oracle, guarantor of oaths, and sacred natural phenomenon.","notes":"Geography, law, and religion remain inseparable.","verificationCue":"The Arabian Styx, accepted or rejected offerings, and perjury.","witness":"Photius"},"f50":{"title":"Phantom battles","status":"Photius excerpt","paraphrase":"Fallen warriors appear at several places continuing their combat.","notes":"Paradoxography with a comparative impulse.","verificationCue":"Souls fight for three days; comparable phantom battles elsewhere.","witness":"Photius"},"f51a":{"title":"Tribo-electric omens","status":"Photius excerpt","paraphrase":"Crackling sparks leap from Damascius’ body and clothing as he changes.","notes":"A plausible natural observation in a divinatory frame.","verificationCue":"Sparks while dressing; clothes shine without burning.","witness":"Photius; parallel in the Suda"},"f145":{"title":"Hegias’ secret restorations","status":"Photius excerpt","paraphrase":"Hegias renews sanctuaries; Damascius regards the effect as dangerous.","notes":"Piety is measured by strategic judgement.","verificationCue":"Hegias secretly revives rites and long-dormant sanctuaries or cult customs.","witness":"Photius"},"f150":{"title":"First human, then god","status":"Photius excerpt","paraphrase":"Isidore demands philosophical and human maturity before theurgy.","notes":"Internal pagan criticism of ritual activism.","verificationCue":"Isidore to Hegias: those who are to become gods must first become human.","witness":"Photius"},"zosime-epi":{"title":"Zosime’s funerary epigram","status":"external self-testimony","paraphrase":"The dead woman had been enslaved only in body; now the body too finds freedom.","notes":"Not a fragment of the work, but central to Damascius’ late biography.","verificationCue":"Funerary epigram: formerly enslaved only in body, now bodily free as well.","witness":"Inscription + Greek Anthology"}},"glossary":{"Kronisches Leben":{"term":"Cronian life","definition":"A way of life governed by reason, unity, and inward concentration; Sarapio is its ideal figure."},"Typhonisches Leben":{"term":"Typhonian life","definition":"Fragmentation through appetite, ambition, falsehood, and social violence."},"Bacchus":{"term":"Bacchus","definition":"A metaphor for the true philosopher who unites philosophical insight and hieratic experience."},"Theurgie":{"term":"Theurgy","definition":"Ritual practice intended to raise the soul through divine symbols and causes."},"Diadochos":{"term":"Successor","definition":"The successor or head of a philosophical school: both spiritual rank and contested office."},"Polydoxia":{"term":"Polydoxy","definition":"A multiplicity of opinions; the danger of undirected learning from books and hearsay."},"Genesis":{"term":"Generation","definition":"The realm of becoming and embodiment, opposed to intelligible being and unity."},"Eumoiria":{"term":"Eumoiria","definition":"Innate fortunate intuition or exceptional natural endowment."},"Patria":{"term":"Patria","definition":"Local traditions and stories of origins and places."},"Paradoxa":{"term":"Paradoxa","definition":"Reports of marvels and anomalies; in Damascius, a mode of inquiry."},"Prosopographie":{"term":"Prosopography"  const glyph={network:'⌬',books:'≡',monochord:'↔',clouds:'☁',route:'⌁',chain:'⛓',exile:'△',epigram:'✧',water:'≈',ghosts:'♙',eshmun:'✦',hypatia:'◎',brahmans:'◫'}[kind]||'✦';

 return `<svg viewBox="0 0 520 260" role="img" aria-label="Original vector illustration"><defs><radialGradient id="g${seed}"><stop stop-color="#263951"/><stop offset="1" stop-color="#090d15"/></radialGradient><filter id="gl${seed}"><feGaussianBlur stdDeviation="5"/></filter></defs><rect width="520" height="260" fill="url(#g${seed})"/><circle cx="390" cy="80" r="74" fill="none" stroke="#d6b46b" opacity=".17"/><circle cx="390" cy="80" r="48" fill="none" stroke="#89d2d4" opacity=".15"/><path d="M20 218 C120 135 185 228 280 148 S420 112 510 38" fill="none" stroke="#d6b46b" opacity=".28" stroke-dasharray="5 8"/>${pts}<text x="78" y="155" fill="#f1d99a" font-size="88" font-family="Georgia" opacity=".9">${glyph}</text><path d="M60 180h190" stroke="#f1d99a" opacity=".18"/><path d="M60 194h145" stroke="#f1d99a" opacity=".11"/></svg>`;

const wonderIcon=id=>({'animated-statues':'◉','aion-union':'∞','mystical-birth':'☝','cloud-divination':'☁','water-scrying':'◌','stygian-water':'≈','oath-dropsy':'⚖','phantom-battle':'♙','electric-sparks':'ϟ','gorgon-plant':'⚘','seven-headed-snakes':'⌇','cave-gas':'▽','attis-dream':'☾','eshmun':'✦','animal-omens':'✧','ring-continence':'○','syncretic-exorcism':'☉','serapis-departure':'↗'}[id]||'✦');

function nav(){ $('#nav').innerHTML=views.map(id=>`<button class="nav-btn ${state.view===id?'active':''}" data-view="${id}"><span class="nav-icon">${navIcons[id]}</span><span>${esc(labelForView(id))}</span></button>`).join('');$('#edition-label').textContent=`${u('publicEdition')} · v${D.meta.version}`;$('#source-toggle').textContent=`${u('sourceMode')}: ${u(state.sources?'on':'off')}`;$('#pdf-button').textContent=u('connectPdf');$('#pdf-status').textContent=state.pdfName?`${u('localPdf')}: ${state.pdfName}`:`${u('noPdf')} · ${u('pdfPrivacy')}`;$('#art-note').textContent=u('allOriginalArt');document.documentElement.lang=state.lang;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang));$('#search').placeholder=u('search');$('#crumbs').textContent=labelForView(state.view);}
function head(ey,title,lead,tools=''){return `<div class="view-head"><div><div class="eyebrow">${esc(ey)}</div><h1>${esc(title)}</h1><div class="lead">${lead}</div></div>${tools}</div>`}
function footer(){return `<footer><span>Damascius Atlas · v${D.meta.version} · ${u('publicSafe')}</span><span>${u('copyrightNote')} · Code MIT · Text & SVG CC BY 4.0</span></footer>`}
function home(){const c=D.meta.counts;const title=state.lang==='de'?'Fragmente einer':'Fragments of a';const title2=state.lang==='de'?'verschwindenden Welt':'vanishing world';const p=state.lang==='de'?'Ein visueller Quellenatlas zu Damascius, seinen ungewöhnlichen Zeitgenossen und den sozialen, religiösen und intellektuellen Netzwerken der Spätantike.':'A visual source atlas of Damascius, his unusual contemporaries, and the social, religious, and intellectual networks of late antiquity.';return `<div class="wrap"><section class="hero"><div class="hero-copy"><div class="eyebrow">${u('publicEdition')} · DE / EN</div><h1>${title}<span>${title2}</span></h1><p>${p}</p><div class="hero-actions"><button class="primary" data-view="stories">${u('stories')}</button><button class="ghost" data-view="atlas">${u('atlas')}</button><button class="ghost" data-view="rights">${u('rights')}</button></div></div><div class="hero-art">${heroArt()}</div></section><div class="stat-row">${[['people',c.people],['places',D.places.length],['stories',c.stories],['cases',c.cases],['wonders',c.wonders],['fragments',c.fragments]].map(([k,n])=>`<div class="stat"><strong>${n}</strong><span>${u(k)}</span></div>`).join('')}</div><div class="section-title"><h2>${state.lang==='de'?'Drei Einstiege':'Three ways in'}</h2></div><div class="grid cols-3">${['alexandria-collapse','sarapio-path','asclepiodotus-path'].map((id,i)=>storyCard(find(D.stories,id),i)).join('')}</div>${footer()}</div>`}
function storyCard(s,i=0){const tr=D.i18n.stories[s.id]||{};return `<article class="card"><div class="art">${storyArt(s.cover,i+3)}</div><div class="card-body"><div class="eyebrow">${esc(s.duration)} · ${esc(s.tone)}</div><h3>${esc(en('stories',s.id,'title',s.title))}</h3><p>${esc(en('stories',s.id,'subtitle',s.subtitle))}</p><button class="primary" data-story="${s.id}">${u('readStory')}</button></div></article>`}
function atlas(){return `<div class="wrap">${head(state.lang==='de'?'Raum und Bewegung':'Space and movement',u('atlas'),state.lang==='de'?'Orte, Fluchten, Pilgerwege und hypothetische Exilrouten. Die Küstenform ist eine bewusst stilisierte, eigenständige SVG-Karte.':'Places, flights, pilgrimages, and hypothetical routes of exile. The coastline is an intentionally stylised, original SVG map.')}<div class="atlas-shell"><div class="atlas-toolbar"><span class="source-pill">${u('allOriginalArt')}</span></div><div class="atlas-canvas">${mapSvg()}</div></div>${footer()}</div>`}
function mapSvg(){const nodes=D.places.map(p=>`<g class="map-node" data-place="${p.id}" transform="translate(${p.x},${p.y*1.1})"><circle r="5" fill="${p.type.includes('Heilig')||p.type.includes('Kult')?'#d6b46b':'#6aa7c7'}"/><circle r="13" fill="none" stroke="#d6b46b" opacity=".12"/><text x="10" y="-8">${esc(p.name)}</text></g>`).join('');const routes=D.routes.map((r,i)=>{const a=find(D.places,r.from),b=find(D.places,r.to);return `<path class="route ${r.kind.includes('hypothetisch')||r.kind.includes('Hypothese')?'hyp':''}" d="M${a.x},${a.y*1.1} Q${(a.x+b.x)/2},${Math.min(a.y,b.y)*1.1-25-i%3*8} ${b.x},${b.y*1.1}"/>`}).join('');return `<svg viewBox="0 0 1000 620" role="img" aria-label="Stylised map of the eastern Mediterranean"><defs><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#142238"/><stop offset="1" stop-color="#08101c"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="9"/></filter></defs><rect width="1000" height="620" fill="url(#sea)"/><path d="M0 80 C130 42 220 64 302 126 C373 181 417 201 510 192 C626 181 710 116 1000 89 L1000 0H0Z" fill="#1f2530"/><path d="M0 500 C114 446 198 452 292 490 C376 524 447 526 522 470 C589 420 660 391 744 420 C818 446 910 456 1000 422V620H0Z" fill="#1c222d"/><path d="M315 196c45 6 84 31 108 68 20 31 28 63 29 98-52-14-95-15-140-6-18-55-17-105 3-160z" fill="#202733"/><path d="M572 208c72 8 135 42 188 104-45 5-85 20-118 49-54-45-85-95-70-153z" fill="#202733"/><path d="M680 339c80-26 171-15 260 34-69 2-134 22-191 57-33-33-55-62-69-91z" fill="#202733"/><g opacity=".16" stroke="#89d2d4" fill="none"><path d="M0 383 C180 315 316 375 453 330 S755 255 1000 304"/><path d="M0 402 C180 334 316 394 453 349 S755 274 1000 323"/></g>${routes}${nodes}<g opacity=".35" fill="#d6b46b">${Array.from({length:45},(_,i)=>`<circle cx="${(i*83)%980+10}" cy="${(i*i*37)%590+10}" r="${i%7===0?2:1}"/>`).join('')}</g></svg>`}
function network(){return `<div class="wrap">${head(state.lang==='de'?'Menschen und Beziehungen':'People and relations',u('network'),state.lang==='de'?'Lehrer, Familien, Konflikte, Patronage und Überlieferung.':'Teachers, families, conflicts, patronage, and transmission.')}<div class="network-shell"><div class="network-toolbar"><span class="source-pill">${D.relationships.length} ${state.lang==='de'?'Relationen':'relations'}</span></div><div class="network-canvas">${networkSvg()}</div></div>${footer()}</div>`}
function networkSvg(){const W=1100,H=720;const groups={philosopher:[.5,.43],woman:[.28,.42],ritual:[.72,.36],scientist:[.73,.62],teacher:[.45,.22],ascetic:[.25,.66],physician:[.56,.7]};const pos={};D.people.forEach((p,i)=>{const g=groups[p.group]||[.5,.5],j=i%7;pos[p.id]=[W*(g[0]+Math.cos(i*2.2)*.09),H*(g[1]+Math.sin(i*1.7)*.12)]});const edges=D.relationships.map((r,i)=>{const a=pos[r[0]],b=pos[r[1]];return `<path class="edge ${i%5===0?'hot':''}" d="M${a[0]},${a[1]} Q${(a[0]+b[0])/2},${(a[1]+b[1])/2-25} ${b[0]},${b[1]}"/>`}).join('');const nodes=D.people.map((p,i)=>{const [x,y]=pos[p.id],col=p.group==='woman'?'#d27b70':p.group==='ritual'?'#9c88c7':p.group==='scientist'?'#89d2d4':p.group==='ascetic'?'#85b889':'#d6b46b';return `<g class="node" data-person="${p.id}" transform="translate(${x},${y})"><circle r="${p.id==='damascius'||p.id==='isidore'?18:12}" fill="${col}" opacity=".82"/><circle r="${p.id==='damascius'||p.id==='isidore'?27:20}" fill="none" stroke="${col}" opacity=".13"/><text y="${p.id==='damascius'||p.id==='isidore'?34:27}">${esc(p.name.replace(', Sohn des Hermeias',''))}</text></g>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Interactive person network"><rect width="${W}" height="${H}" fill="#0a0e17"/><g>${edges}</g><g>${nodes}</g></svg>`}
function timeline(){return `<div class="wrap">${head(state.lang==='de'?'Zeit und Überlieferung':'Time and transmission',u('timeline'),state.lang==='de'?'Historische Ereignisse und spätere Stadien der Textüberlieferung.':'Historical events and later stages in the transmission of the text.')}<div class="timeline">${D.timeline.map(x=>{const key=String(x.year)+'-'+x.title;return `<div class="time-item"><div class="time-year">${x.year}</div><div><h3>${esc(en('timeline',key,'title',x.title))}</h3><p>${esc(en('timeline',key,'detail',x.detail))}</p></div></div>`}).join('')}</div>${footer()}</div>`}

function cases(){return `<div class="wrap">${head(state.lang==='de'?'Abduktion statt Scheingewissheit':'Abduction without false certainty',u('cases'),state.lang==='de'?'Mehrere Erklärungen bleiben nebeneinander sichtbar; Prozentwerte sind heuristisch, nicht statistisch.':'Several explanations remain visible side by side; percentages are heuristic, not statistical.')}<div class="grid cols-3">${D.cases.map(c=>caseCard(c)).join('')}</div>${footer()}</div>`}
function caseCard(c){const tr=D.i18n.cases[c.id]||{};return `<article class="card case-card"><div class="eyebrow">${esc(en('cases',c.id,'status',c.status))}</div><h3>${esc(en('cases',c.id,'title',c.title))}</h3><p>${esc(en('cases',c.id,'question',c.question))}</p><button class="primary" data-case="${c.id}">${u('open')}</button></article>`}
function wonders(){return `<div class="wrap">${head(state.lang==='de'?'Wunder, Natur und Deutung':'Marvels, nature, and interpretation',u('wonders'),state.lang==='de'?'Jede Geschichte wird als Bericht, religiöse Bedeutung und mögliche natürliche oder historische Lesart gezeigt.':'Each story is shown as report, religious meaning, and possible natural or historical reading.')}<div class="grid cols-3">${D.wonders.map(w=>{const t=D.i18n.wonders[w.id]||{};return `<article class="card wonder-card"><div class="wonder-icon">${wonderIcon(w.id)}</div><div class="eyebrow">${esc(en('wonders',w.id,'category',w.category))}</div><h3>${esc(en('wonders',w.id,'title',w.title))}</h3><p>${esc(en('wonders',w.id,'report',w.report))}</p><div class="quad"><div><b>${u('meaning')}</b>${esc(en('wonders',w.id,'meaning',w.meaning))}</div><div><b>${u('possibleReading')}</b>${esc(en('wonders',w.id,'natural',w.natural))}</div></div>${state.sources?`<div class="meta-row"><span class="source-pill">${esc(w.source)}</span><span class="pill">${u('reliability')}: ${esc(en('wonders',w.id,'reliability',w.reliability))}</span></div>`:''}</article>`}).join('')}</div>${footer()}</div>`}
function fragments(){return `<div class="wrap">${head(state.lang==='de'?'Text, Zeuge, Paraphrase':'Text, witness, paraphrase',u('fragments'),state.lang==='de'?'Kurze griechische Identifikationszitate, eigene bilinguale Paraphrasen und expliziter Überlieferungsstatus.':'Short Greek identifying quotations, independent bilingual paraphrases, and explicit textual status.')}<div class="grid cols-3">${D.fragments.map(f=>`<article class="card fragment-card"><div class="fragment-strip" lang="grc">${esc(f.greek)}</div><div class="card-body"><div class="eyebrow">${esc(f.fragment)}</div><h3>${esc(en('fragments',f.id,'title',f.title))}</h3><p>${esc(en('fragments',f.id,'paraphrase',f.paraphrase))}</p><div class="verified">✓ ${u('verified')}</div>${state.sources?`<div class="meta-row"><span class="source-pill">${u('sourceWitness')}: ${esc(en('fragments',f.id,'witness',f.witness))}</span><span class="pill">${esc(en('fragments',f.id,'status',f.status))}</span></div><p class="micro">${u('editorialParaphrase')} · ${esc(en('fragments',f.id,'notes',f.notes))}</p>`:''}${state.pdfUrl?`<div class="meta-row">${(f.openPages||[f.page]).map(p=>`<button class="pdf-btn" data-page="${p}">${u('openLocalPage')} ${p}</button>`).join('')}</div>`:''}</div></article>`).join('')}</div>${footer()}</div>`}
function people(){return `<div class="wrap">${head(state.lang==='de'?'Prosopographischer Atlas':'Prosopographical atlas',u('people'),state.lang==='de'?'Berühmte und fast vergessene Träger einer intellektuellen Welt.':'Famous and nearly forgotten bearers of an intellectual world.')}<div class="grid cols-3">${D.people.map(p=>`<article class="card person-card" data-person="${p.id}"><div class="person-head"><div class="avatar">${esc(p.name[0])}</div><div><h3>${esc(p.name)}</h3><div class="greek" lang="grc">${esc(p.greek)}</div></div></div><p><b>${u('role')}:</b> ${esc(en('people',p.id,'role',p.role))}</p><p>${esc(en('people',p.id,'summary',p.summary))}</p><div class="meta-row">${en('people',p.id,'tags',p.tags).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></article>`).join('')}</div>${footer()}</div>`}
function glossary(){return `<div class="wrap">${head(state.lang==='de'?'Begriffe und Denkfiguren':'Concepts and figures of thought',u('glossary'),state.lang==='de'?'Ein kurzes zweisprachiges Glossar zur Welt des Werkes.':'A short bilingual glossary for the world of the work.')}<div class="grid cols-3">${D.glossary.map(g=>`<article class="card gloss-card"><div class="greek" lang="grc">${esc(g.greek)}</div><h3>${esc(en('glossary',g.term,'term',g.term))}</h3><p>${esc(en('glossary',g.term,'definition',g.definition))}</p></article>`).join('')}</div>${footer()}</div>`}
function transmission(){return `<div class="wrap">${head(state.lang==='de'?'Vom verlorenen Werk zur App':'From lost work to app',u('transmission'),state.lang==='de'?'Jede Stufe bewahrt und verändert: Damascius → Photios → Suda → moderne Edition → digitale Paraphrase.':'Every stage preserves and transforms: Damascius → Photius → Suda → modern edition → digital paraphrase.')}<div class="grid cols-4">${D.sources.map(s=>`<article class="card source-card"><div class="eyebrow">${esc(en('sources',s.id,'type',s.type))} · ${esc(s.date)}</div><h3>${esc(en('sources',s.id,'title',s.title))}</h3><p>${esc(en('sources',s.id,'note',s.note))}</p></article>`).join('')}</div><div class="section-title"><h2>${state.lang==='de'?'Methodische Regel':'Methodological rule'}</h2></div><div class="rights-box"><p>${state.lang==='de'?'Die App unterscheidet antiken Bericht, Überlieferungszeugen, moderne Rekonstruktion und eigene Interpretation. Ein Quellenverweis ist keine Behauptung, dass jede Einzelheit historisch wahr sei.':'The app distinguishes ancient report, textual witness, modern reconstruction, and its own interpretation. A source reference does not imply that every reported detail is historically true.'}</p></div>${footer()}</div>`}
function rights(){const r=D.rights[state.lang];return `<div class="wrap">${head(u('sourcesAndMethod'),r.headline,r.intro)}<div class="rights-box"><ul>${r.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="micro">${esc(r.caveat)}</p><p><a href="https://www.gesetze-im-internet.de/urhg/__64.html" target="_blank" rel="noopener">UrhG §64</a> · <a href="https://www.gesetze-im-internet.de/urhg/__70.html" target="_blank" rel="noopener">UrhG §70</a> · <a href="https://www.gesetze-im-internet.de/urhg/__51.html" target="_blank" rel="noopener">UrhG §51</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · <a href="https://opensource.org/license/mit" target="_blank" rel="noopener">MIT</a></p></div><div class="section-title"><h2>${state.lang==='de'?'Publikationscheck':'Publication checklist'}</h2></div><div class="grid cols-3"><article class="card card-body"><h3>${state.lang==='de'?'Keine eingebettete PDF':'No bundled PDF'}</h3><p>${state.lang==='de'?'Die öffentlich hochgeladene App-Datei enthält keine Seite und kein Bild aus der modernen Ausgabe.':'The publicly hosted app contains no page or image from the modern edition.'}</p></article><article class="card card-body"><h3>${state.lang==='de'?'Keine Fremdbilder':'No third-party images'}</h3><p>${u('allOriginalArt')}</p></article><article class="card card-body"><h3>${state.lang==='de'?'Klare Lizenzdateien':'Clear licence files'}</h3><p>${state.lang==='de'?'Das Download-Paket enthält MIT-, CC-BY- und Quellenhinweise.':'The download package contains MIT, CC BY, and source notices.'}</p></article></div>${footer()}</div>`}
function searchView(q){q=q.toLowerCase();const results=[];const push=(type,id,title,text,view)=>{if((title+' '+text).toLowerCase().includes(q))results.push({type,id,title,text,view})};D.people.forEach(p=>push(u('people'),p.id,p.name,en('people',p.id,'summary',p.summary),'people'));D.places.forEach(p=>push(u('places'),p.id,p.name,en('places',p.id,'summary',p.summary),'atlas'));D.stories.forEach(s=>push(u('stories'),s.id,en('stories',s.id,'title',s.title),en('stories',s.id,'intro',s.intro),'stories'));D.cases.forEach(c=>push(u('cases'),c.id,en('cases',c.id,'title',c.title),en('cases',c.id,'question',c.question),'cases'));D.wonders.forEach(w=>push(u('wonders'),w.id,en('wonders',w.id,'title',w.title),en('wonders',w.id,'report',w.report),'wonders'));D.fragments.forEach(f=>push(u('fragments'),f.id,en('fragments',f.id,'title',f.title),en('fragments',f.id,'paraphrase',f.paraphrase),'fragments'));D.glossary.forEach(g=>push(u('glossary'),g.term,en('glossary',g.term,'term',g.term),en('glossary',g.term,'definition',g.definition),'glossary'));D.sources.forEach(s=>push(u('transmission'),s.id,en('sources',s.id,'title',s.title),en('sources',s.id,'note',s.note),'transmission'));return `<div class="wrap">${head(state.lang==='de'?'Suche':'Search',`“${esc(state.search)}”`,`${results.length} ${state.lang==='de'?'Treffer':'results'}`)}<div class="search-results">${results.length?results.map(r=>`<div class="result" data-view="${r.view}"><div class="eyebrow">${esc(r.type)}</div><b>${esc(r.title)}</b><p>${esc(r.text)}</p></div>`).join(''):`<div class="empty">${u('noResults')}</div>`}</div>${footer()}</div>`}
function render(){nav();let out=state.search?searchView(state.search):({overview:home,atlas,network,timeline,stories,cases,wonders,fragments,people,glossary,transmission,rights}[state.view]||home)();$('#view').innerHTML=out;bindDynamic();$('#view').focus({preventScroll:true})}
function bindDynamic(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>openStory(b.dataset.story));document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case));document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(b.dataset.person));document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>openPlace(b.dataset.place));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPdf(+b.dataset.page))}
function go(v){state.view=v;state.search='';$('#search').value='';location.hash='#/'+v;render();$('#sidebar').classList.remove('open')}
function openPerson(id){const p=find(D.people,id);if(!p)return;$('#detail').innerHTML=`<div class="detail-inner"><button class="icon-btn close-x" data-close>×</button><div class="avatar">${esc(p.name[0])}</div><h1>${esc(p.name)}</h1><div class="greek" lang="grc">${esc(p.greek)}</div><p><b>${u('role')}:</b> ${esc(en('people',id,'role',p.role))}</p><p><b>${u('origin')}:</b> ${esc(en('people',id,'origin',p.origin))}</p><p>${esc(en('people',id,'summary',p.summary))}</p><h3>${u('whyInteresting')}</h3><p>${esc(en('people',id,'why',p.why))}</p>${state.sources?`<div class="meta-row">${p.sources.map(s=>`<span class="source-pill">${esc(s)}</span>`).join('')}</div>`:''}</div>`;$('#detail').classList.add('open');$('#detail [data-close]').onclick=()=>$('#detail').classList.remove('open')}
function openPlace(id){const p=find(D.places,id);if(!p)return;$('#detail').innerHTML=`<div class="detail-inner"><button class="icon-btn close-x" data-close>×</button><div class="eyebrow">${esc(en('places',id,'type',p.type))}</div><h1>${esc(p.name)}</h1><p>${esc(en('places',id,'summary',p.summary))}</p><div class="meta-row"><span class="pill">${esc(p.years)}</span></div></div>`;$('#detail').classList.add('open');$('#detail [data-close]').onclick=()=>$('#detail').classList.remove('open')}
function openStory(id){const s=find(D.stories,id);let n=0;const draw=()=>{const scene=s.scenes[n],tr=D.i18n.stories[id],sc=tr?.scenes?.[n]||{};$('#modal-root').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="scene-visual">${storyArt(s.cover,n+17)}</div><div class="modal-body"><button class="icon-btn close-x" data-close>×</button><div class="eyebrow">${n+1} / ${s.scenes.length} · ${esc(s.duration)}</div><h1>${esc(sc.title||scene.title)}</h1><p class="lead">${esc(sc.text||scene.text)}</p>${state.sources?`<div class="meta-row"><span class="source-pill">${esc(scene.source)}</span>${scene.place?`<span class="pill">${esc(find(D.places,scene.place)?.name||scene.place)}</span>`:''}</div>`:''}<div class="modal-nav"><button class="ghost" data-prev ${n===0?'disabled':''}>← ${u('back')}</button><button class="primary" data-next>${n===s.scenes.length-1?u('close'):u('next')+' →'}</button></div></div></div></div>`;$('#modal-root [data-close]').onclick=closeModal;$('#modal-root [data-prev]').onclick=()=>{if(n>0){n--;draw()}};$('#modal-root [data-next]').onclick=()=>{if(n<s.scenes.length-1){n++;draw()}else closeModal()}};draw()}
function openCase(id){const c=find(D.cases,id),tr=D.i18n.cases[id]||{};$('#modal-root').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-body"><button class="icon-btn close-x" data-close>×</button><div class="eyebrow">${esc(tr.status||c.status)}</div><h1>${esc(tr.title||c.title)}</h1><p class="lead">${esc(tr.question||c.question)}</p><h3>${u('evidence')}</h3><div class="evidence">${c.evidence.map((e,i)=>`<div class="evidence-item"><b>${esc(tr.evidence?.[i]?.kind||e.kind)}</b><span>${esc(tr.evidence?.[i]?.text||e.text)}</span></div>`).join('')}</div><h3>${u('hypotheses')}</h3><div class="hyp-list">${c.hypotheses.map((h,i)=>`<div class="hyp"><b>${esc(tr.hypotheses?.[i]?.name||h.name)} — ${h.confidence}%</b><div>${esc(tr.hypotheses?.[i]?.note||h.note)}</div><div class="bar"><i style="width:${h.confidence}%"></i></div></div>`).join('')}</div><h3>${u('whatMissing')}</h3><p>${esc(tr.open||c.open)}</p></div></div></div>`;$('#modal-root [data-close]').onclick=closeModal}
function closeModal(){$('#modal-root').innerHTML=''}
function openPdf(page){if(!state.pdfUrl)return;window.open(`${state.pdfUrl}#page=${page}`,'_blank','noopener')}
$('#nav').onclick=e=>{const b=e.target.closest('[data-view]');if(b)go(b.dataset.view)};$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#source-toggle').onclick=()=>{state.sources=!state.sources;localStorage.setItem('damascius-source-mode',state.sources?'on':'off');render()};$('#pdf-button').onclick=()=>$('#pdf-input').click();$('#pdf-input').onchange=e=>{const f=e.target.files[0];if(!f)return;if(state.pdfUrl)URL.revokeObjectURL(state.pdfUrl);state.pdfUrl=URL.createObjectURL(f);state.pdfName=f.name;render()};$('#search').addEventListener('input',e=>{state.search=e.target.value.trim();render()});document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;localStorage.setItem('damascius-lang',state.lang);render()});$('#rights-button').onclick=()=>go('rights');window.addEventListener('hashchange',()=>{state.view=location.hash.slice(2)||'overview';render()});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){closeModal();$('#detail').classList.remove('open');$('#sidebar').classList.remove('open')}});render();
})();
</script>
</body>
</html>
