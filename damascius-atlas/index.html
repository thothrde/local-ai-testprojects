iner alexandrinischen Schule","group":"teacher","origin":"Ägypten","places":["alexandria","menouthis"],"summary":"Rhetor und Lehrer in einem internationalen paganen und christlichen Milieu; unter Verfolgung verhaftet und gefoltert.","why":"Sein Leben zeigt die Schule als sozialen, religiösen und politischen Knotenpunkt.","tags":["Schule","Konversion","Folter","Netzwerk"],"sources":["PH 117–121","Athanassiadi 1999, Introduction"],"confidence":"hoch"},{"id":"ammonius","name":"Ammonius, Sohn des Hermeias","greek":"Ἀμμώνιος","dates":"ca. 440–520","role":"Philosoph und Aristoteles-Kommentator","group":"philosopher","origin":"Alexandria","places":["alexandria","athens"],"summary":"Pragmatischer, wissenschaftlich orientierter Lehrer; Damascius wirft ihm Gewinnsucht und einen Kompromiss mit Peter Mongos vor.","why":"Der Fall bleibt offen: Verrat, Überlebensstrategie oder institutionelle Rettung einer Lehrtradition?","tags":["Aristoteles","Kompromiss","Überleben","Rationalismus"],"sources":["PH 118B","Athanassiadi 1999, Introduction"],"confidence":"mittel"},{"id":"aedesia","name":"Aedesia","greek":"Αἰδεσία","dates":"5. Jh.","role":"Mäzenin und Trägerin einer philosophischen Familie","group":"woman","origin":"Alexandria","places":["alexandria","athens"],"summary":"Sicherte die Ausbildung ihrer Söhne, bewahrte öffentliche Förderung und half Bedürftigen bis zur eigenen Verschuldung.","why":"Sie macht sichtbar, dass philosophische Sukzession auf Geld, Fürsorge und weiblichen Netzwerken beruht.","tags":["Fürsorge","Dynastie","Bildung","Mäzenatentum"],"sources":["PH 56","Athanassiadi 1999, Introduction"],"confidence":"hoch"},{"id":"hypatia","name":"Hypatia","greek":"Ὑπατία","dates":"ca. 355–415","role":"Mathematikerin, Philosophin, öffentliche Lehrerin","group":"woman","origin":"Alexandria","places":["alexandria"],"summary":"Wegen Dialektik, politischer Klugheit und öffentlicher Autorität bewundert; zugleich in Damascius’ Hierarchie unter den wahren Philosophen gestellt.","why":"Die Spannung zwischen Verehrung und Herabstufung legt Damascius’ eigenes Philosophieideal offen.","tags":["Mathematik","Politik","Mord","Öffentlichkeit"],"sources":["PH 43E","PH 106A"],"confidence":"hoch"},{"id":"theosebius","name":"Theosebius","greek":"Θεοσέβιος","dates":"5. Jh.","role":"Praktischer Ethiker","group":"ascetic","origin":"unbekannt","places":["alexandria"],"summary":"Verband Helios und den Gott der Juden in einem Exorzismus und führte später eine freiwillig enthaltsame Ehe.","why":"Er zeigt eine städtische pagane Askese, die weder bloß theurgisch noch christlich ist.","tags":["Askese","Ehe","Exorzismus","Synkretismus"],"sources":["PH 46"],"confidence":"hoch"},{"id":"anthusa","name":"Anthusa","greek":"Ἀνθοῦσα","dates":"5. Jh.","role":"Erfinderin einer Wolkenmantik","group":"woman","origin":"Aigai in Kilikien","places":["aegae","constantinople"],"summary":"Deutete eine Wolkenvision als Vorzeichen für die Ermordung Aspars und soll daraus eine fortgesetzte Divinationstechnik entwickelt haben.","why":"Sie erscheint nicht nur als Visionärin, sondern als methodische Innovatorin.","tags":["Wolken","Divination","Politik","Innovation"],"sources":["PH 52"],"confidence":"mittel"},{"id":"epiphanius","name":"Epiphanius","greek":"Ἐπιφάνιος","dates":"4./5. Jh.","role":"Astronom und Mysterienexperte","group":"ritual","origin":"Alexandria","places":["alexandria"],"summary":"Bewahrer von Osiris- und Aion-Mysterien; wahrscheinlich aus dem wissenschaftlichen Umkreis Theons.","why":"Er verkörpert die Übergangsgeneration, die die letzten Träger der alten Lebensordnung noch persönlich kannte.","tags":["Aion","Astronomie","Osiris","Überlieferung"],"sources":["PH 41"],"confidence":"mittel"},{"id":"euprepius","name":"Euprepius","greek":"Εὐπρέπιος","dates":"4./5. Jh.","role":"Leiter persischer Mysterien","group":"ritual","origin":"Alexandria","places":["alexandria"],"summary":"Ritualexperte und Übermittler älterer paganer Erzählungen in einer Zeit unterbrochener Tradition.","why" Kultort mit lokalen theologischen Traditionen."},{"id":"berytius","name":"Berytos / Beirut","x":690,"y":365,"type":"Stadt und Kultort","summary":"Damascius hört lokale phönizische Traditionen, darunter den Mythos von Eshmun.","stories":["eshmun-path","journey-conversion"],"years":"ca. 490","lon":35.5018,"lat":33.8938,"precision":"city","mapCategory":"travel","labelDx":-12,"labelDy":20,"labelAnchor":"end","geography":"Küstenstadt Berytos, das heutige Beirut; in der Reiseerzählung Ort phönizischer Lokaltraditionen, darunter der Eshmun-Mythos."},{"id":"bostra","name":"Bostra","x":745,"y":385,"type":"Provinzhauptstadt","summary":"Begegnung mit arabischen Kulten, Dusares und heiligen Landschaften.","stories":["sacred-geography","journey-conversion"],"years":"ca. 490","lon":36.481,"lat":32.518,"precision":"site","mapCategory":"sacred","labelDx":10,"labelDy":20,"labelAnchor":"start","geography":"Bosra im Hauran, römische Provinzhauptstadt und Ausgangspunkt für Berichte über arabische Kulte und heilige Landschaften."},{"id":"gaza","name":"Gaza","x":700,"y":405,"type":"Bildungszentrum","summary":"Antony hilft Damascius und Isidor auf der Flucht.","stories":["journey-conversion"],"years":"ca. 489","lon":34.4668,"lat":31.5017,"precision":"city","mapCategory":"travel","labelDx":10,"labelDy":20,"labelAnchor":"start","geography":"Bedeutendes Bildungszentrum an der südlichen Levanteküste; in der rekonstruierten Reise ein Ort der Hilfe für die Flüchtenden."},{"id":"emesa","name":"Emesa / Homs","x":705,"y":325,"type":"Sakrale Heimat","summary":"Stadt der Iamblichus-Tradition; möglicher letzter Aufenthaltsort des Damascius und Fundort des Zosime-Epigramms.","stories":["zosime-path","persian-exile"],"years":"6. Jh.","lon":36.7167,"lat":34.7333,"precision":"city","mapCategory":"sacred","labelDx":-12,"labelDy":-10,"labelAnchor":"end","geography":"Homs in Syrien, sakrale Heimat mehrerer philosophischer Traditionslinien; möglicher später Aufenthaltsraum des Damascius bleibt eine Rekonstruktion."},{"id":"harran","name":"Harran","x":790,"y":265,"type":"Grenzstadt","summary":"Spätpagane Stadt; in einer umstrittenen Hypothese möglicher Rückzugsort der Philosophen.","stories":["persian-exile"],"years":"nach 532?","lon":39.031,"lat":36.864,"precision":"site","mapCategory":"travel","labelDx":10,"labelDy":-12,"labelAnchor":"start","geography":"Stadt in Obermesopotamien mit langlebiger nichtchristlicher Religionskultur. Ihre Rolle als Rückzugsort der Philosophen ist eine umstrittene Hypothese."},{"id":"ctesiphon","name":"Ktesiphon","x":900,"y":330,"type":"Sassanidische Hauptstadt","summary":"Ziel der sieben Philosophen in der Hoffnung auf philosophische Freiheit unter Chosrau I.","stories":["persian-exile"],"years":"ca. 531–532","lon":44.58,"lat":33.09,"precision":"site","mapCategory":"travel","labelDx":-12,"labelDy":-10,"labelAnchor":"end","geography":"Sassanidische Residenz am Tigris südöstlich des heutigen Bagdad; Ziel der Philosophenreise zu Chosrau I."},{"id":"constantinople","name":"Konstantinopel","x":565,"y":190,"type":"Kaiserliche Hauptstadt","summary":"Hofpolitik, Aspars Ermordung, Karrieren und religiöse Machtkämpfe.","stories":["anthusa-path"],"years":"5. Jh.","lon":28.9784,"lat":41.0082,"precision":"city","mapCategory":"politics","labelDx":10,"labelDy":-10,"labelAnchor":"start","geography":"Kaiserliche Hauptstadt am Bosporus; politischer Horizont der Aspar-Erzählung und vieler Karrieren des 5. Jahrhunderts."},{"id":"rome","name":"Rom","x":300,"y":290,"type":"Imperiale Erinnerung","summary":"In Geschichten über Attila, Severus und Vorzeichen als symbolischer Horizont präsent.","stories":["phantom-wars"],"years":"5. Jh.","lon":12.4964,"lat":41.9028,"precision":"city","mapCategory":"politics","labelDx":10,"labelDy":-12,"labelAnchor":"start","geography":"Westliche Kaiserstadt und Erinnerungsraum in Geschichten über Herrschaft, Vorzeichen und Schlachten."},{"id":"aegae","name":"Aigai in Kilikien","x":660,"y":250,"type":"Herkunftsort","summary":"Herkunft Anthusas, der Erfinderin der Wolkenmantik.","stories":["anthusa-path"],"years":"5. Jh.","lon":35.85,"lat":36.77,"precision":"approx","mapCategory":"origin","labelDx":10,"labelDy":-10,"labelAnchor":"start","geography":"Aigai in Kilikien, ungefähr im Raum des heutigen Yumurtalık/Ayas; als Herkunftsort Anthusas markiert."},{"id":"attica","name":"Attika","x":510,"y":270,"type":"Kultlandschaft","summary":"Hegias restauriert heimlich Heiligtümer und erneuert Riten.","stories":[],"years":"ca. 500","lon":23.7,"lat":37.85,"precision":"region","mapCategory":"region","labelDx":-12,"labelDy":24,"labelAnchor":"end","geography":"Region um Athen. Der Punkt ist ein Kartenanker für eine Landschaft, kein einzelner antiker Ort."},{"id":"india","name":"Indien","x":980,"y":460,"type":"Fernraum","summary":"Herkunftsraum der Brahmanen im Haus des Severus.","stories":["brahmans-path"],"years":"5. Jh.","lon":77.0,"lat":22.0,"precision":"region","mapCategory":"horizon","labelDx":10,"labelDy":-12,"labelAnchor":"start","geography":"Damascius nennt Indien als Herkunfts- und Erzählhorizont der Brahmanen, ohne einen präzisen Ort anzugeben. Die Markierung bezeichnet deshalb bewusst eine große Region."}],"routes":[{"from":"alexandria","to":"gaza","kind":"Flucht / Reise","year":489,"id":"r1","group":"journey","certainty":"reconstructed","note":"Flucht- und Reiseabschnitt nach der alexandrinischen Krise; die genaue Abfolge wird aus Fragmenten rekonstruiert."},{"from":"gaza","to":"bostra","kind":"Reise","year":489,"id":"r2","group":"journey","certainty":"reconstructed","note":"Fortsetzung der Reise in den syrisch-arabischen Raum."},{"from":"bostra","to":"damascus","kind":"Sakrale Reise","year":489,"id":"r3","group":"journey","certainty":"reconstructed","note":"Route zu lokalen Kulten und heiligen Landschaften."},{"from":"damascus","to":"heliopolis","kind":"Sakrale Reise","year":489,"id":"r4","group":"journey","certainty":"reconstructed","note":"Kurze Verbindung zwischen Damaskus und Heliopolis/Baalbek."},{"from":"heliopolis","to":"berytius","kind":"Reise","year":490,"id":"r5","group":"journey","certainty":"reconstructed","note":"Weiterreise zur phönizischen Küste."},{"from":"berytius","to":"aphrodisias","kind":"Reise","year":490,"id":"r6","group":"journey","certainty":"reconstructed","note":"Langer, nur grob rekonstruierbarer Reiseabschnitt nach Kleinasien."},{"from":"aphrodisias","to":"athens","kind":"Reise","year":490,"id":"r7","group":"journey","certainty":"reconstructed","note":"Übergang in die Athener Schulwelt."},{"from":"athens","to":"harran","kind":"Exilroute, hypothetisch","year":531,"id":"r8","group":"persia","certainty":"hypothetical","note":"Für die Persienreise plausible Großroute; Harran als konkreter Zwischen- oder Rückzugsort bleibt hypothetisch."},{"from":"harran","to":"ctesiphon","kind":"Exilroute","year":531,"id":"r9","group":"persia","certainty":"reconstructed","note":"Reise in den sassanidischen Herrschaftsraum."},{"from":"ctesiphon","to":"harran","kind":"Rückkehrhypothese","year":532,"id":"r10","group":"persia","certainty":"hypothetical","note":"Rückkehrbewegung nach dem Friedensvertrag; genauer Weg und Aufenthaltsorte sind nicht überliefert."},{"from":"harran","to":"emesa","kind":"mögliche letzte Reise","year":538,"id":"r11","group":"persia","certainty":"hypothetical","note":"Mögliche spätere Bewegung nach Syrien; nicht als gesicherte Biographie zu lesen."}],"relationships":[["damascius","isidore","Schüler / Lehrer"],["isidore","sarapio","geistige Verwandtschaft"],["asclepiodotus","isidore","Lehrer"],["proclus","marinus","Lehrer / Nachfolger"],["proclus","asclepiodotus","Lehrer / eigenwilliger Schüler"],["marinus","isidore","Lehrer und Kritiker"],["aedesia","ammonius","Mutter / institutionelle Förderin"],["horapollo","heraiscus","Familien- und Schulkreis"],["horapollo","ammonius","Kollegen im Schulmilieu"],["horapollo","isidore","Schulmilieu"],["damascius","aedesia","junger Redner der Grabrede"],["damascius","asclepiodotus","Bewunderung und Polemik"],["ammonius","peter-mongus","politischer Kompromiss?"],["hegias","proclus","theologische Ausbildung"],["theodora","damascius","Schülerin / Auftraggeberin"],["theodora","isidore","Schülerin"],["severus","brahmans","Gastgeber"],["epiphanius","euprepius","Ritualkollegen"],["photius","damascius","Exzerptor / überlieferter Autor"],["damascius","zosime","Verfasser des Grabepigramms"],["ulpian","isidore","Brüder"]],"timeline":[{"year":412,"title":"Geburt des Proklos","category":"person","detail":"Später maßgebliche Autorität der Athener Schule."},{"year":415,"title":"Ermordung Hypatias","category":"violence","detail":"Damascius deutet Neid und religiöse Macht als Motivkomplex."},{"year":450,"title":"Blüte paganer Schulen in Alexandria","category":"institution","detail":"Horapollo, Aedesia, Ammonius, Heraiscus und Isidor bilden ein dichtes Milieu."},{"year":468,"title":"Vandalenexpedition Leos I.","category":"politics","detail":"Anthusas Sorge um ihren Ehemann bildet den Hintergrund der Wolkenvision."},{"year":471,"title":"Ermordung Aspars","category":"politics","detail":"In Anthusas Vision verschlingt ein Löwe die Gestalt eines Goten."},{"year":480,"title":"Damascius in Alexandria","category":"person","detail":"Studium und Praxis der Rhetorik im Umfeld Horapollos."},{"year":484,"title":"Aufstand des Illus","category":"politics","detail":"Pamprepius verbindet Rebellion mit Hoffnungen auf pagane Restauration."},{"year":485,"title":"Tod des Proklos","category":"institution","detail":"Beginn der offenen Nachfolgekrise."},{"year":488,"title":"Verfolgung des alexandrinischen Milieus","category":"violence","detail":"Verhaftung, Folter, Flucht und mutmaßliche Kompromisse zerreißen das Netzwerk."},{"year":489,"title":"Philosophische Wende und Flucht","category":"person","detail":"Unter Isidors Einfluss verlässt Damascius die Rhetorik."},{"year":490,"title":"Aphrodisias und Ankunft in Athen","category":"travel","detail":"Begegnung mit Asclepiodotus und Eintritt in die Athener Schulwelt."},{"year":500,"title":"Hegias’ Restaurationsaktivismus","category":"religion","detail":"Heiligtümer werden erneuert; Damascius kritisiert die politische Unklugheit."},{"year":515,"title":"Damascius als Diadochos","category":"institution","detail":"Ungefähre Datierung seiner Schulleitung und Reformen."},{"year":517,"title":"Möglicher Beginn der Abfassung","category":"text","detail":"Athanassiadi datiert das Werk zwischen 517 und 526."},{"year":529,"title":"Unterrichtsverbot in Athen","category":"violence","detail":"Ein kaiserliches Edikt beendet den öffentlichen Lehrbetrieb."},{"year":531,"title":"Reise der sieben Philosophen nach Persien","category":"travel","detail":"Hoffnung auf intellektuelle Freiheit bei Chosrau I."},{"year":532,"title":"Friedensvertrag und Rückkehrgarantie","category":"politics","detail":"Keine erzwungene Änderung ihrer Überzeugungen."},{"year":850,"title":"Photios exzerpiert das Werk","category":"transmission","detail":"Seine Epitome bewahrt große Teile und formt sie neu."},{"year":975,"title":"Suda-Exzerpte","category":"transmission","detail":"Lexikographische Zersplitterung bewahrt zusätzliche Fragmente."},{"year":1999,"title":"Athanassiadis Rekonstruktion","category":"transmission","detail":"Text, Übersetzung, Kommentar und neue Gesamtordnung."}],"stories":[{"id":"alexandria-collapse","title":"Alexandria 488/89 – Das Netzwerk zerbricht","subtitle":"Verfolgung, Folter, Flucht und Kompromiss","duration":"12 Min.","tone":"investigativ","cover":"network","intro":"Eine Schule ist zugleich Lehrbetrieb, Familie, Kultgemeinschaft, Karriereweg und Schutznetz.","scenes":[{"title":"Die Schule als Knoten","text":"Horapollos Einrichtung versammelt pagane und christliche Schüler, Rhetoren, Philosophen, Familien und Kultspezialisten.","place":"alexandria","people":["horapollo","ammonius","isidore","heraiscus","damascius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Der Auslöser","text":"Ein Konflikt um einen konvertierten Studenten, ein geheimes Isisheiligtum und kirchenpolitische Rivalitäten wird zur Operation gegen das pagane Milieu.","place":"menouthis","people":["peter-mongus","horapollo"],"source":"Athanassiadi 1999, Introduction"},{"title":"Folter und Schweigen","text":"Horapollo und Heraiscus werden gefoltert, um Verstecke preiszugeben. Damascius macht ihr Schweigen zur moralischen Probe.","place":"alexandria","people":["horapollo","heraiscus","isidore"],"source":"PH 117B–C"},{"title":"Der offene Fall Ammonius","text":"Ammonius bleibt beruflich unbeschädigt und trifft eine Vereinbarung mit dem Patriarchen. Der Inhalt ist verloren.","place":"alexandria","people":["ammonius","peter-mongus"],"source":"PH 118B; Athanassiadi 1999, Introduction"},{"title":"Konversion des Damascius","text":"Die Krise zerstört sein Vertrauen in Rhetorik. Philosophie wird zur Frage, ob Worte im Handeln bestehen.","place":"alexandria","people":["damascius","isidore"],"source":"Athanassiadi 1999, Introduction; contrast PH 124"}],"durationMinutes":12,"significance":"Die Episode zeigt die Schule nicht als isolierten Unterrichtsraum, sondern als verletzliches Geflecht aus Familien, Karrieren, Kulten, Patronage und persönlicher Loyalität. Weil Damascius parteiisch berichtet und die Bedingungen von Ammonius’ Vereinbarung verloren sind, muss dessen Rolle offenbleiben.","sourceNote":"Die Ereignisfolge wird aus Damascius-Fragmenten und zeitnahen christlichen Quellen rekonstruiert. Die App unterscheidet überlieferte Einzelheiten von Athanassiadis moderner Synthese."},{"id":"sarapio-path","title":"Der Mann mit nur drei Büchern","subtitle":"Sarapio und die Politik der geistigen Armut","duration":"8 Min.","tone":"kontemplativ","cover":"books","intro":"Was wäre, wenn eine Bibliothek nicht durch Wachstum, sondern durch radikale Auswahl philosophisch wird?","scenes":[{"title":"Das kleine Haus","text":"Sarapio lebt nahezu unsichtbar in Alexandria und empfängt fast niemanden.","place":"alexandria","people":["sarapio"],"source":"PH 111"},{"title":"Zwei oder drei Bücher","text":"Er besitzt nur wenige Texte, darunter Orpheus. Bücher werden nach ihrer Fähigkeit zur Sammlung beurteilt.","place":"alexandria","people":["sarapio","isidore"],"source":"PH 111"},{"title":"Kronos in der Gegenwart","text":"Damascius erklärt ihn zum Beweis eines goldenen, kronischen Lebens mitten in einer typhonischen Zeit.","place":"alexandria","people":["sarapio","pamprepius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Das Problem","text":"Ist Rückzug höchste Konzentration – oder entzieht er Tugend der politischen Bewährung?","place":"alexandria","people":["sarapio","damascius"],"source":"Kontrast PH 111 / PH 124"}],"durationMinutes":8,"significance":"Sarapio dient Damascius als kronisches Gegenbild zu einer zerstreuten, „typhonischen“ Gegenwart. Zugleich erklärt Damascius an anderer Stelle, Tugend müsse sich im Handeln bewähren. Das Porträt enthält daher eine echte Spannung zwischen Rückzug und öffentlicher Bewährung.","sourceNote":"Die wenigen biographischen Angaben stammen aus der fragmentarischen Überlieferung; die Deutung als Erkenntnispolitik ist eine ausdrücklich gekennzeichnete Interpretation der App."},{"id":"asclepiodotus-path","title":"Das verlorene Intervall","subtitle":"Asclepiodotus zwischen Labor und Metaphysik","duration":"11 Min.","tone":"experimentell","cover":"monochord","intro":"Ein Universalgelehrter versucht, eine Klangwelt wiederzugewinnen, die seine Zeit nicht mehr hören kann.","scenes":[{"title":"220 Positionen","text":"Am Monochord verschiebt Asclepiodotus den Steg in mindestens 220 Positionen, um die enharmonische Diesis zu rekonstruieren.","place":"aphrodisias","people":["asclepiodotus"],"source":"PH 85B"},{"title":"Das historische Ohr","text":"Eine Kultur kann die Fähigkeit verlieren, ein Intervall überhaupt wahrzunehmen.","place":"aphrodisias","people":["asclepiodotus"],"source":"PH 85B"},{"title":"Der giftige Abstieg","text":"In Hierapolis schützt er sich mit eingeschlossener Außenluft und untersucht einen tödlichen unterirdischen Dampf.","place":"hierapolis","people":["asclepiodotus","damascius"],"source":"PH 87A"},{"title":"Medizin als Rekonstruktion","text":"Er stellt den Gebrauch der weißen Nieswurz wieder her.","place":"aphrodisias","people":["asclepiodotus","iacobus"],"source":"PH 85D"},{"title":"Damascius’ Abwehr","text":"Gerade seine empirische Genialität macht ihn zum gefährlichen Gegenmodell.","place":"aphrodisias","people":["asclepiodotus","damascius","isidore"],"source":"Athanassiadi 1999, Introduction"}],"durationMinutes":11,"significance":"Die ungewöhnlich vielen technischen Anekdoten machen Asclepiodotus zu einem konkurrierenden Modell des Philosophen. Damascius’ Kritik ist deshalb selbst ein historischer Befund über rivalisierende Standards von Wissen und nicht als neutrales Urteil zu übernehmen.","sourceNote":"Monochord, Medizin und Dampfexperiment sind als Berichte des Damascius überliefert. Die App trennt den Bericht von moderner naturwissenschaftlicher Einordnung."},{"id":"anthusa-path","title":"Die Frau, die aus Wolken las","subtitle":"Anthusa und eine neu erfundene Mantik","duration":"7 Min.","tone":"visuell","cover":"clouds","intro":"Eine persönliche Sorge, ein Traum und ein politisches Ereignis werden zur Gründungsgeschichte einer Methode.","scenes":[{"title":"Gebet an beide Horizonte","text":"Anthusa betet zur aufgehenden Sonne; der verstorbene Vater fordert sie im Traum auf, auch die untergehende Sonne anzurufen.","place":"aegae","people":["anthusa"],"source":"PH 52"},{"title":"Mann, Löwe, Verschlingen","text":"Zwei Wolken nehmen Gestalt an. Ein Löwe verschlingt einen gotisch wirkenden Mann.","place":"constantinople","people":["anthusa"],"source":"PH 52"},{"title":"Politische Erfüllung","text":"Damascius verbindet das Bild mit der Ermordung Aspars durch Kaiser Leo.","place":"constantinople","people":["anthusa"],"source":"PH 52"},{"title":"Von der Vision zur Technik","text":"Anthusa soll die Wolkenmantik anschließend dauerhaft praktiziert haben.","place":"aegae","people":["anthusa"],"source":"PH 52"}],"durationMinutes":7,"significance":"Die Erzählung verbindet persönliche Sorge, Traumweisung, Wolkenbeobachtung und politische Erinnerung. Damascius schreibt Anthusa die Umwandlung eines einzelnen Zeichens in eine fortgesetzte Kunst zu; unabhängig überprüfen lässt sich diese Methode nicht.","sourceNote":"Die historische Ermordung Aspars ist vom mantischen Deutungsrahmen zu unterscheiden. Die App behauptet keine erfolgreiche Vorhersage als Tatsache."},{"id":"journey-conversion","title":"Die Reise der Bekehrung","subtitle":"Von Alexandria nach Athen durch sakrale Landschaften","duration":"14 Min.","tone":"atlas","cover":"route","intro":"Flucht, Bildungsreise, Pilgerfahrt und Feldforschung überlagern sich.","scenes":[{"title":"Gaza: Hilfe","text":"Antony unterstützt die Flüchtenden. Dankbarkeit wird zu einem Punkt in Damascius’ Gedächtnisgeographie.","place":"gaza","people":["damascius","isidore"],"source":"PH 132–144"},{"title":"Bostra und Arabien","text":"Mit Dorus besuchen sie Kultorte, heilige Gewässer und lokale Theologien.","place":"bostra","people":["damascius","isidore"],"source":"PH 134–142, reconstructed sequence"},{"title":"Heliopolis","text":"Lokale Priester und selbsternannte Philosophen werden zu Prüfsteinen echter und vorgetäuschter Weisheit.","place":"heliopolis","people":["damascius","isidore"],"source":"PH 138–141"},{"title":"Berytos","text":"Damascius hört den Eshmun-Mythos und bewahrt eine phönizische Stimme in griechischer Sprache.","place":"berytius","people":["damascius"],"source":"PH 142B"},{"title":"Aphrodisias","text":"Asclepiodotus führt die Reisenden in eine Welt aus Experiment, Kult und Institutionenbildung.","place":"aphrodisias","people":["asclepiodotus","isidore","damascius"],"source":"PH 81–90"},{"title":"Athen","text":"Die Reise endet in einer alternden, intriganten Schule, die Damascius später reformieren will.","place":"athens","people":["damascius","isidore","marinus"],"source":"PH 145–152"}],"durationMinutes":14,"significance":"Die Route verwandelt Flucht in intellektuelle Feldforschung. Lokale Informanten, Landschaften und Kulttraditionen gelangen in das Werk; zugleich hängt die genaue Reihenfolge der Stationen von einer modernen Anordnung verstreuter Fragmente ab.","sourceNote":"Die gezeichnete Linie ist eine quellenbasierte Rekonstruktion, keine antike Reiseroute mit vollständig überlieferten Etappen."},{"id":"golden-chain","title":"Die goldene Kette und ihre dunkle Unterseite","subtitle":"Nachfolge, Familien, Bücher und Macht","duration":"10 Min.","tone":"institutionell","cover":"chain","intro":"Metaphysische Sukzession erscheint in der Praxis als Kampf um Lehrstühle, Texte und Legitimität.","scenes":[{"title":"Der alternde Proklos","text":"Während Proklos’ Krankheit beginnt die Frage, wer die platonische Autorität erben kann.","place":"athens","people":["proclus","marinus"],"source":"PH 97–105"},{"title":"Marinus’ Buchverbrennung","text":"Ein höflicher Satz Isidors genügt: Der umfangreiche Philebos-Kommentar wird vernichtet.","place":"athens","people":["marinus","isidore","proclus"],"source":"PH 38A"},{"title":"Parmenides als Kampfzone","text":"Ob der Dialog von Arten oder Göttern handelt, entscheidet über die theologische Identität der Schule.","place":"athens","people":["marinus","isidore","proclus"],"source":"PH 97I–J"},{"title":"Freier Diadochos?","text":"Isidor erhält möglicherweise einen Ehrenstatus, ohne die Schule regulär zu leiten.","place":"athens","people":["isidore","damascius"],"source":"Athanassiadi 1999, Introduction"}],"durationMinutes":10,"significance":"Philosophische Sukzession erscheint hier nicht nur als metaphysische „goldene Kette“, sondern als Streit um Autorität, Geld, Manuskripte, Familien und institutionelle Legitimität. Gerade die Selbstvernichtung von Texten macht den inneren Mechanismus kulturellen Verlusts sichtbar.","sourceNote":"Damascius ist Beteiligter und moralischer Richter dieser Konflikte. Seine Charakterbilder sind Quellen, aber keine unparteiischen Protokolle."},{"id":"persian-exile","title":"Die sieben Philosophen in Persien","subtitle":"Utopie, Kulturschock und ausgehandelte Rückkehr","duration":"12 Min.","tone":"politisch","cover":"exile","intro":"Als der Lehrbetrieb verboten wird, versucht Damascius eine ganze Institution in eine andere Welt zu versetzen.","scenes":[{"title":"Verbergen und Packen","text":"Heilige Objekte werden in Brunnen verborgen, Handschriften gepackt.","place":"athens","people":["damascius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Die Hoffnung auf Chosrau","text":"Platonische Königsideale lassen Ktesiphon wie einen Ort philosophischer Freiheit erscheinen.","place":"ctesiphon","people":["damascius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Kulturschock","text":"Der Hof ist kein freier Lehrraum; die Philosophen werden zu fremden Beratern.","place":"ctesiphon","people":["damascius"],"source":"Athanassiadi 1999, Introduction"},{"title":"Gewissensfreiheit","text":"Der Friedensvertrag garantiert nach Agathias Freiheit von erzwungenem Glaubenswechsel.","place":"harran","people":["damascius"],"source":"Agathias II.31"},{"title":"Harran?","text":"Ob die Rückkehrer tatsächlich in Harran lebten, bleibt umstritten.","place":"harran","people":["damascius"],"source":"Athanassiadi 1999, Introduction"}],"durationMinutes":12,"significance":"Die Geschichte fragt, ob eine Institution in eine andere politische Welt versetzt werden kann. Der persische Hof enttäuscht die Hoffnung auf den philosophischen König; der Friedensvertrag sichert nach Agathias wenigstens Schutz vor erzwungener Konversion.","sourceNote":"Die Reise nach Persien ist antik bezeugt. Verborgene Kultobjekte, mitgeführte Manuskripte und ein späterer Aufenthalt in Harran gehören teilweise zu moderner Rekonstruktion und bleiben unterschiedlich sicher."},{"id":"zosime-path","title":"Zosimes Freiheit","subtitle":"Zwei Verse gegen die soziale Definition eines Menschen","duration":"5 Min.","tone":"minimal","cover":"epigram","intro":"Die kleinste Geschichte enthält möglicherweise die stärkste philosophische Verdichtung.","scenes":[{"title":"Der Grabstein","text":"Zosime spricht: Früher war sie nur körperlich versklavt; im Tod sei nun auch der Körper frei.","place":"emesa","people":["zosime","damascius"],"source":"Anthologia Graeca VII.553"},{"title":"Innere Freiheit","text":"Die Seele war nie Besitz eines anderen.","place":"emesa","people":["zosime"],"source":"Athanassiadi 1999, Introduction"},{"title":"Damascius im Alter","text":"Das Epigramm ist ein schwaches Indiz für seine Rückkehr in die syrische Heimat.","place":"emesa","people":["damascius"],"source":"Athanassiadi 1999, Introduction"}],"durationMinutes":5,"significance":"Das kurze Epigramm verdichtet die Unterscheidung zwischen innerer und körperlich-sozialer Freiheit in der Stimme einer versklavten Frau. Seine mögliche Verbindung mit den letzten Lebensjahren des Damascius ist bewegend, aber biographisch nur ein schwaches Indiz.","sourceNote":"Der Wortlaut wird in der öffentlichen App nicht aus einer modernen Übersetzung übernommen, sondern eigenständig paraphrasiert."},{"id":"sacred-geography","title":"Die arabische Styx","subtitle":"Naturphänomen, Eid und göttliches Urteil","duration":"8 Min.","tone":"landschaft","cover":"water","intro":"In der sakralen Geographie sind Natur, Recht, Ritual und Körper nicht getrennt.","scenes":[{"title":"Der Abstieg","text":"Auch geeignete Frauen steigen in die Schlucht hinab; Gärten und Höfe liegen in der Tiefe.","place":"bostra","people":["damascius","isidore"],"source":"PH 135"},{"title":"Das Wasser entscheidet","text":"Leichte Opfer sinken, schwere werden zurückgeworfen – je nach göttlicher Zustimmung.","place":"bostra","people":["damascius","isidore"],"source":"PH 135"},{"title":"Eid und Körper","text":"Meineid an diesem Wasser soll binnen eines Jahres durch Wassersucht bestraft werden.","place":"bostra","people":["damascius"],"source":"PH 135"},{"title":"Feldforschung","text":"Lokale Erfahrung, Homerzitate und religiöse Deutung werden in einem Bericht gesammelt.","place":"bostra","people":["damascius","isidore"],"source":"Kommentar zu PH 135"}],"durationMinutes":8,"significance":"Der Bericht verbindet Landschaft, Recht, Körper und Ritual. Er ist besonders aufschlussreich für eine Welt, in der Naturerscheinung und göttliches Urteil nicht als getrennte Kategorien behandelt werden.","sourceNote":"Die App behauptet weder die physikalische Funktionsweise der Opferprobe noch die berichtete Strafe für Meineid. Sie untersucht die Erzählung als heilige Geographie."},{"id":"phantom-wars","title":"Schlachten nach dem Tod","subtitle":"Phantomkrieger, Geräusche und wiederkehrende Orte","duration":"7 Min.","tone":"paradoxographisch","cover":"ghosts","intro":"Damascius vergleicht einen wiederkehrenden Typus von Erscheinung.","scenes":[{"title":"Drei Tage Kampf","text":"Nach einer großen Schlacht sollen die Seelen der Gefallenen drei Tage und Nächte weitergekämpft haben.","place":"rome","people":["damascius"],"source":"PH 50"},{"title":"Geographie der Wiederholung","text":"Ähnliche Phantome erscheinen in Karien, Sizilien und anderen Ebenen.","place":"aphrodisias","people":["damascius"],"source":"PH 50"},{"title":"Anomalietyp","text":"Der Text sammelt Zeugen, Orte und Varianten eines Phänomens.","place":"rome","people":["damascius"],"source":"PH 50"}],"durationMinutes":7,"significance":"Die Sammlung ähnlicher Berichte zeigt Damascius’ Interesse an wiederkehrenden Typen des Außergewöhnlichen. Der vergleichende Impuls ist historisch interessant; er beweist nicht, dass die Erscheinungen stattgefunden haben.","sourceNote":"Orte und Varianten sind als antike Berichte dargestellt, nicht als bestätigte Ereignisse."},{"id":"eshmun-path","title":"Eshmun, der achte Sohn","subtitle":"Ein phönizischer Heilgott zwischen Kastration und Wiedergeburt","duration":"7 Min.","tone":"mythologisch","cover":"eshmun","intro":"Eine lokale mündliche Überlieferung gelangt in eine griechische philosophische Reiseerzählung.","scenes":[{"title":"Astronoes Verfolgung","text":"Die Göttin verfolgt den schönen Jäger Eshmun; in Panik verstümmelt er sich.","place":"berytius","people":[],"source":"PH 142B"},{"title":"Lebenswärme","text":"Astronoe belebt ihn durch Wärme neu; der Jüngling wird zum Heilgott.","place":"berytius","people":["damascius"],"source":"PH 142B"},{"title":"Die Acht","text":"Eine zweite Etymologie macht ihn zum achten Sohn und öffnet kosmologische Symbolik.","place":"berytius","people":["isidore"],"source":"Kommentar zu PH 142B"},{"title":"Lokale Stimme","text":"Der Erzählstil deutet auf einen örtlichen Informanten.","place":"berytius","people":["damascius"],"source":"Athanassiadi 1999, commentary"}],"durationMinutes":7,"significance":"Die Episode kann eine lokale phönizische Tradition bewahren, aber sie erreicht uns durch eine griechische philosophische Reiseerzählung. Gerade diese Übersetzung zwischen lokalen und gelehrten Deutungssystemen macht sie wichtig.","sourceNote":"Die Annahme eines lokalen Informanten ist plausibel, aber keine direkt überlieferte Angabe."},{"id":"hypatia-path","title":"Hypatia im Spiegel des Damascius","subtitle":"Bewunderung, Mordbericht und disziplinäre Hierarchie","duration":"9 Min.","tone":"kritisch","cover":"hypatia","intro":"Eine Quelle kann zugleich wertvolles Zeugnis und parteiisches Urteil sein.","scenes":[{"title":"Öffentliche Autorität","text":"Hypatia lehrt öffentlich, berät Amtsträger und wird von der Stadt hoch geachtet.","place":"alexandria","people":["hypatia"],"source":"PH 43E"},{"title":"Neid und Mord","text":"Damascius macht Kyrills Neid zum Ausgangspunkt des Mordkomplotts.","place":"alexandria","people":["hypatia"],"source":"PH 43E"},{"title":"Wahrer Philosoph gegen Mathematikerin","text":"An anderer Stelle dient Hypatia als Gegenfolie für Isidors höhere Philosophie.","place":"alexandria","people":["hypatia","isidore"],"source":"PH 106A"},{"title":"Quellenkritik","text":"Gerade die Ungerechtigkeit des Vergleichs dokumentiert Damascius’ Hierarchie.","place":"alexandria","people":["hypatia","damascius"],"source":"Interpretative Analyse"}],"durationMinutes":9,"significance":"Damascius liefert ein wertvolles Zeugnis für Hypatias öffentliche Autorität und benutzt sie zugleich als Gegenfolie für Isidors angeblich höhere Philosophie. Seine Voreingenommenheit ist deshalb kein Grund, die Quelle zu verwerfen; sie ist selbst Teil des historischen Befunds.","sourceNote":"Die App hält PH 43E (öffentliche Autorität und Tod) und PH 106A (Vergleich mit Isidor) ausdrücklich auseinander."},{"id":"brahmans-path","title":"Brahmanen im Haus eines römischen Senators","subtitle":"Alexandria als transkultureller Knoten","duration":"6 Min.","tone":"ethnographisch","cover":"brahmans","intro":"Die interessante Figur ist weniger der sagenhafte Bergasket als der Vermittler zwischen zwei sozialen Welten.","scenes":[{"title":"Askese im Haus","text":"Die Gäste verlassen das Haus kaum, essen Datteln und Reis und trinken Wasser.","place":"alexandria","people":["severus","brahmans"],"source":"PH 51D"},{"title":"Zwischen zwei Welten","text":"Sie vertreten Bergbrahmanen in Stadtangelegenheiten und die Städte gegenüber den Brahmanen.","place":"alexandria","people":["brahmans"],"source":"PH 51D"},{"title":"Wunderberichte","text":"Regengebet, Seuchenabwehr und siebenköpfige Schlangen vermischen Erfahrung und Reiseliteratur.","place":"india","people":["brahmans"],"source":"PH 51D"}],"durationMinutes":6,"significance":"Historisch besonders anregend ist nicht der Wunderkatalog, sondern die beschriebene soziale Vermittlungsfunktion zwischen Städten und asketischen Gruppen. Sie macht Alexandria als Knoten transkultureller Wissensbewegung sichtbar.","sourceNote":"Ernährung und Vermittlerrolle werden als Damascius-Bericht wiedergegeben; Regengebet, Seuchenabwehr und mehrköpfige Tiere gehören zum Bereich er klaren politischen Allegorie.","weight":2},{"kind":"Überlieferung","text":"Damascius berichtet Jahrzehnte später und wohl aus zweiter Hand.","weight":3}],"hypotheses":[{"name":"Echte Vision, später gedeutet","confidence":48,"note":"Psychologisch plausibel, historisch nicht prüfbar."},{"name":"Nachträgliche mantische Legende","confidence":68,"note":"Typische Form politischer Vorzeichenerzählung."},{"name":"Bewusste Erfindung","confidence":22,"note":"Keine Quelle erlaubt ein Motivurteil."}],"open":"Der Zeitpunkt der ersten Fassung ist unbekannt."},{"id":"hegias-case","title":"Mutiger Restaurator oder gefährlicher Aktivist?","status":"wertungsabhängig","question":"Wie beurteilt man religiöse Sichtbarkeit unter Verfolgungsbedingungen?","evidence":[{"kind":"Handlung","text":"Hegias restaurierte Heiligtümer und erneuerte Riten.","weight":3},{"kind":"Damascius","text":"Sein Eifer sei unbesonnen und ziehe Feinde auf die Gemeinschaft.","weight":3},{"kind":"Isidor","text":"Theurgie setze menschliche und philosophische Reife voraus.","weight":2}],"hypotheses":[{"name":"Moralischer Mut mit strategischen Fehlern","confidence":72,"note":"Vereinigt beide Seiten."},{"name":"Selbstdarstellerische Frömmigkeit","confidence":34,"note":"Angedeutet, nicht bewiesen."}],"open":"Die Sicht der Kultgemeinden fehlt."}],"wonders":[{"id":"animated-statues","title":"Beseelte und unbeseelte Statuen","category":"Kultobjekte","report":"Heraiscus reagiert körperlich nur auf Statuen, die göttlich beseelt seien.","meaning":"Der gereinigte Mensch gilt als Sensor sakraler Präsenz.","natural":"Suggestion, ritualisierte Körperreaktion oder Hagiographie.","source":"PH 76E","reliability":"mittel"},{"id":"aion-union","title":"Aion als Osiris und Adonis","category":"Theologie","report":"Eine alexandrinische Statue wird als mystische Einheit mehrerer Gottheiten erkannt.","meaning":"Lokale Kulte werden als reale theologische Vereinigung verstanden.","natural":"Religionshistorische Synkretisierung.","source":" alt prägt Landschaften über den Tod hinaus.","natural":"Lichtphänomene, Geräusche, kollektive Erinnerung.","source":"PH 50","reliability":"niedrig"},{"id":"electric-sparks","title":"Funken aus Körper und Kleidung","category":"Naturphänomen","report":"Damascius beobachtet beim Umkleiden knisternde Funken und flammenähnliches Licht.","meaning":"Seltene Physik kann zugleich als Omen gelesen werden.","natural":"Triboelektrische Entladung.","source":"PH 51A","reliability":"hoch als mögliche Beobachtung"},{"id":"gorgon-plant","title":"Die Gorgonenpflanze","category":"Naturkunde","report":"Severus sieht eine Wurzel, die wie ein Mädchenkopf mit Schlangenhaar aussieht.","meaning":"Natur produziert ikonische Ähnlichkeiten zu Mythengestalten.","natural":"Anthropomorphe Wurzelform und Pareidolie.","source":"PH 51E","reliability":"mittel"},{"id":"seven-headed-snakes","title":"Siebenköpfige Schlangen","category":"Ethnographie","report":"Brahmanen berichten von riesigen siebenköpfigen Schlangen und einbeinigen Menschen.","meaning":"Ferne Welt als Reservoir des Übernatürlichen.","natural":"Reiseliterarische Traditionsmotive.","source":"PH 51D","reliability":"sehr niedrig"},{"id":"cave-gas","title":"Der tödliche Dampf von Hierapolis","category":"Naturphänomen","report":"Ein unterirdischer Gang tötet Lebewesen; Asclepiodotus steigt mit improvisiertem Atemschutz hinab.","meaning":"Heilige Gefahr wird rituell und experimentell erforscht.","natural":"Kohlendioxid oder andere vulkanische Gase.","source":"PH 87A","reliability":"hoch im Kern"},{"id":"attis-dream","title":"Damascius als Attis","category":"Traum","report":"In Hierapolis träumt Damascius, er feiere als Attis die Hilaria und werde vom Tod gerettet.","meaning":"Persönliche Krise wird in den Mythos von Tod und Wiederkehr integriert.","natural":"Rituell geprägter Traum.","source":"PH 87A","reliability":"hoch als Selbstbericht"},{"id":"eshmun","title":"Eshmuns Kastration und Vergöttlichung","category":"Mythos","report":"Der verfolgte Jüngling verstümmelt sich; Astronoe belebt ihn und macht ihn zum Heilgott.","meaning":"Heilung entsteht aus Tod, Wärme und Transformation.","natural":"Lokale Kultätiologie.","source":"PH 142B","reliability":"hoch als Mythosbericht"},{"id":"animal-omens","title":"Oryx, Sirius und der Mondaffe","category":"Tiersymbolik","report":"Der Oryx kündigt Sirius durch Niesen an; ein Affe reagiert auf die Sonnen-Mond-Konjunktion.","meaning":"Tierverhalten wird als kosmische Schrift gelesen.","natural":"Saisonales Verhalten oder Symbolkonstruktion.","source":"PH 74–75","reliability":"niedrig"},{"id":"ring-continence","title":"Der Ring der Enthaltsamkeit","category":"Ritualisierte Ethik","report":"Theosebius übergibt seiner Frau einen Ring als Zeichen freiwilliger Enthaltsamkeit.","meaning":"Ein Objekt materialisiert einen neuen ethischen Vertrag.","natural":"Sozialer und psychologischer Verpflichtungsmechanismus.","source":"PH 46E","reliability":"hoch"},{"id":"syncretic-exorcism","title":"Helios und der Gott der Juden","category":"Ritual","report":"Theosebius ruft beide Mächte in einem Exorzismus an.","meaning":"Praktische Religion überschreitet konfessionelle Systemgrenzen.","natural":"Synkretistische Beschwörungspraxis.","source":"PH 46B","reliability":"mittel"},{"id":"serapis-departure","title":"Sarapis verlässt den Tempel","category":"Prophetie","report":"Olympos prophezeit den Rückzug des Gottes aus dem Tempel.","meaning":"Tempelzerstörung wird als eigener Entschluss der Gottheit gedeutet.","natural":"Theologische Verarbeitung eines absehbaren Untergangs.","source":"PH 42H","reliability":"mittel"}],"fragments":[{"id":"f111","title":"Sarapios zwei oder drei Bücher","fragment":"PH 111","witness":"Photios + Suda","page":263,"status":"rekonstruiertes Fragment","greek":"μόνα δύο ἢ τρία βιβλία","paraphrase":"Sarapio besitzt fast keine Bücher, lebt allein und richtet sein Denken auf das Innere und Ungeteilte.","people":["sarapio","isidore"],"places":["alexandria"],"notes":"Sch
