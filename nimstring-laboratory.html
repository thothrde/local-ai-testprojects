<main>
<section class="hero">
<div class="eye" data-de="Testprojekt · kombinatorische Spieltheorie · strikt lokal" data-en="Test project · combinatorial game theory · strictly local"></div>
<h1>Nimstring Laboratory</h1>
<p data-de="Eine lokale Forschungs-App zu Dots and Boxes und seiner Dualdarstellung Strings and Coins. Sie verbindet ein interaktives Brett, einen graphischen Struktur-Analysator und einen exakten Solver für kleine oder weit fortgeschrittene Stellungen. Das Projekt dient zugleich als Ausgangspunkt für spätere Nimstring-Berechnungen, Graphreduktionen, Beweiszertifikate und formale Verifikation."
data-en="A local research app for Dots and Boxes and its dual Strings-and-Coins representation. It combines an interactive board, a structural graph analyzer, and an exact solver for small or advanced positions. The project is also intended as a basis for later Nimstring computations, graph reductions, proof certificates, and formal verification."></p>
<div class="actions"><a class="btn primary" href="https://nimstring.autark-data.org" data-de="App öffnen" data-en="Open the app"></a><a class="btn" href="index.html" data-de="Projektübersicht" data-en="Project overview"></a></div>
<div class="notice" data-de="Die App ist öffentlich über HTTPS erreichbar; der Rechenkern läuft ausschließlich lokal auf einem Mac Studio in Berlin."
data-en="The app is publicly reachable via HTTPS; the compute core runs exclusively locally on a Mac Studio in Berlin."></div>
</section>
<section class="grid">
<article class="card"><h2 data-de="Mathematische Idee" data-en="Mathematical idea"></h2><p data-de="Im Dualgraphen wird jedes Kästchen zu einer Coin und jede noch nicht gezogene Seite zu einem String. Ein Spielzug schneidet einen String. Dadurch werden Ketten, Schleifen, Gelenke und unabhängige Komponenten sichtbar, die auf dem ursprünglichen Gitter leicht verborgen bleiben."
data-en="In the dual graph, every box becomes a coin and every unplayed side becomes a string. A move cuts a string. This reveals chains, loops, joints, and independent components that are easily hidden in the original grid."></p></article>
<article class="card"><h2 data-de="Was die App bereits kann" data-en="What the app already does"></h2><ul>
<li data-de="beliebige rechteckige Stellungen interaktiv eingeben" data-en="enter arbitrary rectangular positions interactively"></li>
<li data-de="Brett und Dualgraph synchron untersuchen" data-en="inspect board and dual graph synchronously"></li>
<li data-de="optimale Züge für kleine Endspiele exakt berechnen" data-en="compute optimal moves exactly for small endgames"></li>
<li data-de="Gelenke, fangbare Münzen, Komponenten und geschlossene Schleifen erkennen" data-en="detect joints, capturable coins, components, and closed loops"></li>
</ul></article>
<article class="card"><h2 data-de="Lokaler Rechenkern, öffentlicher Zugang" data-en="Local compute core, public access"></h2><div class="arch">Browser UI
    ↓ HTTPS via Cloudflare Tunnel
FastAPI · 127.0.0.1:8765 (Mac Studio, Berlin)
    ↓
Exact scoring solver
    +
NetworkX dual-graph analysis</div><p data-de="Es werden keine Cloudmodelle, CDNs, Webfonts oder externen JavaScript-Bibliotheken aufgerufen." data-en="No cloud models, CDNs, web fonts, or external JavaScript libraries are contacted."></p></article>
<article class="card"><h2 data-de="Gegenwärtige Grenze" data-en="Current limitation"></h2><p data-de="Der Python-Kern führt die vollständige Suche gegenwärtig bis zu 20 freien Kanten aus; größere Stellungen erhalten eine Strukturdiagnose. Nimstring- und affine Werte, Symmetriequotienten, Transpositionswiederverwendung und Beweiszertifikate sind bereits im Python-Kern integriert. Ein optionaler Rust-Kern für höhere Performance bei großen Stellungen liegt als Quellcode vor, ist aber noch nicht kompiliert."
data-en="The Python core currently performs exhaustive search up to 20 free edges; larger positions receive structural diagnostics. Nimstring and affine values, symmetry quotients, transposition reuse, and proof certificates are already integrated in the Python core. An optional Rust core for higher performance on large positions exists as source code but is not yet compiled."></p></article>
<article class="card full"><h2 data-de="Warum dieses Testprojekt?" data-en="Why this test project?"></h2><p data-de="Das Projekt prüft, ob ein strikt lokales KI-Ökosystem nicht nur Texte generieren, sondern eine mathematische Forschungsumgebung aufbauen kann: exakte Berechnung, strukturelle Visualisierung, automatische Vermutungsbildung, Gegenbeispielsuche und schließlich formale Beweise sollen in einem kontrollierbaren lokalen Workflow zusammengeführt werden."
data-en="The project tests whether a strictly local AI ecosystem can do more than generate text and can instead build a mathematical research environment: exact computation, structural visualization, automated conjecture formation, counterexample search, and eventually formal proofs are to be combined in a controllable local workflow."></p></article>
</section>
<div class="footer">Thomas Riepe · Berlin · August 2026</div>

<!-- NIMSTRING-V33-VALIDATION:START -->
<section class="card full" id="validation-status">
  <h2 data-de="Mathematische Validierung in Version 3.3" data-en="Mathematical validation in version 3.3"></h2>
  <p data-de="Die affine Graphübersetzung wird nun nicht nur an Paaren, sondern auch an echten Dreifachsummen unabhängig geprüft. Der globale Brute-Force-Solver erlaubt nach jedem Capture die Fortsetzung in jeder Komponente; gezielte Regressionen umfassen gewöhnliche Nimber-Tripel und Mond plus zwei Nimber. Bestätigte endliche Prüfungen werden weiterhin nicht als allgemeiner Beweis ausgegeben."
     data-en="The affine graph translation is now independently checked not only on pairs but also on genuine three-component sums. After every capture, the global brute-force solver permits continuation in any component; targeted regressions include ordinary nimber triples and moon plus two nimbers. Passing finite checks is still not presented as a general proof."></p>
  <p data-de="Die Kontrollwert-Brücke verwendet den standardmäßigen terminal bonus: 8 für reine Schleifensummen, 6 für Schleifen zusammen ausschließlich mit 3-Ketten und 4 in den übrigen nichtleeren Fällen. Ein unabhängiger globaler Punktesolver prüft systematisch Ketten-/Schleifen-Multimengen bis zur konfigurierten Suchgrenze. Nur Fälle mit cv ≥ 2 gelten als theoremgestützte Vorhersagen; das kleinste Gegenbeispiel wird bei einer Abweichung automatisch als JSON-Artefakt gespeichert."
     data-en="The controlled-value bridge uses the standard terminal bonus: 8 for loop-only sums, 6 for loops together only with 3-chains, and 4 in the remaining nonempty cases. An independent global scoring solver systematically checks chain/loop multisets up to the configured search bound. Only cases with cv ≥ 2 count as theorem-backed predictions; on a mismatch, the smallest counterexample is automatically stored as a JSON artifact."></p>
</section>
<!-- NIMSTRING-V33-VALIDATION:END -->
